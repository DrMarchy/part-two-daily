<script>
var C=[[0.0, 1.69, "Tutor", "Welcome to Part Two Daily."], [1.69, 8.52, "Tutor", "It is Monday the ninth of November, one hundred and twenty one days until the written exam, and this is the primer for week five."], [8.52, 15.19, "Tutor", "This week brings two blocks together: shock, haemodynamics and fluids, and acute kidney injury with renal replacement therapy."], [15.19, 16.63, "Tutor", "They belong together."], [16.63, 23.01, "Tutor", "The kidney is the organ that tells you first when the circulation is failing, and it is often the last organ to recover."], [23.01, 27.69, "Tutor", "Between them, these two blocks account for well over a hundred past College questions."], [27.69, 29.38, "Tutor", "Here is the running order."], [29.38, 33.17, "Tutor", "First, a short look back at one question that is on your list today."], [33.17, 40.79, "Tutor", "Then the week's tutorial: monitoring, vasoactive drugs, acute kidney injury and renal replacement therapy, with the guidelines and their numbers."], [40.79, 47.16, "Tutor", "Then two landmark fluid trials, an exam practice question with a twenty nine percent pass rate, and a syllabus round-up."], [48.56, 54.14, "Tutor", "Before the new material, one question from your earlier sets, because it is back on your list today."], [54.14, 58.17, "Tutor", "It is the 2019 first sitting, question nine, the electrolyte question."], [58.17, 61.48, "Tutor", "You scored four and a half on the fourteenth of October."], [61.48, 63.49, "Tutor", "The knowledge was mostly there."], [63.49, 66.91, "Tutor", "The marks went on the calculations you did not write down."], [66.91, 68.97, "Tutor", "So let us do them now, out loud."], [68.97, 77.5, "Tutor", "Part two of that question gives a confused man after a pneumonectomy, with a total calcium of 2.59 millimoles per litre and an albumin of 15 grams per litre."], [77.5, 79.0, "Tutor", "Here is the question."], [79.0, 81.38, "Tutor", "What is his albumin-corrected calcium?"], [81.38, 82.72, "Tutor", "Pause, and answer."], [88.12, 94.5, "Tutor", "The usual correction adds 0.02 millimoles per litre for every gram per litre that albumin is below 40."], [94.5, 97.0, "Tutor", "Forty minus fifteen is twenty five."], [97.0, 99.2, "Tutor", "Twenty five times 0.02 is 0.5."], [99.2, 103.09, "Tutor", "So the corrected calcium is about 3.1 millimoles per litre."], [103.09, 106.69, "Tutor", "That number is the justification the examiners wanted."], [106.69, 116.67, "Tutor", "Without it, the word hypercalcaemia is an assertion, not an answer, and the albumin of fifteen is the trap that makes a nearly normal total calcium look reassuring."], [116.67, 129.03, "Tutor", "The four therapies follow from it: saline to restore volume and drive calciuresis, a bisphosphonate such as zoledronic acid, calcitonin for speed, and corticosteroids where the cause is steroid-responsive."], [129.03, 134.49, "Tutor", "Remember that zoledronate and pamidronate count once, because they are the same class."], [134.49, 136.81, "Tutor", "Part four is the sodium deficit."], [136.81, 141.57, "Tutor", "A sixty kilogram man with SIADH and a sodium of 110, with a target of 120."], [141.57, 146.44, "Tutor", "Total body water is 0.5 or 0.6 times weight, so thirty or thirty six litres."], [146.44, 149.46, "Tutor", "Multiply by the ten millimole rise you want."], [149.46, 155.44, "Tutor", "The answer is 300 to 360 millimoles of sodium, and the College accepted anything in that range."], [155.44, 158.11, "Tutor", "Two marks, for one line of arithmetic."], [158.11, 160.08, "Tutor", "The other gaps were lists."], [160.26, 173.19, "Tutor", "In the young man with labile blood pressure after an intracranial haemorrhage, exogenous catecholamines, amphetamines and cocaine belong on the list, as does previous use of a tricyclic or a monoamine oxidase inhibitor."], [173.19, 182.08, "Tutor", "And in the malnourished drinker with a sodium of 115 who looks euvolaemic, the answer is beer potomania, low solute intake with a very dilute urine."], [182.08, 183.33, "Tutor", "Not cirrhosis."], [183.33, 184.81, "Tutor", "The fix is simple."], [184.81, 189.94, "Tutor", "When a question gives you numbers, write the sum on the page, then the conclusion."], [191.34, 192.74, "Tutor", "Picture the scene."], [192.74, 194.53, "Tutor", "It is two in the morning."], [194.53, 200.41, "Tutor", "A seventy one year old man has just arrived from theatre after a valve replacement and bypass grafts."], [200.41, 202.25, "Tutor", "He came off bypass easily."], [202.25, 205.11, "Tutor", "Ten minutes later his pressure is 60 over 30."], [205.11, 208.67, "Tutor", "The nurse is looking at you, and so is the arterial trace."], [208.67, 211.48, "Tutor", "What do you trust, and what do you do first?"], [211.48, 216.45, "Tutor", "That scenario is the 2021 first sitting, question two, and it is on your list today."], [216.45, 218.39, "Tutor", "It captures this whole week."], [218.39, 225.95, "Tutor", "You need to know whether the numbers are real, what they mean, which drug or device to reach for, and what the kidneys will do next."], [225.95, 228.65, "Tutor", "Let us start with how the College asks it."], [228.65, 239.18, "Tutor", "On the data in your curriculum, the haemodynamic monitoring syllabus item is linked to thirty one past questions, renal replacement therapy to twenty six, and renal failure to twenty one."], [239.18, 245.88, "Tutor", "Within those, the derived variables of the pulmonary artery catheter were examined four times between 2008 and 2012."], [245.88, 251.44, "Tutor", "Fluid resuscitation and fluid responsiveness has been asked three times, most recently in 2020."], [251.44, 257.54, "Tutor", "Causes of shock after cardiac surgery has appeared three times, most recently in the 2026 second sitting."], [257.72, 263.07, "Tutor", "The patient with end-stage kidney disease who becomes critically ill has appeared four times."], [263.07, 266.82, "Tutor", "And the comparison of renal replacement modalities three times."], [266.82, 269.79, "Tutor", "The verbs are mostly outline, list, and compare."], [269.79, 275.08, "Tutor", "When a question says compare, the examiners reward a table, with the comparison in the rows."], [275.48, 280.72, "Tutor", "First, the post cardiac surgery framework, because your coach note for today asks for it."], [280.72, 287.43, "Tutor", "Structure the differential for hypotension as four headings: preload, rate and rhythm, contractility, and afterload."], [287.43, 292.4, "Tutor", "Preload means bleeding, tamponade, and the vasodilatation and diuresis of rewarming."], [292.4, 299.05, "Tutor", "Rate and rhythm means heart block, which is why you check the epicardial pacing wires, and new atrial fibrillation."], [299.05, 304.18, "Tutor", "Contractility means post bypass stunning, graft failure, and right ventricular failure."], [304.18, 315.15, "Tutor", "Afterload means vasoplegia, but also dynamic left ventricular outflow tract obstruction with systolic anterior motion of the mitral valve, which is made worse by the inotrope you might reach for."], [315.15, 317.37, "Tutor", "And always add measurement error."], [317.37, 327.31, "Tutor", "The examiners' comment on that question was that a stepwise, logical immediate plan earned the marks, and that if a question asks for four causes, only the first four are read."], [327.31, 328.34, "Tutor", "Write four."], [328.34, 330.72, "Tutor", "Then number your first five minutes."], [331.12, 336.12, "Tutor", "Now, Oh's Manual, ninth edition, chapter twenty four, haemodynamic monitoring."], [336.12, 341.42, "Tutor", "Start with the arterial line, because every decision in the scenario depends on it."], [341.42, 344.45, "Tutor", "A fluid-filled system behaves like a spring."], [344.45, 348.0, "Tutor", "It has a natural frequency and a damping coefficient."], [348.0, 351.49, "Tutor", "The fast flush, or square wave, test tells you both."], [351.49, 357.6, "Tutor", "After the flush, an optimally damped system gives one or two small oscillations and then settles."], [357.6, 361.39, "Tutor", "A damping coefficient of around 0.6 to 0.7 is the target."], [361.39, 367.32, "Tutor", "An underdamped trace rings, with several oscillations, and it overestimates systolic pressure."], [367.32, 375.06, "Tutor", "An overdamped trace, from an air bubble, a clot or a kinked line, gives no oscillation, and underestimates systolic pressure."], [375.06, 381.29, "Tutor", "The mean arterial pressure is relatively preserved in both, which is one reason we target the mean."], [381.29, 391.36, "Tutor", "Zero to atmosphere, level the transducer to the phlebostatic axis, the fourth intercostal space in the mid-axillary line, and then decide whether the number is real."], [391.76, 394.3, "Tutor", "The central venous pressure is next."], [394.3, 397.42, "Tutor", "The 2021 question asked for four determinants."], [397.42, 411.32, "Tutor", "Think of the reference level of the transducer, the venous blood volume, venous and right ventricular compliance, right ventricular function, the tricuspid valve, the rhythm, pulmonary vascular resistance, and intrathoracic pressure."], [411.32, 412.82, "Tutor", "Then the waveform."], [412.82, 415.19, "Tutor", "The a wave is atrial contraction."], [415.19, 420.44, "Tutor", "The c wave is the tricuspid valve bulging back at the start of ventricular systole."], [420.44, 422.92, "Tutor", "The x descent is atrial relaxation."], [422.92, 428.69, "Tutor", "The v wave is atrial filling against a closed valve, and the y descent is the valve opening."], [428.69, 431.52, "Tutor", "Atrial fibrillation abolishes the a wave."], [431.52, 438.5, "Tutor", "Complete heart block or a junctional rhythm gives cannon a waves, as the atrium contracts against a closed valve."], [438.5, 442.02, "Tutor", "Tricuspid regurgitation gives a giant fused c v wave."], [442.02, 444.27, "Tutor", "Tamponade blunts the y descent."], [444.27, 448.02, "Tutor", "Constriction gives a steep y descent, the M or W pattern."], [448.02, 452.06, "Tutor", "The single number tells you little about fluid responsiveness."], [452.06, 455.12, "Tutor", "The waveform tells you a lot about the heart."], [455.52, 458.3, "Tutor", "So how do you predict whether fluid will help?"], [458.3, 462.53, "Tutor", "The passive leg raise is the bedside test the College asked about in 2021."], [462.53, 467.57, "Tutor", "Move the patient from semi-recumbent to supine with the legs raised to forty five degrees."], [467.57, 473.45, "Tutor", "That shifts a few hundred millilitres of venous blood from the legs and the splanchnic bed into the chest."], [473.45, 476.02, "Tutor", "It is a fluid challenge you can take back."], [476.02, 480.71, "Tutor", "Measure stroke volume or cardiac output, not blood pressure, within about a minute."], [480.71, 484.22, "Tutor", "A rise of ten percent or more predicts fluid responsiveness."], [484.22, 494.52, "Tutor", "Its limits: it needs a real-time cardiac output measurement, and it is unreliable or unsafe with raised intracranial pressure, intra-abdominal hypertension, pelvic fractures or leg amputation."], [494.52, 497.56, "Tutor", "Pulse pressure variation is the other dynamic test."], [497.56, 510.9, "Tutor", "A variation above about twelve to thirteen percent suggests responsiveness, but only in a patient who is fully ventilated, without spontaneous breaths, in sinus rhythm, with a closed chest and a tidal volume of at least eight millilitres per kilogram."], [510.9, 514.2, "Tutor", "Most of your patients break at least one of those rules."], [514.38, 525.5, "Tutor", "The Surviving Sepsis Campaign guideline, published in March 2026, suggests dynamic measures over physical examination or static measures alone, and capillary refill time as an adjunct."], [525.9, 530.73, "Tutor", "Now a story, about the catheter that defined haemodynamic monitoring for a generation."], [530.73, 537.29, "Tutor", "In the late 1960s, Jeremy Swan, an Irish-born cardiologist at Cedars of Lebanon Hospital in Los Angeles, was frustrated."], [537.29, 542.32, "Tutor", "Right heart catheterisation needed fluoroscopy and a catheter laboratory, and it was slow."], [542.32, 548.38, "Tutor", "The story he told was that on a day out with his children in Santa Monica, he watched sailboats on a calm bay."], [548.38, 552.69, "Tutor", "One boat with a big spinnaker was making good progress when others were not."], [552.69, 562.44, "Tutor", "If a sail could catch wind, he reasoned, a small balloon on the tip of a catheter could catch blood, and the flow out of the right ventricle would carry it into the pulmonary artery."], [562.44, 566.75, "Tutor", "With his colleague William Ganz, he built a prototype in the autumn of 1969."], [566.75, 571.07, "Tutor", "In 1970 they published the technique in the New England Journal of Medicine."], [571.07, 575.89, "Tutor", "In the report, most catheters were placed without fluoroscopy, in well under a minute."], [575.89, 582.15, "Tutor", "Ganz's work on thermodilution followed in 1971, and the catheter could then measure cardiac output at the bedside."], [582.15, 586.26, "Tutor", "For thirty years the Swan-Ganz catheter was the badge of intensive care."], [586.26, 587.9, "Tutor", "Then came the reckoning."], [588.08, 598.33, "Tutor", "In the UK PAC-Man trial, published in the Lancet in 2005, 1041 patients in sixty five intensive care units were randomised to management with or without a pulmonary artery catheter."], [598.33, 606.58, "Tutor", "Hospital mortality was 68 percent with the catheter and 66 percent without it, an adjusted hazard ratio of 1.09, with no significant difference."], [606.58, 610.11, "Tutor", "Ten percent of insertions had a complication, none fatal."], [610.11, 613.8, "Tutor", "The lesson for the exam is not that the catheter is useless."], [613.8, 617.22, "Tutor", "It is that a monitor cannot improve outcome on its own."], [617.22, 619.44, "Tutor", "Only the treatment it guides can."], [619.84, 624.64, "Tutor", "Because it is examined, know what the catheter measures and what it derives."], [624.64, 637.67, "Tutor", "Measured directly: right atrial pressure, right ventricular and pulmonary artery pressures, the pulmonary artery occlusion pressure, cardiac output by thermodilution, mixed venous oxygen saturation, and core temperature."], [637.67, 644.92, "Tutor", "Derived: cardiac index, stroke volume, systemic and pulmonary vascular resistance, and oxygen delivery and consumption."], [644.92, 657.78, "Tutor", "Systemic vascular resistance is eighty times the mean arterial pressure minus the central venous pressure, divided by cardiac output, with a normal range of about 800 to 1200 dynes seconds per centimetre to the fifth."], [657.78, 661.61, "Tutor", "Mixed venous saturation is normally about 65 to 75 percent."], [661.61, 668.75, "Tutor", "The occlusion pressure only reflects left atrial pressure if the tip lies in West zone three, read at end expiration."], [668.75, 670.29, "Tutor", "Here is a question."], [670.29, 679.09, "Tutor", "Your patient after bypass has a cardiac index of 1.6 litres per minute per square metre, a wedge of 22 and a systemic vascular resistance of 2000."], [679.09, 683.03, "Tutor", "What is the pattern, and what is the first thing you exclude?"], [683.03, 684.52, "Tutor", "Pause, and answer."], [689.92, 694.58, "Tutor", "That is a low output, high filling, high resistance pattern: cardiogenic."], [694.58, 708.38, "Tutor", "After cardiac surgery the first thing to exclude is tamponade, with an urgent echocardiogram, because equalised high filling pressures can look just like left ventricular failure, and the treatment is the surgeon, not more inotrope."], [708.38, 712.53, "Tutor", "Now the drugs, from Oh's chapter twenty six on vasoactive drugs."], [712.53, 721.96, "Tutor", "The 2026 Surviving Sepsis guideline makes a strong recommendation for noradrenaline as the first-line vasopressor, over dopamine, adrenaline or selepressin."], [721.96, 731.11, "Tutor", "It recommends an initial mean arterial pressure target of 65 millimetres of mercury, and for patients aged 65 or older it suggests a range of 60 to 65."], [731.11, 733.64, "Tutor", "That age-specific suggestion is new."], [733.64, 745.95, "Tutor", "It suggests adding vasopressin when noradrenaline doses are escalating, adrenaline if the target is still not met, and dobutamine, or adrenaline alone, for persistent hypoperfusion with cardiac dysfunction."], [745.95, 751.87, "Tutor", "It suggests starting vasopressors peripherally rather than delaying until a central line is in."], [751.87, 755.84, "Tutor", "And it suggests intravenous corticosteroids for septic shock."], [755.84, 760.96, "Tutor", "In an exam answer, name the drug, the receptor, the dose range and the end point."], [761.14, 769.71, "Tutor", "Noradrenaline is mainly an alpha one agonist with some beta one effect, typically 0.05 to 0.5 micrograms per kilogram per minute."], [769.71, 778.71, "Tutor", "Dobutamine is a beta one agonist, 2.5 to 10 micrograms per kilogram per minute, which raises contractility and drops afterload a little."], [778.71, 789.22, "Tutor", "Milrinone inhibits phosphodiesterase three, so it works independently of the beta receptor, at the cost of vasodilatation and a long half-life in renal failure."], [789.22, 794.66, "Tutor", "Levosimendan sensitises troponin C to calcium and opens potassium ATP channels."], [795.06, 799.64, "Tutor", "Now the kidney, from Oh's chapter fifty five, acute kidney injury."], [799.64, 803.79, "Tutor", "The definition you write is the KDIGO definition from 2012."], [803.79, 819.63, "Tutor", "Acute kidney injury is a rise in creatinine of at least 26.5 micromoles per litre within forty eight hours, or to at least one and a half times baseline within seven days, or a urine output below 0.5 millilitres per kilogram per hour for six hours."], [819.63, 823.22, "Tutor", "Stage one is one and a half to 1.9 times baseline."], [823.22, 828.85, "Tutor", "Stage two is two to 2.9 times baseline, or urine output below 0.5 for twelve hours."], [828.85, 832.0, "Tutor", "Stage three is the one examiners ask about."], [832.0, 835.78, "Tutor", "Pause, and answer: what are the stage three criteria?"], [841.18, 857.06, "Tutor", "Stage three is three times baseline, or a creatinine of at least 353.6 micromoles per litre, or the start of renal replacement therapy, or a urine output below 0.3 millilitres per kilogram per hour for twenty four hours, or anuria for twelve hours."], [857.06, 868.11, "Tutor", "KDIGO released a draft 2026 update to the acute kidney injury and acute kidney disease guideline for public review earlier this year, its first revision in over a decade."], [868.11, 876.6, "Tutor", "Until the final version is published, the 2012 criteria are the ones to quote, and you can mention that an update is in progress."], [876.6, 885.97, "Tutor", "For causes, use three headings, prerenal, renal and postrenal, then split the renal causes into tubular, interstitial, glomerular and vascular."], [885.97, 895.71, "Tutor", "In the ICU, most acute kidney injury is multifactorial: sepsis, hypotension, nephrotoxins and contrast, often in someone with chronic kidney disease."], [895.71, 897.82, "Tutor", "Do not forget obstruction."], [897.82, 901.05, "Tutor", "It is the cause you can fix with a catheter."], [901.05, 911.78, "Tutor", "A urea that is disproportionately high for the creatinine should make you think of a prerenal state, gastrointestinal bleeding, catabolism, steroids, or obstruction."], [911.96, 919.93, "Tutor", "The urinary sodium and the fractional excretion of sodium can support a prerenal picture, but diuretics and sepsis make them unreliable."], [919.93, 928.52, "Tutor", "Management is mostly about removing causes: restore perfusion, stop nephrotoxins, relieve obstruction, adjust drug doses, and avoid fluid overload."], [928.92, 938.99, "Tutor", "One prevention question deserves its own minute, because it has been asked twice, most recently in the 2026 second sitting: strategies to prevent contrast-associated kidney injury."], [938.99, 941.56, "Tutor", "Start by putting the risk in proportion."], [941.56, 951.15, "Tutor", "Modern observational studies that compare patients with and without contrast suggest that much of the injury once blamed on contrast is the illness that prompted the scan."], [951.15, 954.74, "Tutor", "So the first strategy is not to withhold an essential scan."], [954.74, 965.18, "Tutor", "Then identify risk: chronic kidney disease, especially an estimated filtration rate below thirty, diabetes with renal impairment, hypovolaemia, heart failure, and concurrent nephrotoxins."], [965.18, 966.58, "Tutor", "Then the measures."], [966.58, 969.68, "Tutor", "Use the lowest dose of a low or iso-osmolar agent."], [969.68, 972.04, "Tutor", "Avoid repeat studies close together."], [972.04, 980.72, "Tutor", "Correct volume depletion with isotonic crystalloid, and pause nephrotoxins such as aminoglycosides and nonsteroidal anti-inflammatory drugs where you can."], [980.72, 984.41, "Tutor", "Hold metformin in patients with significant renal impairment."], [984.41, 987.84, "Tutor", "Two strategies that do not work should be named as such."], [988.02, 999.93, "Tutor", "In the PRESERVE trial, published in 2018, neither sodium bicarbonate instead of saline nor N-acetylcysteine instead of placebo reduced death, dialysis or persistent kidney injury after angiography."], [999.93, 1005.22, "Tutor", "And prophylactic haemofiltration or dialysis to remove contrast is not recommended."], [1005.22, 1011.38, "Tutor", "An examiner wants the risk factors, the practical measures, and the evidence that kills the myths."], [1011.78, 1020.37, "Tutor", "Back to the circulation for a moment, and a word on echocardiography, Oh's chapter twenty five, because it answers the questions the pressure numbers cannot."], [1020.37, 1025.37, "Tutor", "In the hypotensive patient after cardiac surgery, a focused study looks for four things."], [1025.37, 1029.27, "Tutor", "Is there a pericardial collection, and is it compressing a chamber?"], [1029.27, 1036.82, "Tutor", "Remember that a localised clot behind the right atrium may be missed on transthoracic views, so a transoesophageal study is often needed."], [1036.82, 1042.86, "Tutor", "How is left ventricular function, globally and regionally, which tells you about stunning and graft failure?"], [1042.86, 1048.22, "Tutor", "Is the right ventricle dilated, with the septum flattened, which points to right heart failure?"], [1048.22, 1058.84, "Tutor", "And is there systolic anterior motion of the mitral valve with a high gradient in the outflow tract, which tells you to stop the inotrope, give fluid, and consider a beta blocker or phenylephrine."], [1058.84, 1066.34, "Tutor", "In septic shock, echocardiography helps detect septic cardiomyopathy and the patient who needs an inotrope rather than more vasopressor."], [1066.74, 1070.23, "Tutor", "Then renal replacement therapy, Oh's chapter fifty six."], [1070.23, 1085.18, "Tutor", "The indications are refractory hyperkalaemia, refractory acidosis, fluid overload that is not responding to diuretics, uraemic complications such as pericarditis or encephalopathy, and dialysable poisons such as lithium, toxic alcohols, metformin and salicylate."], [1085.18, 1087.72, "Tutor", "Timing has been tested more than once."], [1087.72, 1095.75, "Tutor", "You already know STARRT-AKI: starting early, without an urgent indication, did not reduce mortality and increased dependence on dialysis."], [1095.75, 1105.94, "Tutor", "The 2026 Surviving Sepsis guideline suggests against renal replacement therapy without a definitive indication, and either continuous or intermittent therapy when there is one."], [1105.94, 1109.48, "Tutor", "The mechanism matters, because the College has asked it."], [1109.48, 1118.51, "Tutor", "Haemofiltration clears solute by convection: water is pushed across the membrane by pressure, dragging solute with it, and it clears middle molecules well."], [1118.51, 1126.82, "Tutor", "Haemodialysis clears solute by diffusion down a concentration gradient against a countercurrent dialysate, and it clears small molecules best."], [1126.82, 1128.59, "Tutor", "Diafiltration does both."], [1128.59, 1132.74, "Tutor", "In 2015 the pass rate on the modality comparison was forty percent."], [1132.92, 1137.75, "Tutor", "Many candidates described diafiltration when the question asked about haemofiltration."], [1137.75, 1139.04, "Tutor", "Read the acronym."], [1139.44, 1141.18, "Tutor", "Dose is the next fact."], [1141.18, 1155.44, "Tutor", "KDIGO recommends a delivered effluent volume of 20 to 25 millilitres per kilogram per hour, and that comes from two trials, the American ATN trial and the Australian and New Zealand RENAL trial, which you will hear more about another day."], [1155.44, 1160.89, "Tutor", "Prescribe a little more than you want, because downtime means you always deliver less."], [1160.89, 1163.33, "Tutor", "Anticoagulation is the last piece."], [1163.33, 1170.4, "Tutor", "KDIGO suggests regional citrate rather than heparin for continuous therapy in patients without a contraindication."], [1170.4, 1175.97, "Tutor", "Citrate chelates ionised calcium in the circuit, and the clotting cascade needs calcium."], [1175.97, 1185.94, "Tutor", "You aim for a post-filter ionised calcium of about 0.25 to 0.35 millimoles per litre, and you replace calcium to keep the patient's own ionised calcium near normal."], [1185.94, 1188.61, "Tutor", "Most citrate is removed by the filter."], [1188.61, 1193.19, "Tutor", "The rest is metabolised in the liver, muscle and kidney to bicarbonate."], [1193.19, 1198.0, "Tutor", "Pause, and answer: what blood test ratio tells you citrate is accumulating?"], [1203.4, 1206.62, "Tutor", "A total to ionised calcium ratio above 2.5."], [1206.62, 1215.72, "Tutor", "The total calcium rises as calcium-citrate complexes accumulate, while the ionised calcium falls, and you see a high anion gap acidosis."], [1215.72, 1221.21, "Tutor", "That is the patient with severe liver failure or a lactate that will not clear."], [1221.21, 1226.14, "Tutor", "Reduce the citrate dose, increase the clearance, or change the method."], [1226.14, 1229.8, "Tutor", "To finish the tutorial, three numbers to remember."], [1229.8, 1236.5, "Tutor", "First, a ten percent rise in stroke volume with a passive leg raise predicts fluid responsiveness."], [1236.5, 1248.62, "Tutor", "Second, stage three acute kidney injury is three times baseline, a creatinine of 353.6, the start of dialysis, or less than 0.3 millilitres per kilogram per hour for twenty four hours."], [1248.62, 1257.72, "Tutor", "Third, deliver 20 to 25 millilitres per kilogram per hour of effluent, and keep the total to ionised calcium ratio below 2.5 on citrate."], [1259.12, 1262.55, "Tutor", "Two trials this week, both about what is in the bag."], [1262.55, 1264.27, "Tutor", "Start with a question."], [1264.27, 1270.96, "Tutor", "In 1998, a Cochrane review suggested that giving albumin to critically ill patients might increase mortality."], [1270.96, 1275.42, "Tutor", "If you were an intensivist in Sydney in 2001, how would you settle it?"], [1275.42, 1282.63, "Tutor", "You would do what the Australian and New Zealand Intensive Care Society Clinical Trials Group did: run the SAFE trial."], [1282.63, 1290.18, "Tutor", "It was published in the New England Journal of Medicine in 2004, and it is chapter ten of Landmark Studies in Critical Care."], [1290.18, 1300.48, "Tutor", "Sixteen intensive care units in Australia and New Zealand randomised 6997 adults who needed fluid resuscitation to four percent albumin or 0.9 percent saline, double blind."], [1300.48, 1304.77, "Tutor", "Cardiac surgery, liver transplant and burns patients were excluded."], [1304.77, 1308.72, "Tutor", "The primary outcome was twenty eight day all-cause mortality."], [1308.72, 1314.15, "Tutor", "It was 20.9 percent with albumin and 21.1 percent with saline, a relative risk of 0.99."], [1314.15, 1317.87, "Tutor", "No difference in length of stay, ventilation or dialysis."], [1317.87, 1319.3, "Tutor", "Albumin was safe."], [1319.3, 1326.28, "Tutor", "In the severe sepsis subgroup, mortality was 30.7 versus 35.3 percent, a hint of benefit that was not significant."], [1326.28, 1328.97, "Tutor", "The trauma subgroup went the other way."], [1328.97, 1333.6, "Tutor", "Pause, and answer: what happened to patients with traumatic brain injury?"], [1339.0, 1347.93, "Tutor", "In a post hoc analysis, patients with traumatic brain injury had higher mortality with albumin: 24.5 versus 15.1 percent, a relative risk of 1.62."], [1347.93, 1357.97, "Tutor", "The follow-up SAFE-TBI study confirmed the signal at two years, and the proposed mechanism is the hypotonicity of four percent albumin raising intracranial pressure."], [1357.97, 1367.13, "Tutor", "The main criticisms are that the trial was designed to show equivalence for safety, not benefit, and that subgroup findings are hypothesis generating."], [1367.13, 1373.17, "Tutor", "What it changed: albumin was rehabilitated as safe, and it is avoided in traumatic brain injury."], [1373.17, 1382.68, "Tutor", "The 2026 sepsis guideline suggests crystalloids alone over adding albumin, with albumin a reasonable option after large crystalloid volumes or in cirrhosis."], [1382.68, 1385.06, "Tutor", "In an answer, quote it like this."], [1385.06, 1395.44, "Tutor", "The SAFE trial of nearly seven thousand patients showed no mortality difference between four percent albumin and saline, but albumin was harmful in traumatic brain injury."], [1395.84, 1399.36, "Tutor", "Second, SMART, chapter thirteen of Landmark Studies."], [1399.36, 1405.45, "Tutor", "Published in the New England Journal of Medicine in 2018 by Semler and colleagues at Vanderbilt."], [1405.45, 1416.29, "Tutor", "It was a pragmatic, unblinded, cluster randomised, multiple crossover trial in five intensive care units: each unit switched between balanced crystalloid and saline every month."], [1416.29, 1418.34, "Tutor", "15802 adults were included."], [1418.34, 1427.25, "Tutor", "The primary outcome was a composite called MAKE thirty: death, new renal replacement therapy or persistent renal dysfunction within thirty days."], [1427.25, 1436.97, "Tutor", "It occurred in 14.3 percent with balanced crystalloid and 15.4 percent with saline, an odds ratio of 0.91, with a number needed to treat of about ninety four."], [1436.97, 1441.31, "Tutor", "None of the individual components reached significance on its own."], [1441.31, 1446.94, "Tutor", "In the prespecified sepsis subgroup, in-hospital mortality was 25.2 versus 29.4 percent."], [1446.94, 1455.32, "Tutor", "The criticisms: a single centre, no blinding, a composite outcome, and small fluid volumes, with a median of about a litre in each arm."], [1455.32, 1466.33, "Tutor", "Then came the Australian and New Zealand PLUS trial, which you have met already, and the Brazilian BaSICS trial, both larger and blinded, and neither showed a mortality difference."], [1466.33, 1470.2, "Tutor", "What it changed: balanced crystalloids became the default."], [1470.38, 1477.18, "Tutor", "The 2026 Surviving Sepsis guideline suggests them over saline, with saline still preferred in traumatic brain injury."], [1477.18, 1478.6, "Tutor", "Quote it this way."], [1478.6, 1488.18, "Tutor", "SMART showed a small reduction in major adverse kidney events with balanced crystalloids, but the larger blinded trials, PLUS and BaSICS, found no mortality difference."], [1489.58, 1493.31, "Examiner", "This is from the 2016 first sitting, question twenty nine."], [1493.31, 1506.94, "Examiner", "List the pathophysiological changes, system by system, associated with end-stage kidney disease, dialysis dependent, and briefly explain how these may impact on the management when a dialysis dependent patient becomes critically ill."], [1506.94, 1508.58, "Examiner", "You have ten minutes."], [1509.08, 1513.21, "Candidate", "I will go system by system and link each change to management."], [1513.21, 1514.57, "Candidate", "Cardiovascular."], [1514.57, 1520.65, "Candidate", "These patients have hypertension, left ventricular hypertrophy and accelerated atherosclerosis."], [1520.65, 1526.26, "Candidate", "Their usual pressure may be higher, so I would individualise the blood pressure target."], [1526.26, 1533.11, "Candidate", "They are at risk of uraemic pericarditis and effusion, so I would have a low threshold for echocardiography."], [1533.11, 1538.37, "Candidate", "Troponin is often chronically raised, so I would interpret it against a baseline."], [1538.37, 1539.55, "Candidate", "Respiratory."], [1539.55, 1548.64, "Candidate", "They are prone to pulmonary oedema because they are oligo-anuric, so fluid is restricted, and dialysis or ultrafiltration is used to remove fluid."], [1548.64, 1550.12, "Candidate", "Renal and fluids."], [1550.12, 1558.62, "Candidate", "Usually oligo-anuric, so all fluids, feeds and drugs count against a tight balance, and I would plan dialysis early with the renal team."], [1558.62, 1559.69, "Candidate", "Metabolic."], [1559.69, 1571.44, "Candidate", "Hyperkalaemia and metabolic acidosis, worsened by illness, tissue injury and transfusion, so I would avoid potassium-containing fluids, watch for suxamethonium, and monitor potassium closely."], [1571.44, 1572.62, "Candidate", "Haematology."], [1572.62, 1578.52, "Candidate", "Anaemia from low erythropoietin, and uraemic platelet dysfunction, so bleeding risk is high."], [1578.52, 1584.07, "Candidate", "I would transfuse to a restrictive target and consider desmopressin before procedures."], [1584.07, 1584.96, "Candidate", "Immune."], [1585.14, 1590.57, "Candidate", "They are immunosuppressed, so infection risk is higher and fever may be blunted."], [1590.57, 1592.12, "Candidate", "Gastrointestinal."], [1592.12, 1598.23, "Candidate", "Dysmotility, gastroparesis and ulceration, so aspiration risk and stress ulcer prophylaxis."], [1598.23, 1599.53, "Candidate", "Neurological."], [1599.53, 1604.9, "Candidate", "Uraemic encephalopathy and polyneuropathy, which confound sedation and weaning."], [1605.4, 1606.47, "Examiner", "That is a good start."], [1606.47, 1607.92, "Examiner", "You have not mentioned the arm."], [1607.92, 1608.88, "Examiner", "Or the drug chart."], [1609.38, 1610.07, "Candidate", "Yes."], [1610.07, 1611.45, "Candidate", "Vascular access."], [1611.45, 1614.39, "Candidate", "An arteriovenous fistula must be protected."], [1614.39, 1623.88, "Candidate", "No blood pressure cuffs, venepuncture or lines in that arm, and I would avoid the subclavian vein on that side because central stenosis can kill the fistula."], [1623.88, 1631.25, "Candidate", "I would not use the fistula for continuous therapy, because needle dislodgement over many hours risks major haemorrhage."], [1631.25, 1633.95, "Candidate", "I would check for a thrill every shift."], [1633.95, 1635.16, "Candidate", "Pharmacology."], [1635.16, 1638.84, "Candidate", "Renally cleared drugs and active metabolites accumulate."], [1638.84, 1643.16, "Candidate", "Morphine metabolites, enoxaparin, gabapentin, and many antibiotics."], [1643.16, 1652.02, "Candidate", "Doses need adjusting, and drugs removed by dialysis need timing around sessions, so I would involve the pharmacist and use levels where available."], [1652.52, 1656.52, "Examiner", "And when you dialyse a patient whose urea is very high on admission?"], [1657.02, 1658.97, "Candidate", "Dialysis disequilibrium."], [1658.97, 1668.14, "Candidate", "A rapid fall in plasma urea leaves the brain relatively hyperosmolar, so water moves in, causing cerebral oedema, headache, seizures and coma."], [1668.14, 1672.35, "Candidate", "The risk is highest with a first session or a very high urea."], [1672.35, 1679.07, "Candidate", "So I would start gently, with a lower dose or continuous therapy, especially if there is brain injury."], [1679.07, 1691.9, "Candidate", "Mineral and bone too: secondary hyperparathyroidism, high phosphate and low calcium, so continue binders and calcitriol when feeding, and handle them carefully because of fracture risk and fragile skin."], [1692.4, 1694.36, "Examiner", "Where the marks come from."], [1694.36, 1700.12, "Examiner", "The College answer is system by system, and each change is paired with what you do about it."], [1700.12, 1704.56, "Examiner", "The candidate who lists only the pathophysiology gets half the marks."], [1704.56, 1713.84, "Examiner", "The examiners' comment for that sitting was exactly that: they expected a system-by-system structure with each change linked to its impact on management."], [1713.84, 1718.85, "Examiner", "The pass rate was twenty nine percent, and the highest mark was six and a half."], [1718.85, 1732.1, "Examiner", "This answer started well, cardiovascular, respiratory, potassium, platelets, but the first pass missed vascular access, pharmacology and dialysis disequilibrium, which are the three points specific to the dialysis patient."], [1732.1, 1735.96, "Examiner", "Without the prompts, I would give it around six out of ten."], [1735.96, 1737.4, "Examiner", "With them, eight."], [1737.4, 1751.12, "Examiner", "The one fix: write it as a two column table, change on the left and management on the right, and put access, drugs and disequilibrium in the first three rows, because those are the points that separate this patient from any other."], [1752.02, 1754.81, "Tutor", "Two more ways this theme has been asked."], [1754.81, 1769.29, "Tutor", "In the 2020 second sitting, question thirteen: List and briefly discuss the considerations in managing a patient with dialysis dependent End Stage Renal Failure admitted to the ICU post-operatively from an uncomplicated Hartmann's procedure."], [1769.29, 1776.73, "Tutor", "The same table, applied to a patient after bowel surgery, with fluid balance, potassium and feeding taking centre stage."], [1776.73, 1789.35, "Tutor", "And in the 2021 first sitting, question eight: Outline the pathophysiological changes associated with end-stage kidney disease, dialysis dependent, that may impact on the management of critically ill patients."], [1789.35, 1791.56, "Tutor", "That is four times since 2011."], [1791.56, 1793.53, "Tutor", "It is likely to come back."], [1793.53, 1795.22, "Tutor", "Have the table ready."], [1796.62, 1802.69, "Tutor", "Now the round-up, the part of the episode that makes sure the whole syllabus is covered by March."], [1802.69, 1805.41, "Tutor", "Six items, all from this week's blocks."], [1805.41, 1813.33, "Tutor", "First, mechanical support, the intra-aortic balloon pump and extracorporeal membrane oxygenation, from Oh's chapter twenty eight."], [1813.33, 1815.07, "Tutor", "Start with a question."], [1815.07, 1819.0, "Tutor", "When should the balloon inflate, and when should it deflate?"], [1819.0, 1820.5, "Tutor", "Pause, and answer."], [1825.9, 1831.02, "Tutor", "It inflates at the dicrotic notch, at aortic valve closure, at the start of diastole."], [1831.02, 1834.44, "Tutor", "That raises diastolic pressure and coronary perfusion."], [1834.44, 1844.9, "Tutor", "It deflates just before systole, at the start of the upstroke, which lowers the pressure the ventricle has to open the valve against, reducing afterload and myocardial oxygen demand."], [1844.9, 1849.47, "Tutor", "It uses helium because its low density allows fast inflation and deflation."], [1849.47, 1859.17, "Tutor", "On the chest X-ray, the tip should sit just below the aortic knuckle, two to three centimetres distal to the left subclavian artery, roughly at the level of the carina."], [1859.17, 1865.83, "Tutor", "Contraindications are significant aortic regurgitation, aortic dissection and severe peripheral vascular disease."], [1865.83, 1874.54, "Tutor", "Complications are limb ischaemia, bleeding, thrombocytopenia, balloon rupture with gas embolism, and mesenteric or renal ischaemia if it sits too low."], [1874.54, 1882.25, "Tutor", "You heard on Saturday that IABP-SHOCK II showed no mortality benefit in cardiogenic shock after infarction, so routine use has gone."], [1882.25, 1886.21, "Tutor", "It still has a role in mechanical complications and as a bridge."], [1886.21, 1891.45, "Tutor", "Veno-arterial ECMO is the opposite end of the spectrum: full cardiorespiratory support."], [1891.45, 1893.54, "Tutor", "Know its two classic problems."], [1893.72, 1903.46, "Tutor", "Retrograde femoral flow increases left ventricular afterload, so the ventricle can distend and the aortic valve may stop opening, which needs a vent or an Impella."], [1903.46, 1915.19, "Tutor", "And when the native heart recovers and the lungs are poor, the upper body receives poorly oxygenated blood from the heart, called differential hypoxaemia, so you measure saturation in the right arm."], [1915.19, 1924.65, "Tutor", "In 2023 the ECLS-SHOCK trial found no mortality benefit from routine ECMO in infarct-related cardiogenic shock, with more bleeding and vascular complications."], [1924.65, 1932.68, "Tutor", "The College compared the balloon pump and ventricular assist devices in the 2007 first sitting, and asked you to tabulate the answer."], [1933.08, 1937.34, "Tutor", "Second, the central venous catheter, from Oh's chapter twenty four."], [1937.34, 1948.18, "Tutor", "The indications are vasoactive drugs, irritant infusions such as parenteral nutrition or concentrated potassium, monitoring, poor peripheral access, and access for dialysis or pacing."], [1948.18, 1954.37, "Tutor", "Use real-time ultrasound guidance, which reduces failed attempts, arterial puncture and pneumothorax."], [1954.37, 1959.42, "Tutor", "The tip should lie in the lower superior vena cava near the cavo-atrial junction."], [1959.42, 1961.98, "Tutor", "Complications fall into three groups."], [1961.98, 1967.26, "Tutor", "Immediate: arterial puncture, pneumothorax, arrhythmia, air embolism and malposition."], [1967.26, 1969.42, "Tutor", "Early: bleeding and haematoma."], [1969.42, 1973.79, "Tutor", "Late: line-associated bloodstream infection, thrombosis, and erosion."], [1973.79, 1981.91, "Tutor", "For infection, the subclavian site carries the lowest risk and the femoral the highest, while the subclavian carries more pneumothorax."], [1981.91, 1983.72, "Tutor", "That is the 3SITE trial."], [1983.72, 1995.48, "Tutor", "The prevention bundle is hand hygiene, full barrier precautions, chlorhexidine in alcohol for skin preparation, avoiding the femoral site where possible, and removing lines that are no longer needed."], [1995.48, 2004.56, "Tutor", "For air embolism, put the patient head down and on the left side, give a hundred percent oxygen, and aspirate from the line if it is in the right heart."], [2004.96, 2011.0, "Tutor", "Third, beyond the noradrenaline story, vasopressin and its analogues, from Oh's chapter twenty six."], [2011.0, 2018.73, "Tutor", "The College asked it in the 2009 second sitting: Outline the role of vasopressin and its analogues in the critically ill patient."], [2018.73, 2021.04, "Tutor", "Structure the answer by receptor."], [2021.04, 2029.23, "Tutor", "Vasopressin acts at V one receptors on vascular smooth muscle, causing vasoconstriction through the Gq pathway and intracellular calcium."], [2029.23, 2038.71, "Tutor", "It acts at V two receptors in the collecting duct, inserting aquaporin two channels and conserving water, and on factor eight and von Willebrand factor release."], [2038.71, 2042.88, "Tutor", "And at V three receptors in the pituitary, where it releases ACTH."], [2042.88, 2052.65, "Tutor", "In septic shock there is a relative vasopressin deficiency, which is the rationale for replacement at 0.01 to 0.03 units per minute as a noradrenaline-sparing agent."], [2052.65, 2058.06, "Tutor", "The VASST trial found no overall mortality difference compared with noradrenaline alone."], [2058.06, 2059.59, "Tutor", "Then the analogues."], [2059.59, 2069.46, "Tutor", "Terlipressin is a longer-acting V one selective prodrug, used for variceal bleeding and hepatorenal syndrome, with ischaemia and respiratory failure as its main harms."], [2069.46, 2071.72, "Tutor", "Desmopressin is V two selective."], [2071.9, 2080.86, "Tutor", "Use it for central diabetes insipidus, and at 0.3 micrograms per kilogram for uraemic platelet dysfunction and von Willebrand disease."], [2080.86, 2085.46, "Tutor", "Selepressin, a selective V one agonist, did not improve outcomes."], [2085.86, 2089.11, "Tutor", "Fourth, diuretics, from Oh's chapter fifty five."], [2089.11, 2095.22, "Tutor", "Loop diuretics block the sodium potassium two chloride cotransporter in the thick ascending limb."], [2095.22, 2102.02, "Tutor", "Furosemide is highly protein bound and must be secreted into the proximal tubule to reach its site of action."], [2102.02, 2109.0, "Tutor", "That is why it works poorly with hypoalbuminaemia and uraemia, and why higher doses are needed in kidney injury."], [2109.0, 2115.62, "Tutor", "KDIGO advises against diuretics to prevent or treat acute kidney injury, except to manage volume overload."], [2115.62, 2123.53, "Tutor", "Know the furosemide stress test: one milligram per kilogram in a diuretic-naive patient, or 1.5 if they have had loop diuretics."], [2123.53, 2129.4, "Tutor", "A urine output below 200 millilitres in two hours predicts progression to stage three injury."], [2129.4, 2140.97, "Tutor", "Diuretic resistance is managed by an infusion or higher bolus, then sequential nephron blockade with a thiazide such as metolazone, or acetazolamide, watching potassium, magnesium and sodium."], [2140.97, 2145.62, "Tutor", "If the patient still does not respond, ultrafiltration is the next step."], [2146.02, 2151.57, "Tutor", "Fifth and sixth, renal replacement fluids and the dialysis catheter, from Oh's chapter fifty six."], [2151.57, 2160.2, "Tutor", "Replacement fluid and dialysate are sterile, bicarbonate- or lactate-buffered solutions with a sodium near 140 millimoles per litre and variable potassium."], [2160.2, 2166.39, "Tutor", "Bicarbonate buffering is preferred in liver failure and lactic acidosis, where lactate cannot be metabolised."], [2166.39, 2169.14, "Tutor", "Calcium-free fluids are paired with citrate."], [2169.14, 2174.38, "Tutor", "Phosphate-containing solutions reduce the hypophosphataemia that continuous therapy causes."], [2174.38, 2179.83, "Tutor", "In the RENAL trial, hypophosphataemia occurred in about two thirds of the higher intensity arm."], [2179.83, 2187.45, "Tutor", "Pre-dilution, giving replacement fluid before the filter, lowers haematocrit in the filter and prolongs its life, but reduces clearance."], [2187.45, 2194.17, "Tutor", "Post-dilution is more efficient but concentrates the blood, so keep the filtration fraction below about twenty percent."], [2194.17, 2202.47, "Tutor", "For the catheter, the right internal jugular is first choice, then femoral, and the subclavian is avoided because stenosis threatens future fistulae."], [2202.47, 2203.69, "Tutor", "Use ultrasound."], [2203.69, 2208.98, "Tutor", "A right jugular catheter of fifteen to sixteen centimetres reaches the cavo-atrial junction."], [2209.16, 2216.12, "Tutor", "Poor flow, access pressures that are too negative and a short filter life are often line problems, not drug problems."], [2216.52, 2218.7, "Tutor", "That is the primer for week five."], [2218.7, 2221.25, "Tutor", "One thing to do before the next episode."], [2221.25, 2229.22, "Tutor", "On today's revisit, the 2019 calcium and sodium question, write the corrected calcium and the sodium deficit sum on the page before any words."], [2229.22, 2236.88, "Tutor", "Then, when you do the post cardiac surgery shock question, use the four headings: preload, rate and rhythm, contractility and afterload."], [2236.88, 2242.14, "Tutor", "After marking, tick tonight's check-in on Study HQ so the plan picks up from where you are."], [2242.14, 2243.68, "Tutor", "Thanks for listening."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 48.56, "title": "Last week"}, {"start": 191.34, "title": "This week: shock, haemodynamics, fluids and the kidney"}, {"start": 1259.12, "title": "Landmark trials"}, {"start": 1489.58, "title": "Exam practice"}, {"start": 1796.62, "title": "Syllabus round-up"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
