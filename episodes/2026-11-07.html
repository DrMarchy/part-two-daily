<script>
var C=[[0.0, 1.13, "Tutor", "Good morning."], [1.13, 6.39, "Tutor", "This is Part Two Daily for Saturday the seventh of November, and today is a spiral review."], [6.39, 13.31, "Tutor", "Spiral reviews exist because memory decays on a curve, and the cheapest time to rescue a fact is just before you lose it."], [13.31, 21.09, "Tutor", "So we go back to material from about one week ago and about three weeks ago, and we bring each topic back harder, tied to another system."], [21.09, 23.13, "Tutor", "Today there are four revisits."], [23.13, 30.75, "Tutor", "First, cardiogenic shock after a coronary intervention, with a kidney twist and the trial that took the balloon pump off its pedestal."], [30.75, 38.75, "Tutor", "Second, the phosphate and calcium question from the 2025 first sitting, which then walks straight into citrate anticoagulation on the filter."], [38.75, 44.11, "Tutor", "Third, TURP syndrome and the osmolar gap, with a twist where the measured osmolality is low."], [44.11, 49.37, "Tutor", "Fourth, a four-part blood gas question run at exam pace, ending in metformin and dialysis."], [49.37, 55.54, "Tutor", "There is no journal watch today, because nothing new and practice changing has appeared since the last one."], [55.54, 64.56, "Tutor", "After the revisits, a syllabus round-up of six high-yield items from beyond this week: ventilation, airway, pulmonary embolism, poisoning, bleeding, and sepsis."], [64.56, 65.9, "Tutor", "Have a pen ready."], [65.9, 68.8, "Tutor", "There are pause and answer moments throughout."], [70.2, 71.26, "Tutor", "Revisit one."], [71.26, 72.63, "Tutor", "Picture the scene."], [72.63, 74.37, "Tutor", "It is two in the morning."], [74.37, 81.39, "Tutor", "A man in his late fifties comes up from the cath lab intubated, with a stent in his proximal left anterior descending artery."], [81.39, 86.99, "Tutor", "His blood pressure is 82 over 50 on noradrenaline, his peripheries are cold, and the lactate is 6."], [86.99, 89.47, "Tutor", "The nurse asks you what you want first."], [89.47, 92.43, "Tutor", "That is almost word for word a College question."], [92.43, 107.0, "Tutor", "From the 2023 first sitting, question one: Discuss the assessment and initial management, first hour, of an intubated patient admitted to the ICU with cardiogenic shock, after percutaneous coronary intervention for acute coronary syndrome due to a proximal LAD lesion."], [107.0, 116.77, "Tutor", "Your answer should include but not be limited to the following headings: potential likely causes, suggested diagnostic approach, key elements of the management of likely causes."], [116.77, 122.1, "Tutor", "The pass rate was 66.7 percent, and the College said it was a near repeat of a 2019 question."], [122.1, 123.84, "Tutor", "So this theme comes back."], [124.24, 126.86, "Tutor", "Here is the answer that earns the marks."], [126.86, 133.92, "Tutor", "It is a long-answer question, so think in three headings, exactly as the stem gives them, and prioritise inside each one."], [133.92, 141.08, "Tutor", "The examiners were explicit that generic shock answers, which wander into distributive and neurogenic shock, scored poorly."], [141.08, 148.57, "Tutor", "They also said that mechanical support and emergency surgery should be ranked above minor measures like placing an arterial line."], [148.57, 151.25, "Tutor", "First, the likely causes in this patient."], [151.25, 154.86, "Tutor", "Pump failure from a large anterior infarct is the default."], [154.86, 159.56, "Tutor", "But a proximal LAD lesion that has just been stented can still be going wrong."], [159.56, 163.17, "Tutor", "Think stent thrombosis, coronary dissection, or no-reflow."], [163.17, 172.35, "Tutor", "Then the mechanical complications: a ventricular septal rupture, acute mitral regurgitation from papillary muscle rupture, and free wall rupture with tamponade."], [172.35, 183.07, "Tutor", "Add an arrhythmia, bleeding from the access site, including a retroperitoneal haematoma after a femoral puncture, and the haemodynamic effect of sedation and positive pressure ventilation."], [183.07, 184.98, "Tutor", "And one less obvious cause."], [184.98, 194.44, "Tutor", "An apical anterior infarct treated with inotropes can develop dynamic left ventricular outflow tract obstruction, which gets worse with every increase in adrenaline."], [194.62, 196.86, "Tutor", "Second, the diagnostic approach."], [196.86, 202.58, "Tutor", "Echocardiography is the single most valuable test, and it should be done in the first minutes."], [202.58, 206.61, "Tutor", "It tells you the ejection fraction and the regional wall motion."], [206.61, 214.01, "Tutor", "It shows a septal defect with colour flow, a flail mitral leaflet, a pericardial collection, and right ventricular function."], [214.01, 218.77, "Tutor", "Then a twelve-lead ECG for new ST elevation, which suggests stent thrombosis."], [218.77, 225.22, "Tutor", "Then a gas with lactate, a haemoglobin to look for bleeding, potassium and magnesium, and a troponin trend."], [225.22, 229.81, "Tutor", "Talk to the interventional cardiologist early about going back to the lab."], [229.81, 240.91, "Tutor", "A pulmonary artery catheter is reasonable in refractory shock, because it measures cardiac output, wedge pressure and mixed venous saturation, and it lets you calculate cardiac power output."], [240.91, 243.54, "Tutor", "Third, management of the likely causes."], [243.54, 250.77, "Tutor", "Use a mean arterial pressure target of about 65 millimetres of mercury, with noradrenaline as the first line vasopressor."], [250.77, 256.54, "Tutor", "Add an inodilator, dobutamine or milrinone, for a low cardiac output once pressure is restored."], [256.72, 267.71, "Tutor", "Positive end expiratory pressure helps the failing left ventricle, because it lowers both preload and afterload, and the College specifically marked down candidates who could not explain that."], [267.71, 271.83, "Tutor", "Each mechanical complication goes to the surgeon, usually urgently."], [271.83, 278.87, "Tutor", "For refractory shock, escalate to mechanical support, a microaxial flow pump or venoarterial ECMO, through a shock team."], [278.87, 285.35, "Tutor", "Grade the severity with the five SCAI stages, A to E, which makes your answer look like a consultant wrote it."], [285.35, 287.82, "Tutor", "The stages are worth knowing by name."], [287.82, 291.56, "Tutor", "A is at risk, such as a large infarct without hypoperfusion."], [291.56, 296.28, "Tutor", "B is beginning shock, with hypotension or tachycardia but preserved perfusion."], [296.28, 301.5, "Tutor", "C is classic shock, with hypoperfusion needing a vasoactive drug or mechanical support."], [301.5, 305.35, "Tutor", "D is deteriorating, meaning worsening despite initial therapy."], [305.35, 310.41, "Tutor", "E is extremis, including refractory arrest or ongoing cardiopulmonary resuscitation."], [310.41, 316.23, "Tutor", "Our man, intubated on noradrenaline with a lactate of 6 and cold peripheries, is at least stage C."], [316.23, 323.32, "Tutor", "If he needs a second vasoactive drug within the hour, he is stage D, and that is when the shock team decides on a device."], [323.5, 329.06, "Tutor", "Stage it out loud in your answer, because it shows the examiner a rationale for escalation rather than a list."], [329.96, 331.52, "Examiner", "I would add one thing."], [331.52, 334.6, "Examiner", "Candidates write mechanical support and stop there."], [334.6, 338.45, "Examiner", "Which device, for what problem, and what does it cost the patient?"], [338.45, 341.99, "Examiner", "A balloon pump does not rescue a heart that cannot contract."], [341.99, 345.02, "Examiner", "ECMO raises afterload on a stunned left ventricle."], [345.02, 347.36, "Examiner", "Say that and you are in the top half."], [348.26, 352.58, "Tutor", "That brings us to the trial that changed the balloon pump story."], [352.58, 357.63, "Tutor", "IABP-SHOCK II, Thiele and colleagues, New England Journal of Medicine, 2012."], [357.63, 366.7, "Tutor", "Six hundred patients at 37 German centres with myocardial infarction complicated by cardiogenic shock, all planned for early revascularisation."], [366.7, 371.92, "Tutor", "They were randomised to intra-aortic balloon counterpulsation or to no balloon."], [371.92, 379.97, "Tutor", "The primary outcome was 30-day all-cause mortality, 39.7 versus 41.3 percent, a relative risk of 0.96, with a P value of 0.69."], [379.97, 385.01, "Tutor", "There was no difference in bleeding, peripheral ischaemia, sepsis or stroke."], [385.01, 389.94, "Tutor", "Follow-up at one year and at six years showed the same absence of benefit."], [389.94, 400.27, "Tutor", "The main criticisms were that it was unblinded, about one in ten control patients crossed over to a balloon, and the control group had a higher lactate at baseline."], [400.27, 413.9, "Tutor", "What it changed: the European Society of Cardiology now recommends against routine balloon pump use in cardiogenic shock, reserving it for mechanical complications such as a septal rupture or acute mitral regurgitation."], [414.08, 429.24, "Tutor", "One sentence for an SAQ: in IABP-SHOCK II, routine balloon pump support for infarct-related cardiogenic shock did not reduce 30-day mortality, so it is not used routinely, though it can still bridge a mechanical complication to surgery."], [429.64, 432.94, "Tutor", "Now the difficulty goes up, and the kidney joins in."], [432.94, 434.15, "Tutor", "It is day two."], [434.15, 439.38, "Tutor", "The lactate has cleared to 1.8 and he is on a low dose of noradrenaline and dobutamine."], [439.38, 442.96, "Tutor", "But he has passed 80 millilitres of urine in eight hours."], [442.96, 446.7, "Tutor", "The creatinine has gone from 90 to 210 micromoles per litre."], [446.7, 452.31, "Tutor", "His central venous pressure is 18 millimetres of mercury and his mean arterial pressure is 68."], [452.31, 456.0, "Tutor", "The registrar wants to give a fluid bolus for the oliguria."], [456.0, 457.32, "Tutor", "What do you say?"], [458.22, 459.92, "Candidate", "I would not give fluid."], [459.92, 463.48, "Candidate", "His output is improving and his filling pressure is high."], [463.48, 466.17, "Candidate", "I think the problem is venous congestion."], [466.17, 474.06, "Candidate", "The perfusion pressure of the kidney is roughly the mean arterial pressure minus the central venous pressure, so 68 minus 18 is only 50."], [474.06, 480.25, "Candidate", "I would try a loop diuretic, perhaps frusemide 40 to 80 milligrams intravenously, and check the response."], [480.25, 485.62, "Candidate", "If he does not respond, I would talk to the nephrologists about renal replacement therapy."], [486.12, 486.75, "Examiner", "Good."], [486.75, 490.38, "Examiner", "That is cardiorenal syndrome type one, and you have the physiology."], [490.38, 492.37, "Examiner", "But you have left out two things."], [492.37, 495.76, "Examiner", "What would make you start dialysis today rather than tomorrow?"], [495.76, 497.36, "Examiner", "And what about the drugs?"], [497.86, 506.02, "Candidate", "The urgent indications are refractory hyperkalaemia, severe acidosis, pulmonary oedema that is not responding to diuretics, and uraemic complications."], [506.02, 511.76, "Candidate", "Without those, the trials of earlier versus delayed starting do not show a benefit from starting early."], [511.76, 518.06, "Candidate", "For the drugs, I would review anything renally cleared, such as low molecular weight heparin and some antibiotics."], [518.06, 521.94, "Candidate", "I would also stop nephrotoxins and avoid more contrast if possible."], [522.84, 525.43, "Tutor", "That is the answer that earns the marks."], [525.43, 529.48, "Tutor", "Notice how the higher-level move is to say congestion, not dryness."], [529.48, 535.85, "Tutor", "A rising creatinine with a high central venous pressure in a failing heart is a reason to unload, not to fill."], [535.85, 537.79, "Tutor", "Time for a pause and answer."], [537.79, 544.6, "Tutor", "Name the three mechanical complications of myocardial infarction and the single echo finding that identifies each one."], [544.6, 546.0, "Tutor", "Pause, and answer."], [551.4, 560.6, "Tutor", "Ventricular septal rupture shows a left-to-right jet across the septum on colour Doppler, with a step-up in oxygen saturation from the right atrium to the pulmonary artery."], [560.6, 566.02, "Tutor", "Papillary muscle rupture shows a flail mitral leaflet with severe, often eccentric, regurgitation."], [566.02, 572.21, "Tutor", "And free wall rupture shows a pericardial effusion with tamponade physiology, often with clot in the pericardium."], [572.21, 575.84, "Tutor", "All three typically present days, not hours, after the infarct."], [575.84, 579.72, "Tutor", "All three need a surgeon, and a balloon pump is a reasonable bridge."], [580.12, 581.34, "Tutor", "Revisit two."], [581.34, 585.23, "Tutor", "This one comes from the 2025 first sitting, question 21."], [585.23, 586.75, "Tutor", "It has two parts."], [586.75, 594.84, "Tutor", "Part one gives you an elderly patient admitted with falls, who then develops hypoxia and heart failure despite a normal echo."], [594.84, 606.94, "Tutor", "The phosphate is less than 0.10 millimoles per litre, the potassium is 3.1, the magnesium is 0.65, the albumin is 14 grams per litre, and the urea, creatinine and creatine kinase are all low."], [606.94, 619.52, "Tutor", "Part two reads like this: A patient recently discharged from hospital following a long admission for management of variceal bleeding and decompensated alcoholic cardiomyopathy is referred to the ICU."], [619.52, 625.42, "Tutor", "They have presented to the emergency department with refractory seizures and hypotension."], [625.42, 637.28, "Tutor", "The key values are an ionised calcium of 0.61 millimoles per litre, a creatinine of 145 micromoles per litre, a urea of 9.4, a potassium of 5.1, a bicarbonate of 20, and an albumin of 19."], [637.28, 642.14, "Tutor", "Part a asks for five possible causes of these biochemical abnormalities."], [642.14, 647.37, "Tutor", "Part b asks for five investigations that would help discriminate between them."], [647.37, 654.0, "Tutor", "You scored three and a half on this on the 14th of October and two and a half on the 17th of October."], [654.18, 658.04, "Tutor", "The pass rate was 57.1 percent, and the highest mark in the room was 5."], [658.04, 660.33, "Tutor", "So it was a hard question for everyone."], [660.33, 663.84, "Tutor", "But the examiner comments tell you exactly where the marks were."], [663.84, 668.04, "Tutor", "Many candidates failed to identify severe hypocalcaemia and renal dysfunction."], [668.04, 673.02, "Tutor", "And answers on the causes of seizures that were not linked to the biochemistry scored nothing."], [673.42, 675.05, "Tutor", "So let us rebuild it."], [675.05, 680.1, "Tutor", "In part one, the significance of a phosphate below 0.1 is cellular energy failure."], [680.1, 684.14, "Tutor", "Without phosphate you cannot make ATP or 2,3-diphosphoglycerate."], [684.14, 694.68, "Tutor", "That gives respiratory muscle weakness, which explains the hypoxia and tachypnoea, and impaired myocardial contractility, which explains heart failure despite a recent normal echo."], [694.68, 700.01, "Tutor", "The low urea, creatinine and creatine kinase point to malnutrition and low muscle mass."], [700.01, 707.64, "Tutor", "The low potassium and magnesium fit diuretics and refeeding, and the potassium will not correct until the magnesium is replaced."], [707.64, 710.96, "Tutor", "One fix from your answers is worth making explicit."], [710.96, 715.5, "Tutor", "Check each value against its own reference range before you interpret it."], [715.5, 719.6, "Tutor", "The ionised calcium of 1.31 is normal in this question, not high."], [719.6, 723.47, "Tutor", "And Addison's disease causes a high potassium, not a low one."], [723.47, 726.38, "Tutor", "Five likely causes of the hypophosphataemia."], [726.38, 731.88, "Tutor", "Refeeding syndrome, which is an intracellular shift driven by insulin once feeding starts."], [731.88, 736.2, "Tutor", "Renal phosphate loss from diuretics, alcohol, or hyperparathyroidism."], [736.2, 741.98, "Tutor", "Parathyroid hormone related peptide from an occult malignancy, given the falls and the decline."], [741.98, 745.74, "Tutor", "Poor intake and absorption, including vitamin D deficiency."], [745.92, 754.0, "Tutor", "And intravenous iron, specifically ferric carboxymaltose, which raises fibroblast growth factor 23 and causes phosphate wasting."], [754.0, 755.96, "Tutor", "Five slots, five answers."], [755.96, 757.8, "Tutor", "Do not leave one blank."], [757.8, 764.63, "Tutor", "Because refeeding sits at the top of that list, know how to prevent it, as it is examined in its own right."], [764.63, 779.95, "Tutor", "The NICE criteria for high risk include a body mass index below 16, unintentional weight loss of more than 15 percent in three to six months, little or no intake for more than ten days, and low potassium, phosphate or magnesium before feeding starts."], [779.95, 786.9, "Tutor", "Having two lesser criteria, such as a body mass index below 18.5 or a history of alcohol misuse, also counts."], [786.9, 794.32, "Tutor", "For a high-risk patient, start at no more than 10 kilocalories per kilogram per day, and 5 in the most extreme cases."], [794.32, 799.9, "Tutor", "Give thiamine and a B vitamin preparation before and during the first days of feeding."], [799.9, 807.09, "Tutor", "Then check phosphate, potassium and magnesium daily, replace them, and build up the feed over four to seven days."], [807.09, 814.63, "Tutor", "In the ICU, a fall in phosphate after feeding begins is the trigger to slow the feed, not to stop nutrition altogether."], [814.63, 815.64, "Tutor", "Part two."], [815.82, 827.76, "Tutor", "Name the problem first: severe hypocalcaemia, ionised 0.61, with acute kidney injury, in a patient with alcohol-related liver and heart disease, presenting with seizures and hypotension."], [827.76, 832.37, "Tutor", "Both the seizures and the hypotension are explained by the calcium."], [832.37, 833.6, "Tutor", "Five causes."], [833.6, 842.46, "Tutor", "First, hypomagnesaemia, from alcohol and proton pump inhibitors, which impairs both the secretion and the action of parathyroid hormone."], [842.46, 846.89, "Tutor", "Second, acute pancreatitis, with calcium being deposited in fat."], [846.89, 852.98, "Tutor", "Third, vitamin D deficiency, from malnutrition and impaired hydroxylation in liver disease."], [852.98, 856.37, "Tutor", "Fourth, renal failure with phosphate retention."], [856.37, 862.15, "Tutor", "Fifth, rhabdomyolysis from the seizures, where calcium is deposited in injured muscle."], [862.15, 870.09, "Tutor", "The College accepted vitamin D, parathyroid hormone and its related peptide, and amylase or lipase as the investigations."], [870.09, 876.3, "Tutor", "Add magnesium, phosphate, creatine kinase and lactate, and an ECG to look at the QT interval."], [877.2, 878.32, "Examiner", "And treatment?"], [878.32, 880.95, "Examiner", "The question did not ask for it, but I will."], [880.95, 882.52, "Examiner", "The patient is seizing."], [883.02, 891.48, "Candidate", "Ten to twenty millilitres of 10 percent calcium gluconate over ten minutes, which is about 2.2 millimoles of calcium for each ten millilitres."], [891.48, 897.79, "Candidate", "Or ten millilitres of 10 percent calcium chloride through a central line, which is about 6.8 millimoles."], [897.79, 901.79, "Candidate", "Then an infusion, with ionised calcium checked every few hours."], [901.79, 906.58, "Candidate", "And I would replace magnesium at the same time, or the calcium will not hold."], [907.08, 907.8, "Examiner", "Correct."], [907.8, 910.97, "Examiner", "Calcium chloride gives three times the calcium per millilitre."], [910.97, 913.0, "Examiner", "That is a number an examiner can ask."], [913.9, 917.78, "Tutor", "Now raise the difficulty and bring in this week's renal block."], [917.78, 920.16, "Tutor", "Same principles, different patient."], [920.16, 928.42, "Tutor", "A woman with alcohol-related cirrhosis and septic shock is on continuous venovenous haemodiafiltration with regional citrate anticoagulation."], [928.42, 933.74, "Tutor", "Over 24 hours her systemic ionised calcium falls from 1.05 to 0.85 millimoles per litre."], [933.74, 936.4, "Tutor", "Her total calcium rises from 2.2 to 2.9."], [936.4, 939.17, "Tutor", "Her anion gap opens, and her lactate is 5."], [939.17, 940.56, "Tutor", "What is going on?"], [940.56, 943.44, "Tutor", "It helps to know where the filter came from."], [943.44, 953.92, "Tutor", "In the Netherlands during the German occupation, a young physician named Willem Kolff, working in the small hospital at Kampen, built an artificial kidney out of what he could find."], [953.92, 962.95, "Tutor", "He used sausage casing made of cellophane as the membrane, juice cans, and parts from an old washing machine, with the tubing wound around a rotating drum."], [962.95, 970.6, "Tutor", "The cellophane let small molecules like urea pass from the blood into a bath of fluid by diffusion, down a concentration gradient."], [970.6, 974.14, "Tutor", "His first fifteen patients with kidney failure all died."], [974.14, 979.3, "Tutor", "The sixteenth, in 1945, was a comatose woman in kidney failure named Maria Schafstad."], [979.3, 983.9, "Tutor", "She was a known Nazi collaborator, held as a prisoner after the liberation."], [984.08, 989.0, "Tutor", "Kolff treated her anyway, and she was the first person to survive because of dialysis."], [989.0, 999.67, "Tutor", "Kolff gave several of his early machines to hospitals abroad, later moved to the United States, and went on to work on artificial organs for the rest of his career, including the artificial heart."], [999.67, 1008.05, "Tutor", "Kolff's machine needed anticoagulation to keep blood from clotting on the membrane, and the problem he faced is still the problem we solve with citrate."], [1008.05, 1010.98, "Tutor", "Two exam points come straight out of that story."], [1010.98, 1013.49, "Tutor", "First, his drum was a diffusion machine."], [1013.49, 1015.06, "Tutor", "Diffusion is dialysis."], [1015.06, 1020.4, "Tutor", "Convection, where water is pushed across the membrane and drags solute with it, is filtration."], [1020.4, 1029.5, "Tutor", "Today's question on continuous venovenous haemofiltration asks about pure convection, and the College noted that many candidates described haemodiafiltration instead."], [1029.5, 1036.2, "Tutor", "Second, the circuit has to stay unclotted without making the patient bleed, which is exactly what regional citrate does."], [1036.6, 1041.84, "Tutor", "Citrate is infused before the filter and chelates ionised calcium in the circuit."], [1041.84, 1049.25, "Tutor", "The target post-filter ionised calcium is roughly 0.25 to 0.35 millimoles per litre, which stops the clotting cascade."], [1049.25, 1053.55, "Tutor", "Some of the calcium citrate complex is removed across the filter."], [1053.55, 1061.67, "Tutor", "The rest returns to the patient, where the liver, and to a lesser extent muscle and kidney, metabolise citrate in the Krebs cycle."], [1061.67, 1068.09, "Tutor", "Each molecule of trisodium citrate generates three molecules of bicarbonate and releases its calcium."], [1068.09, 1074.09, "Tutor", "That is why the usual complication in a patient with a working liver is a metabolic alkalosis."], [1074.09, 1079.57, "Tutor", "In liver failure, or in shock with poor tissue perfusion, citrate is not metabolised."], [1079.57, 1080.92, "Tutor", "It accumulates."], [1080.92, 1091.04, "Tutor", "The bound calcium stays bound, so the total calcium rises while the ionised calcium falls, and unmetabolised citrate is an unmeasured anion, so the anion gap opens."], [1091.04, 1095.04, "Tutor", "The tell-tale sign is the ratio of total to ionised calcium."], [1095.04, 1097.16, "Tutor", "Time for a pause and answer."], [1097.16, 1102.99, "Tutor", "What ratio of total to ionised calcium suggests citrate accumulation, and why does it rise?"], [1102.99, 1104.52, "Tutor", "Pause, and answer."], [1109.92, 1113.05, "Tutor", "A ratio above 2.5 suggests citrate accumulation."], [1113.05, 1116.91, "Tutor", "In our patient it is 2.9 divided by 0.85, which is about 3.4."], [1116.91, 1122.9, "Tutor", "It rises because the citrate-bound calcium is counted in the total but not in the ionised fraction."], [1122.9, 1131.07, "Tutor", "The management is to reduce or stop the citrate, increase calcium replacement, and consider switching to heparin or to no anticoagulation."], [1131.07, 1142.32, "Tutor", "A twist like this can earn you more than recall alone: KDIGO, in its 2012 acute kidney injury guideline, suggests regional citrate for continuous therapy in patients without a contraindication."], [1142.32, 1146.24, "Tutor", "Severe liver failure is the classic relative contraindication."], [1146.24, 1149.54, "Tutor", "And one last link back to part one of the question."], [1149.54, 1155.42, "Tutor", "Continuous renal replacement therapy, run with phosphate-free fluids, steadily removes phosphate."], [1155.42, 1162.92, "Tutor", "Hypophosphataemia on the filter is common and is often missed, and it is one reason patients fail to wean from the ventilator."], [1162.92, 1168.4, "Tutor", "Check the phosphate daily and replace it, or use a phosphate-containing replacement fluid."], [1168.8, 1170.04, "Tutor", "Revisit three."], [1170.04, 1175.86, "Tutor", "A 77-year-old man is having a transurethral resection of the prostate under spinal anaesthesia."], [1175.86, 1178.17, "Tutor", "He becomes restless and agitated."], [1178.17, 1181.05, "Tutor", "He is intubated in theatre and sent to you."], [1181.05, 1184.04, "Tutor", "This is the 2009 second sitting, question 21."], [1184.04, 1188.22, "Tutor", "The biochemistry, read in order: sodium, 113 millimoles per litre."], [1188.22, 1190.59, "Tutor", "Chloride, 87 millimoles per litre."], [1190.59, 1193.07, "Tutor", "Potassium, 4.5 millimoles per litre."], [1193.07, 1195.44, "Tutor", "Glucose, 5.1 millimoles per litre."], [1195.44, 1197.64, "Tutor", "Urea, 5.0 millimoles per litre."], [1197.64, 1200.97, "Tutor", "Measured osmolality, 280 milliosmoles per kilogram."], [1200.97, 1213.45, "Tutor", "The parts ask you to describe the important biochemical abnormalities, the likely cause of the confusion, the transient neurological disturbance, two confirmatory tests, and whether hypertonic saline is indicated."], [1213.45, 1218.41, "Tutor", "You scored three on this on the 14th of October and five on the 17th of October."], [1218.41, 1221.12, "Tutor", "The diagnosis was right the second time."], [1221.12, 1225.47, "Tutor", "The marks you left behind were in the calculation and the mechanisms."], [1225.47, 1229.42, "Tutor", "So here is a pause and answer, and do the arithmetic properly."], [1229.42, 1232.41, "Tutor", "Calculate the osmolar gap from these numbers."], [1232.41, 1233.88, "Tutor", "Pause, and answer."], [1239.28, 1244.2, "Tutor", "The calculated osmolality is two times the sodium, plus glucose, plus urea."], [1244.2, 1248.47, "Tutor", "Two times 113 is 226, plus 5.1, plus 5.0, which gives about 236."], [1248.47, 1250.48, "Tutor", "The measured value is 280."], [1250.48, 1254.39, "Tutor", "The osmolar gap is therefore 44 milliosmoles per kilogram."], [1254.39, 1260.5, "Tutor", "Anything over about 10 is abnormal, and a gap this large means an unmeasured osmole is present."], [1260.5, 1268.74, "Tutor", "In this setting that osmole is glycine, absorbed from 1.5 percent glycine irrigating fluid through opened prostatic venous sinuses."], [1268.74, 1273.12, "Tutor", "So this is severe hyponatraemia with a normal measured osmolality."], [1273.12, 1275.55, "Tutor", "It is iso-osmolar, not hypotonic."], [1275.55, 1278.81, "Tutor", "That one sentence answers most of the question."], [1278.81, 1282.9, "Tutor", "The confusion is mostly glycine toxicity, not brain swelling."], [1282.9, 1294.11, "Tutor", "Glycine is an inhibitory neurotransmitter in the retina, which explains the transient visual disturbance, sometimes complete blindness with fixed pupils, that resolves within hours."], [1294.11, 1300.21, "Tutor", "It is also a co-agonist at the NMDA receptor, which contributes to encephalopathy and seizures."], [1300.21, 1305.78, "Tutor", "And it is metabolised to serine and ammonia, so hyperammonaemia adds to the confusion."], [1305.78, 1310.29, "Tutor", "The two confirmatory tests are serum glycine, and ammonia or serine."], [1310.29, 1312.6, "Tutor", "Is hypertonic saline indicated?"], [1312.6, 1315.8, "Tutor", "No, because the measured osmolality is normal."], [1315.98, 1320.08, "Tutor", "There is no osmotic gradient driving water into the brain."], [1320.08, 1325.79, "Tutor", "The College answer said to consider it only if the measured osmolality is below 260."], [1325.79, 1332.38, "Tutor", "The gas shows a pH of 7.33, a carbon dioxide of 33 millimetres of mercury and a bicarbonate of 16."], [1332.38, 1340.08, "Tutor", "Using Winter's formula, the expected carbon dioxide is one and a half times 16, plus 8, which is 32, give or take 2."], [1340.08, 1346.23, "Tutor", "So this is a normal anion gap metabolic acidosis with appropriate respiratory compensation."], [1346.23, 1352.68, "Tutor", "The mechanism, in Stewart terms, is that the absorbed fluid has a strong ion difference of zero."], [1352.68, 1359.58, "Tutor", "It lowers the extracellular strong ion difference more than it dilutes the weak acids, so the pH falls."], [1359.58, 1366.29, "Tutor", "Seven hours later the sodium is 130, the urea has risen to 10.6, and the measured osmolality is 281."], [1366.29, 1373.12, "Tutor", "The calculated value is now 2 times 130, plus 5.5, plus 10.6, about 276, so the gap has almost closed."], [1373.12, 1378.46, "Tutor", "The glycine has been metabolised, and the rise in urea reflects its breakdown."], [1378.46, 1384.73, "Tutor", "The registrar is worried that the sodium is correcting too fast, a rise of 17 in seven hours."], [1384.73, 1389.7, "Tutor", "There is a basis to think about it, but the concern does not apply here."], [1389.88, 1397.81, "Tutor", "The osmolality has not changed, so brain cells have not had to adapt to hypotonicity, and the risk of osmotic demyelination is low."], [1397.81, 1404.49, "Tutor", "One more thing the examiners like: the differential of agitation during a resection under spinal anaesthesia."], [1404.49, 1418.75, "Tutor", "Before you settle on TURP syndrome, consider hypoxaemia, a high spinal block, bladder perforation with pain from extravasated fluid, haemorrhage with hypotension, hypothermia from cold irrigating fluid, and bacteraemia from the urinary tract."], [1418.75, 1423.2, "Tutor", "A sentence that rules these in or out shows judgment, not just recall."], [1424.1, 1426.04, "Examiner", "Now I change one number."], [1426.04, 1429.48, "Examiner", "Same patient, but the measured osmolality is 252."], [1429.48, 1436.62, "Examiner", "The surgeon was using sterile water, or the resection went on for ninety minutes and he absorbed three litres."], [1436.62, 1437.95, "Examiner", "He is seizing."], [1437.95, 1438.98, "Examiner", "What now?"], [1439.48, 1445.09, "Candidate", "Then this is hypotonic hyponatraemia with cerebral oedema, and it is an emergency."], [1445.09, 1456.86, "Candidate", "I would give 150 millilitres of 3 percent saline over 20 minutes, check the sodium, and repeat up to twice more, aiming for a rise of about 5 millimoles per litre in the first hour."], [1456.86, 1461.22, "Candidate", "Then I would limit the total rise to 10 in the first 24 hours."], [1461.22, 1465.08, "Candidate", "I would also treat the seizures with a benzodiazepine."], [1465.58, 1469.11, "Examiner", "That matches the 2014 European guideline on hyponatraemia."], [1469.11, 1471.62, "Examiner", "But you have assumed his volume status."], [1471.62, 1473.59, "Examiner", "He has absorbed three litres."], [1473.59, 1475.3, "Examiner", "What is his chest doing?"], [1475.8, 1482.32, "Candidate", "He may well have pulmonary oedema and hypertension from the fluid load, then hypotension as it redistributes."], [1482.32, 1487.39, "Candidate", "So I would examine him and image the lungs, and give frusemide if he is overloaded."], [1487.39, 1495.8, "Candidate", "If there is renal impairment and severe glycine or ammonia toxicity, haemodialysis can clear both, which links back to the dialysis discussion."], [1496.7, 1497.46, "Tutor", "Good."], [1497.46, 1502.83, "Tutor", "Notice the higher-level layer: the osmolality decides the treatment, not the sodium."], [1502.83, 1505.04, "Tutor", "Two more points for the twist."], [1505.04, 1512.34, "Tutor", "First, modern bipolar resection uses normal saline as the irrigant, so the classic glycine syndrome is becoming rare."], [1512.34, 1520.51, "Tutor", "But saline absorption still causes volume overload and a hyperchloraemic acidosis, so the syndrome has changed rather than vanished."], [1520.51, 1523.37, "Tutor", "Second, the College has not forgotten it."], [1523.37, 1528.44, "Tutor", "TURP syndrome came back twice in the 2022 second sitting, as questions 6 and 7."], [1528.44, 1529.67, "Tutor", "So expect it."], [1529.67, 1537.78, "Tutor", "Your fix from both attempts is the same: write the osmolar gap calculation out in full, then give the reason behind each yes or no."], [1538.18, 1541.62, "Tutor", "Revisit four, and this one is a gas-reading workout."], [1541.62, 1547.13, "Tutor", "It is the 2013 second sitting, question 26, which is four short data questions in a row."], [1547.13, 1550.75, "Tutor", "You scored one and a half on it on the 20th of October."], [1550.75, 1558.21, "Tutor", "You answered only the first part, and you used the wrong compensation formula, so the other three parts never got started."], [1558.21, 1562.97, "Tutor", "This is a speed problem as much as a knowledge problem, so let us drill it."], [1562.97, 1563.94, "Tutor", "Part one."], [1563.94, 1571.06, "Tutor", "A 46-year-old man has been ventilated for three weeks with severe pneumonia and acute respiratory distress syndrome."], [1571.06, 1584.6, "Tutor", "On an inspired oxygen fraction of 0.6, the pH is 7.5, the arterial oxygen is 79 millimetres of mercury, the carbon dioxide is 45 millimetres of mercury, the bicarbonate is 36 millimoles per litre, and the base excess is plus 12."], [1584.6, 1588.33, "Tutor", "The sodium is 138, the potassium 5.0 and the chloride 97."], [1588.33, 1590.46, "Tutor", "Here is the pause and answer."], [1590.46, 1596.77, "Tutor", "What is the expected carbon dioxide for this metabolic alkalosis, and is the compensation appropriate?"], [1596.77, 1598.26, "Tutor", "Pause, and answer."], [1603.66, 1610.05, "Tutor", "The formula for metabolic alkalosis is 0.7 times the bicarbonate, plus 20, give or take 5."], [1610.05, 1613.57, "Tutor", "So 0.7 times 36 is 25.2, plus 20, which is 45."], [1613.57, 1616.31, "Tutor", "The measured carbon dioxide is 45."], [1616.31, 1624.79, "Tutor", "So this is a metabolic alkalosis with appropriate respiratory compensation, and there is no separate respiratory disorder."], [1624.79, 1634.24, "Tutor", "The formula you used, 0.8 times the carbon dioxide, takes the wrong variable, and it led you to call a second disorder that is not there."], [1634.24, 1636.91, "Tutor", "Learn the four formulas as a set."], [1636.91, 1643.37, "Tutor", "In metabolic acidosis, Winter's formula: 1.5 times the bicarbonate, plus 8, give or take 2."], [1643.37, 1647.74, "Tutor", "In metabolic alkalosis: 0.7 times the bicarbonate, plus 20."], [1647.74, 1656.48, "Tutor", "In respiratory acidosis, the bicarbonate rises by 1 for every 10 of carbon dioxide acutely, and by 4 for every 10 chronically."], [1656.48, 1661.5, "Tutor", "In respiratory alkalosis, it falls by 2 acutely and by 5 chronically."], [1661.5, 1665.15, "Tutor", "The College also gave marks for the oxygenation."], [1665.15, 1676.37, "Tutor", "The alveolar gas equation gives an alveolar oxygen of about 371 millimetres of mercury at this inspired fraction, so the alveolar to arterial gradient is about 290."], [1676.37, 1685.69, "Tutor", "The ratio of arterial oxygen to inspired oxygen is 79 divided by 0.6, about 130, which is moderate acute respiratory distress syndrome."], [1685.69, 1687.58, "Tutor", "You had the gradient."], [1687.76, 1699.8, "Tutor", "One likely cause: diuresis, or a post-hypercapnic alkalosis, where a chronic respiratory acidosis has been corrected by the ventilator but the kidneys have not yet excreted the retained bicarbonate."], [1700.2, 1703.49, "Tutor", "Part two is the one that rewards a system."], [1703.49, 1711.07, "Tutor", "A 75-year-old insulin-dependent woman with heart failure, on digoxin and a thiazide, arrives semi-comatose."], [1711.07, 1720.49, "Tutor", "The pH is 7.40, the carbon dioxide 32, the bicarbonate 19, the potassium 2.7, the glucose 67 millimoles per litre and the anion gap 34."], [1720.49, 1723.26, "Tutor", "A normal pH hides three disorders."], [1723.26, 1730.63, "Tutor", "First, the anion gap of 34 means a severe high anion gap metabolic acidosis, from diabetic ketoacidosis."], [1730.63, 1732.74, "Tutor", "Second, the delta ratio."], [1732.74, 1736.69, "Tutor", "The anion gap has risen by 34 minus 12, which is 22."], [1736.69, 1741.11, "Tutor", "The bicarbonate has fallen by only 24 minus 19, which is 5."], [1741.11, 1744.07, "Tutor", "Twenty-two divided by 5 is about 4.4."], [1744.07, 1755.21, "Tutor", "Anything above 2 means the bicarbonate is higher than it should be, so there is a coexisting metabolic alkalosis, here from the thiazide and potassium depletion."], [1755.21, 1757.32, "Tutor", "Third, Winter's formula."], [1757.32, 1763.57, "Tutor", "The expected carbon dioxide is 1.5 times 19, plus 8, which is about 36, give or take 2."], [1763.57, 1769.57, "Tutor", "The measured value is 32, which is lower, so there is also a respiratory alkalosis."], [1769.57, 1776.88, "Tutor", "That is a triple disorder, and a College answer of three lines scores well if each line has its number."], [1777.78, 1779.47, "Examiner", "Now I make it harder."], [1779.47, 1780.52, "Examiner", "Part four."], [1780.52, 1786.86, "Examiner", "A 68-year-old woman with type 2 diabetes and a history of alcohol abuse presents with abdominal pain."], [1786.86, 1793.55, "Examiner", "The pH is 6.87, the carbon dioxide is 8, the bicarbonate is 1.4 millimoles per litre and the lactate is 16."], [1793.55, 1795.3, "Examiner", "Her creatinine is 170."], [1795.3, 1796.92, "Examiner", "She is on metformin."], [1796.92, 1802.22, "Examiner", "Give me the diagnoses, and tell me when you would call the renal team for dialysis."], [1802.72, 1812.5, "Candidate", "The diagnoses are ischaemic bowel, metformin-associated lactic acidosis, and thiamine deficiency, with pancreatitis and cardiogenic shock as other possibilities."], [1812.5, 1817.41, "Candidate", "I would want a CT of the abdomen, or a laparotomy, and a lipase and troponin."], [1817.41, 1822.04, "Candidate", "For dialysis, metformin is small and water soluble and it is dialysable."], [1822.04, 1829.04, "Candidate", "I would dialyse with a pH this low and a lactate this high, especially with kidney injury reducing its clearance."], [1829.54, 1830.28, "Examiner", "Good."], [1830.28, 1842.66, "Examiner", "The EXTRIP workgroup recommends extracorporeal treatment in metformin-associated lactic acidosis when the lactate is above 20, the pH is 7.0 or less, or there is shock or a failure of standard supportive care."], [1842.66, 1844.82, "Examiner", "Her pH puts her over the line."], [1844.82, 1852.69, "Examiner", "Intermittent haemodialysis is the preferred first modality, with continuous therapy as the alternative when that is not available."], [1852.69, 1856.74, "Examiner", "Continue until the lactate is below 3 and the pH is above 7.35."], [1856.74, 1858.74, "Examiner", "But what did you leave out?"], [1859.24, 1860.46, "Candidate", "The thiamine."], [1860.46, 1863.9, "Candidate", "I should give it straight away, before any glucose."], [1863.9, 1868.96, "Candidate", "It is cheap, and type B lactic acidosis from thiamine deficiency is reversible."], [1869.86, 1871.63, "Tutor", "That is the right instinct."], [1871.63, 1874.67, "Tutor", "The higher-level lesson from all four parts is pace."], [1874.67, 1877.4, "Tutor", "Each part is worth about two and a half marks."], [1877.4, 1880.84, "Tutor", "Two lines with a number in each will pass every one of them."], [1880.84, 1885.19, "Tutor", "One beautiful paragraph on part one, with nothing else, scores one and a half."], [1885.19, 1889.54, "Tutor", "Write two or three lines under every part label before you deepen any of them."], [1890.94, 1892.87, "Tutor", "Now the syllabus round-up."], [1892.87, 1900.15, "Tutor", "Six items, all beyond this week, chosen because they are among the most examined topics not yet covered on this podcast."], [1900.15, 1902.31, "Tutor", "Each one is at overview level."], [1902.31, 1906.91, "Tutor", "The aim is to hang a framework you will fill in properly in its own week."], [1906.91, 1909.52, "Tutor", "First, mechanical ventilatory support."], [1909.52, 1920.55, "Tutor", "It underlies more than fifty past College questions, more than any other item left on the list, usually as ventilator waveforms, a ventilation strategy for a named condition, or weaning."], [1920.55, 1922.76, "Tutor", "The examiner wants five things."], [1922.76, 1937.03, "Tutor", "One, lung-protective ventilation in acute respiratory distress syndrome: a tidal volume of about 6 millilitres per kilogram of predicted body weight, a plateau pressure of 30 centimetres of water or less, and a driving pressure under about 15."], [1937.03, 1941.17, "Tutor", "The ARMA trial in 2000 established the low tidal volume strategy."], [1941.17, 1947.26, "Tutor", "Two, PEEP chosen by a table or by response, with an awareness that recruitment manoeuvres can harm."], [1947.26, 1955.78, "Tutor", "Three, prone positioning for at least 16 hours a day when the ratio of arterial oxygen to inspired oxygen is below 150 millimetres of mercury."], [1955.96, 1964.2, "Tutor", "Four, the mechanics of the ventilator: the difference between peak and plateau pressure, which separates airway resistance from compliance."], [1964.2, 1969.97, "Tutor", "And five, structured weaning, with daily spontaneous breathing trials linked to sedation holds."], [1969.97, 1977.59, "Tutor", "The governing guideline to name is the 2023 ESICM guideline on acute respiratory distress syndrome, by Grasselli and colleagues."], [1977.59, 1984.31, "Tutor", "A high-yield phrase: a high peak with a normal plateau means resistance, such as a blocked tube or bronchospasm."], [1984.31, 1990.65, "Tutor", "A high peak with a high plateau means compliance, such as pneumothorax, oedema or abdominal hypertension."], [1990.65, 1993.0, "Tutor", "Two more angles the College likes."], [1993.0, 1996.08, "Tutor", "Non-invasive ventilation has its own questions."], [1996.08, 2008.35, "Tutor", "The classic indication is a hypercapnic exacerbation of chronic obstructive pulmonary disease with a pH below 7.35 and a carbon dioxide above 45 millimetres of mercury, where it reduces intubation and mortality."], [2008.35, 2017.04, "Tutor", "The examiner also wants the contraindications and the markers of failure, such as no improvement in pH or respiratory rate within one to two hours."], [2017.04, 2020.4, "Tutor", "And weaning failure is examined as a list of causes."], [2020.58, 2034.67, "Tutor", "Use a framework of load against capacity: respiratory load, cardiac load including weaning-induced pulmonary oedema, neuromuscular weakness, neurological drive, and metabolic causes such as hypophosphataemia, which links straight back to revisit two."], [2034.67, 2038.01, "Tutor", "Driving pressure is worth one sentence of physiology."], [2038.01, 2043.63, "Tutor", "It is the plateau pressure minus the PEEP, which is the tidal volume divided by the compliance."], [2043.63, 2048.66, "Tutor", "So it scales the breath to the size of the functional lung, the so-called baby lung."], [2049.06, 2058.45, "Tutor", "Second, airway management, which underlies about 45 past questions, often as the failed or difficult intubation in ICU, or the patient with a threatened airway."], [2058.45, 2066.0, "Tutor", "Intubation in ICU is more dangerous than in theatre, because the patient brings hypoxaemia, hypotension and acidosis with them."], [2066.0, 2068.8, "Tutor", "The examiner wants preparation and a plan."], [2068.8, 2070.14, "Tutor", "Use a checklist."], [2070.14, 2075.73, "Tutor", "Preoxygenate with non-invasive ventilation or high-flow nasal oxygen in hypoxaemic patients."], [2075.73, 2080.88, "Tutor", "Optimise the haemodynamics first, with fluid if appropriate and a vasopressor ready."], [2080.88, 2083.78, "Tutor", "Use a videolaryngoscope as the first device."], [2083.78, 2087.36, "Tutor", "Confirm placement with waveform capnography, every time."], [2087.36, 2101.12, "Tutor", "The guideline to name is the 2018 Difficult Airway Society guideline for tracheal intubation in critically ill adults, written with the Intensive Care Society, the Faculty of Intensive Care Medicine and the Royal College of Anaesthetists."], [2101.12, 2112.52, "Tutor", "Its plan is a maximum of three laryngoscopy attempts plus one by an expert, then a second-generation supraglottic airway, then face mask, then front-of-neck access with a scalpel, bougie and tube."], [2112.52, 2115.82, "Tutor", "In Australia you can also name the Vortex approach."], [2115.82, 2117.78, "Tutor", "Here is a pause and answer."], [2117.96, 2122.02, "Tutor", "Name the three physiological killers at intubation in the critically ill."], [2122.02, 2123.32, "Tutor", "Pause, and answer."], [2128.72, 2131.77, "Tutor", "Hypoxaemia, hypotension and metabolic acidosis."], [2131.77, 2141.04, "Tutor", "The acidotic patient who is compensating by breathing hard will acidify quickly once you stop that breathing with apnoea and a ventilator set to normal values."], [2141.04, 2144.99, "Tutor", "So match the minute ventilation to their pre-intubation effort."], [2144.99, 2147.37, "Tutor", "Two further points that earn marks."], [2147.37, 2150.31, "Tutor", "First, post-intubation hypotension is common."], [2150.31, 2161.86, "Tutor", "It comes from induction agents, loss of sympathetic drive and positive pressure reducing venous return, so have a vasopressor running or drawn up, and choose a haemodynamically gentler induction dose."], [2161.86, 2165.8, "Tutor", "Second, extubating a known difficult airway needs its own plan."], [2165.8, 2174.85, "Tutor", "That means an awake extubation in a controlled setting, with an airway exchange catheter considered, and the equipment and people present for reintubation."], [2174.85, 2180.85, "Tutor", "Third, thrombotic disease, which in practice means pulmonary embolism, with about 39 past questions."], [2180.85, 2189.01, "Tutor", "There is a new guideline this year, the 2026 multisociety guideline from the American Heart Association and American College of Cardiology."], [2189.01, 2194.95, "Tutor", "It replaces the old low, intermediate and high risk language with five clinical categories, A to E."], [2194.95, 2198.0, "Tutor", "Category A is an incidental, asymptomatic clot."], [2198.18, 2203.16, "Tutor", "B is symptomatic with low severity, for example a simplified severity index of zero."], [2203.16, 2205.76, "Tutor", "C is symptomatic with elevated severity."], [2205.76, 2213.82, "Tutor", "D is incipient cardiopulmonary failure, meaning transient hypotension or normotensive shock, such as a raised lactate or acute kidney injury."], [2213.82, 2220.75, "Tutor", "E is persistent hypotension or cardiopulmonary failure, with refractory shock or cardiac arrest as its most severe form."], [2220.75, 2231.36, "Tutor", "For category E, systemic thrombolysis, catheter-directed thrombolysis and mechanical thrombectomy are all given the same reasonable-to-use rating, so systemic lysis no longer has priority."], [2231.36, 2240.83, "Tutor", "Low molecular weight heparin is preferred over unfractionated heparin in hospitalised patients, and a pulmonary embolism response team should assess categories C to E."], [2240.83, 2246.03, "Tutor", "The College will still accept the European Society of Cardiology language, so know both."], [2246.03, 2249.44, "Tutor", "And know the physiology of the failing right ventricle."], [2249.44, 2260.1, "Tutor", "Avoid large fluid boluses, keep the systemic pressure up with noradrenaline to protect right coronary perfusion, and be very wary of induction and positive pressure, which can cause arrest."], [2260.1, 2265.46, "Tutor", "For systemic thrombolysis, the standard alteplase regimen is 100 milligrams over two hours."], [2265.64, 2275.05, "Tutor", "In peri-arrest or cardiac arrest from presumed pulmonary embolism, a bolus is given, and resuscitation should continue for long enough for the drug to work."], [2275.05, 2285.16, "Tutor", "Know the absolute contraindications: previous haemorrhagic stroke, recent ischaemic stroke, active bleeding, recent major surgery or trauma, and an intracranial tumour."], [2285.16, 2296.52, "Tutor", "Where lysis is contraindicated or has failed, catheter-directed therapy, surgical embolectomy, or venoarterial ECMO as a bridge are the options a pulmonary embolism response team will weigh."], [2296.92, 2301.39, "Tutor", "Fourth, poisoning and drug intoxication, with about 39 past questions."], [2301.39, 2315.48, "Tutor", "The examiner rewards a structure, and the Australian one is the sequence taught in the Toxicology Handbook: resuscitation, risk assessment, supportive care, investigations, decontamination, enhanced elimination, antidotes and disposition."], [2315.48, 2318.52, "Tutor", "Risk assessment is the step that earns marks."], [2318.52, 2327.74, "Tutor", "It means the agent, the dose in milligrams per kilogram, the time since ingestion, the clinical features and patient factors, and it predicts the course."], [2327.74, 2333.01, "Tutor", "The screening tests in every overdose are an ECG, a paracetamol level and a glucose."], [2333.01, 2338.74, "Tutor", "For paracetamol, name the 2019 Australian and New Zealand guideline by Chiew and colleagues."], [2338.74, 2351.57, "Tutor", "It uses a single nomogram line starting at 150 milligrams per litre at four hours, and a two-bag acetylcysteine regimen, 200 milligrams per kilogram over four hours and then 100 milligrams per kilogram over 16 hours."], [2351.57, 2358.5, "Tutor", "The dose in the second bag is increased for large ingestions with a concentration above double the nomogram line."], [2358.5, 2362.28, "Tutor", "For enhanced elimination, know which drugs are dialysable."], [2362.46, 2372.67, "Tutor", "These are small, water soluble, with a small volume of distribution and low protein binding, such as lithium, toxic alcohols, salicylate, metformin and valproate."], [2372.67, 2382.1, "Tutor", "The EXTRIP workgroup publishes recommendations on when to dialyse for specific poisons, and we have just used its metformin criteria in revisit four."], [2382.1, 2387.57, "Tutor", "Finally, know a short list of antidotes with doses, because examiners ask for them."], [2387.57, 2397.72, "Tutor", "Sodium bicarbonate for tricyclic cardiotoxicity with a QRS longer than 100 milliseconds, 1 to 2 millimoles per kilogram as a bolus, aiming for a pH of about 7.5."], [2397.72, 2407.39, "Tutor", "Digoxin-specific antibody fragments for digoxin toxicity with life-threatening arrhythmia or a potassium above 5 millimoles per litre in acute poisoning."], [2407.39, 2411.95, "Tutor", "High-dose insulin euglycaemia for calcium channel blocker poisoning."], [2411.95, 2420.9, "Tutor", "And naloxone in small titrated doses for opioid toxicity, so you reverse the respiratory depression without precipitating violent withdrawal."], [2421.3, 2432.94, "Tutor", "Fifth, haemostatic failure, with about 37 past questions, spanning trauma coagulopathy, disseminated intravascular coagulation, heparin-induced thrombocytopenia and anticoagulant reversal."], [2432.94, 2442.97, "Tutor", "For bleeding trauma, name the European guideline on management of major bleeding and coagulopathy following trauma, sixth edition, Rossaint and colleagues, 2023."], [2442.97, 2445.23, "Tutor", "The key points are as follows."], [2445.23, 2453.36, "Tutor", "Give tranexamic acid within three hours of injury, 1 gram over 10 minutes and then 1 gram over 8 hours, the dose used in CRASH-2."], [2453.36, 2465.48, "Tutor", "Use permissive hypotension, a systolic pressure of 80 to 90 millimetres of mercury until bleeding is controlled, but not in traumatic brain injury, where a mean pressure of at least 80 is advised."], [2465.48, 2472.66, "Tutor", "Replace fibrinogen when it is below 1.5 grams per litre, or when viscoelastic testing shows a functional deficit."], [2472.66, 2475.81, "Tutor", "Keep the ionised calcium in the normal range."], [2475.81, 2490.06, "Tutor", "For disseminated intravascular coagulation, the International Society on Thrombosis and Haemostasis score uses platelets, a fibrin marker such as D-dimer, prothrombin time and fibrinogen, and a score of five or more means overt DIC."], [2490.24, 2497.36, "Tutor", "For heparin-induced thrombocytopenia, use the 4Ts score: thrombocytopenia, timing, thrombosis and other causes."], [2497.36, 2503.47, "Tutor", "Then stop all heparin and start a non-heparin anticoagulant such as argatroban or bivalirudin."], [2503.47, 2505.69, "Tutor", "Note the link to revisit two."], [2505.69, 2512.63, "Tutor", "In a patient on the filter with this condition, citrate becomes the anticoagulant of choice for the circuit."], [2512.63, 2516.23, "Tutor", "Anticoagulant reversal is the other common question."], [2516.23, 2529.4, "Tutor", "For warfarin with major bleeding, give a prothrombin complex concentrate, in Australia Prothrombinex, at about 25 to 50 international units per kilogram, together with 5 to 10 milligrams of intravenous vitamin K."], [2529.4, 2532.39, "Tutor", "For dabigatran, give idarucizumab 5 grams."], [2532.39, 2540.3, "Tutor", "For the factor ten inhibitors, apixaban and rivaroxaban, a prothrombin complex concentrate is the usual Australian approach."], [2540.3, 2548.32, "Tutor", "In every case, add the general measures: local haemostasis, temperature above 35 degrees, calcium, and correction of acidosis."], [2548.72, 2555.36, "Tutor", "Sixth, sepsis and septic shock, with about 31 past questions, and the link back to this week's shock block."], [2555.36, 2558.01, "Tutor", "There is also a new guideline to know."], [2558.01, 2566.26, "Tutor", "The Surviving Sepsis Campaign 2026 adult guidelines were published in March 2026 in Critical Care Medicine and Intensive Care Medicine."], [2566.26, 2569.26, "Tutor", "They contain 129 statements, 46 of them new."], [2569.26, 2572.37, "Tutor", "The points that matter for the exam are these."], [2572.37, 2577.16, "Tutor", "For septic shock, give antimicrobials immediately, ideally within one hour."], [2577.16, 2582.47, "Tutor", "For sepsis without shock, give them early but leave room for diagnostic stewardship."], [2582.47, 2586.45, "Tutor", "After a loading dose, use extended infusions of beta-lactams."], [2586.45, 2589.39, "Tutor", "De-escalate once the microbiology is known."], [2589.39, 2592.74, "Tutor", "Use balanced crystalloids in preference to saline."], [2592.74, 2602.32, "Tutor", "Target a mean arterial pressure of about 65 millimetres of mercury, managed as a range, with a lower range of 60 to 65 suggested for patients aged 65 or over."], [2602.32, 2606.07, "Tutor", "And remove fluid actively once resuscitation is complete."], [2606.07, 2616.28, "Tutor", "The 2026 guideline is new, so for its exact wording on vasopressin and corticosteroids, read the document itself before the exam rather than relying on older thresholds."], [2616.28, 2618.76, "Tutor", "The definitions are still Sepsis-3."], [2618.94, 2626.97, "Tutor", "Sepsis is life-threatening organ dysfunction from a dysregulated host response to infection, marked by a rise in SOFA score of two or more."], [2626.97, 2635.39, "Tutor", "Septic shock means a vasopressor is needed to keep the mean pressure at 65 and the lactate is above 2 millimoles per litre despite adequate fluid."], [2635.39, 2640.42, "Tutor", "When sepsis comes up, examiners reward source control named specifically, and timed."], [2640.42, 2644.85, "Tutor", "Say what the source is, how it will be controlled, by whom, and how soon."], [2644.85, 2648.07, "Tutor", "Re-measure a raised lactate to guide resuscitation."], [2648.07, 2656.05, "Tutor", "You can mention capillary refill time as an alternative target, which ANDROMEDA-SHOCK supported and which we covered in an earlier spiral."], [2656.05, 2662.45, "Tutor", "And when asked about fluids, describe the four phases: rescue, optimisation, stabilisation and de-escalation."], [2662.45, 2668.35, "Tutor", "The 2026 recommendation on active fluid removal is the de-escalation phase written into a guideline."], [2668.35, 2670.7, "Tutor", "Here is the final pause and answer."], [2670.7, 2673.87, "Tutor", "A 70-year-old in septic shock is on noradrenaline."], [2673.87, 2683.0, "Tutor", "What mean arterial pressure range does the 2026 guideline suggest as the initial target for her, and what other fluid strategy does it add after resuscitation?"], [2683.0, 2684.42, "Tutor", "Pause, and answer."], [2689.82, 2694.03, "Tutor", "A range of 60 to 65 millimetres of mercury, because she is 65 or older."], [2694.03, 2698.72, "Tutor", "And after resuscitation, it suggests actively removing fluid to reduce overload."], [2698.72, 2705.22, "Tutor", "That ties neatly back to the cardiorenal patient in revisit one, where fluid made things worse rather than better."], [2705.62, 2707.18, "Tutor", "That is today's spiral."], [2707.18, 2709.61, "Tutor", "One thing to do before the next episode."], [2709.61, 2715.86, "Tutor", "In today's set, write the osmolar gap and Winter's formula out in full when you revisit the 2018 acid-base question."], [2715.86, 2721.91, "Tutor", "Then, for the renal replacement question, write one line that defines convection before you write anything else."], [2721.91, 2727.86, "Tutor", "Under every part label, write two or three lines before you deepen any of them, and move on at twelve minutes."], [2727.86, 2733.36, "Tutor", "And for the haemodynamic question on the cardiac surgical patient, use the same habit as revisit one."], [2733.36, 2741.99, "Tutor", "Name the problems from the numbers first, the low cardiac index, the high pulmonary pressures and the hypothermia, then manage each in order of what kills soonest."], [2741.99, 2743.3, "Tutor", "See you next time."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 70.2, "title": "Spiral review: cardiogenic shock, calcium and citrate, TURP syndrome, four gases"}, {"start": 1890.94, "title": "Syllabus round-up"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
