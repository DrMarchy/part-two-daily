<script>
var C=[[0.0, 3.17, "Tutor", "Welcome to Part Two Daily, the Wednesday deep dive."], [3.17, 14.45, "Tutor", "This is a test episode for Wednesday the twenty-eighth of October, and today's topic sits right in the middle of this week's shock and kidney block: rhabdomyolysis, and its violent cousin, crush injury."], [14.45, 17.78, "Tutor", "It is one of the College's favourite kidney questions."], [17.78, 24.76, "Tutor", "It turns up as a list of causes, as a management question, buried inside a trauma scenario, and as a page of biochemistry."], [24.76, 26.54, "Tutor", "Here's the running order."], [26.54, 35.4, "Tutor", "First, a tutorial: where the syndrome was discovered, the causes by category, why the kidney fails, the electrolyte traps, and what actually changes outcome."], [35.4, 39.7, "Tutor", "Then two trials that shape how we give fluid and when we start dialysis."], [39.7, 45.12, "Tutor", "Then a real past College question, read word for word, worked by an examiner and a candidate."], [46.52, 49.29, "Tutor", "Let's start in London, in the spring of 1941."], [49.29, 50.23, "Tutor", "The Blitz."], [50.23, 58.8, "Tutor", "People are being dug out of collapsed buildings, sometimes after hours trapped under rubble, and some of them look remarkably well when they reach hospital."], [58.8, 60.05, "Tutor", "They're talking."], [60.05, 61.51, "Tutor", "Their pulse is fine."], [61.51, 65.12, "Tutor", "A limb is swollen and numb, but they've survived the bombing."], [65.12, 68.67, "Tutor", "And then, over the next few days, something strange happens."], [68.67, 70.13, "Tutor", "They become shocked."], [70.13, 72.48, "Tutor", "Their urine turns dark, almost black."], [72.48, 73.53, "Tutor", "It dries up."], [73.53, 77.08, "Tutor", "And within about a week, many of them die of kidney failure."], [77.48, 89.24, "Tutor", "A young doctor at Hammersmith, Eric Bywaters, with his colleague Desmond Beall, wrote these cases up in the British Medical Journal in March 1941, under the title Crush injuries with impairment of renal function."], [89.24, 93.41, "Tutor", "It was the first clear description of what we now call crush syndrome."], [93.41, 101.43, "Tutor", "Experimental work over the following years linked the kidney injury to a pigment released from damaged muscle, myoglobin, and to acidic urine."], [101.43, 105.17, "Tutor", "That's where the tradition of alkalinising the urine was born."], [105.17, 110.68, "Tutor", "Hold on to that thought, because eighty years later we're still arguing about whether it works."], [111.08, 113.62, "Tutor", "So why does the College love this topic?"], [113.62, 123.55, "Tutor", "Because it tests whether you can think in categories, because the biochemistry is rich, and because the management has a few traps that separate a safe registrar from a consultant."], [123.55, 129.25, "Tutor", "In the question bank there are at least eight past questions built around rhabdomyolysis since 2012."], [129.25, 138.55, "Tutor", "They come as list five causes, as outline your management, as a crush injury in a trauma stem, and as a biochemistry panel, for example after an aortic aneurysm repair."], [138.55, 148.16, "Tutor", "One recent crush question had a pass rate of only forty-four percent, and the examiners said why: candidates gave beautiful answers about blood products and forgot the fluid."], [148.56, 151.56, "Tutor", "Start with a definition you can write in one line."], [151.56, 157.81, "Tutor", "Rhabdomyolysis is injury to skeletal muscle severe enough to release intracellular contents into the circulation."], [157.81, 167.02, "Tutor", "Biochemically, it's usually defined as a creatine kinase more than five times the upper limit of normal, which in practice means above about one thousand units per litre."], [167.02, 172.5, "Tutor", "The classic triad is muscle pain, weakness and dark urine, but most patients don't have all three."], [172.5, 175.75, "Tutor", "Many of yours will be sedated, so the triad is useless."], [175.75, 178.96, "Tutor", "You find it because you thought of it and sent the CK."], [179.36, 180.46, "Tutor", "Now the causes."], [180.46, 188.0, "Tutor", "When the College asks you to list five causes, it gives half a mark per cause, and it won't give extra credit for three causes under the same heading."], [188.0, 190.53, "Tutor", "It also wants examples, not just the heading."], [190.53, 195.35, "Tutor", "So the winning move is five causes from five different categories, each with a named example."], [195.35, 198.64, "Tutor", "Let me give you a framework you can reproduce under pressure."], [199.04, 208.53, "Tutor", "First, physical injury and compression: crush injury, prolonged immobilisation after a fall or an overdose, prolonged surgery in one position."], [208.53, 216.18, "Tutor", "Second, exertion and excessive muscle activity: extreme exercise, seizures, status epilepticus, severe agitation."], [216.18, 225.1, "Tutor", "Third, ischaemia: compartment syndrome, arterial occlusion, and reperfusion after an aortic aneurysm repair or a revascularised limb."], [225.1, 232.75, "Tutor", "Fourth, temperature: heat stroke, malignant hyperthermia, neuroleptic malignant syndrome, and severe hypothermia."], [232.75, 243.44, "Tutor", "Fifth, drugs and toxins: statins, especially combined with fibrates, alcohol, cocaine and amphetamines, propofol infusion syndrome, colchicine, and snake venoms."], [243.44, 249.51, "Tutor", "Sixth, infection: influenza, COVID, Legionella, streptococcal and staphylococcal sepsis."], [249.51, 259.0, "Tutor", "Seventh, metabolic and electrolyte causes: hypokalaemia, hypophosphataemia, hyperosmolar states and diabetic emergencies, and thyroid disease."], [259.0, 268.36, "Tutor", "And finally, inherited and inflammatory causes: McArdle disease, carnitine palmitoyltransferase deficiency, and the inflammatory myositides."], [268.76, 271.12, "Tutor", "Let's test that while it's fresh."], [271.12, 277.38, "Tutor", "Name five causes of rhabdomyolysis, one from each of five different categories, each with an example."], [277.38, 278.88, "Tutor", "Pause, and answer."], [285.28, 295.94, "Tutor", "A strong list would be: crush injury, status epilepticus, compartment syndrome after vascular surgery, neuroleptic malignant syndrome, and a statin combined with a fibrate."], [295.94, 299.96, "Tutor", "Five categories, five examples, two and a half marks banked."], [300.36, 301.47, "Tutor", "Now the why."], [301.47, 304.12, "Tutor", "Why does damaged muscle kill the kidney?"], [304.12, 308.33, "Tutor", "Think of three hits on the tubule, plus a fourth on the circulation."], [308.33, 310.38, "Tutor", "The first hit is obstruction."], [310.38, 314.86, "Tutor", "Myoglobin is small, about seventeen kilodaltons, so it's freely filtered."], [314.86, 321.88, "Tutor", "In acidic, concentrated urine it precipitates with Tamm-Horsfall protein and forms casts that block the distal tubules."], [321.88, 324.21, "Tutor", "The second hit is direct toxicity."], [324.21, 330.02, "Tutor", "The haem iron in myoglobin drives oxidative injury, with lipid peroxidation of the tubular cells."], [330.02, 332.34, "Tutor", "The third hit is vasoconstriction."], [332.34, 336.38, "Tutor", "Free haem mops up nitric oxide, and the renal vessels clamp down."], [336.38, 338.76, "Tutor", "And the fourth hit is hypovolaemia."], [338.76, 342.36, "Tutor", "Injured muscle swells and sequesters extracellular fluid."], [342.36, 345.4, "Tutor", "A crushed pair of legs can hide several litres."], [345.4, 351.6, "Tutor", "That's why these patients become shocked after they've been rescued, which is exactly what Bywaters saw."], [352.0, 354.48, "Tutor", "That mechanism explains the treatment."], [354.48, 358.8, "Tutor", "More flow through the tubule dilutes the myoglobin and washes out casts."], [358.8, 363.45, "Tutor", "Alkaline urine should, in theory, reduce precipitation and the iron chemistry."], [363.45, 367.87, "Tutor", "Restoring volume reverses the vasoconstriction and the prerenal component."], [367.87, 371.0, "Tutor", "So the physiology says fluid, and possibly alkali."], [371.0, 373.92, "Tutor", "Keep that in mind when we get to the evidence."], [374.32, 375.63, "Tutor", "Investigations."], [375.63, 381.57, "Tutor", "The CK rises within hours, peaks at roughly one to three days, and then falls over several days."], [381.57, 387.34, "Tutor", "Myoglobin is cleared within hours, so a normal serum myoglobin doesn't exclude the diagnosis."], [387.34, 390.08, "Tutor", "The bedside trick is the urine dipstick."], [390.08, 396.53, "Tutor", "It reads positive for blood, because the test detects haem, but the microscopy shows few or no red cells."], [396.53, 401.1, "Tutor", "That combination should make you think of myoglobin or free haemoglobin."], [401.1, 405.9, "Tutor", "Then there's the electrolyte panel: potassium, calcium, phosphate and urate."], [405.9, 411.15, "Tutor", "Check creatinine, which can rise faster than in other causes of acute kidney injury."], [411.15, 417.95, "Tutor", "Check for a high anion gap metabolic acidosis, and for coagulopathy and disseminated intravascular coagulation."], [417.95, 421.2, "Tutor", "Measure compartment pressures if a limb is tense."], [421.2, 428.8, "Tutor", "And then the cause-directed tests: temperature, a drug screen, thyroid function, respiratory viral swabs, and blood cultures."], [429.2, 430.63, "Tutor", "One exam trap here."], [430.63, 438.69, "Tutor", "In the 2020 question, the examiners noted that some candidates listed CT scans and exploratory surgery when asked for laboratory investigations."], [438.69, 441.92, "Tutor", "Those aren't laboratory tests, and they earn nothing."], [441.92, 444.2, "Tutor", "Answer the question that was asked."], [444.6, 449.37, "Tutor", "Now the electrolytes, and this is where the calcium and phosphate story gets interesting."], [449.37, 455.81, "Tutor", "Earlier this month you dropped marks on hypophosphataemia and hypocalcaemia, so here's where those two meet a real patient."], [455.81, 459.5, "Tutor", "Dying muscle cells release phosphate, so the serum phosphate rises."], [459.5, 467.61, "Tutor", "Calcium then binds phosphate and deposits as calcium phosphate in the damaged muscle, so the serum calcium falls, sometimes quite low, in the first few days."], [467.61, 473.95, "Tutor", "Then, during recovery, that deposited calcium is mobilised again, and a proportion of patients swing into hypercalcaemia."], [473.95, 477.2, "Tutor", "That's especially likely if they were given calcium early."], [477.6, 480.16, "Tutor", "Here's the question that catches people."], [480.16, 483.3, "Tutor", "Early in rhabdomyolysis the ionised calcium is low."], [483.3, 484.89, "Tutor", "Should you replace it?"], [484.89, 486.28, "Tutor", "Pause, and answer."], [492.68, 493.79, "Tutor", "Usually not."], [493.79, 503.19, "Tutor", "Treat the low calcium only if it's causing harm: tetany, seizures, arrhythmia, or hyperkalaemia with ECG changes, where calcium is part of membrane stabilisation."], [503.19, 509.11, "Tutor", "Otherwise, extra calcium feeds the deposits in the muscle and sets up rebound hypercalcaemia later."], [509.11, 511.21, "Tutor", "And remember the mirror image."], [511.21, 519.39, "Tutor", "Hypophosphataemia isn't only a consequence of illness, it's a cause of rhabdomyolysis, classically in refeeding and in alcohol use disorder."], [519.39, 523.04, "Tutor", "Low phosphate as a cause, high phosphate as a consequence."], [523.04, 526.64, "Tutor", "That contrast is worth a mark in a biochemistry question."], [527.04, 537.2, "Tutor", "Hyperkalaemia is the electrolyte that kills, and it can arrive suddenly, especially when a crushed limb is freed and the potassium-rich blood from that limb returns to the circulation."], [537.2, 544.97, "Tutor", "In disaster medicine, that's why people talk about the smile of death: the trapped patient who's chatting, is extricated, and then arrests."], [544.97, 551.32, "Tutor", "The European renal association's field guidance says to expect hyperkalaemia at all times and to treat it early."], [551.72, 554.49, "Tutor", "How do you predict who'll need dialysis?"], [554.49, 562.74, "Tutor", "The McMahon score, published in 2013, combines age, sex, the cause, and the initial creatinine, calcium, phosphate, bicarbonate and CK."], [562.74, 568.23, "Tutor", "Its main use is identifying low-risk patients who are unlikely to need dialysis or die."], [568.23, 575.79, "Tutor", "The CK alone is a poor predictor, though acute kidney injury becomes more likely as the CK climbs past about five thousand."], [575.79, 578.1, "Tutor", "Name the score and what it does."], [578.1, 580.52, "Tutor", "You won't be asked its weightings."], [580.92, 582.16, "Tutor", "Now management."], [582.16, 584.81, "Tutor", "Use a structure the examiners can follow."], [584.81, 587.73, "Tutor", "One: treat immediate threats to life and limb."], [587.73, 591.18, "Tutor", "Two: stop the ongoing muscle injury and treat the cause."], [591.18, 593.67, "Tutor", "Three: protect the kidney with volume."], [593.67, 596.42, "Tutor", "Four: manage the electrolytes and acidosis."], [596.42, 599.99, "Tutor", "Five: renal replacement therapy for the usual indications."], [599.99, 602.2, "Tutor", "And six: watch for complications."], [602.6, 604.37, "Tutor", "Immediate threats first."], [604.37, 613.21, "Tutor", "Hyperkalaemia gets calcium for membrane stabilisation, insulin with dextrose, nebulised salbutamol, bicarbonate if acidotic, and dialysis if refractory."], [613.21, 614.87, "Tutor", "Then the compartments."], [614.87, 621.11, "Tutor", "A tense, painful compartment with pain on passive stretch is compartment syndrome until proven otherwise."], [621.11, 633.32, "Tutor", "A compartment pressure above about thirty millimetres of mercury, or a perfusion gap between diastolic pressure and compartment pressure of less than thirty, should prompt an urgent surgical review for fasciotomy."], [633.32, 640.56, "Tutor", "Then stop the cause: cool the hyperthermic patient, stop the statin or the propofol, and treat the seizures and the sepsis."], [640.96, 642.22, "Tutor", "Then the kidney."], [642.22, 646.84, "Tutor", "Early, generous isotonic crystalloid is the one intervention everyone agrees on."], [646.84, 651.77, "Tutor", "In a crush victim, the field guidance from the European renal association is specific."], [651.77, 657.23, "Tutor", "Start isotonic saline at about one litre an hour in adults, ideally before the limb is released."], [657.23, 660.33, "Tutor", "Aim for three to six litres in the first six hours."], [660.33, 663.22, "Tutor", "Avoid potassium-containing fluids in the field."], [663.22, 665.47, "Tutor", "Then keep reassessing for overload."], [665.47, 668.15, "Tutor", "In the ICU, titrate to a high urine output."], [668.15, 680.33, "Tutor", "The College's model answer to the recent crush question talked about crystalloid at around four hundred millilitres an hour, up to a litre an hour, aiming for a urine output of one to three millilitres per kilogram per hour."], [680.33, 682.22, "Tutor", "And here's the safety point."], [682.22, 687.83, "Tutor", "If the patient is anuric despite resuscitation, stop pushing fluid, because you'll just drown them."], [687.83, 689.88, "Tutor", "That's a dialysis decision now."], [690.28, 693.7, "Tutor", "This is exactly where that recent crush question was lost."], [693.7, 697.73, "Tutor", "In your attempt on the twelfth of October, you scored four and a half."], [697.73, 703.63, "Tutor", "The marks that slipped away were the crush injury itself and a concrete fluid strategy for rhabdomyolysis."], [703.63, 706.79, "Tutor", "Three days later you wrote it again and scored seven."], [706.79, 708.86, "Tutor", "So you've already fixed it once."], [708.86, 715.8, "Tutor", "The examiners' comment is the lesson: when a question says blood and fluid, give fluid equal weight, with a rate and a target."], [716.2, 718.3, "Tutor", "Now bicarbonate and mannitol."], [718.3, 720.98, "Tutor", "This is the eighty-year-old Blitz idea."], [720.98, 729.16, "Tutor", "The rationale is sound: alkaline urine to reduce cast formation, and mannitol for osmotic diuresis and perhaps scavenging free radicals."], [729.16, 732.35, "Tutor", "But there's no randomised trial showing benefit."], [732.35, 741.04, "Tutor", "The best-known clinical study, by Brown and colleagues in the Journal of Trauma in 2004, looked at trauma patients with a CK above five thousand."], [741.04, 746.04, "Tutor", "Bicarbonate and mannitol made no difference to renal failure, dialysis or death."], [746.04, 747.98, "Tutor", "And bicarbonate has costs."], [747.98, 752.24, "Tutor", "It worsens ionised hypocalcaemia and can cause metabolic alkalosis."], [752.24, 759.86, "Tutor", "In the 2020 question, the College said alkalinisation, mannitol and frusemide were optional and attracted no marks either way."], [759.86, 763.44, "Tutor", "So mention them, say the evidence is weak, and move on."], [763.84, 765.19, "Tutor", "Which crystalloid?"], [765.19, 768.21, "Tutor", "Historically, saline, because it has no potassium."], [768.21, 771.64, "Tutor", "But saline brings chloride and a hyperchloraemic acidosis."], [771.64, 776.22, "Tutor", "Balanced solutions contain about four to five millimoles per litre of potassium."], [776.22, 781.84, "Tutor", "That's less than the potassium already in the patient's plasma, so they don't meaningfully raise it."], [781.84, 785.28, "Tutor", "In the ICU, a balanced crystalloid is entirely reasonable."], [785.28, 789.8, "Tutor", "In the field, before you know the potassium, the crush guidance prefers saline."], [789.8, 793.76, "Tutor", "Being able to say why both views exist is a consultant-level answer."], [794.16, 802.03, "Tutor", "Renal replacement therapy follows the usual indications: refractory hyperkalaemia, acidosis, fluid overload, and uraemic complications."], [802.03, 805.22, "Tutor", "Removing myoglobin isn't an indication on its own."], [805.22, 811.21, "Tutor", "Myoglobin is cleared by some high cut-off membranes, but that's never been shown to improve outcomes."], [811.21, 814.35, "Tutor", "Say that explicitly; it's a common discriminator."], [814.35, 830.08, "Tutor", "And list the complications to watch for: acute kidney injury, hyperkalaemic arrest, compartment syndrome, disseminated intravascular coagulation, hypocalcaemia then rebound hypercalcaemia, and, in crush, the injuries and therapies that came with it, such as massive transfusion."], [830.48, 832.66, "Tutor", "Let's do one more before the trials."], [832.66, 840.24, "Tutor", "A crush victim has a potassium of seven point two with peaked T waves and a urine output of ten millilitres an hour despite four litres of fluid."], [840.24, 842.27, "Tutor", "What are your next three actions?"], [842.27, 843.56, "Tutor", "Pause, and answer."], [849.96, 857.4, "Tutor", "First, ten millilitres of ten percent calcium chloride, or thirty of calcium gluconate, to stabilise the membrane."], [857.4, 862.78, "Tutor", "Second, insulin and dextrose with salbutamol, to shift potassium into the cells."], [862.78, 870.71, "Tutor", "Third, stop escalating fluid and arrange urgent dialysis, because this is refractory hyperkalaemia in an oliguric patient."], [870.71, 874.92, "Tutor", "If you also said check the compartments, that's a bonus mark."], [875.32, 877.24, "Tutor", "Three numbers to remember."], [877.24, 885.88, "Tutor", "One: a CK more than five times the upper limit of normal defines rhabdomyolysis, and kidney injury becomes more likely above about five thousand."], [885.88, 894.29, "Tutor", "Two: in crush, isotonic fluid at about one litre an hour, three to six litres in the first six hours, started before extrication if possible."], [894.29, 900.28, "Tutor", "Three: a compartment perfusion gap of less than thirty millimetres of mercury means a surgeon now."], [901.68, 908.04, "Tutor", "Two trials shape what you do for these patients, one about fluid and one about dialysis."], [908.44, 915.63, "Tutor", "First, PLUS, an Australian and New Zealand trial published in the New England Journal of Medicine in 2022, led by Simon Finfer."], [915.63, 926.23, "Tutor", "It randomised five thousand and thirty-seven critically ill adults needing fluid resuscitation to a balanced multi-electrolyte solution, Plasma-Lyte 148, or to zero point nine percent saline."], [926.23, 934.48, "Tutor", "The primary outcome was ninety-day mortality: twenty-one point eight percent with the balanced solution, twenty-two point zero percent with saline."], [934.48, 935.65, "Tutor", "No difference."], [935.65, 941.4, "Tutor", "There was also no significant difference in new renal replacement therapy or in acute kidney injury."], [941.4, 950.29, "Tutor", "The criticism is that many patients had received fluid before enrolment, and the doses given in the trial were moderate, which may have diluted any difference."], [950.29, 958.02, "Tutor", "How it changed practice: either fluid is acceptable for most patients, so choose on the patient's chloride, acid–base status and context."], [958.02, 968.72, "Tutor", "In an exam answer you'd say: in the PLUS trial of over five thousand ICU patients, balanced crystalloid didn't reduce ninety-day mortality compared with saline, so the choice is individualised."], [969.12, 977.46, "Tutor", "Second, STARRT-AKI, also in the New England Journal of Medicine, in 2020, from an international group including Australian and New Zealand sites."], [977.46, 994.13, "Tutor", "It randomised three thousand and nineteen patients with severe acute kidney injury, but without an urgent indication for dialysis, to accelerated renal replacement therapy, started within twelve hours, or to a standard strategy that waited for a conventional indication or persistent kidney injury."], [994.13, 999.75, "Tutor", "Ninety-day mortality was forty-three point nine percent versus forty-three point seven percent."], [999.75, 1000.78, "Tutor", "No benefit."], [1000.78, 1003.13, "Tutor", "But look at the secondary outcomes."], [1003.13, 1011.47, "Tutor", "Among survivors, dependence on dialysis at ninety days was higher in the accelerated group, ten point four percent versus six point zero percent."], [1011.47, 1019.64, "Tutor", "And adverse events were more common with early dialysis, twenty-three versus sixteen and a half percent, mostly hypotension and low phosphate."], [1019.64, 1023.89, "Tutor", "The criticism is that it can't tell you when waiting becomes too long."], [1023.89, 1028.58, "Tutor", "A later trial, AKIKI two, suggested that delaying even further may cause harm."], [1028.58, 1033.37, "Tutor", "The take-home message: don't start dialysis just because the creatinine is high."], [1033.37, 1035.28, "Tutor", "Start it for an indication."], [1035.46, 1050.14, "Tutor", "In your rhabdomyolysis answer, that's exactly the line: renal replacement therapy for standard indications, supported by STARRT-AKI, which showed no survival benefit from accelerated initiation and more dialysis dependence."], [1050.54, 1053.44, "Tutor", "Here's a quick check on the trials."], [1053.44, 1060.26, "Tutor", "In STARRT-AKI, what happened to dialysis dependence at ninety days with an accelerated start?"], [1060.26, 1062.02, "Tutor", "Pause, and answer."], [1067.42, 1072.32, "Tutor", "It was higher: ten point four percent versus six point zero percent among survivors."], [1072.32, 1076.26, "Tutor", "Earlier wasn't better, and it may have been worse for the kidneys."], [1077.66, 1078.76, "Examiner", "Good morning."], [1078.76, 1081.79, "Examiner", "This is from the 2020 first sitting, question one."], [1081.79, 1083.88, "Examiner", "I'll read it exactly as written."], [1083.88, 1086.91, "Examiner", "With regards to rhabdomyolysis in the ICU patient."], [1086.91, 1087.69, "Examiner", "Part a."], [1087.69, 1089.0, "Examiner", "List five causes."], [1089.0, 1090.67, "Examiner", "Twenty percent of marks."], [1090.67, 1091.45, "Examiner", "Part b."], [1091.45, 1098.93, "Examiner", "What are the important features in the history and clinical examination, and what specific laboratory investigations would you request?"], [1098.93, 1100.6, "Examiner", "Thirty percent of marks."], [1100.6, 1101.38, "Examiner", "Part c."], [1101.38, 1103.0, "Examiner", "Outline the management."], [1103.0, 1104.62, "Examiner", "Fifty percent of marks."], [1104.62, 1105.98, "Examiner", "Start with part a."], [1106.48, 1107.62, "Candidate", "Five causes."], [1107.62, 1111.47, "Candidate", "Crush injury, for example a patient trapped under a vehicle."], [1111.47, 1113.0, "Candidate", "Status epilepticus."], [1113.0, 1116.98, "Candidate", "Neuroleptic malignant syndrome, for example after haloperidol."], [1116.98, 1119.98, "Candidate", "Statin toxicity, particularly with a fibrate."], [1119.98, 1123.16, "Candidate", "And compartment syndrome after vascular surgery."], [1123.66, 1125.59, "Examiner", "Five causes, but count your categories."], [1125.59, 1128.25, "Examiner", "Compartment syndrome and crush injury sit close together."], [1128.25, 1130.1, "Examiner", "Give me one that's clearly different."], [1130.6, 1134.04, "Candidate", "Infection, for example influenza or Legionella."], [1134.04, 1138.36, "Candidate", "Or a metabolic cause, such as hypophosphataemia in refeeding."], [1138.86, 1139.74, "Examiner", "Better."], [1139.74, 1140.63, "Examiner", "Part b."], [1140.63, 1144.1, "Examiner", "History, examination and laboratory investigations."], [1144.6, 1160.98, "Candidate", "In the history: trauma or a long lie, seizures, exertion, heat exposure, drugs including statins, antipsychotics, propofol, alcohol and stimulants, recent viral illness, muscle pain and dark urine, and baseline kidney function."], [1160.98, 1171.37, "Candidate", "On examination: tender, swollen muscle compartments, weakness, temperature, signs of volume depletion, pressure areas, and peripheral pulses."], [1171.37, 1185.18, "Candidate", "Investigations: CK, creatinine and urea, potassium, calcium, phosphate, urate, a blood gas for the acidosis and anion gap, a coagulation screen for DIC, and a urine dipstick with microscopy."], [1185.18, 1188.73, "Candidate", "The dipstick shows blood with no red cells."], [1188.73, 1195.08, "Candidate", "Then cause-directed tests, such as a drug screen, thyroid function and viral swabs."], [1195.08, 1199.68, "Candidate", "I'd also get a CT of the limb to look for muscle necrosis."], [1200.18, 1201.12, "Examiner", "Stop there."], [1201.12, 1203.94, "Examiner", "The question asked for laboratory investigations."], [1203.94, 1205.18, "Examiner", "Is a CT scan one?"], [1205.68, 1206.8, "Candidate", "No, it isn't."], [1206.8, 1207.91, "Candidate", "I'll drop it."], [1207.91, 1212.8, "Candidate", "I'd add serial CK and potassium, because the trend matters more than a single value."], [1213.3, 1214.0, "Examiner", "Good."], [1214.0, 1215.46, "Examiner", "Part c, management."], [1215.46, 1217.18, "Examiner", "Half the marks are here."], [1217.68, 1219.12, "Candidate", "I'd structure it."], [1219.12, 1221.03, "Candidate", "First, immediate threats."], [1221.03, 1230.89, "Candidate", "Treat hyperkalaemia with calcium, insulin and dextrose, and salbutamol, and check the compartments, measuring pressures with early surgical review if one is tense."], [1230.89, 1237.7, "Candidate", "Second, treat the cause, for example stopping the statin, or cooling and dantrolene in malignant hyperthermia."], [1237.7, 1240.94, "Candidate", "Third, protect the kidneys with early IV fluids."], [1240.94, 1245.44, "Candidate", "Fourth, correct the electrolytes, including replacing the low calcium."], [1245.44, 1247.4, "Candidate", "Fifth, dialysis if needed."], [1247.9, 1249.06, "Examiner", "Two problems."], [1249.06, 1252.37, "Examiner", "Your fluid plan has no fluid, no rate and no target."], [1252.37, 1255.18, "Examiner", "How much, and how do you know it's working?"], [1255.68, 1259.32, "Candidate", "Isotonic crystalloid, started early and given generously."], [1259.32, 1265.26, "Candidate", "In a crush patient, about one litre an hour initially, three to six litres in the first six hours."], [1265.26, 1272.43, "Candidate", "Then titrate to a urine output of around one to three millilitres per kilogram per hour, reassessing often for overload."], [1272.43, 1277.64, "Candidate", "If they're anuric despite adequate volume, I stop escalating fluid and plan dialysis."], [1278.14, 1279.3, "Examiner", "And the calcium?"], [1279.8, 1287.13, "Candidate", "I'd only replace calcium if it's symptomatic, if there's an arrhythmia, or if there's hyperkalaemia with ECG changes."], [1287.13, 1292.76, "Candidate", "Calcium deposits in the damaged muscle and can cause rebound hypercalcaemia in recovery."], [1292.76, 1296.04, "Candidate", "I'd tolerate a moderately low calcium otherwise."], [1296.54, 1298.66, "Examiner", "What about bicarbonate and mannitol?"], [1299.16, 1303.98, "Candidate", "There's a physiological rationale, but no randomised evidence of benefit."], [1303.98, 1312.98, "Candidate", "A retrospective trauma study by Brown in 2004 showed no reduction in renal failure, dialysis or death in patients with a CK over five thousand."], [1312.98, 1316.26, "Candidate", "Bicarbonate also worsens ionised hypocalcaemia."], [1316.26, 1318.52, "Candidate", "I wouldn't use them routinely."], [1319.02, 1320.6, "Examiner", "And dialysis."], [1320.6, 1322.26, "Examiner", "When, and why?"], [1322.76, 1330.8, "Candidate", "For standard indications: refractory hyperkalaemia, severe acidosis, fluid overload, or uraemic complications."], [1330.8, 1335.16, "Candidate", "Not to clear myoglobin, which hasn't been shown to help."], [1335.16, 1338.29, "Candidate", "And not early just for the creatinine."], [1338.29, 1345.24, "Candidate", "STARRT-AKI showed no survival benefit from an accelerated start, and more dialysis dependence."], [1345.74, 1347.89, "Examiner", "Here's how that would be marked."], [1347.89, 1356.74, "Examiner", "Part a earns half a mark per cause, so five causes from five categories with examples gets the full two marks, and you got there after I made you change one."], [1356.74, 1362.1, "Examiner", "Part b earns marks for a targeted history, a focused examination, and laboratory tests only."], [1362.1, 1366.88, "Examiner", "The CT scan earned nothing, and in the written paper I wouldn't have stopped you."], [1366.88, 1368.91, "Examiner", "Part c is where the marks are."], [1368.91, 1382.76, "Examiner", "They come for a clear structure: immediate threats including hyperkalaemia and compartment syndrome, stopping the cause, early aggressive isotonic fluid with a rate and a target, cautious electrolyte correction, and dialysis for standard indications."], [1382.76, 1388.28, "Examiner", "Your first pass gave fluid with no numbers and replaced the calcium, which would have cost you."], [1388.28, 1392.14, "Examiner", "After probing, it's a comfortable pass, around seven out of ten."], [1392.14, 1398.58, "Examiner", "The one fix is to give every therapy a number or an end point the first time, because the paper won't probe you."], [1399.48, 1400.98, "Tutor", "That's the deep dive."], [1400.98, 1403.31, "Tutor", "Before Saturday, do one active thing."], [1403.31, 1407.4, "Tutor", "From memory, write your five causes from five categories with examples."], [1407.4, 1410.82, "Tutor", "Then write a one-line fluid plan with a rate and a target."], [1410.82, 1416.98, "Tutor", "Check both against the show notes, and check the rhabdomyolysis section of Oh's chapter on acute kidney injury."], [1416.98, 1422.99, "Tutor", "And on Friday, when your questions come back, give fluid the same weight as blood whenever a stem says both."], [1422.99, 1424.44, "Tutor", "See you on Saturday."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 46.52, "title": "Tutorial: rhabdomyolysis and crush"}, {"start": 901.68, "title": "Landmark trials"}, {"start": 1077.66, "title": "Exam practice"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
