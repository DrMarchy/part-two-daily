<script>
var C=[[0.0, 1.91, "Tutor", "Welcome to Part Two Daily."], [1.91, 8.1, "Tutor", "It's Monday the second of November, 128 days until the written exam, and this is the week four primer."], [8.1, 11.13, "Tutor", "The theme this week is cardiac intensive care."], [11.13, 12.76, "Tutor", "Why does that matter?"], [12.76, 15.63, "Tutor", "Because the College keeps coming back here."], [15.63, 22.77, "Tutor", "Electrocardiogram interpretation appears in seventeen past College questions in our bank, including both 2026 sittings."], [22.77, 30.69, "Tutor", "Cardiac arrest, advanced life support and post-cardiac-surgery care all sit near the top of the syllabus by number of past questions."], [30.69, 32.55, "Tutor", "Here's the running order."], [32.55, 43.68, "Tutor", "First, the shape of the week: how the College asks cardiac questions, the frameworks that score, and the core conditions as Oh's teaches them, with real numbers and the governing guidelines."], [43.68, 50.82, "Tutor", "Second, two landmark temperature trials, TTM and TTM2, and the story of how cooling after cardiac arrest rose and fell."], [50.82, 56.5, "Tutor", "Third, exam practice on neuroprognostication after cardiac arrest, a real question from 2021."], [56.5, 62.4, "Tutor", "Then a syllabus round-up of six more cardiac topics, and one thing to do before the next episode."], [63.8, 65.63, "Tutor", "Picture a Tuesday night."], [65.63, 70.79, "Tutor", "A 58-year-old man is wheeled in from the cath lab after an out-of-hospital arrest."], [70.79, 77.49, "Tutor", "He has a pulse, a stent in his left anterior descending artery, a noradrenaline infusion, and no eye opening."], [77.49, 88.31, "Tutor", "Within the next hour you will be asked about his blood pressure target, his oxygen target, his temperature, whether he needs a CT, and, sooner than you'd like, what his chances are."], [88.31, 92.66, "Tutor", "Almost every one of those questions has appeared in a College paper."], [92.66, 95.92, "Tutor", "Let's start with how the College asks this block."], [95.92, 97.76, "Tutor", "There are four patterns."], [97.76, 99.65, "Tutor", "First, the data question."], [99.65, 108.24, "Tutor", "An electrocardiogram is printed in the booklet and you are asked to list the abnormalities, give the likely causes, and name the complication."], [108.24, 113.73, "Tutor", "That format has appeared seventeen times in our bank, most recently in both 2026 papers."], [113.73, 118.09, "Tutor", "It is cheap marks if you are systematic and expensive if you aren't."], [118.09, 120.43, "Tutor", "Second, the post-arrest question."], [120.43, 126.56, "Tutor", "Prognostication after cardiac arrest has been asked five times, in 2011, 2018, 2021, 2023 and 2024."], [126.56, 131.66, "Tutor", "The verbs vary: list the tests, discuss their limitations, outline your approach."], [131.66, 134.52, "Tutor", "Third, the arrhythmia management question."], [134.7, 145.46, "Tutor", "Atrial fibrillation in the critically ill has been asked four times, in 2012, 2021, 2024 and 2025, usually as outline your approach to assessment and management."], [145.46, 151.13, "Tutor", "Fourth, the post-cardiac-surgery question: the shocked patient back from theatre."], [151.13, 158.32, "Tutor", "Dynamic left ventricular outflow tract obstruction has been asked three times, in 2019 and twice in 2025."], [158.32, 165.27, "Tutor", "Older papers also loved troubleshooting the temporary pacemaker, six questions between 2008 and 2013."], [165.27, 172.84, "Tutor", "So the week has a clear spine: the rhythm, the arrest, the brain after the arrest, and the heart after surgery."], [172.84, 186.98, "Tutor", "Our anchor reading is Oh's Intensive Care Manual, ninth edition: chapter 30 on cardiopulmonary resuscitation, chapter 31 on arrhythmias, chapter 32 on pacing, and chapter 73 on postoperative cardiac intensive care."], [187.38, 189.88, "Tutor", "Start with the electrocardiogram."], [189.88, 193.66, "Tutor", "The framework examiners reward is boring and it works."], [193.66, 194.45, "Tutor", "Rate."], [194.45, 195.37, "Tutor", "Rhythm."], [195.37, 196.16, "Tutor", "Axis."], [196.16, 199.09, "Tutor", "Intervals: PR, QRS and the corrected QT."], [199.09, 202.93, "Tutor", "Then morphology: P waves, QRS, ST segments and T waves."], [202.93, 207.02, "Tutor", "Then, and this is where candidates drop marks, the so what."], [207.02, 214.03, "Tutor", "Every abnormality you name should be followed by its likely cause in this patient, and the risk it carries."], [214.03, 216.35, "Tutor", "Write it that way in the exam."], [216.35, 229.16, "Tutor", "If a question gives five percent for the abnormalities and twenty percent for the aetiologies, as the 2021 second sitting did in question 23, the marks are in the causes, not in a beautiful description."], [229.16, 232.14, "Tutor", "The high-yield patterns are a short list."], [232.14, 238.73, "Tutor", "Hyperkalaemia: peaked T waves, then flattened P waves, then a broad QRS heading towards a sine wave."], [238.73, 245.93, "Tutor", "Brugada pattern: coved ST elevation of at least two millimetres in V1 and V2, sloping into an inverted T wave."], [245.93, 250.81, "Tutor", "Wolff-Parkinson-White: short PR under 120 milliseconds and a delta wave."], [250.81, 256.66, "Tutor", "Long QT: a corrected QT above 500 milliseconds carries real risk of torsades de pointes."], [256.66, 266.54, "Tutor", "ST elevation in lead a V R with widespread ST depression: think left main or severe three-vessel disease, or a global subendocardial ischaemia from shock."], [266.72, 275.2, "Tutor", "Then Mobitz type two block and complete heart block, pericarditis, the Osborn wave of hypothermia, and the right heart strain pattern of pulmonary embolism."], [275.2, 279.08, "Tutor", "The classic higher-order question is the broad complex tachycardia."], [279.48, 281.78, "Tutor", "Here's your first chance to recall."], [281.78, 286.42, "Tutor", "You are looking at a regular broad complex tachycardia at 200 beats per minute."], [286.42, 294.97, "Tutor", "Name three features on the electrocardiogram that make ventricular tachycardia more likely than a supraventricular tachycardia with aberrant conduction."], [294.97, 296.36, "Tutor", "Pause, and answer."], [301.76, 303.87, "Tutor", "Here are the ones that score."], [303.87, 307.81, "Tutor", "AV dissociation, with P waves marching through independently."], [307.81, 312.88, "Tutor", "Capture beats and fusion beats, which are the visible proof of that dissociation."], [312.88, 323.49, "Tutor", "No RS complex in any precordial lead, or an R to S interval longer than 100 milliseconds in any precordial lead: those are the first two steps of the Brugada algorithm from 1991."], [323.49, 326.97, "Tutor", "Precordial concordance, all positive or all negative."], [326.97, 329.2, "Tutor", "And an extreme, northwest axis."], [329.2, 338.27, "Tutor", "Add the bedside rule: in an older patient with structural heart disease, a broad complex tachycardia is ventricular tachycardia until proven otherwise."], [338.27, 339.75, "Tutor", "Treat it that way."], [339.75, 345.85, "Tutor", "One more pairing worth a mark on its own: atrial fibrillation with a pre-excited accessory pathway."], [345.85, 349.73, "Tutor", "Irregular, very fast, with QRS complexes that vary in width."], [349.73, 351.96, "Tutor", "Never give an AV nodal blocker."], [351.96, 356.35, "Tutor", "Not adenosine, not verapamil, not digoxin, and be wary of amiodarone."], [356.35, 362.34, "Tutor", "Block the node and you push conduction down the pathway, and ventricular fibrillation can follow."], [362.34, 368.84, "Tutor", "The answer is synchronised DC cardioversion if unstable, or a class one drug such as flecainide if stable."], [369.24, 370.68, "Tutor", "Now cardiac arrest."], [370.68, 376.18, "Tutor", "A short story first, because it explains why compressions matter more than anything else we do."], [376.18, 382.59, "Tutor", "In the 1950s, at Johns Hopkins, an electrical engineer called William Kouwenhoven was working on defibrillation."], [382.59, 384.08, "Tutor", "He was not a doctor."], [384.08, 389.64, "Tutor", "A graduate student on his team, Guy Knickerbocker, noticed something odd in the laboratory dogs."], [389.64, 393.38, "Tutor", "When the chest was compressed, femoral arterial pressure rose."], [393.38, 395.62, "Tutor", "Pushing on the chest made a pulse."], [395.62, 403.09, "Tutor", "With the surgeon James Jude, they took it to patients, and in 1960 the three of them published Closed Chest Cardiac Massage in JAMA."], [403.09, 406.88, "Tutor", "Their series reported fourteen survivors among twenty patients."], [406.88, 411.32, "Tutor", "Before that, resuscitation outside theatre largely meant opening the chest."], [411.32, 415.27, "Tutor", "Within a few years, closed chest compression was taught worldwide."], [415.27, 421.83, "Tutor", "That's the exam point: every modern guideline still puts high-quality compressions with minimal interruption first."], [421.83, 426.69, "Tutor", "Here are the numbers from Oh's chapter 30 and the current resuscitation guidelines."], [426.69, 431.61, "Tutor", "Compressions at 100 to 120 a minute, five to six centimetres deep, with full recoil."], [431.61, 437.0, "Tutor", "Thirty compressions to two breaths until the airway is secured, then continuous compressions."], [437.18, 442.73, "Tutor", "Shockable rhythm: shock, then two minutes of compressions before the rhythm check."], [442.73, 448.22, "Tutor", "Adrenaline one milligram after the third shock, then every three to five minutes."], [448.22, 453.89, "Tutor", "Amiodarone 300 milligrams after the third shock, and 150 milligrams after the fifth."], [453.89, 459.13, "Tutor", "Non-shockable rhythm: adrenaline one milligram as soon as access is obtained."], [459.13, 467.08, "Tutor", "Use waveform capnography to confirm tube position, judge compression quality, and spot return of spontaneous circulation."], [467.08, 477.5, "Tutor", "Hunt the reversible causes: hypoxia, hypovolaemia, hyperkalaemia and other metabolic causes, hypothermia, tension pneumothorax, tamponade, toxins and thrombosis."], [477.9, 483.76, "Tutor", "Two adjuncts to compressions have been asked about, mechanical devices in 2015 and 2024."], [483.76, 491.32, "Tutor", "Automated chest compression devices deliver consistent compressions, but the large trials found no survival benefit."], [491.32, 498.15, "Tutor", "LINC, in 2014, randomised about 2,600 patients and found four-hour survival of 23.6 versus 23.7 percent."], [498.15, 507.49, "Tutor", "PARAMEDIC, in 2015, randomised about 4,500 patients, and 30-day survival was 6 percent with the device versus 7 percent with manual compressions."], [507.49, 509.74, "Tutor", "So the device is not routine."], [509.74, 519.63, "Tutor", "Its place is where manual compressions are unsafe or impossible: in a moving ambulance, in the cath lab during PCI, and as a bridge to extracorporeal CPR."], [519.63, 526.7, "Tutor", "The limitations are worth a line too: the pause to apply it, and injuries such as rib and sternal fractures."], [526.7, 532.44, "Tutor", "Extracorporeal CPR, venoarterial ECMO started during the arrest, is the other adjunct."], [532.44, 534.27, "Tutor", "The evidence is mixed."], [534.27, 544.82, "Tutor", "The small ARREST trial in Minneapolis, with 30 patients in refractory ventricular fibrillation, was stopped early when survival to discharge was 43 versus 7 percent."], [545.0, 560.1, "Tutor", "The Prague trial of 256 patients found no significant difference in its primary outcome, and INCEPTION, a pragmatic Dutch multicentre trial of 134 patients, found 30-day survival with good neurology of 20 versus 16 percent, not significant."], [560.1, 566.56, "Tutor", "The message for the exam: ECPR works only in a system built for it, with tight selection criteria."], [566.56, 573.32, "Tutor", "Young, witnessed, shockable rhythm, bystander CPR, and cannulation within about 60 minutes of collapse."], [573.72, 578.71, "Tutor", "Cardiac arrest after cardiac surgery is different, and it's on this week's reading list."], [578.71, 583.34, "Tutor", "The guidance from the European cardiothoracic surgeons in 2017 changed the order."], [583.34, 590.1, "Tutor", "For witnessed ventricular fibrillation in the unit, give up to three quick successive shocks before starting compressions."], [590.1, 594.83, "Tutor", "For asystole or extreme bradycardia, connect the epicardial wires and pace at once."], [594.83, 602.68, "Tutor", "If there's no output, prepare for emergency resternotomy within five minutes, because tamponade and bleeding are common and correctable causes."], [602.68, 609.6, "Tutor", "Full-dose adrenaline is avoided in this setting because of the risk of rebound hypertension and bleeding at the suture lines."], [610.0, 612.49, "Tutor", "Next, the post-resuscitation hour."], [612.49, 627.01, "Tutor", "The governing guideline is the European Resuscitation Council and European Society of Intensive Care Medicine guidelines on post-resuscitation care, the 2025 edition, published in Intensive Care Medicine with Jerry Nolan as first author."], [627.01, 629.56, "Tutor", "ANZCOR guidance is closely aligned."], [629.56, 631.57, "Tutor", "Here's your second recall."], [631.57, 639.1, "Tutor", "Give me the post-arrest targets for mean arterial pressure, oxygen saturation, arterial carbon dioxide and temperature."], [639.1, 640.64, "Tutor", "Pause, and answer."], [646.04, 654.77, "Tutor", "Mean arterial pressure above 60 to 65 millimetres of mercury, with systolic above 100, guided by an arterial line and early echocardiography."], [654.77, 666.66, "Tutor", "Start with 100 percent oxygen, then titrate to saturations of 94 to 98 percent, or an arterial oxygen tension of about 75 to 100 millimetres of mercury, avoiding both hypoxaemia and hyperoxaemia."], [666.66, 674.51, "Tutor", "Normocapnia: an arterial carbon dioxide of 35 to 45 millimetres of mercury, and watch for hypocapnia when the patient is cold."], [674.51, 679.72, "Tutor", "Temperature: the guideline no longer talks about targeted temperature management."], [679.72, 682.24, "Tutor", "It talks about temperature control."], [682.24, 694.31, "Tutor", "Actively prevent fever, keeping core temperature at 37.5 degrees or below, through the first days in patients who remain comatose, and don't actively rewarm a patient who arrives mildly hypothermic."], [694.31, 698.0, "Tutor", "Several 2025 changes are worth a sentence in an answer."], [698.0, 701.75, "Tutor", "If there's ST elevation, go to the cath lab immediately."], [701.75, 712.82, "Tutor", "If there's no ST elevation after an out-of-hospital arrest, delay angiography unless acute coronary occlusion is strongly suspected; that rests on trials such as COACT and TOMAHAWK."], [712.82, 719.32, "Tutor", "If the cause is unclear, consider a whole-body CT from head to pelvis, including a pulmonary angiogram."], [719.5, 728.03, "Tutor", "Use EEG to diagnose seizures, treat them with levetiracetam or sodium valproate alongside sedation, and don't give seizure prophylaxis."], [728.03, 734.71, "Tutor", "Use short-acting sedation, avoid routine neuromuscular blockade, and plan rehabilitation from the start."], [734.71, 752.3, "Tutor", "Don't forget the ordinary things that earn marks in a list: standard glucose control, avoiding hypoglycaemia, early echo for the stunned myocardium, which usually recovers over 48 to 72 hours, and lung-protective ventilation at six to eight millilitres per kilogram of ideal body weight."], [752.7, 755.68, "Tutor", "One more scenario from this week's reading list."], [755.68, 760.79, "Tutor", "A 35-year-old collapses while running and is resuscitated from ventricular fibrillation."], [760.79, 762.18, "Tutor", "Here's the recall."], [762.18, 767.88, "Tutor", "List four causes of sudden cardiac death in a young adult, and the electrocardiogram clue for each."], [767.88, 769.26, "Tutor", "Pause, and answer."], [774.66, 777.27, "Tutor", "Think structural, then electrical."], [777.27, 800.6, "Tutor", "Structural: hypertrophic cardiomyopathy, with voltage criteria for left ventricular hypertrophy and deep T wave inversion; arrhythmogenic right ventricular cardiomyopathy, with T wave inversion in V1 to V3 and sometimes an epsilon wave; myocarditis, with ST changes and arrhythmia after a viral illness; and anomalous coronary arteries, which may show nothing at rest."], [800.6, 818.78, "Tutor", "Electrical: long QT syndrome, with a corrected QT above 500 milliseconds; Brugada syndrome, with coved ST elevation in V1 and V2; Wolff-Parkinson-White, with a short PR and a delta wave; and catecholaminergic polymorphic ventricular tachycardia, which usually has a normal resting ECG."], [818.78, 827.71, "Tutor", "Then the acquired causes that the examiner also accepts: drugs such as cocaine, electrolyte disturbance, and premature coronary disease."], [827.71, 833.11, "Tutor", "The 2025 post-resuscitation guideline adds a new section on unexplained arrest."], [833.11, 844.9, "Tutor", "If no cause is found, the work-up extends to cardiac MRI, provocation testing and genetic testing, with screening of first-degree relatives, because these conditions run in families."], [845.3, 854.46, "Tutor", "This is also where the cardiac block meets acid-base, which has been your weakest area in the marked answers so far, averaging around five out of ten."], [854.46, 857.82, "Tutor", "Expect a post-arrest blood gas in a data question."], [857.82, 865.36, "Tutor", "A typical one: pH 7.05, arterial carbon dioxide 60 millimetres of mercury, bicarbonate 16 millimoles per litre, lactate 9."], [865.36, 867.04, "Tutor", "Do the sums out loud."], [867.04, 875.32, "Tutor", "Anion gap, the College way, without potassium: sodium minus chloride plus bicarbonate, with a normal of 12, and correct it for albumin."], [875.32, 879.32, "Tutor", "Then the delta ratio, to look for a second metabolic process."], [879.32, 886.28, "Tutor", "Then the expected carbon dioxide for the metabolic acidosis, 1.5 times the bicarbonate plus 8, which here is 32."], [886.28, 893.06, "Tutor", "A measured 60 means a coexisting respiratory acidosis from inadequate ventilation during or after the arrest."], [893.06, 902.97, "Tutor", "The lactate should fall by at least half within a few hours of restoring perfusion; if it doesn't, look for ongoing low output, mesenteric ischaemia, or a seizure."], [902.97, 906.91, "Tutor", "Write the formula, then the number, then the interpretation."], [906.91, 909.58, "Tutor", "That's where the marks went last time."], [909.98, 915.44, "Tutor", "Now arrhythmias in the critically ill, and the most common one: atrial fibrillation."], [915.44, 926.35, "Tutor", "In the general ICU, new atrial fibrillation is usually the illness talking: catecholamines, atrial stretch from fluid, inflammation, electrolyte loss, a line tip in the atrium."], [926.35, 934.42, "Tutor", "After cardiac surgery it is even more common, affecting roughly a quarter to a third of patients, peaking on days two and three."], [934.42, 937.15, "Tutor", "The answer that scores has two halves."], [937.15, 952.16, "Tutor", "Assessment: is the patient haemodynamically unstable; when did it start; a 12-lead ECG; potassium, magnesium, troponin and thyroid function; an echo for ventricular function, valves and atrial size; and the stroke risk against the bleeding risk."], [952.16, 959.52, "Tutor", "The 2024 European Society of Cardiology guideline now uses CHA two DS two VA, which drops female sex from the score."], [959.52, 961.71, "Tutor", "Management: treat the driver."], [961.71, 966.4, "Tutor", "Correct potassium to about 4.5 millimoles per litre and give magnesium."], [966.4, 968.89, "Tutor", "Wean catecholamines where you can."], [968.89, 971.92, "Tutor", "If unstable, synchronised DC cardioversion."], [971.92, 980.34, "Tutor", "For atrial fibrillation, the European resuscitation guidance suggests starting at maximum defibrillator output rather than escalating."], [980.52, 989.88, "Tutor", "Flutter and regular narrow complex tachycardias often respond to 70 to 120 joules, and monomorphic ventricular tachycardia with a pulse to 120 to 150."], [989.88, 999.78, "Tutor", "If stable, rate control is usually first: a beta-blocker if blood pressure allows, amiodarone if it doesn't, digoxin as an add-on in poor ventricular function."], [999.78, 1010.86, "Tutor", "After cardiac surgery, a 2016 trial of 523 patients from the Cardiothoracic Surgical Trials Network found rate control and rhythm control gave the same number of days in hospital."], [1010.86, 1014.78, "Tutor", "So either strategy is defensible; say why you chose yours."], [1014.78, 1018.04, "Tutor", "Torsades de pointes is the other rhythm to own."], [1018.04, 1030.6, "Tutor", "Magnesium two grams intravenously, stop every QT-prolonging drug, correct potassium, and if it recurs, increase the heart rate with isoprenaline or overdrive pacing, because a faster rate shortens the QT."], [1031.0, 1032.95, "Tutor", "Pacing, from Oh's chapter 32."], [1032.95, 1038.39, "Tutor", "Know the three-letter code: the chamber paced, the chamber sensed, and the response to sensing."], [1038.39, 1042.67, "Tutor", "So D D D paces and senses both chambers, and either inhibits or triggers."], [1042.67, 1046.48, "Tutor", "V O O paces the ventricle asynchronously and ignores everything."], [1046.48, 1049.43, "Tutor", "The troubleshooting question has three failures."], [1049.43, 1060.68, "Tutor", "Failure to pace, where there's no pacing spike: check the connections, the battery and the box, and look for oversensing, where the pacemaker mistakes noise or T waves for native beats and inhibits itself."], [1060.68, 1069.14, "Tutor", "Failure to capture, where there's a spike with no complex after it: increase the output, check the wires, and correct potassium, acidosis and ischaemia."], [1069.14, 1076.16, "Tutor", "Failure to sense, where it fires on top of native beats: increase the sensitivity, which means lowering the millivolt number."], [1076.16, 1081.49, "Tutor", "Set output at two to three times the capture threshold, and keep transcutaneous pacing ready."], [1081.49, 1087.2, "Tutor", "If you're unsure in an emergency, switch to an asynchronous mode at a high output and fix the cause."], [1087.6, 1088.79, "Tutor", "Quick recall."], [1088.79, 1092.98, "Tutor", "Day one after valve surgery, paced D D D through epicardial wires."], [1092.98, 1099.27, "Tutor", "On the monitor you see pacing spikes with no QRS complex after them, and the blood pressure is falling."], [1099.27, 1103.01, "Tutor", "What's the failure, and what are your first three actions?"], [1103.01, 1104.48, "Tutor", "Pause, and answer."], [1109.88, 1111.81, "Tutor", "That's failure to capture."], [1111.81, 1119.03, "Tutor", "First, check the patient and support the circulation, and have transcutaneous pacing or an isoprenaline infusion ready."], [1119.03, 1124.2, "Tutor", "Second, increase the output to maximum and check every connection from wire to box."], [1124.2, 1133.52, "Tutor", "Third, look for the reasons the threshold has risen: lead displacement, oedema around the wire, hyperkalaemia, acidosis, ischaemia, or antiarrhythmic drugs."], [1133.52, 1138.12, "Tutor", "Epicardial thresholds rise over days, which is why they're checked daily."], [1138.52, 1141.37, "Tutor", "Where do candidates lose marks in this block?"], [1141.37, 1146.26, "Tutor", "The College's comment on the 2019 question on dynamic outflow obstruction is blunt."], [1146.26, 1151.85, "Tutor", "Candidates who did poorly recommended dangerous therapies, including inotropes and vasodilators."], [1151.85, 1156.63, "Tutor", "In a heart that obstructs when it empties hard and fast, inotropes make it worse."], [1156.63, 1164.47, "Tutor", "For prognostication, the commonest failure is listing tests without their limitations, which is exactly what that 2021 question asked for."], [1164.47, 1170.28, "Tutor", "And for electrocardiograms, the commonest failure is a description with no cause and no consequence."], [1170.28, 1172.1, "Tutor", "Three numbers to remember."], [1172.1, 1176.13, "Tutor", "37.5 degrees: the ceiling for temperature in the comatose survivor."], [1176.13, 1179.84, "Tutor", "72 hours: the earliest point to draw a prognostic conclusion."], [1179.84, 1185.32, "Tutor", "And five minutes: the time to resternotomy when a post-cardiac-surgery arrest doesn't respond."], [1186.72, 1188.26, "Tutor", "Here's a question."], [1188.26, 1197.01, "Tutor", "If cooling the brain after cardiac arrest was the standard of care for a decade, why do the guidelines now talk only about preventing fever?"], [1197.01, 1200.14, "Tutor", "The idea of cold as a brain protector is old."], [1200.14, 1206.17, "Tutor", "Cardiac surgeons used hypothermia in the 1950s to protect the brain during circulatory arrest."], [1206.17, 1209.65, "Tutor", "But for decades it didn't cross into resuscitation."], [1209.65, 1215.98, "Tutor", "Then, in February 2002, the New England Journal of Medicine published two trials in the same issue."], [1215.98, 1219.29, "Tutor", "One, from Melbourne, was led by Stephen Bernard."], [1219.29, 1224.55, "Tutor", "The other was the European Hypothermia After Cardiac Arrest trial, known as HACA."], [1224.55, 1232.0, "Tutor", "HACA randomised 275 patients after ventricular fibrillation arrest to 32 to 34 degrees for 24 hours, or standard care."], [1232.0, 1238.8, "Tutor", "Favourable neurological outcome at six months was 55 versus 39 percent, and mortality 41 versus 55 percent."], [1238.8, 1244.35, "Tutor", "ILCOR endorsed therapeutic hypothermia the following year, and cooling became routine."], [1244.35, 1246.48, "Tutor", "But look at the control arm."], [1246.48, 1251.8, "Tutor", "In HACA, normothermia wasn't controlled, and many control patients became febrile."], [1251.8, 1255.4, "Tutor", "So was the benefit from cold, or from avoiding fever?"], [1255.4, 1263.68, "Tutor", "Meanwhile the practice spread far beyond the trial populations: to asystole, to in-hospital arrest, to patients with long downtimes."], [1263.86, 1267.97, "Tutor", "A therapy proven in a narrow group had become routine for everyone."], [1267.97, 1271.47, "Tutor", "Two Scandinavian-led trials set out to test it properly."], [1271.47, 1283.46, "Tutor", "That's the pattern you'll see again and again this year, from tight glucose control to early goal-directed therapy: a striking early trial, rapid adoption, then a larger pragmatic trial that finds no difference."], [1283.86, 1288.1, "Tutor", "TTM, published in 2013 by Niklas Nielsen and colleagues."], [1288.1, 1296.17, "Tutor", "950 unconscious adults after out-of-hospital arrest of presumed cardiac cause, in 36 ICUs in Europe and Australia."], [1296.17, 1299.22, "Tutor", "Intervention: 33 degrees for 28 hours."], [1299.22, 1302.13, "Tutor", "Comparator: 36 degrees for 28 hours."], [1302.13, 1306.97, "Tutor", "Both arms were rewarmed slowly and fever was avoided to 72 hours."], [1306.97, 1319.28, "Tutor", "The primary outcome, all-cause mortality, was 50 percent at 33 degrees versus 48 percent at 36, with a hazard ratio of 1.06, and a 95 percent confidence interval of 0.89 to 1.28."], [1319.28, 1324.78, "Tutor", "Death or poor neurological function at six months was 54 versus 52 percent."], [1324.78, 1339.21, "Tutor", "The main criticisms: the confidence interval was wide, unwitnessed arrests with asystole were excluded, so the sickest brains were under-represented, and some argued that 36 degrees was still a form of cooling."], [1339.21, 1344.84, "Tutor", "What it changed: many units moved to 36 degrees, which was easier to deliver."], [1344.84, 1347.49, "Tutor", "There's a nuance worth one line."], [1347.49, 1358.08, "Tutor", "TTM did not test cooling against nothing; both arms received a carefully controlled temperature, and that is exactly what made the next trial necessary."], [1358.08, 1365.1, "Tutor", "How to quote it: in TTM, 33 degrees was no better than 36, with mortality of 50 versus 48 percent."], [1365.5, 1369.89, "Tutor", "TTM2, published in 2021 by Josef Dankiewicz and colleagues."], [1369.89, 1377.48, "Tutor", "1,900 patients were randomised in 61 centres in 14 countries, with 1,861 in the intention-to-treat analysis."], [1377.48, 1384.42, "Tutor", "Adults after out-of-hospital arrest of presumed cardiac or unknown cause, with any initial rhythm."], [1384.42, 1388.48, "Tutor", "Intervention: 33 degrees for 28 hours, then rewarming."], [1388.48, 1396.33, "Tutor", "Comparator: normothermia, aiming for 37.5 degrees or below, with a device used only if temperature reached 37.8."], [1396.33, 1404.38, "Tutor", "Six-month mortality was 50 versus 48 percent, a relative risk of 1.04, 95 percent confidence interval 0.94 to 1.14."], [1404.38, 1408.31, "Tutor", "Poor functional outcome was 55 percent in both arms."], [1408.31, 1415.32, "Tutor", "The harm: arrhythmia with haemodynamic compromise in 24 versus 16 percent in the hypothermia group."], [1415.32, 1430.24, "Tutor", "Criticisms: it was open-label, follow-up was disrupted by COVID, about a fifth of patients were co-enrolled in the TAME carbon dioxide trial, and it can't exclude benefit in a subgroup with severe but salvageable injury."], [1430.24, 1442.62, "Tutor", "What it changed: the 2022 ERC and ESICM temperature guideline, and then the 2025 post-resuscitation guideline, replaced targeted temperature management with active fever prevention."], [1442.62, 1446.54, "Tutor", "What does fever prevention look like at the bedside?"], [1446.54, 1448.18, "Tutor", "It's not passive."], [1448.36, 1457.49, "Tutor", "Many patients still need a feedback-controlled surface or intravascular device, because fever after cardiac arrest is common in the first 72 hours."], [1457.49, 1472.87, "Tutor", "Shivering has to be managed, with a stepwise approach: skin counter-warming, paracetamol, magnesium, then deeper sedation or opioids, and neuromuscular blockade only as a last resort, because it masks seizures and confounds the neurological examination."], [1472.87, 1482.36, "Tutor", "And remember the TTM2 harm: cooling to 33 degrees brought more arrhythmia with haemodynamic compromise, which matters in a patient who has just arrested."], [1482.36, 1498.68, "Tutor", "How to quote it in an SAQ: TTM2 found no mortality benefit from 33 degrees over fever prevention, 50 versus 48 percent at six months, with more haemodynamically significant arrhythmia, so I would actively prevent fever above 37.5 degrees rather than induce hypothermia."], [1500.08, 1502.16, "Tutor", "Now let's go to the exam room."], [1502.16, 1505.56, "Tutor", "This is from the 2021 first sitting, question sixteen."], [1505.56, 1510.32, "Tutor", "Neuroprognostication after cardiac arrest has been asked five times since 2011."], [1511.22, 1514.15, "Examiner", "Before you start, a word on reading the question."], [1514.15, 1517.5, "Examiner", "The verb is discuss, and the object is their limitations."], [1517.5, 1519.92, "Examiner", "Half the marks are for the limitations."], [1519.92, 1521.26, "Examiner", "I'll read it once."], [1521.66, 1524.12, "Examiner", "Here is the question, as written."], [1524.12, 1531.54, "Examiner", "List the clinical signs and tests used for neuro-prognostication after cardiac arrest and discuss their limitations."], [1532.04, 1532.78, "Candidate", "Okay."], [1532.78, 1540.65, "Candidate", "I'll group them into four categories: clinical examination, electrophysiology, biomarkers and imaging, with the limitation of each."], [1540.65, 1542.64, "Candidate", "Clinical examination first."], [1542.64, 1546.77, "Candidate", "Bilaterally absent pupillary light reflexes at 72 hours or later."], [1546.77, 1548.59, "Candidate", "Absent corneal reflexes."], [1548.59, 1551.42, "Candidate", "A motor response that's extensor or worse."], [1551.42, 1554.54, "Candidate", "And status myoclonus within the first 72 hours."], [1554.54, 1561.85, "Candidate", "The limitation of all clinical signs is confounding by sedatives, opioids and neuromuscular blockers, and by hypothermia."], [1561.85, 1570.69, "Candidate", "The motor response in particular has a high false positive rate, so it's used to select patients for prognostication rather than to predict outcome."], [1570.69, 1577.09, "Candidate", "Myoclonus can be subtle, it's interpreter dependent, and some patients with Lance-Adams syndrome do well."], [1577.09, 1578.56, "Candidate", "Electrophysiology."], [1578.56, 1583.1, "Candidate", "Somatosensory evoked potentials: a bilaterally absent N twenty response."], [1583.1, 1591.88, "Candidate", "It's quite specific, but the limitation is that it's insensitive, it can be degraded by electrical interference in the ICU, and it needs expertise."], [1591.88, 1596.7, "Candidate", "EEG: highly malignant patterns, a suppressed background or burst suppression."], [1596.7, 1603.27, "Candidate", "The limitation is that sedation can produce the same pattern, and the interpretation varies between readers."], [1603.27, 1604.35, "Candidate", "Biomarkers."], [1604.35, 1606.16, "Candidate", "Neuron-specific enolase."], [1606.34, 1608.84, "Candidate", "A high level suggests a poor outcome."], [1608.84, 1612.24, "Candidate", "I'd use a threshold of about 33 micrograms per litre."], [1612.24, 1616.69, "Candidate", "The limitation is haemolysis, which falsely raises it, and some tumours."], [1616.69, 1617.58, "Candidate", "Imaging."], [1617.58, 1623.36, "Candidate", "CT showing loss of grey-white differentiation, and MRI showing widespread diffusion restriction."], [1623.36, 1629.26, "Candidate", "CT may be normal if it's done too early, and there's no agreed threshold for the grey-white ratio."], [1629.76, 1630.91, "Examiner", "Good structure."], [1630.91, 1631.86, "Examiner", "Two things."], [1631.86, 1635.52, "Examiner", "Where does 33 come from, and what does the current guideline use?"], [1636.02, 1643.71, "Candidate", "Thirty-three was the older American Academy of Neurology figure from 2006, from the era of hypothermia."], [1643.71, 1653.62, "Candidate", "The ERC and ESICM threshold is above 60 micrograms per litre at 48 or 72 hours, and a rising level between 24 and 72 hours adds weight."], [1654.12, 1655.01, "Examiner", "Correct."], [1655.01, 1655.84, "Examiner", "Second."], [1655.84, 1657.72, "Examiner", "You've given me the tests."], [1657.72, 1659.38, "Examiner", "What frames their use?"], [1659.38, 1660.88, "Examiner", "When, and how many?"], [1661.38, 1662.11, "Candidate", "Right."], [1662.11, 1664.15, "Candidate", "I should have opened with that."], [1664.15, 1670.94, "Candidate", "First, exclude the confounders: sedation cleared, normothermia, no neuromuscular blockade, no major metabolic derangement."], [1670.94, 1680.61, "Candidate", "Second, timing: prognostic conclusions are drawn in patients who remain unconscious at 72 hours or more after return of circulation, although some tests can be recorded earlier."], [1680.61, 1682.23, "Candidate", "Third, it's multimodal."], [1682.23, 1686.05, "Candidate", "A poor outcome is likely when two or more predictors are present."], [1686.05, 1688.51, "Candidate", "No single test should drive withdrawal."], [1688.51, 1693.32, "Candidate", "Fourth, the biggest limitation of the whole process is the self-fulfilling prophecy."], [1693.32, 1701.26, "Candidate", "Many patients die after life-sustaining treatment is withdrawn, so the studies that validated these tests may have overestimated their accuracy."], [1701.76, 1702.44, "Examiner", "Better."], [1702.44, 1703.2, "Examiner", "One more."], [1703.2, 1705.37, "Examiner", "You said the CT may be normal too early."], [1705.37, 1707.44, "Examiner", "When does each imaging test work best?"], [1707.94, 1718.13, "Candidate", "CT is most useful within the first couple of days, and the guideline suggests repeating it at 72 to 96 hours if the first is normal and the patient is still unconscious."], [1718.13, 1720.78, "Candidate", "MRI is best at about two to five days."], [1720.78, 1724.58, "Candidate", "Done too late, the diffusion changes can pseudo-normalise."], [1725.08, 1726.18, "Examiner", "Last probe."], [1726.18, 1731.7, "Examiner", "A patient at day four has myoclonus, but the EEG background is continuous and reactive."], [1731.7, 1733.04, "Examiner", "What do you do?"], [1733.54, 1736.47, "Candidate", "That's not status myoclonus with a malignant EEG."], [1736.47, 1740.63, "Candidate", "It may be Lance-Adams syndrome, which is compatible with a good recovery."], [1740.63, 1750.86, "Candidate", "I'd treat the myoclonus, with levetiracetam or valproate, and the guideline suggests a wake-up trial, reducing sedation over the following days, rather than drawing any prognostic conclusion."], [1750.86, 1756.98, "Candidate", "I'd also make sure the family hears that uncertainty honestly, and that no decision is made on myoclonus alone."], [1757.48, 1758.86, "Examiner", "Let me mark that."], [1758.86, 1769.42, "Examiner", "The marks sit in four places: the right signs and tests, the right timing, the specific limitation of each one, and the framing of multimodal prognostication with confounders excluded."], [1769.42, 1773.22, "Examiner", "You named all the major tests and gave a limitation for most."], [1773.22, 1781.04, "Examiner", "You lost marks for the outdated enolase threshold, and for leaving confounders, timing and the self-fulfilling prophecy until I asked."], [1781.04, 1783.57, "Examiner", "In the paper, nobody would have asked."], [1783.57, 1786.21, "Examiner", "That's around six and a half out of ten."], [1786.21, 1789.02, "Examiner", "With the framing at the top, it's an eight."], [1789.02, 1791.44, "Examiner", "The one fix: open with when and how."], [1791.44, 1794.91, "Examiner", "Confounders excluded, 72 hours, two or more predictors."], [1794.91, 1798.26, "Examiner", "Then present each test with its limitation beside it."], [1798.26, 1803.88, "Examiner", "A two-column table, test and limitation, is the fastest way to write this under time pressure."], [1803.88, 1806.19, "Examiner", "And keep the limitations specific."], [1806.19, 1813.4, "Examiner", "Confounded by sedation is worth a mark once; saying which test, which drug, and how long to wait is worth a mark each time."], [1814.8, 1822.1, "Tutor", "Now the syllabus round-up: six more topics from this week's block, at overview level, each with what the examiner wants."], [1822.1, 1827.41, "Tutor", "First, the patient after cardiac surgery: coronary grafts, valves and aortic surgery."], [1827.41, 1828.78, "Tutor", "Oh's chapter 73."], [1828.78, 1833.8, "Tutor", "This syllabus item has 25 past questions linked to it, so the framework matters."], [1833.8, 1835.57, "Tutor", "Think in five problems."], [1835.57, 1847.44, "Tutor", "Low cardiac output, usually defined as a cardiac index below 2.2 litres per minute per square metre with signs of hypoperfusion: check preload, rhythm, contractility and afterload, and look with echo."], [1847.44, 1853.37, "Tutor", "Expect a dip in ventricular function at six to eight hours after bypass, which usually recovers."], [1853.37, 1869.01, "Tutor", "Bleeding: correct temperature, calcium, protamine reversal of heparin, and coagulopathy guided by viscoelastic testing; commonly quoted re-exploration thresholds are more than 400 millilitres in the first hour, or more than 200 millilitres an hour for several hours."], [1869.01, 1878.48, "Tutor", "Tamponade: it can be localised after cardiac surgery, so a clean transthoracic echo does not exclude it, and transoesophageal echo or reopening may be needed."], [1878.66, 1887.84, "Tutor", "Vasoplegia: a low systemic vascular resistance with normal or high output, treated with noradrenaline and vasopressin, with methylene blue as a rescue."], [1887.84, 1893.9, "Tutor", "And rhythm: atrial fibrillation and heart block, which is why epicardial wires are left in place."], [1894.3, 1901.26, "Tutor", "Then there is the trap from the 2025 first sitting, question twelve: systolic anterior motion of the mitral valve."], [1901.26, 1908.5, "Tutor", "You scored seven out of ten on it on 12 October, and the points that would have taken it higher were in the definition."], [1908.5, 1909.98, "Tutor", "Here's the recall."], [1909.98, 1914.03, "Tutor", "Systolic anterior motion causes two physiological consequences."], [1914.03, 1915.34, "Tutor", "Name them both."], [1915.34, 1916.82, "Tutor", "Pause, and answer."], [1922.22, 1929.36, "Tutor", "First, dynamic left ventricular outflow tract obstruction, giving low output despite a hypercontractile ventricle."], [1929.36, 1934.8, "Tutor", "Second, mitral regurgitation, usually directed posteriorly, causing pulmonary oedema."], [1934.8, 1939.01, "Tutor", "The examiners said the higher-scoring definitions included both."], [1939.01, 1952.94, "Tutor", "The management follows the physiology: fluid to fill the ventricle, slow the heart and keep sinus rhythm, wean inotropes, raise afterload with a pure vasoconstrictor, and return to theatre if it's refractory after a mitral repair."], [1953.34, 1957.95, "Tutor", "Second, heart failure and cardiogenic shock, from Oh's chapter 33."], [1957.95, 1967.16, "Tutor", "The examiner wants a definition, the Society for Cardiovascular Angiography and Interventions stages from A to E, and a structured approach."], [1967.16, 1970.33, "Tutor", "Treat the cause, usually revascularisation."], [1970.33, 1979.17, "Tutor", "Support the pressure with noradrenaline first, then add an inodilator such as dobutamine, milrinone or levosimendan to support output."], [1979.17, 1983.53, "Tutor", "Then mechanical support, and here the trials are worth naming."], [1983.53, 1994.29, "Tutor", "IABP-SHOCK II in 2012: 600 patients with infarct-related shock, no difference in 30-day mortality, 39.7 versus 41.3 percent, so routine balloon pumps were abandoned."], [1994.29, 2011.47, "Tutor", "Don't forget the simpler therapies for acute cardiogenic pulmonary oedema: sit the patient up, give non-invasive ventilation to reduce preload and afterload and the work of breathing, glyceryl trinitrate if the blood pressure allows, and loop diuretics for congestion."], [2011.47, 2021.74, "Tutor", "ECLS-SHOCK in 2023: 420 patients, venoarterial ECMO did not reduce 30-day mortality, 47.8 versus 49.0 percent, with more bleeding and vascular complications."], [2021.92, 2038.09, "Tutor", "DanGer Shock in 2024: 360 patients with ST elevation infarction and shock, a microaxial flow pump reduced six-month mortality from 58.5 to 45.8 percent, at the cost of more limb ischaemia, bleeding and kidney replacement therapy."], [2038.09, 2044.36, "Tutor", "So, beyond this week: selected patients, experienced centres, and a clear exit plan."], [2044.76, 2049.72, "Tutor", "Third, acute coronary syndromes and ischaemic heart disease, Oh's chapter 29."], [2049.72, 2053.7, "Tutor", "The examiner wants reperfusion timing and the complications."], [2053.7, 2063.86, "Tutor", "ST elevation infarction: primary PCI if it can happen within 120 minutes of diagnosis; otherwise fibrinolysis, ideally within ten minutes of diagnosis, then transfer."], [2063.86, 2075.72, "Tutor", "In cardiogenic shock with multivessel disease, CULPRIT-SHOCK in 2017 showed that treating the culprit lesion only reduced death or kidney replacement therapy at 30 days, 45.9 versus 55.4 percent."], [2075.72, 2089.16, "Tutor", "Then the mechanical complications that turn up as a new murmur and sudden shock in the first week: papillary muscle rupture with acute mitral regurgitation, ventricular septal rupture, and free wall rupture with tamponade."], [2089.16, 2095.64, "Tutor", "Echo makes the diagnosis; surgery is usually the answer; a balloon pump or other support is the bridge."], [2096.04, 2099.8, "Tutor", "Fourth, aortic dissection and aneurysm, Oh's chapter 35."], [2099.8, 2108.84, "Tutor", "Stanford type A involves the ascending aorta and needs emergency surgery; untreated, early mortality rises by roughly one to two percent per hour."], [2108.84, 2118.3, "Tutor", "Type B is managed medically unless it's complicated by malperfusion, rupture or uncontrolled pain, in which case endovascular repair is the usual answer."], [2118.3, 2125.7, "Tutor", "The medical target is impulse control: heart rate below 60 and systolic pressure of 100 to 120 millimetres of mercury."], [2125.7, 2127.23, "Tutor", "The order matters."], [2127.23, 2137.03, "Tutor", "Beta-blocker first, usually esmolol or labetalol, then a vasodilator, so that you don't cause a reflex tachycardia that increases the shear on the aortic wall."], [2137.03, 2144.2, "Tutor", "CT angiography is the usual diagnostic test, and transoesophageal echo is the alternative in the unstable patient."], [2144.6, 2149.37, "Tutor", "Fifth, hypertensive crisis and the antihypertensives, from Oh's chapter 27."], [2149.37, 2160.07, "Tutor", "The key distinction is emergency versus urgency: the emergency has acute end-organ damage, such as encephalopathy, pulmonary oedema, dissection, acute kidney injury or eclampsia."], [2160.07, 2161.57, "Tutor", "Here's the recall."], [2161.57, 2168.59, "Tutor", "In a hypertensive emergency without dissection, how far do you lower the mean arterial pressure in the first hour?"], [2168.59, 2170.08, "Tutor", "Pause, and answer."], [2175.48, 2178.98, "Tutor", "By no more than 25 percent in the first hour."], [2178.98, 2186.11, "Tutor", "Then towards 160 over 100 to 110 over the next two to six hours, then to normal over 24 to 48 hours."], [2186.11, 2193.56, "Tutor", "Autoregulation has shifted to the right, so a rapid fall can cause cerebral, coronary or renal ischaemia."], [2193.56, 2213.89, "Tutor", "The exceptions are the examiners' favourites: aortic dissection, where you go fast and low; severe pre-eclampsia, where you treat a systolic of 160 or more promptly; and acute ischaemic stroke, where you lower only to below 185 over 110 before thrombolysis, and keep it below 180 over 105 afterwards."], [2213.89, 2229.0, "Tutor", "Name your drugs with a reason: glyceryl trinitrate for pulmonary oedema, labetalol or hydralazine in pregnancy, esmolol in dissection, and sodium nitroprusside as a potent titratable option, watching for cyanide toxicity."], [2229.4, 2232.83, "Tutor", "Sixth, valvular heart disease, from Oh's chapter 34."], [2232.83, 2235.97, "Tutor", "The examiner wants the haemodynamic principles."], [2235.97, 2245.75, "Tutor", "Severe aortic stenosis: a valve area under one square centimetre, a mean gradient above 40 millimetres of mercury, or a peak velocity above four metres per second."], [2245.75, 2259.18, "Tutor", "The ventricle is stiff and preload-dependent, so keep sinus rhythm, avoid tachycardia, and treat hypotension early with a vasoconstrictor, because a fall in diastolic pressure starves a hypertrophied ventricle of coronary flow."], [2259.18, 2264.96, "Tutor", "Acute mitral regurgitation: reduce afterload, consider a balloon pump, and get surgical help."], [2264.96, 2270.96, "Tutor", "Acute aortic regurgitation: avoid bradycardia, never use a balloon pump, and plan urgent surgery."], [2270.96, 2286.62, "Tutor", "Infective endocarditis belongs here too: the indications for early surgery are heart failure from valve destruction, uncontrolled infection such as an abscess or a resistant organism, and prevention of embolism from a large vegetation, usually above ten millimetres."], [2286.62, 2289.99, "Tutor", "In each case, say what the ventricle needs and why."], [2289.99, 2293.48, "Tutor", "That rationale is what turns a pass into a good mark."], [2293.88, 2296.42, "Tutor", "Before the next episode, do one thing."], [2296.42, 2308.45, "Tutor", "Take a blank page and write the neuroprognostication answer from memory as a two-column table: test on the left, limitation on the right, with confounders, timing and the two-or-more rule as your opening lines."], [2308.45, 2310.32, "Tutor", "Give yourself ten minutes."], [2310.32, 2316.78, "Tutor", "Then check it against Oh's chapter 30, the post-resuscitation section from page 1002, and fix what's missing."], [2316.78, 2322.08, "Tutor", "Keep this week's daily ECG drills going: abnormality, cause and consequence, every time."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 63.8, "title": "This week: Cardiac intensive care"}, {"start": 1186.72, "title": "Landmark trials"}, {"start": 1500.08, "title": "Exam practice"}, {"start": 1814.8, "title": "Syllabus round-up"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
