<script>
var C=[[0.0, 1.79, "Tutor", "Welcome to Part Two Daily."], [1.79, 5.63, "Tutor", "It's Wednesday the fourth of November, and this is the deep dive."], [5.63, 8.53, "Tutor", "Today is the high anion gap metabolic acidosis."], [8.53, 10.37, "Tutor", "Not the whole of acid-base."], [10.37, 17.96, "Tutor", "Just the gap: how to measure it properly, what fills it, and how to find the one cause that matters before the patient runs out of time."], [17.96, 19.75, "Tutor", "Why this, in cardiac week?"], [19.75, 27.07, "Tutor", "Because today's practice set leans hard on metabolic acidosis, and because the theme is one of the most examined in the whole exam."], [27.07, 33.44, "Tutor", "The cardiac links are real, too: the lactate after bypass, the lactate after adrenaline, the gas after an arrest."], [33.44, 35.18, "Tutor", "Here's the running order."], [35.18, 45.6, "Tutor", "First, a tutorial built on Oh's chapter fifty-seven, with toxic alcohols from chapter one hundred and one, and the governing guidance, the Surviving Sepsis Campaign and the EXTRIP workgroup."], [45.6, 47.82, "Tutor", "Second, two trials on bicarbonate."], [47.82, 52.4, "Tutor", "Third, exam practice with a real College question, an examiner and a candidate."], [52.4, 53.51, "Tutor", "Pencil ready."], [53.51, 54.4, "Tutor", "Let's go."], [55.8, 57.31, "Tutor", "Start with a scenario."], [57.31, 58.77, "Tutor", "Day three in the ICU."], [58.77, 65.16, "Tutor", "A seventy-year-old woman, thin, treated for a wound infection with flucloxacillin, and on regular paracetamol for pain."], [65.16, 66.61, "Tutor", "She's breathing fast."], [66.61, 68.22, "Tutor", "Her bicarbonate is five."], [68.22, 69.58, "Tutor", "Her lactate is one."], [69.58, 71.19, "Tutor", "Her ketones are trivial."], [71.19, 74.51, "Tutor", "Her creatinine is up, but not enough to explain any of it."], [74.51, 77.08, "Tutor", "The registrar says, it must be the kidneys."], [77.08, 77.78, "Tutor", "Is it?"], [77.78, 79.09, "Tutor", "Hold that thought."], [79.09, 83.92, "Tutor", "By the end of this part you should be able to name the acid, the mechanism, and the fix."], [84.32, 86.76, "Tutor", "First, how the College asks this."], [86.76, 97.46, "Tutor", "In the curriculum's bank of past questions, causes of metabolic acidosis appears in eighteen past questions, from the 2011 second sitting through to the 2022 first sitting."], [97.46, 100.67, "Tutor", "Causes of lactic acidosis appears in thirteen."], [100.67, 109.18, "Tutor", "Pyroglutamic acidosis, which candidates still treat as a curiosity, has been examined five times, from 2011 to the 2025 second sitting."], [109.18, 116.73, "Tutor", "And across the whole bank, sixty-three question parts have acidosis or the anion gap in their title, from 2007 to 2026."], [116.73, 119.29, "Tutor", "The form is almost always the same."], [119.29, 120.9, "Tutor", "A table of results."], [120.9, 129.58, "Tutor", "Then three verbs: describe the abnormalities, list the likely causes, and give one associated clinical scenario, or explain the mechanism."], [129.58, 132.38, "Tutor", "That means the marks sit in two places."], [132.38, 135.29, "Tutor", "The numbers, written down and calculated."], [135.29, 138.56, "Tutor", "And the specific cause, named, not gestured at."], [138.96, 142.15, "Tutor", "So here is the framework the examiners reward."], [142.15, 148.59, "Tutor", "Write it as a short stack of lines, one number per line, before you write a single word of diagnosis."], [148.59, 149.59, "Tutor", "Line one."], [149.59, 150.47, "Tutor", "The pH."], [150.47, 152.36, "Tutor", "Acidaemia or alkalaemia."], [152.36, 153.37, "Tutor", "Line two."], [153.37, 155.02, "Tutor", "The primary process."], [155.02, 158.98, "Tutor", "A low bicarbonate with a low pH means a metabolic acidosis."], [158.98, 160.1, "Tutor", "Line three."], [160.1, 161.34, "Tutor", "Compensation."], [161.34, 170.96, "Tutor", "Winters' formula, from 1967: expected carbon dioxide equals one and a half times the bicarbonate, plus eight, plus or minus two, in millimetres of mercury."], [170.96, 176.99, "Tutor", "If the measured carbon dioxide is higher than that, there's a coexisting respiratory acidosis."], [176.99, 180.41, "Tutor", "If it's lower, a coexisting respiratory alkalosis."], [180.41, 181.47, "Tutor", "Line four."], [181.47, 182.77, "Tutor", "The anion gap."], [182.77, 186.14, "Tutor", "Sodium minus the sum of chloride and bicarbonate."], [186.14, 190.86, "Tutor", "The College convention leaves potassium out, and takes twelve as normal."], [190.86, 191.92, "Tutor", "Line five."], [191.92, 196.41, "Tutor", "Correct for albumin whenever albumin is below forty grams per litre."], [196.41, 202.67, "Tutor", "Add a quarter of a millimole per litre to the gap for every gram per litre of albumin below forty."], [202.67, 205.15, "Tutor", "So an albumin of twenty adds five."], [205.15, 206.16, "Tutor", "Line six."], [206.16, 207.57, "Tutor", "The delta ratio."], [207.57, 211.0, "Tutor", "The rise in the gap, over the fall in bicarbonate."], [211.0, 215.84, "Tutor", "That's the gap minus twelve, divided by twenty-four minus the bicarbonate."], [215.84, 216.96, "Tutor", "Line seven."], [217.14, 221.06, "Tutor", "If the gap is high and the cause isn't obvious, the osmolar gap."], [221.06, 228.51, "Tutor", "Measured osmolality minus calculated, where calculated is two times sodium, plus glucose, plus urea, all in millimoles per litre."], [228.51, 229.6, "Tutor", "Seven lines."], [229.6, 232.05, "Tutor", "Perhaps ninety seconds of arithmetic."], [232.05, 242.66, "Tutor", "In your own marked answers this month, this is exactly where the missing marks were: an expected carbon dioxide not calculated, a delta ratio not written, an osmolar gap left in the stem."], [242.66, 244.94, "Tutor", "The numbers come before the words."], [245.34, 246.24, "Tutor", "Try one."], [246.24, 254.08, "Tutor", "A patient's sodium is one hundred and thirty-six, chloride one hundred and two, bicarbonate twenty, albumin twenty grams per litre."], [254.08, 258.75, "Tutor", "What is the albumin-corrected anion gap, and does it change your diagnosis?"], [258.75, 260.22, "Tutor", "Pause, and answer."], [265.62, 270.26, "Tutor", "The raw gap is one hundred and thirty-six minus one hundred and twenty-two."], [270.26, 271.6, "Tutor", "That's fourteen."], [271.6, 273.06, "Tutor", "Just above normal."], [273.06, 274.34, "Tutor", "Now correct it."], [274.34, 277.2, "Tutor", "Albumin is twenty below forty, so add five."], [277.2, 279.32, "Tutor", "The corrected gap is nineteen."], [279.32, 283.85, "Tutor", "That's a real high anion gap acidosis hiding behind a near-normal number."], [283.85, 290.62, "Tutor", "This is the commonest trap in ICU acid-base, because our patients' albumin is so often in the teens and twenties."], [290.62, 294.14, "Tutor", "An uncorrected gap in the ICU is a gap you can't trust."], [294.54, 299.41, "Tutor", "Now the delta ratio, because it earns marks and candidates fumble the bands."], [299.41, 304.74, "Tutor", "Below zero point four: the fall in bicarbonate is mostly not from unmeasured anions."], [304.74, 308.16, "Tutor", "That's a hyperchloraemic normal anion gap acidosis."], [308.16, 313.2, "Tutor", "Zero point four to zero point eight: a mixed picture, high gap plus normal gap."], [313.2, 317.72, "Tutor", "Think renal failure, or a ketoacidosis being resuscitated with saline."], [317.72, 320.32, "Tutor", "One to two: a pure high gap acidosis."], [320.32, 325.02, "Tutor", "Ketoacidosis tends to sit near one, because ketoanions are lost in urine."], [325.02, 332.95, "Tutor", "Lactic acidosis tends to sit around one point six, partly because lactate leaves cells more slowly than hydrogen ion is buffered."], [332.95, 337.3, "Tutor", "Above two: the bicarbonate is higher than it should be for the gap."], [337.3, 345.99, "Tutor", "That means a coexisting metabolic alkalosis, from vomiting, diuretics or nasogastric loss, or a pre-existing compensated respiratory acidosis."], [345.99, 348.08, "Tutor", "Say which one fits the stem."], [348.08, 351.38, "Tutor", "Examiners want the inference, not just the ratio."], [351.78, 353.92, "Tutor", "Now, what fills the gap."], [353.92, 356.12, "Tutor", "You'll remember MUDPILES."], [356.12, 362.87, "Tutor", "It dates from an era of paraldehyde, and it misses two causes that ICU patients actually get."], [362.87, 368.89, "Tutor", "So in 2008 Mehta and the Emmetts wrote a letter to the Lancet proposing GOLD MARK."], [368.89, 372.69, "Tutor", "G, glycols: ethylene glycol and propylene glycol."], [372.69, 376.04, "Tutor", "O, oxoproline, which is pyroglutamic acid."], [376.04, 377.44, "Tutor", "L, L-lactate."], [377.44, 378.84, "Tutor", "D, D-lactate."], [378.84, 380.18, "Tutor", "M, methanol."], [380.18, 381.45, "Tutor", "A, aspirin."], [381.45, 383.12, "Tutor", "R, renal failure."], [383.12, 384.72, "Tutor", "K, ketoacidosis."], [384.72, 388.06, "Tutor", "The value of GOLD MARK isn't the mnemonic."], [388.06, 392.27, "Tutor", "It's that it forces two questions MUDPILES never asked."], [392.27, 394.48, "Tutor", "Could this be oxoproline?"], [394.48, 398.35, "Tutor", "And could the lactate assay be blind to this acid?"], [398.35, 405.03, "Tutor", "In an SAQ, list them in order of likelihood for the patient in the stem, not alphabetically."], [405.03, 410.11, "Tutor", "A post-operative cardiac patient on adrenaline gets L-lactate first."], [410.11, 416.26, "Tutor", "A malnourished woman on flucloxacillin and paracetamol gets oxoproline near the top."], [416.66, 421.13, "Tutor", "Take lactate first, because it's the cause you'll see every day."], [421.13, 428.82, "Tutor", "Oh's chapter fifty-seven treats it under hyperlactataemia, and the useful split is still Cohen and Woods, from 1976."], [428.82, 434.91, "Tutor", "Type A is the hypoxic kind: shock, regional ischaemia, severe hypoxaemia, carbon monoxide."], [434.91, 437.95, "Tutor", "Type B is lactate without global hypoxia."], [437.95, 443.16, "Tutor", "B one, with disease: sepsis, liver failure, malignancy, thiamine deficiency."], [443.16, 452.59, "Tutor", "B two, from drugs and toxins: adrenaline, salbutamol, metformin, linezolid, propofol infusion syndrome, cyanide, the nucleoside antiretrovirals."], [452.59, 454.77, "Tutor", "B three, the inborn errors."], [454.77, 457.68, "Tutor", "The cardiac links this week are direct."], [457.68, 465.13, "Tutor", "After bypass, lactate rises from low flow, from hypothermia, from lactate-containing prime, and from adrenaline."], [465.13, 469.78, "Tutor", "Adrenaline is worth a sentence of mechanism, because it's examined."], [469.78, 476.24, "Tutor", "It drives beta-two stimulated aerobic glycolysis and sodium-potassium ATPase activity in muscle."], [476.24, 483.13, "Tutor", "Pyruvate is made faster than the mitochondria can take it, so lactate rises with no oxygen debt at all."], [483.13, 493.74, "Tutor", "That's why a rising lactate on adrenaline with a good cardiac output and a falling central venous to arterial carbon dioxide gap isn't a signal to give more fluid."], [493.92, 505.27, "Tutor", "The Controversies in Critical Care chapter on hyperlactataemia makes the larger point: lactate is a fuel and a signal, not just a waste product, and clearance is a marker, not a target in itself."], [505.27, 509.13, "Tutor", "The Surviving Sepsis Campaign's 2026 guideline reflects that."], [509.13, 517.96, "Tutor", "It suggests measuring lactate, and serial lactate to guide resuscitation, but its remarks warn against continuing fluids just to normalise the number."], [518.36, 519.91, "Tutor", "Two lactate traps."], [519.91, 521.39, "Tutor", "First, D-lactate."], [521.39, 524.19, "Tutor", "Standard assays measure L-lactate only."], [524.19, 531.38, "Tutor", "So the patient with short bowel syndrome, confused after a carbohydrate load, has a big gap and a normal lactate."], [531.38, 534.42, "Tutor", "The gap is D-lactate from colonic bacteria."], [534.42, 535.96, "Tutor", "Second, metformin."], [535.96, 540.66, "Tutor", "Metformin-associated lactic acidosis can push the lactate above twenty."], [540.66, 553.21, "Tutor", "The EXTRIP workgroup, Calello and colleagues in 2015, recommend extracorporeal removal if the lactate is above twenty millimoles per litre, the pH is seven point zero or lower, or standard therapy fails."], [553.21, 558.14, "Tutor", "Shock, kidney impairment and a reduced conscious state lower the threshold."], [558.14, 563.5, "Tutor", "Intermittent haemodialysis with a bicarbonate bath is the preferred first session."], [563.5, 569.92, "Tutor", "Stop when the lactate is under three and the pH above seven point three five, and watch for rebound."], [570.32, 572.44, "Tutor", "Ketoacidosis next, briefly."], [572.44, 575.05, "Tutor", "Diabetic, alcoholic and starvation."], [575.05, 576.51, "Tutor", "Two exam points."], [576.51, 577.23, "Tutor", "One."], [577.23, 583.12, "Tutor", "The euglycaemic diabetic ketoacidosis of the sodium-glucose cotransporter two inhibitors."], [583.12, 585.78, "Tutor", "A normal glucose doesn't exclude it."], [585.78, 588.03, "Tutor", "Measure beta-hydroxybutyrate."], [588.03, 588.76, "Tutor", "Two."], [588.76, 594.7, "Tutor", "The nitroprusside test on a urine dipstick detects acetoacetate, not beta-hydroxybutyrate."], [594.7, 605.5, "Tutor", "In alcoholic ketoacidosis, the redox state pushes almost everything to beta-hydroxybutyrate, so the dipstick can look reassuring while the patient is profoundly acidotic."], [605.5, 609.32, "Tutor", "Renal failure: early on it gives a normal gap acidosis."], [609.32, 616.53, "Tutor", "The gap rises only when the glomerular filtration rate is very low, as sulfate, phosphate and urate accumulate."], [616.53, 623.33, "Tutor", "So when a modest creatinine rise is offered as the explanation for a bicarbonate of five, be suspicious."], [623.33, 626.48, "Tutor", "That's the scenario at the top of this part."], [626.88, 629.27, "Tutor", "Which brings us to pyroglutamic acid."], [629.27, 631.46, "Tutor", "It's also called five-oxoproline."], [631.46, 640.29, "Tutor", "And it's where this deep dive earns its keep, because you scored two out of ten on this on the nineteenth of October, after four and a half on the fourteenth."], [640.29, 643.64, "Tutor", "On the nineteenth, the gap was put down to the kidneys."], [643.64, 648.11, "Tutor", "Here's the mechanism, slowly, because the College answer gives marks for it."], [648.11, 650.29, "Tutor", "Glutathione is made in two steps."], [650.29, 654.5, "Tutor", "Glutamate and cysteine are joined by gamma-glutamylcysteine synthetase."], [654.5, 657.48, "Tutor", "Then glycine is added by glutathione synthetase."], [657.48, 660.88, "Tutor", "The first enzyme is held in check by glutathione itself."], [660.88, 662.26, "Tutor", "Negative feedback."], [662.26, 663.97, "Tutor", "Now deplete glutathione."], [663.97, 667.37, "Tutor", "Paracetamol does it, through its toxic metabolite NAPQI."], [667.37, 670.4, "Tutor", "So do sepsis, malnutrition and liver dysfunction."], [670.4, 671.89, "Tutor", "The brake comes off."], [671.89, 679.72, "Tutor", "Gamma-glutamylcysteine is made in excess, and when glycine is short, it's diverted by gamma-glutamyl cyclotransferase into five-oxoproline."], [679.72, 685.25, "Tutor", "Normally five-oxoprolinase, an ATP-dependent enzyme, converts five-oxoproline back to glutamate."], [685.25, 687.91, "Tutor", "Flucloxacillin inhibits five-oxoprolinase."], [687.91, 690.2, "Tutor", "So does netilmicin, and vigabatrin."], [690.2, 691.74, "Tutor", "So you have two hits."], [691.74, 693.55, "Tutor", "Paracetamol opens the tap."], [693.55, 695.68, "Tutor", "Flucloxacillin blocks the drain."], [695.86, 704.47, "Tutor", "The typical patient: female, elderly, malnourished, septic, with renal or hepatic impairment, on regular paracetamol, and often on flucloxacillin."], [704.47, 707.77, "Tutor", "Diagnosis is by exclusion first, then confirmation."], [707.77, 708.84, "Tutor", "A high gap."], [708.84, 711.19, "Tutor", "A lactate that doesn't explain it."], [711.19, 713.31, "Tutor", "Ketones that don't explain it."], [713.31, 716.89, "Tutor", "No toxic alcohol, no salicylate, kidneys not bad enough."], [716.89, 720.19, "Tutor", "Then urinary organic acids showing five-oxoproline."], [720.19, 721.87, "Tutor", "Treatment is specific."], [721.87, 723.27, "Tutor", "Stop paracetamol."], [723.27, 725.39, "Tutor", "Stop or change flucloxacillin."], [725.39, 726.79, "Tutor", "Treat the sepsis."], [726.79, 728.19, "Tutor", "Feed the patient."], [728.19, 731.27, "Tutor", "Give N-acetylcysteine to replenish glutathione."], [731.27, 735.52, "Tutor", "Bicarbonate and dialysis may support, but they aren't the treatment."], [735.52, 745.7, "Tutor", "In the College answer to the 2014 second-sitting question, the management line reads: supportive care, cease culprit drugs, treat sepsis, improve nutrition, N-acetylcysteine."], [746.1, 751.93, "Tutor", "Name the two drugs that cause pyroglutamic acidosis most often, and the step each one hits."], [751.93, 753.46, "Tutor", "Pause, and answer."], [758.86, 768.16, "Tutor", "Paracetamol depletes glutathione, which removes the negative feedback on gamma-glutamylcysteine synthetase, so excess substrate is cycled into five-oxoproline."], [768.16, 774.01, "Tutor", "Flucloxacillin inhibits five-oxoprolinase, so five-oxoproline can't be cleared back to glutamate."], [774.01, 775.79, "Tutor", "Tap open, drain blocked."], [775.79, 779.86, "Tutor", "If you write those two sentences, you've got the mechanism marks."], [780.26, 786.38, "Tutor", "Now a story, because the toxic alcohols have a history that shaped how every drug you prescribe is regulated."], [786.38, 790.98, "Tutor", "In 1937, sulfanilamide was the new wonder drug, one of the first antibacterials."], [790.98, 794.9, "Tutor", "It came as tablets, and there was demand for a liquid for children."], [794.9, 796.68, "Tutor", "A company in Tennessee, S."], [796.68, 797.2, "Tutor", "E."], [797.2, 801.54, "Tutor", "Massengill, found that sulfanilamide dissolved nicely in diethylene glycol."], [801.54, 803.16, "Tutor", "It tasted of raspberry."], [803.16, 807.6, "Tutor", "They called it Elixir Sulfanilamide, and shipped it across the United States."], [807.6, 811.11, "Tutor", "Diethylene glycol is a close chemical cousin of antifreeze."], [811.11, 814.4, "Tutor", "Within weeks people were dying of acute kidney failure."], [814.4, 817.33, "Tutor", "More than a hundred died, many of them children."], [817.33, 818.63, "Tutor", "Here's the twist."], [818.63, 822.4, "Tutor", "There was no law requiring that a new drug be tested for safety."], [822.4, 829.61, "Tutor", "The federal inspectors could only act on a technicality: an elixir, by definition, contained alcohol, and this one contained none."], [829.61, 831.6, "Tutor", "So the charge was misbranding."], [831.6, 837.24, "Tutor", "One of the scientists who helped confirm that the solvent was the killer was a young Frances Kelsey."], [837.24, 842.42, "Tutor", "Two decades later, at the Food and Drug Administration, she refused to approve thalidomide."], [842.6, 851.22, "Tutor", "The public anger produced the Federal Food, Drug, and Cosmetic Act of 1938, which for the first time required proof of safety before a drug could be sold."], [851.22, 852.65, "Tutor", "And the exam point?"], [852.65, 856.69, "Tutor", "The glycols kill through their metabolites, not the parent compound."], [856.69, 858.93, "Tutor", "The parent raises the osmolar gap."], [858.93, 862.38, "Tutor", "The metabolites raise the anion gap and wreck the kidney."], [862.38, 865.68, "Tutor", "That pattern is the whole of toxic alcohol management."], [866.08, 870.64, "Tutor", "So, the toxic alcohols, as Oh's chapter one hundred and one sets them out."], [870.64, 871.59, "Tutor", "Methanol."], [871.59, 874.31, "Tutor", "Alcohol dehydrogenase makes formaldehyde."], [874.31, 877.03, "Tutor", "Aldehyde dehydrogenase makes formic acid."], [877.03, 878.65, "Tutor", "Formate is the toxin."], [878.65, 885.26, "Tutor", "It inhibits cytochrome c oxidase, so it adds a lactic acidosis, and it targets the optic nerve and the putamen."], [885.26, 896.16, "Tutor", "So the picture is a high anion gap acidosis, a raised osmolar gap early, visual blurring or a snowfield in the vision, and in severe cases basal ganglia haemorrhage or necrosis on imaging."], [896.16, 901.28, "Tutor", "Formate is cleared by a folate-dependent pathway, which is why we give folinic acid."], [901.28, 902.61, "Tutor", "Ethylene glycol."], [902.61, 906.51, "Tutor", "Alcohol dehydrogenase makes glycoaldehyde, then glycolic acid."], [906.51, 908.45, "Tutor", "Glycolate is the main acid."], [908.45, 911.96, "Tutor", "It's then metabolised to glyoxylate, and on to oxalate."], [911.96, 913.62, "Tutor", "Oxalate binds calcium."], [913.62, 919.02, "Tutor", "So you get calcium oxalate crystals in the urine, hypocalcaemia, and acute kidney injury."], [919.02, 925.02, "Tutor", "Thiamine and pyridoxine are cofactors that steer glyoxylate away from oxalate, so they're given too."], [925.02, 928.3, "Tutor", "And the gaps move in opposite directions over time."], [928.3, 934.25, "Tutor", "Early, the parent alcohol is in the blood: the osmolar gap is high and the anion gap may be normal."], [934.25, 939.76, "Tutor", "Late, the parent is metabolised: the anion gap is high and the osmolar gap may have closed."], [939.94, 943.57, "Tutor", "A normal osmolar gap doesn't exclude a late presentation."], [943.57, 946.91, "Tutor", "Remember that ethanol itself raises the osmolar gap."], [946.91, 953.22, "Tutor", "Each millimole per litre of ethanol adds roughly one to the gap; some use a factor of one point two five."], [953.22, 956.34, "Tutor", "Account for it before you blame a toxic alcohol."], [956.74, 960.65, "Tutor", "A patient presents eighteen hours after drinking antifreeze."], [960.65, 962.83, "Tutor", "The anion gap is twenty-eight."], [962.83, 964.61, "Tutor", "The osmolar gap is six."], [964.61, 968.29, "Tutor", "Why is the osmolar gap normal, and does it reassure you?"], [968.29, 969.78, "Tutor", "Pause, and answer."], [975.18, 979.84, "Tutor", "It's normal because most of the ethylene glycol has already been metabolised."], [979.84, 986.26, "Tutor", "The osmotically active parent is gone, and its acid metabolites, glycolate above all, now fill the anion gap."], [986.26, 988.4, "Tutor", "It doesn't reassure you at all."], [988.4, 990.38, "Tutor", "This is the dangerous phase."], [990.38, 996.74, "Tutor", "An anion gap above twenty-seven is itself a strong EXTRIP indication for dialysis, as we'll see in a moment."], [997.14, 998.18, "Tutor", "Management."], [998.18, 1003.92, "Tutor", "First, block alcohol dehydrogenase, so the parent is excreted unchanged and no more acid is made."], [1003.92, 1006.28, "Tutor", "Fomepizole is the cleaner antidote."], [1006.28, 1017.98, "Tutor", "Fifteen milligrams per kilogram as a load, then ten milligrams per kilogram every twelve hours for four doses, then fifteen milligrams per kilogram every twelve hours, because it induces its own metabolism."], [1017.98, 1022.09, "Tutor", "During haemodialysis it's dialysed, so it's given every four hours."], [1022.09, 1026.19, "Tutor", "Ethanol is the older alternative and still the one on many shelves."], [1026.19, 1030.73, "Tutor", "It has a much higher affinity for alcohol dehydrogenase than methanol does."], [1030.73, 1037.18, "Tutor", "Aim for a blood ethanol of about twenty-two millimoles per litre, which is a hundred milligrams per decilitre."], [1037.18, 1044.24, "Tutor", "It needs close monitoring, and it brings intoxication, hypoglycaemia and a messy infusion, often doubled during dialysis."], [1044.24, 1048.45, "Tutor", "Availability of fomepizole varies, so know your local antidote stock."], [1048.45, 1051.19, "Tutor", "The evidence base for fomepizole is small."], [1051.19, 1057.37, "Tutor", "Brent and colleagues' 1999 New England Journal case series in ethylene glycol enrolled nineteen patients."], [1057.37, 1064.87, "Tutor", "Glycolate fell once fomepizole started, and patients with a normal creatinine at the start didn't go on to develop kidney injury."], [1064.87, 1066.78, "Tutor", "Second, give the cofactors."], [1066.96, 1068.72, "Tutor", "Folinic acid for methanol."], [1068.72, 1071.42, "Tutor", "Thiamine and pyridoxine for ethylene glycol."], [1071.42, 1075.56, "Tutor", "Third, dialysis, which removes both the parent and the acid metabolites."], [1075.56, 1078.36, "Tutor", "This is where the governing guidance comes in."], [1078.76, 1081.66, "Tutor", "The EXTRIP workgroup is the guideline here."], [1081.66, 1086.16, "Tutor", "For methanol, Roberts and colleagues in Critical Care Medicine in 2015."], [1086.16, 1090.61, "Tutor", "For ethylene glycol, Ghannoum and colleagues in Critical Care in 2023."], [1090.61, 1096.48, "Tutor", "Both rate the evidence as very low quality, and both are what an examiner expects you to quote."], [1096.48, 1097.44, "Tutor", "Methanol."], [1097.44, 1110.77, "Tutor", "Recommend extracorporeal treatment for severe poisoning: coma, seizures, new visual deficits, a pH of seven point one five or lower, persistent acidosis despite supportive care and antidotes, or an anion gap above twenty-four."], [1110.77, 1124.45, "Tutor", "Also on the methanol concentration: above seven hundred milligrams per litre with fomepizole, which is about twenty-two millimoles per litre; above six hundred with ethanol; above five hundred with no alcohol dehydrogenase blockade."], [1124.45, 1126.55, "Tutor", "And impaired kidney function."], [1126.55, 1130.03, "Tutor", "Intermittent haemodialysis is the modality of choice."], [1130.03, 1134.87, "Tutor", "Avoid systemic anticoagulation, because of the risk of putaminal haemorrhage."], [1134.87, 1137.55, "Tutor", "Continue the antidote and folinic acid."], [1137.55, 1143.13, "Tutor", "Stop when methanol is below two hundred milligrams per litre and the patient is improving."], [1143.13, 1144.5, "Tutor", "Ethylene glycol."], [1144.5, 1150.08, "Tutor", "Recommend dialysis for coma, seizures, or acute kidney injury at KDIGO stage two or three."], [1150.26, 1155.88, "Tutor", "Recommend it for a glycolate above twelve millimoles per litre or an anion gap above twenty-seven."], [1155.88, 1159.48, "Tutor", "Suggest it for an anion gap of twenty-three to twenty-seven."], [1159.48, 1167.48, "Tutor", "If the patient is on fomepizole with an ethylene glycol above fifty millimoles per litre, or an osmolar gap above fifty, dialysis is suggested."], [1167.48, 1170.45, "Tutor", "On ethanol at the same levels, it's recommended."], [1170.45, 1173.1, "Tutor", "Stop when the anion gap is below eighteen."], [1173.1, 1175.59, "Tutor", "Notice what that means for the bedside."], [1175.59, 1181.32, "Tutor", "With fomepizole on board and good kidneys, a high ethylene glycol level alone may not need dialysis."], [1181.32, 1184.02, "Tutor", "The acid and the kidney drive the decision."], [1184.42, 1189.17, "Tutor", "A word on salicylate, because it's in GOLD MARK and it shows up as a mixed gas."], [1189.17, 1194.74, "Tutor", "Salicylate stimulates the respiratory centre directly and uncouples oxidative phosphorylation."], [1194.74, 1199.7, "Tutor", "So the classic adult gas is a respiratory alkalosis with a high anion gap acidosis."], [1199.7, 1206.47, "Tutor", "When you see a carbon dioxide well below the Winters' prediction with a high gap, salicylate should be on your list."], [1206.47, 1211.77, "Tutor", "And the cardiac link this week: in cardiac arrest, routine bicarbonate isn't recommended."], [1211.77, 1215.1, "Tutor", "Keep it for hyperkalaemia and for tricyclic toxicity."], [1215.5, 1217.92, "Tutor", "Where do candidates lose marks?"], [1217.92, 1222.19, "Tutor", "From the examiner comments and your own scripts, four places."], [1222.19, 1222.94, "Tutor", "One."], [1222.94, 1224.42, "Tutor", "Not calculating."], [1224.42, 1229.07, "Tutor", "Writing high anion gap metabolic acidosis with no number beside it."], [1229.07, 1229.81, "Tutor", "Two."], [1229.81, 1233.59, "Tutor", "Not correcting the gap for albumin in an ICU patient."], [1233.59, 1234.46, "Tutor", "Three."], [1234.46, 1237.25, "Tutor", "Naming a category instead of a cause."], [1237.25, 1242.39, "Tutor", "Toxic alcohol earns less than ethylene glycol, with the reason in the data."], [1242.39, 1251.63, "Tutor", "In the 2020 second-sitting question, which you scored five and a half on, ethylene glycol and the glycolate mechanism were the missing marks."], [1251.63, 1252.43, "Tutor", "Four."], [1252.43, 1255.16, "Tutor", "Leaving the compensation unexamined."], [1255.16, 1261.66, "Tutor", "An inadequate or excessive respiratory response is a second diagnosis, and a second set of marks."], [1261.66, 1263.77, "Tutor", "Three numbers to remember."], [1263.77, 1269.78, "Tutor", "Expected carbon dioxide: one and a half times bicarbonate, plus eight, plus or minus two."], [1269.78, 1274.31, "Tutor", "Albumin correction: add a quarter per gram per litre below forty."], [1274.31, 1279.82, "Tutor", "And EXTRIP for ethylene glycol: dialyse when the anion gap is above twenty-seven."], [1279.82, 1283.85, "Tutor", "So, the woman at the start, with the bicarbonate of five."], [1283.85, 1285.71, "Tutor", "Pyroglutamic acidosis."], [1285.71, 1289.98, "Tutor", "Paracetamol opened the tap, flucloxacillin blocked the drain."], [1289.98, 1294.26, "Tutor", "Stop both, feed her, treat the sepsis, give N-acetylcysteine."], [1295.66, 1299.75, "Tutor", "Here's a question that has divided intensivists for fifty years."], [1299.75, 1302.71, "Tutor", "If the blood is acid, should we give alkali?"], [1302.71, 1304.64, "Tutor", "The case for is intuitive."], [1304.64, 1311.63, "Tutor", "Severe acidaemia depresses myocardial contractility, blunts the response to catecholamines, and causes arrhythmias."], [1311.63, 1314.02, "Tutor", "The case against is physiological."], [1314.02, 1317.77, "Tutor", "Bicarbonate buffers hydrogen ion by making carbon dioxide."], [1317.77, 1326.58, "Tutor", "Carbon dioxide crosses cell membranes faster than bicarbonate does, so in a patient who can't ventilate it off, intracellular pH can actually fall."], [1326.58, 1331.07, "Tutor", "Bicarbonate also lowers ionised calcium, loads sodium, and adds volume."], [1331.07, 1338.35, "Tutor", "Eight point four percent bicarbonate is one millimole per millilitre and roughly two thousand milliosmoles per kilogram."], [1338.35, 1342.32, "Tutor", "For decades, the argument ran on physiology and small studies."], [1342.32, 1344.54, "Tutor", "Then the French ran two trials."], [1344.94, 1345.97, "Tutor", "BICAR-ICU."], [1345.97, 1348.66, "Tutor", "Jaber and colleagues, the Lancet, 2018."], [1348.66, 1350.43, "Tutor", "Twenty-six French ICUs."], [1350.43, 1367.24, "Tutor", "Three hundred and eighty-nine adults within forty-eight hours of admission with severe metabolic acidaemia: pH seven point two or lower, carbon dioxide forty-five millimetres of mercury or lower, bicarbonate twenty or lower, and a SOFA score of four or more or a lactate of two or more."], [1367.24, 1371.76, "Tutor", "Patients with gastrointestinal or renal bicarbonate loss were excluded."], [1371.76, 1374.5, "Tutor", "This was about acid gain, mostly lactic."], [1374.5, 1389.77, "Tutor", "The intervention was four point two percent sodium bicarbonate, one hundred and twenty-five to two hundred and fifty millilitres over thirty minutes, repeated to keep the pH above seven point three, up to a thousand millilitres in the first twenty-four hours."], [1389.77, 1391.99, "Tutor", "The control was no bicarbonate."], [1391.99, 1398.57, "Tutor", "The primary outcome was a composite: death by day twenty-eight, or at least one organ failure at day seven."], [1398.57, 1404.29, "Tutor", "It occurred in sixty-six percent with bicarbonate, against seventy-one percent with control."], [1404.29, 1405.66, "Tutor", "Not significant."], [1405.84, 1419.4, "Tutor", "But in the prespecified stratum with acute kidney injury, AKIN stage two or three, around one hundred and eighty patients, day twenty-eight survival was fifty-four percent with bicarbonate against thirty-seven percent with control."], [1419.4, 1424.28, "Tutor", "Overall, renal replacement therapy fell from fifty-two to thirty-five percent."], [1424.28, 1433.19, "Tutor", "The harms were what physiology predicts: more metabolic alkalosis, hypernatraemia and hypocalcaemia, with no life-threatening complications reported."], [1433.19, 1442.04, "Tutor", "The criticisms: open label, no placebo infusion, about a quarter of controls received bicarbonate anyway, and the striking result was in a subgroup."], [1442.04, 1444.88, "Tutor", "A subgroup is a hypothesis, not an answer."], [1445.28, 1448.03, "Tutor", "And that hypothesis was tested directly."], [1448.03, 1449.11, "Tutor", "BICARICU-2."], [1449.11, 1451.4, "Tutor", "Jung and colleagues, JAMA, 2025."], [1451.4, 1453.23, "Tutor", "Forty-three French ICUs."], [1453.23, 1458.33, "Tutor", "Six hundred and forty patients randomised, six hundred and twenty-seven analysed."], [1458.33, 1468.11, "Tutor", "The same acidaemia criteria, confirmed on two gases at least thirty minutes apart, and this time everyone had to have KDIGO stage two or three acute kidney injury."], [1468.11, 1474.12, "Tutor", "Ketoacidosis, gastrointestinal bicarbonate loss and an immediate need for dialysis were excluded."], [1474.12, 1478.24, "Tutor", "Same bicarbonate regimen, to a pH of at least seven point three."], [1478.24, 1481.28, "Tutor", "The primary outcome was ninety-day mortality."], [1481.28, 1487.0, "Tutor", "Sixty-two point one percent with bicarbonate, sixty-one point seven percent with usual care."], [1487.0, 1495.35, "Tutor", "A difference of zero point four percentage points, ninety-five percent confidence interval minus seven point two to plus eight point zero."], [1495.35, 1496.78, "Tutor", "No signal at all."], [1496.78, 1503.54, "Tutor", "Kidney replacement therapy, a secondary outcome, fell from fifty point two to thirty-four point seven percent."], [1503.54, 1505.54, "Tutor", "The criticisms matter here."], [1505.54, 1507.03, "Tutor", "It was open label."], [1507.03, 1516.64, "Tutor", "Clinicians decided when to start dialysis, and severe acidaemia is itself a dialysis criterion, so correcting the pH may simply have removed one reason to dial."], [1516.82, 1524.06, "Tutor", "The trial assumed a control mortality of eighty percent; it was about sixty-two, so it was underpowered for a modest effect."], [1524.06, 1527.9, "Tutor", "And fifteen percent of the control group received bicarbonate."], [1527.9, 1532.07, "Tutor", "There's a lesson in that sequence that goes well beyond bicarbonate."], [1532.07, 1538.6, "Tutor", "A striking subgroup in a neutral trial, tested in a trial of its own, and the effect shrinking towards nothing."], [1538.6, 1546.83, "Tutor", "Tight glucose control and early goal-directed therapy followed a similar arc, though they began as single-centre trials rather than subgroups."], [1546.83, 1553.41, "Tutor", "When an examiner asks you to appraise a subgroup finding, this pair is the cleanest modern example you can give."], [1553.41, 1554.56, "Tutor", "What changed?"], [1554.56, 1558.18, "Tutor", "The BICAR-ICU subgroup mortality benefit didn't replicate."], [1558.18, 1562.9, "Tutor", "What survives is a reduction in dialysis that may be partly a design artefact."], [1563.3, 1568.25, "Tutor", "What was BICARICU-2's primary outcome, and what was the result?"], [1568.25, 1570.06, "Tutor", "Pause, and answer."], [1575.46, 1577.68, "Tutor", "Ninety-day all-cause mortality."], [1577.68, 1581.38, "Tutor", "Sixty-two point one versus sixty-one point seven percent."], [1581.38, 1582.63, "Tutor", "No difference."], [1582.63, 1585.58, "Tutor", "The guideline sits just behind the evidence."], [1585.58, 1593.83, "Tutor", "The Surviving Sepsis Campaign's 2026 guideline, Prescott and colleagues in Critical Care Medicine, keeps two conditional recommendations."], [1593.83, 1601.22, "Tutor", "It suggests against bicarbonate to improve haemodynamics or reduce vasopressors in hypoperfusion-induced lactic acidaemia."], [1601.22, 1610.55, "Tutor", "And it suggests bicarbonate in septic shock with a pH of seven point two or lower and AKIN stage two or three kidney injury, on very low certainty evidence."], [1610.55, 1612.88, "Tutor", "Here's how to quote it in an SAQ."], [1612.88, 1631.08, "Tutor", "One sentence: bicarbonate in severe metabolic acidaemia doesn't reduce mortality, BICAR-ICU 2018 and BICARICU-2 2025, but may reduce the need for dialysis in patients with acute kidney injury, so I'd consider it at a pH of seven point two or lower with stage two or three kidney injury, while treating the cause."], [1631.08, 1636.2, "Tutor", "And in pyroglutamic or toxic alcohol acidosis, the cause has a specific treatment."], [1636.2, 1637.9, "Tutor", "Bicarbonate buys time."], [1637.9, 1640.18, "Tutor", "It doesn't replace the antidote."], [1641.58, 1645.47, "Examiner", "This is from the 2020 second sitting, question twenty, part two."], [1645.47, 1651.9, "Examiner", "The College didn't publish an answer or comments for it, so the marking points are the accepted interpretation."], [1651.9, 1653.63, "Examiner", "I'll read it as written."], [1653.63, 1657.41, "Examiner", "A 44-year-old male presents following an intentional overdose."], [1657.41, 1660.28, "Examiner", "His arterial blood gases are presented below."], [1660.28, 1662.33, "Examiner", "F I O two, zero point two one."], [1662.33, 1664.17, "Examiner", "pH, seven point three six."], [1664.17, 1667.73, "Examiner", "Reference seven point three five to seven point four five."], [1667.73, 1673.19, "Examiner", "P C O two, sixteen point zero millimetres of mercury, that's two point one three kilopascals."], [1673.19, 1675.57, "Examiner", "Reference thirty-five to forty-five."], [1675.57, 1680.81, "Examiner", "P O two, one hundred and eleven millimetres of mercury, fourteen point eight kilopascals."], [1680.81, 1682.97, "Examiner", "S P O two, ninety-seven percent."], [1682.97, 1686.11, "Examiner", "Bicarbonate, nine point zero millimoles per litre."], [1686.11, 1688.43, "Examiner", "Reference twenty-two to twenty-six."], [1688.43, 1692.05, "Examiner", "Base excess, minus fifteen point zero millimoles per litre."], [1692.05, 1694.21, "Examiner", "Reference minus two to plus two."], [1694.21, 1697.51, "Examiner", "Lactate, twenty-five point zero millimoles per litre."], [1697.51, 1700.27, "Examiner", "Reference zero point five to one point six."], [1700.27, 1703.45, "Examiner", "Sodium, one hundred and fifty millimoles per litre."], [1703.45, 1707.56, "Examiner", "Reference one hundred and thirty-five to one hundred and forty-five."], [1707.56, 1710.59, "Examiner", "Potassium, four point five millimoles per litre."], [1710.59, 1714.1, "Examiner", "Chloride, one hundred and seventeen millimoles per litre."], [1714.28, 1717.21, "Examiner", "Reference ninety-five to one hundred and five."], [1717.21, 1720.14, "Examiner", "Glucose, four point zero millimoles per litre."], [1720.14, 1720.95, "Examiner", "Part a."], [1720.95, 1723.39, "Examiner", "Describe the acid base abnormalities."], [1723.39, 1725.08, "Examiner", "Forty percent of marks."], [1725.08, 1735.65, "Examiner", "His lactate as measured on ABG is 25 millimoles per litre, but the result on a venous blood sample taken at the same time and measured in the laboratory is only five millimoles per litre."], [1735.65, 1736.47, "Examiner", "Part b."], [1736.47, 1738.75, "Examiner", "What is the most likely diagnosis?"], [1738.75, 1742.54, "Examiner", "Explain the mechanism of the differences in measured lactates."], [1742.54, 1744.28, "Examiner", "Twenty percent of marks."], [1745.18, 1747.33, "Tutor", "Before the candidate answers."], [1747.33, 1752.03, "Tutor", "Calculate the anion gap, the expected carbon dioxide and the delta ratio."], [1752.03, 1753.54, "Tutor", "Pause, and answer."], [1758.94, 1762.59, "Tutor", "The gap is one hundred and fifty minus one hundred and twenty-six."], [1762.59, 1763.57, "Tutor", "Twenty-four."], [1763.57, 1768.4, "Tutor", "The expected carbon dioxide is one and a half times nine, thirteen and a half, plus eight."], [1768.4, 1772.94, "Tutor", "Twenty-one and a half, so a range of nineteen and a half to twenty-three and a half."], [1772.94, 1775.25, "Tutor", "The delta ratio is twelve over fifteen."], [1775.25, 1776.48, "Tutor", "Zero point eight."], [1776.48, 1779.54, "Tutor", "Hold those, and listen to how the candidate uses them."], [1780.44, 1781.17, "Candidate", "Okay."], [1781.17, 1787.31, "Candidate", "The pH is seven point three six, so it's just within normal, but there's a severe metabolic acidosis."], [1787.31, 1790.24, "Candidate", "Bicarbonate nine, base excess minus fifteen."], [1790.24, 1792.1, "Candidate", "There's a high anion gap."], [1792.1, 1795.03, "Candidate", "The gap is twenty-four, so raised by twelve."], [1795.03, 1799.6, "Candidate", "That's from the lactate of twenty-five, so it's a severe lactic acidosis."], [1799.6, 1807.14, "Candidate", "The chloride is high at one hundred and seventeen, and the sodium is high at one hundred and fifty, so there's hypernatraemia."], [1807.14, 1810.86, "Candidate", "The near-normal pH is because of respiratory compensation."], [1810.86, 1813.68, "Candidate", "The carbon dioxide is very low at sixteen."], [1814.18, 1817.02, "Examiner", "You said the pH is normal because of compensation."], [1817.02, 1819.9, "Examiner", "Does compensation ever bring the pH back to normal?"], [1820.4, 1821.01, "Candidate", "No."], [1821.01, 1823.38, "Candidate", "Compensation doesn't fully correct."], [1823.38, 1826.52, "Candidate", "So if the pH is normal, there's a second
