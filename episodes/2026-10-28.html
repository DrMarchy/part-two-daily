<script>
var C=[[0.0, 1.81, "Tutor", "Welcome to Part Two Daily."], [1.81, 5.6, "Tutor", "This is the episode for Wednesday the twenty-eighth of October."], [5.6, 11.47, "Tutor", "Today is a light, reading-only day, so I've picked a topic that runs underneath half the paper: shock."], [11.47, 17.28, "Tutor", "What it is, how you classify it, and how a handful of numbers tells you which kind you're looking at."], [17.28, 25.76, "Tutor", "Get this framework solid and it pays off in cardiac questions, sepsis questions, trauma, and almost every haemodynamic data set the examiners give you."], [26.16, 29.97, "Tutor", "Start with the definition, because candidates lose easy marks here."], [29.97, 31.65, "Tutor", "Shock is not hypotension."], [31.65, 41.15, "Tutor", "Shock is a life-threatening, generalised failure of the circulation, in which oxygen delivery is inadequate for the cells' needs, or the cells cannot use the oxygen they're given."], [41.15, 43.13, "Tutor", "The result is cellular dysoxia."], [43.13, 50.95, "Tutor", "That's the wording of the European Society of Intensive Care Medicine consensus from 2014, and the key point is that blood pressure can be normal."], [50.95, 58.12, "Tutor", "A young patient can hold a mean arterial pressure of 75 by clamping down their peripheries while their gut and kidneys are ischaemic."], [58.12, 66.96, "Tutor", "So when an examiner asks you to define shock, say inadequate oxygen delivery or utilisation at the tissue level, then say that hypotension is common but not required."], [67.36, 70.74, "Tutor", "Now the physiology you need to hang everything on."], [70.74, 75.41, "Tutor", "Oxygen delivery is cardiac output multiplied by arterial oxygen content."], [75.41, 86.25, "Tutor", "Arterial oxygen content is 1.34 times the haemoglobin, times the saturation, plus a small dissolved fraction of 0.003 times the arterial oxygen tension in millimetres of mercury."], [86.25, 96.45, "Tutor", "In a healthy adult, delivery is around 1000 millilitres of oxygen per minute and consumption is around 250, so the tissues extract about a quarter of what's delivered."], [96.45, 101.17, "Tutor", "That's why mixed venous saturation normally sits around 65 to 75 percent."], [101.17, 106.36, "Tutor", "When delivery falls, the tissues extract more, and mixed venous saturation drops."], [106.36, 116.8, "Tutor", "Below a critical delivery threshold, extraction can't rise any further, consumption becomes supply dependent, the cells switch to anaerobic metabolism, and lactate climbs."], [117.2, 121.22, "Tutor", "The other relationship is pressure equals flow times resistance."], [121.22, 127.81, "Tutor", "Mean arterial pressure minus central venous pressure equals cardiac output times systemic vascular resistance."], [127.81, 136.36, "Tutor", "Rearranged, systemic vascular resistance is 80 times the mean arterial pressure minus the central venous pressure, divided by the cardiac output."], [136.36, 140.83, "Tutor", "Normal is roughly 800 to 1200 dynes seconds per centimetre to the fifth."], [140.83, 148.04, "Tutor", "Learn to do that sum quickly, with the units, because data questions give you the numbers and expect you to calculate it."], [148.44, 149.96, "Tutor", "So, classification."], [149.96, 155.54, "Tutor", "The classic scheme is Weil and Shubin's, from 1971, and it's still what the examiners want."], [155.54, 156.89, "Tutor", "Four mechanisms."], [156.89, 160.38, "Tutor", "First, hypovolaemic: not enough volume in the circuit."], [160.38, 162.86, "Tutor", "Second, cardiogenic: the pump fails."], [162.86, 167.08, "Tutor", "Third, obstructive: something blocks flow into or out of the heart."], [167.08, 171.59, "Tutor", "Fourth, distributive: the vessels lose tone and blood is maldistributed."], [171.59, 181.44, "Tutor", "Many people add a fifth, cytotoxic or dissociative shock, where delivery is adequate but the mitochondria can't use oxygen, as in cyanide or carbon monoxide poisoning."], [181.44, 184.26, "Tutor", "And always say that mixed shock is common."], [184.26, 190.4, "Tutor", "The septic patient is often hypovolaemic before resuscitation and may have septic cardiomyopathy too."], [190.8, 193.56, "Tutor", "Give the examiners some sense of scale."], [193.56, 207.86, "Tutor", "In the SOAP Two trial of nearly 1700 patients with shock, about 62 percent had septic shock, about 16 percent cardiogenic, about 16 percent hypovolaemic, around 4 percent other distributive causes, and only about 2 percent obstructive."], [207.86, 216.16, "Tutor", "So in your ICU, distributive shock from sepsis dominates, but obstructive shock is the one you can fix in minutes if you think of it."], [216.56, 221.78, "Tutor", "Now the haemodynamic pattern for each, which is the part that gets tabulated in a written answer."], [221.78, 232.06, "Tutor", "On paper you'd draw a table with the shock types down the side, and across the top: central venous pressure, wedge pressure, cardiac output, systemic vascular resistance, and mixed venous saturation."], [232.06, 233.8, "Tutor", "I'll talk through each row."], [234.2, 235.77, "Tutor", "Hypovolaemic shock."], [235.77, 240.55, "Tutor", "Filling pressures are low, both the central venous pressure and the wedge."], [240.55, 243.93, "Tutor", "Cardiac output is low, because there's no preload."], [243.93, 248.3, "Tutor", "Vascular resistance is high, as the sympathetic system clamps down."], [248.3, 252.44, "Tutor", "Mixed venous saturation is low, because extraction has gone up."], [252.44, 266.08, "Tutor", "Divide the causes into haemorrhagic, such as trauma, gastrointestinal bleeding and ruptured aneurysm, and non-haemorrhagic, such as vomiting and diarrhoea, burns, diabetic ketoacidosis and losses into the gut lumen or tissues."], [266.48, 267.99, "Tutor", "Cardiogenic shock."], [267.99, 272.86, "Tutor", "Here the filling pressures are high, particularly the wedge, often above 18."], [272.86, 274.6, "Tutor", "Cardiac output is low."], [274.6, 282.19, "Tutor", "The trial definitions use a cardiac index below 2.2 litres per minute per square metre on support, or below 1.8 without it."], [282.19, 285.78, "Tutor", "Resistance is high and mixed venous saturation is low."], [285.78, 298.77, "Tutor", "The commonest cause is acute myocardial infarction with left ventricular failure, but list the others: myocarditis, acute valve lesions, arrhythmias, post-cardiotomy stunning, Takotsubo, and end-stage cardiomyopathy."], [298.77, 302.25, "Tutor", "One variant to know is right ventricular infarction."], [302.25, 310.31, "Tutor", "The central venous pressure is high, but the wedge is normal or low, and the right atrial pressure approaches or exceeds the wedge."], [310.31, 314.25, "Tutor", "Those patients need preload and an adequate rate and rhythm."], [314.25, 316.16, "Tutor", "Nitrates make them worse."], [316.56, 318.0, "Tutor", "Obstructive shock."], [318.0, 324.18, "Tutor", "Cardiac output is low and resistance is high, so it looks like cardiogenic shock from the arterial side."], [324.18, 327.76, "Tutor", "The filling pressures depend on where the obstruction is."], [327.76, 330.8, "Tutor", "In tamponade, the diastolic pressures equalise."], [330.8, 341.34, "Tutor", "Central venous pressure, right ventricular diastolic pressure and wedge all sit within about 5 millimetres of mercury of each other, and you may find pulsus paradoxus greater than 10."], [341.34, 349.45, "Tutor", "In massive pulmonary embolism, the central venous pressure is high, the wedge is normal or low, and the right ventricle is dilated on echo."], [349.45, 354.81, "Tutor", "In tension pneumothorax, venous return is impaired and the central venous pressure rises."], [354.81, 363.36, "Tutor", "The key exam point is that all three are fixed by a procedure rather than a drug: pericardial drainage, thrombolysis or embolectomy, decompression."], [363.76, 366.38, "Tutor", "Distributive shock is the odd one out."], [366.38, 367.87, "Tutor", "Resistance is low."], [367.87, 374.31, "Tutor", "Cardiac output is normal or high once the patient has had fluid, and filling pressures are low to normal."], [374.31, 377.16, "Tutor", "Mixed venous saturation is normal or high."], [377.16, 382.58, "Tutor", "That's the trap: a high venous saturation doesn't mean the tissues are well oxygenated."], [382.58, 390.33, "Tutor", "In sepsis, microcirculatory shunting and mitochondrial dysfunction mean oxygen isn't extracted, and lactate can still be rising."], [390.33, 398.32, "Tutor", "Causes are sepsis, anaphylaxis, neurogenic shock, adrenal crisis, liver failure, vasoplegia after cardiopulmonary bypass, and drugs."], [398.32, 407.84, "Tutor", "For neurogenic shock, say high spinal cord injury, above about T6, with hypotension, bradycardia and warm peripheries, because the sympathetic outflow is lost."], [408.24, 413.14, "Tutor", "While we're on sepsis, have the Sepsis-3 definition of septic shock word perfect."], [413.14, 422.88, "Tutor", "It's sepsis requiring a vasopressor to keep the mean arterial pressure at 65 or above, with a lactate above 2 millimoles per litre, despite adequate fluid resuscitation."], [422.88, 426.68, "Tutor", "Hospital mortality with that combination is above 40 percent."], [427.08, 434.7, "Tutor", "Now the second part of today's reading: the bedside signs of hypoperfusion, and their limits in a sedated, ventilated patient."], [434.7, 436.46, "Tutor", "Think of three windows."], [436.46, 438.91, "Tutor", "The brain, the kidney and the skin."], [438.91, 444.08, "Tutor", "The brain window is mental state, and in a sedated patient it's essentially closed."], [444.08, 449.09, "Tutor", "The kidney window is urine output below half a millilitre per kilogram per hour."], [449.09, 455.17, "Tutor", "It lags, and it's confounded by diuretics, established acute kidney injury, and a blocked catheter."], [455.17, 458.7, "Tutor", "The skin window is capillary refill time and mottling."], [458.7, 465.63, "Tutor", "Capillary refill is normal at 3 seconds or less, measured by firm pressure on the fingertip for about ten seconds."], [465.63, 470.13, "Tutor", "Mottling can be scored from 0 to 5 by how far it spreads from the knee."], [470.13, 477.52, "Tutor", "Both are confounded by vasopressors, hypothermia, peripheral vascular disease, and they are harder to read on darker skin."], [477.92, 479.32, "Tutor", "Know the trial."], [479.32, 488.84, "Tutor", "ANDROMEDA-SHOCK randomised 424 patients with septic shock to resuscitation targeting a normal capillary refill time, or targeting lactate clearance."], [488.84, 496.15, "Tutor", "Twenty-eight day mortality was 34.9 percent in the capillary refill group and 43.4 percent in the lactate group."], [496.15, 504.75, "Tutor", "That wasn't statistically significant, with a p value of 0.06, but the capillary refill group had less organ dysfunction at 72 hours."], [504.75, 513.72, "Tutor", "The message for the exam is that peripheral perfusion is a valid, fast, cheap target, and it responds within minutes, whereas lactate lags."], [514.12, 515.92, "Tutor", "Lactate itself has limits."], [515.92, 519.69, "Tutor", "It's a marker of stress and of clearance as much as of hypoxia."], [519.69, 523.51, "Tutor", "Adrenaline and salbutamol raise it through beta-two stimulation."], [523.51, 525.75, "Tutor", "Liver failure slows its clearance."], [525.75, 529.78, "Tutor", "Metformin and other type B causes raise it without any shock at all."], [529.78, 532.27, "Tutor", "So use the trend, not the single value."], [532.27, 534.77, "Tutor", "Two more flow markers are worth naming."], [534.77, 539.39, "Tutor", "Central venous oxygen saturation below 70 percent suggests inadequate delivery."], [539.39, 547.72, "Tutor", "A venous-to-arterial carbon dioxide gap greater than 6 millimetres of mercury suggests inadequate flow, even when the venous saturation looks normal."], [548.12, 549.74, "Tutor", "And blood pressure."], [549.74, 553.81, "Tutor", "The usual starting target is a mean arterial pressure of 65."], [553.81, 565.32, "Tutor", "In SEPSISPAM, targeting 80 to 85 rather than 65 to 70 made no difference to mortality, but chronically hypertensive patients needed less renal replacement therapy at the higher target."], [565.32, 569.39, "Tutor", "There was more atrial fibrillation in the high-target group."], [569.39, 576.52, "Tutor", "So individualise: 65 as the default, higher in a patient with long-standing hypertension who is oliguric at 65."], [576.92, 581.79, "Tutor", "Finally, the fastest test that separates the four mechanisms at the bedside is echo."], [581.79, 591.85, "Tutor", "In about two minutes you can look at left ventricular function, right ventricular size, any pericardial effusion, and the stroke volume from the outflow tract velocity time integral."], [591.85, 596.83, "Tutor", "Normal is around 18 to 22 centimetres, and below about 10 is a very low stroke volume."], [596.83, 601.33, "Tutor", "Echo turns a guess into a mechanism, and the mechanism decides the treatment."], [601.33, 603.02, "Tutor", "Volume for hypovolaemia."], [603.02, 607.74, "Tutor", "Inotropy, revascularisation and possibly mechanical support for the failing pump."], [607.74, 609.43, "Tutor", "Relieve the obstruction."], [609.43, 611.76, "Tutor", "Restore tone for distributive shock."], [612.16, 614.55, "Tutor", "Here's your recap, three numbers."], [614.55, 621.03, "Tutor", "One: about six in ten shocked ICU patients are septic, and only about two in a hundred are obstructive."], [621.03, 631.18, "Tutor", "Two: a capillary refill time over 3 seconds is abnormal, and ANDROMEDA-SHOCK found 35 versus 43 percent mortality, which was not significant but points the right way."], [631.18, 641.68, "Tutor", "Three: in cardiogenic shock, a cardiac index under 2.2 on support with a wedge above 18, while distributive shock has low resistance and a normal or high venous saturation."], [641.68, 645.12, "Tutor", "Now let's hear how this sounds under exam pressure."], [646.52, 647.86, "Examiner", "Good morning."], [647.86, 650.87, "Examiner", "This is a data interpretation question."], [650.87, 661.74, "Examiner", "A 64-year-old man is in intensive care, two days after an anterior ST elevation myocardial infarction treated with a stent to the left anterior descending artery."], [661.74, 664.75, "Examiner", "He has become hypotensive and confused."], [664.75, 668.07, "Examiner", "He has a pulmonary artery catheter in place."], [668.07, 671.01, "Examiner", "His heart rate is 118 in sinus rhythm."], [671.01, 673.96, "Examiner", "Blood pressure is 88 over 58, mean 68."], [673.96, 676.2, "Examiner", "Central venous pressure 14."], [676.2, 678.95, "Examiner", "Pulmonary artery wedge pressure 26."], [678.95, 683.04, "Examiner", "Cardiac output 3.2 litres per minute, cardiac index 1.7."], [683.04, 685.79, "Examiner", "Mixed venous saturation 48 percent."], [685.79, 687.07, "Examiner", "Lactate 5.2."], [687.07, 692.12, "Examiner", "First, what type of shock is this, and how do the numbers support that?"], [692.62, 694.57, "Candidate", "This is cardiogenic shock."], [694.57, 698.01, "Candidate", "The cardiac index is low at 1.7, which is below 2.2."], [698.01, 705.17, "Candidate", "The wedge pressure is high at 26, so the left ventricle is failing with a high filling pressure, not short of volume."], [705.17, 712.79, "Candidate", "The mixed venous saturation is low at 48 percent, which means the tissues are extracting a lot of oxygen because flow is low."], [712.79, 716.12, "Candidate", "And the lactate of 5.2 shows tissue hypoperfusion."], [716.12, 719.9, "Candidate", "He's also confused, which fits hypoperfusion of the brain."], [720.4, 723.12, "Examiner", "Calculate his systemic vascular resistance."], [723.62, 731.48, "Candidate", "It's 80 times the mean arterial pressure minus the central venous pressure, divided by cardiac output."], [731.48, 737.55, "Candidate", "So 80 times 68 minus 14, which is 80 times 54, which is 4320, divided by 3.2."], [737.55, 742.26, "Candidate", "That gives 1350 dynes seconds per centimetre to the fifth."], [742.26, 748.26, "Candidate", "That's high, which fits compensatory vasoconstriction in a low-output state."], [748.76, 749.36, "Examiner", "Good."], [749.36, 751.16, "Examiner", "It's day two after his infarct."], [751.16, 754.8, "Examiner", "What specific causes of this deterioration would you look for, and how?"], [755.3, 764.24, "Candidate", "I'd think about extension of the infarct or stent thrombosis, so a twelve-lead ECG and troponin, and discuss urgent repeat angiography with cardiology."], [764.24, 766.6, "Candidate", "Then the mechanical complications."], [766.6, 777.45, "Candidate", "A ventricular septal rupture, which would cause a new harsh systolic murmur and a step-up in oxygen saturation between the right atrium and the pulmonary artery on the catheter samples."], [777.45, 784.87, "Candidate", "Acute mitral regurgitation from papillary muscle rupture, with large v waves on the wedge trace and a flail leaflet on echo."], [784.87, 792.06, "Candidate", "I'd also check for arrhythmias, and right ventricular involvement, although that's less likely with an anterior infarct."], [792.56, 795.46, "Examiner", "You've missed one mechanical complication that kills quickly."], [795.46, 797.52, "Examiner", "What else would you look for on the echo?"], [798.02, 801.63, "Candidate", "Free wall rupture, with haemopericardium and tamponade."], [801.63, 807.99, "Candidate", "On echo I'd look for a pericardial effusion with right atrial and right ventricular diastolic collapse."], [807.99, 812.17, "Candidate", "On the catheter, the diastolic pressures would start to equalise."], [812.17, 816.7, "Candidate", "That needs emergency surgery, with pericardiocentesis only as a bridge."], [817.2, 818.86, "Examiner", "Second data set."], [818.86, 826.97, "Examiner", "Four days later he's ventilated, febrile at 38.9, on noradrenaline at 0.3 micrograms per kilogram per minute."], [826.97, 828.56, "Examiner", "Heart rate 110."], [828.56, 830.92, "Examiner", "Mean arterial pressure 58."], [830.92, 833.34, "Examiner", "Central venous pressure 10."], [833.34, 834.52, "Examiner", "Wedge 12."], [834.52, 836.32, "Examiner", "Cardiac index 4.2."], [836.32, 839.3, "Examiner", "Mixed venous saturation 78 percent."], [839.3, 840.69, "Examiner", "Lactate 3.8."], [840.69, 842.28, "Examiner", "Interpret this."], [842.78, 846.08, "Candidate", "This is now distributive shock, most likely septic."], [846.08, 856.33, "Candidate", "The cardiac index has risen to 4.2, the filling pressures are normal, and he's hypotensive despite a significant dose of noradrenaline, so his vascular resistance must be low."], [856.33, 859.58, "Candidate", "The mixed venous saturation is high at 78 percent."], [859.58, 862.66, "Candidate", "That fits impaired oxygen extraction in sepsis."], [862.66, 867.59, "Candidate", "It doesn't mean his tissues are well perfused, because the lactate is still 3.8."], [867.59, 873.24, "Candidate", "Likely sources are ventilator-associated pneumonia, a line infection, or the catheter itself."], [873.24, 880.86, "Candidate", "I'd culture, remove or change the lines, start broad-spectrum antibiotics, and add vasopressin to reduce the noradrenaline dose."], [881.36, 882.29, "Examiner", "Thank you."], [882.29, 884.36, "Examiner", "Here's how that would be marked."], [884.36, 892.2, "Examiner", "Marks come for naming cardiogenic shock and justifying it with three numbers: the low index, the high wedge and the low mixed venous saturation."], [892.2, 895.35, "Examiner", "Then the resistance calculated correctly, with units."], [895.35, 904.39, "Examiner", "Then the causes in an orderly list, each with the test that confirms it: re-infarction, septal rupture, papillary muscle rupture, and free wall rupture with tamponade."], [904.39, 914.1, "Examiner", "In the second set, marks come for distributive shock, with low resistance inferred from the data, and for saying that a high mixed venous saturation doesn't exclude tissue hypoxia."], [914.1, 917.09, "Examiner", "You missed free wall rupture until I prompted you."], [917.09, 920.66, "Examiner", "In the written paper there's no prompt, so that mark is gone."], [920.66, 924.12, "Examiner", "Overall that's a comfortable pass, around seven out of ten."], [924.12, 930.88, "Examiner", "The one fix is to have the full list of mechanical complications ready as a set, so none of them depends on being reminded."], [932.28, 933.52, "Tutor", "That's the episode."], [933.52, 934.9, "Tutor", "Today is reading only."], [934.9, 942.01, "Tutor", "If you do one active thing, draw the shock table from memory, four rows and five columns, then check it against the shock overview chapter in Oh's."], [942.01, 943.16, "Tutor", "See you tomorrow."]], CH=[{"start": 0.0, "title": "Tutorial: classifying shock"}, {"start": 646.52, "title": "Exam practice: cardiogenic vs septic shock"}, {"start": 932.28, "title": "Close"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
