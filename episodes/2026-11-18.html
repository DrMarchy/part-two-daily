var C=[[0.0, 1.82, "Tutor", "Welcome to Part Two Daily."], [1.82, 8.56, "Tutor", "It's Wednesday the eighteenth of November, one hundred and twelve days to the written exam, and this is the deep dive."], [8.56, 15.83, "Tutor", "Cardiac week continues, and today we go deep on one of the College's favourite questions: what happens after the heart restarts."], [15.83, 26.36, "Tutor", "Specifically, how you predict neurological outcome in the patient who is still comatose after an out-of-hospital cardiac arrest, and how you look after the brain while you wait to find out."], [26.36, 28.18, "Tutor", "Here is the running order."], [28.18, 38.88, "Tutor", "First, a tutorial: the post cardiac arrest syndrome, the 2025 European Resuscitation Council and European Society of Intensive Care Medicine guideline, and every prognostic test with its trap."], [38.88, 42.57, "Tutor", "Along the way, the strange career of therapeutic hypothermia."], [42.57, 44.6, "Tutor", "Second, three landmark trials."], [44.6, 49.84, "Tutor", "Third, exam practice on the 2024 first sitting question, with an examiner and a candidate."], [51.24, 52.27, "Tutor", "Picture it."], [52.27, 53.51, "Tutor", "It's day three."], [53.51, 62.12, "Tutor", "A fifty-eight year old man, out-of-hospital ventricular fibrillation arrest, bystander CPR, return of spontaneous circulation after twenty-two minutes."], [62.12, 64.71, "Tutor", "He's been off sedation for twenty hours."], [64.71, 66.07, "Tutor", "His pupils react."], [66.07, 67.53, "Tutor", "He extends to pain."], [67.53, 72.29, "Tutor", "His wife asks you the only question that matters to her: is he going to wake up?"], [72.29, 76.67, "Tutor", "Everything in today's tutorial is about answering that question honestly."], [76.67, 81.92, "Tutor", "Not too early, not on one test, and not in a way that becomes a self-fulfilling prophecy."], [82.32, 89.67, "Tutor", "Let's start with how the College asks it, because this is one of the most reliably examined themes in the cardiac block."], [89.67, 97.48, "Tutor", "Prognostication after cardiac arrest has appeared as a question seven times since 2011, and four of those were from 2021 onward."], [97.48, 103.0, "Tutor", "Hypothermia after cardiac arrest has been asked twice more on its own, in 2015 and 2021."], [103.0, 105.93, "Tutor", "So, nine questions on one family of themes."], [105.93, 108.0, "Tutor", "The forms are worth knowing."], [108.0, 118.39, "Tutor", "In the 2021 first sitting, question sixteen read simply: List the clinical signs and tests used for neuro-prognostication after cardiac arrest and discuss their limitations."], [118.39, 119.66, "Tutor", "Note the verb."], [119.66, 122.93, "Tutor", "That question wanted limitations, not advantages."], [122.93, 132.46, "Tutor", "In the 2023 second sitting, question two read: Outline the approach to neurological prognostication of a patient post out-of-hospital cardiac arrest, O H C A."], [132.46, 137.58, "Tutor", "Your answer should include the following headings: General principles, two marks."], [137.58, 140.28, "Tutor", "Clinical factors, two and a half marks."], [140.28, 142.46, "Tutor", "Imaging, two and a half marks."], [142.46, 145.1, "Tutor", "Neurophysiological studies, two marks."], [145.1, 146.77, "Tutor", "Biomarkers, one mark."], [146.77, 153.2, "Tutor", "The 2024 first sitting asked it again with a guidelines heading, and we'll do that one in exam practice."], [153.38, 163.2, "Tutor", "And the 2024 second sitting asked a narrower version: the role of early, under twenty-four hours, versus late, over forty-eight hours, CT brain in the same patient group."], [163.2, 167.67, "Tutor", "The commentary on the 2023 question noted two ways candidates lost marks."], [167.67, 171.86, "Tutor", "Some misunderstood the question and wrote about brain death testing."], [171.86, 173.85, "Tutor", "Others gave generic answers."], [173.85, 178.37, "Tutor", "Neurophysiology and biomarkers were generally explored only superficially."], [178.37, 180.85, "Tutor", "Hold on to those three failure modes."], [180.85, 182.62, "Tutor", "They are the whole game."], [183.02, 185.55, "Tutor", "Now the framework the examiners reward."], [185.55, 188.61, "Tutor", "If you get a headed question, use their headings."], [188.61, 196.94, "Tutor", "If you don't, use five of your own: principles, timing and confounders, clinical examination, investigations, and then synthesis and communication."], [196.94, 203.93, "Tutor", "Under each investigation, the examiners want three things: what the finding is, when to do it, and what the limitation is."], [203.93, 206.08, "Tutor", "That makes this a natural table."], [206.08, 210.27, "Tutor", "Three columns: test, poor-outcome finding with timing, and limitation."], [210.27, 217.26, "Tutor", "If you write it as a table, you'll find it very hard to forget the limitation column, and that's where half the marks sit."], [217.66, 219.61, "Tutor", "Before the tests, the disease."], [219.61, 230.19, "Tutor", "Oh's Intensive Care Manual covers this in chapter thirty, Cardiopulmonary resuscitation, in the post-resuscitation care section, with the coma side in chapter fifty-nine, Disorders of consciousness."], [230.19, 233.07, "Tutor", "The post cardiac arrest syndrome has four parts."], [233.07, 236.3, "Tutor", "Here's your first chance to retrieve before I tell you."], [236.3, 239.84, "Tutor", "Name the four components of the post cardiac arrest syndrome."], [239.84, 241.18, "Tutor", "Pause, and answer."], [246.58, 249.21, "Tutor", "First, post cardiac arrest brain injury."], [249.21, 252.44, "Tutor", "Second, post cardiac arrest myocardial dysfunction."], [252.44, 262.31, "Tutor", "Third, the systemic ischaemia-reperfusion response, which looks and behaves a lot like sepsis: vasoplegia, capillary leak, raised lactate, and a temperature that drifts up."], [262.31, 270.81, "Tutor", "And fourth, the persistent precipitating pathology, whether that's an occluded coronary artery, a pulmonary embolus, or a subarachnoid haemorrhage."], [270.81, 275.68, "Tutor", "That fourth one is easy to forget and it's the one that changes management today."], [275.68, 279.3, "Tutor", "So it belongs in any answer about the post-arrest patient."], [279.7, 284.39, "Tutor", "The brain injury is what kills most of these patients after they reach ICU."], [284.39, 286.81, "Tutor", "The mechanism that matters is this."], [286.81, 295.45, "Tutor", "The brain has almost no oxygen reserve, so within seconds of circulatory arrest consciousness is lost, and within a few minutes ATP is exhausted."], [295.45, 301.5, "Tutor", "The ion pumps fail, neurons depolarise, glutamate floods the synapse, and calcium pours into cells."], [301.5, 307.26, "Tutor", "Then reperfusion adds a second hit: free radicals, mitochondrial injury, and patchy no-reflow."], [307.26, 309.12, "Tutor", "The injury isn't uniform."], [309.12, 311.83, "Tutor", "Some neurons are selectively vulnerable."], [311.83, 319.23, "Tutor", "The CA1 region of the hippocampus, the Purkinje cells of the cerebellum, the middle cortical layers, and the basal ganglia."], [319.23, 328.15, "Tutor", "That's why a late MRI shows restricted diffusion in cortex and deep grey matter, and why survivors with moderate injury so often have memory problems."], [328.15, 331.54, "Tutor", "And importantly, the injury keeps evolving for days."], [331.54, 335.77, "Tutor", "Cell death after reperfusion is not finished at the moment of ROSC."], [335.77, 342.66, "Tutor", "That's the biological reason we wait before prognosticating, and the reason fever in the first few days does harm."], [343.06, 350.75, "Tutor", "Which brings me to a story, because the way we manage temperature after cardiac arrest has had one of the strangest careers in intensive care."], [350.75, 359.46, "Tutor", "In the late nineteen fifties, surgeons were already cooling patients for cardiac surgery, and a few small case series tried cooling patients after cardiac arrest."], [359.46, 369.0, "Tutor", "Peter Safar, the Austrian-born anaesthetist in the United States who also championed mouth-to-mouth ventilation and the modern ICU, was a strong advocate in the nineteen sixties."], [369.0, 374.48, "Tutor", "But deep cooling was hard to deliver and hard to manage, and the idea faded for about thirty years."], [374.48, 376.74, "Tutor", "It came back through the laboratory."], [376.74, 386.84, "Tutor", "In the late nineteen eighties and nineteen nineties, Safar's group and others showed in dogs that mild hypothermia, only a few degrees, improved neurological outcome after prolonged arrest."], [386.84, 388.38, "Tutor", "Mild was the key word."], [388.38, 392.12, "Tutor", "You could get the benefit without the worst of the complications."], [392.12, 396.94, "Tutor", "Then in February 2002, the New England Journal published two trials in the same issue."], [396.94, 405.14, "Tutor", "One was from Melbourne, led by Stephen Bernard: seventy-seven patients, allocated by odd and even days, cooled to thirty-three degrees for twelve hours."], [405.32, 410.64, "Tutor", "Good outcome, meaning discharge home or to rehabilitation, was 49 versus 26 percent."], [410.64, 415.15, "Tutor", "The other was the European HACA trial, which we'll take apart shortly."], [415.15, 419.72, "Tutor", "Within a year, therapeutic hypothermia was in international guidelines."], [419.72, 423.24, "Tutor", "An Australian trial had helped change world practice."], [423.24, 424.98, "Tutor", "Then the story turned."], [424.98, 430.47, "Tutor", "In 2013, the TTM trial found no difference between thirty-three and thirty-six degrees."], [430.47, 439.6, "Tutor", "In 2021, TTM2, with about nineteen hundred patients, found no difference between thirty-three degrees and normothermia with active treatment of fever."], [439.6, 442.67, "Tutor", "Six-month mortality was 50 versus 48 percent."], [442.67, 444.75, "Tutor", "So what was the real lesson?"], [444.75, 447.06, "Tutor", "Look at the 2002 control groups."], [447.06, 451.57, "Tutor", "Their temperature wasn't actively controlled, and many became febrile."], [451.57, 458.8, "Tutor", "The likeliest reading of the whole story is that the benefit came mostly from preventing fever, not from cold itself."], [458.8, 465.5, "Tutor", "That's exactly why the 2025 guideline talks about temperature control and fever prevention, not hypothermia."], [465.5, 475.04, "Tutor", "And it's a sentence worth putting in an answer: the early benefit was probably fever avoidance, because the controls in 2002 were not temperature controlled."], [475.44, 477.5, "Tutor", "So, the governing guideline."], [477.5, 489.68, "Tutor", "Today's is the European Resuscitation Council and European Society of Intensive Care Medicine Guidelines 2025: Post-Resuscitation Care, first author Jerry Nolan, published in Resuscitation in October 2025."], [489.68, 502.95, "Tutor", "Australian practice through the Australian and New Zealand Committee on Resuscitation follows the same international evidence review, but for the exam, naming the 2025 European guideline with its year is the cleanest choice."], [502.95, 510.44, "Tutor", "For prognostication specifically, you can also name the Neurocritical Care Society guideline of 2023, first author Rajajee."], [510.44, 513.58, "Tutor", "Here are the key recommendations, with numbers."], [513.58, 514.44, "Tutor", "Oxygen."], [514.44, 521.82, "Tutor", "Titrate to an oxygen saturation of 94 to 98 percent, or a partial pressure of oxygen of 75 to 100 millimetres of mercury."], [521.82, 525.13, "Tutor", "Avoid hypoxaemia below 60, and avoid hyperoxaemia."], [525.13, 526.45, "Tutor", "Carbon dioxide."], [526.45, 529.48, "Tutor", "Normocapnia, 35 to 45 millimetres of mercury."], [529.48, 536.17, "Tutor", "Watch it closely if the patient is cooled, because hypocapnia creeps in and causes cerebral vasoconstriction."], [536.17, 537.49, "Tutor", "Blood pressure."], [537.49, 542.98, "Tutor", "A mean arterial pressure above 60 to 65, or a systolic above 100 millimetres of mercury."], [542.98, 544.12, "Tutor", "Temperature."], [544.3, 551.3, "Tutor", "Prevent fever, defined as a temperature above 37.5 degrees, for 36 to 72 hours in patients who remain comatose."], [551.3, 557.3, "Tutor", "Don't actively rewarm a comatose patient who is mildly hypothermic, between 32 and 36 degrees."], [557.3, 562.59, "Tutor", "If you use a device, use one with feedback from continuous temperature monitoring."], [562.59, 565.36, "Tutor", "And no routine prehospital cold fluids."], [565.36, 566.71, "Tutor", "The coronaries."], [566.71, 573.24, "Tutor", "Immediate coronary angiography for clear ST elevation, or a high suspicion of acute coronary occlusion."], [573.24, 580.06, "Tutor", "Without ST elevation, delay the catheter laboratory unless the context strongly suggests an occluded vessel."], [580.06, 581.06, "Tutor", "Seizures."], [581.06, 582.88, "Tutor", "Diagnose them with EEG."], [582.88, 587.94, "Tutor", "Treat with levetiracetam or sodium valproate first line, along with sedatives."], [587.94, 590.94, "Tutor", "Do not give prophylactic antiseizure drugs."], [591.34, 596.74, "Tutor", "Now the prognostication algorithm itself, which is the core of most of these questions."], [596.74, 597.99, "Tutor", "Who enters it?"], [597.99, 608.84, "Tutor", "In the 2025 guideline, a patient who is not awake and obeying commands, meaning a Glasgow Coma Scale motor score below six, at 72 hours or later after ROSC, with confounders excluded."], [608.84, 610.21, "Tutor", "Note the change."], [610.21, 613.67, "Tutor", "The 2021 version used a motor score of three or less."], [613.67, 616.51, "Tutor", "Either way, the timing anchor is 72 hours."], [616.51, 620.95, "Tutor", "Poor outcome is likely when two or more of six predictors are present."], [620.95, 623.33, "Tutor", "Here's the second retrieval point."], [623.33, 625.83, "Tutor", "Before I list them, try it yourself."], [625.83, 631.06, "Tutor", "Name the six predictors of poor neurological outcome in the 2025 European algorithm."], [631.06, 632.54, "Tutor", "Pause, and answer."], [637.94, 638.67, "Tutor", "One."], [638.67, 642.79, "Tutor", "Absent pupillary and corneal reflexes, at 72 hours or later."], [642.79, 643.52, "Tutor", "Two."], [643.52, 649.22, "Tutor", "Bilaterally absent N20 waves on somatosensory evoked potentials, at 24 hours or later."], [649.22, 650.07, "Tutor", "Three."], [650.07, 652.91, "Tutor", "A highly malignant EEG, after 24 hours."], [652.91, 659.83, "Tutor", "Highly malignant means a suppressed background, with or without periodic discharges, or burst suppression."], [659.83, 660.61, "Tutor", "Four."], [660.61, 666.25, "Tutor", "Neuron-specific enolase above 60 micrograms per litre at 48 hours, 72 hours, or both."], [666.25, 667.04, "Tutor", "Five."], [667.04, 669.53, "Tutor", "Status myoclonus within 72 hours."], [669.53, 670.25, "Tutor", "Six."], [670.25, 673.71, "Tutor", "Diffuse and extensive anoxic injury on CT or MRI."], [673.71, 676.38, "Tutor", "And if the picture is indeterminate?"], [676.38, 678.32, "Tutor", "Then you keep observing."], [678.32, 689.05, "Tutor", "The Neurocritical Care Society guideline explicitly supports an extended period of observation for awakening when prognosis is uncertain, if that fits the goals of care."], [689.05, 696.02, "Tutor", "Some of these patients wake up late, particularly older patients and those who had a lot of sedative drugs."], [696.42, 702.2, "Tutor", "Now let's go test by test, with the limitation for each, because that's where the marks are."], [702.2, 704.23, "Tutor", "Clinical examination first."], [704.23, 708.16, "Tutor", "The pupillary light reflex is the most robust clinical sign."], [708.16, 714.23, "Tutor", "Use automated pupillometry if you have it, because it's quantitative and less observer-dependent."], [714.23, 719.44, "Tutor", "Bilaterally absent pupillary reflexes at 72 hours carry a low false-positive rate."], [719.44, 724.41, "Tutor", "The corneal reflex is more vulnerable to sedatives and neuromuscular blockade."], [724.41, 726.66, "Tutor", "The motor response is the trap."], [726.66, 732.91, "Tutor", "A motor score of three or less, extension or no response, has a high false-positive rate on its own."], [732.91, 736.38, "Tutor", "That's why it's an entry criterion, not a predictor."], [736.38, 740.78, "Tutor", "Use it to decide who needs further testing, never to decide outcome."], [740.78, 742.45, "Tutor", "Myoclonus needs care."], [742.45, 755.99, "Tutor", "Status myoclonus, meaning continuous, generalised myoclonus persisting for thirty minutes or more within the first 72 hours, is a poor sign, especially when the EEG shows a suppressed or burst-suppression background behind it."], [755.99, 764.43, "Tutor", "But don't confuse it with Lance-Adams syndrome, a chronic action myoclonus that appears as the patient wakes up, with preserved cognition."], [764.43, 769.46, "Tutor", "So the rule is: record an EEG during the myoclonus, and look at the background."], [769.86, 772.03, "Tutor", "Somatosensory evoked potentials."], [772.03, 776.75, "Tutor", "You stimulate the median nerve at the wrist and record over the sensory cortex."], [776.75, 779.24, "Tutor", "The N20 wave is the cortical response."], [779.24, 788.35, "Tutor", "If it's absent on both sides, at 24 hours or later, the false-positive rate for poor outcome is very low, and it's relatively resistant to sedation and cooling."], [788.35, 791.22, "Tutor", "That makes it the most specific test we have."], [791.22, 792.52, "Tutor", "The limitations."], [792.52, 796.1, "Tutor", "Its sensitivity is low, so a present N20 tells you little."], [796.1, 803.48, "Tutor", "It's vulnerable to muscle artefact and electrical noise in the ICU, so you may need neuromuscular blockade to get a clean trace."], [803.48, 808.9, "Tutor", "It needs expertise to interpret, and it isn't available everywhere, especially out of hours."], [809.3, 809.94, "Tutor", "EEG."], [809.94, 814.75, "Tutor", "The highly malignant patterns are the suppressed background and burst suppression."], [814.75, 821.64, "Tutor", "A continuous, reactive background early on points the other way, towards good recovery, and that's a useful thing to say."], [821.64, 826.98, "Tutor", "Limitations: sedatives cause suppression, so you must read it in the context of drug levels."], [826.98, 829.86, "Tutor", "Definitions of reactivity aren't standardised."], [829.86, 832.53, "Tutor", "And interpretation varies between readers."], [832.53, 835.1, "Tutor", "Remember also the role beyond prognosis."], [835.1, 838.46, "Tutor", "EEG finds non-convulsive seizures, which are treatable."], [838.86, 840.01, "Tutor", "Biomarkers."], [840.01, 843.95, "Tutor", "Neuron-specific enolase is released from damaged neurons."], [843.95, 852.07, "Tutor", "Above 60 micrograms per litre at 48 or 72 hours predicts poor outcome, and a rising level between 24 and 72 hours adds weight."], [852.07, 857.83, "Tutor", "Older thresholds in your reading may differ, and there's no universally agreed cut-off."], [857.83, 859.65, "Tutor", "Third retrieval point."], [859.65, 865.89, "Tutor", "Neuron-specific enolase can be falsely high for reasons that have nothing to do with the brain."], [865.89, 866.92, "Tutor", "Give two."], [866.92, 868.5, "Tutor", "Pause, and answer."], [873.9, 875.44, "Tutor", "First, haemolysis."], [875.44, 881.5, "Tutor", "Red cells contain enolase, so a haemolysed sample, or haemolysis from ECMO, falsely raises it."], [881.5, 885.59, "Tutor", "Many labs report a haemolysis index, and you should check it."], [885.59, 890.58, "Tutor", "Second, neuroendocrine tumours and small cell lung cancer, which secrete it."], [890.58, 899.37, "Tutor", "So the limitation sentence is: it's a continuous variable without a universal threshold, and it's confounded by haemolysis and some tumours."], [899.37, 907.26, "Tutor", "S100B and neurofilament light chain are promising, but they're not in routine clinical use, so mention them only as emerging."], [907.66, 908.51, "Tutor", "Imaging."], [908.51, 914.76, "Tutor", "On CT, look for loss of grey-white matter differentiation and diffuse cerebral oedema with sulcal effacement."], [914.76, 920.2, "Tutor", "The grey-to-white matter density ratio can quantify this, but thresholds vary between centres."], [920.2, 924.58, "Tutor", "The best timing is after 24 to 48 hours, because early CT is often normal."], [924.58, 927.83, "Tutor", "And a normal early CT doesn't exclude a poor outcome."], [927.83, 933.12, "Tutor", "That's precisely what the 2024 second sitting question on early versus late CT was probing."], [933.12, 937.38, "Tutor", "An early CT is about finding the cause, like a subarachnoid haemorrhage."], [937.38, 939.3, "Tutor", "A late CT is about severity."], [939.3, 940.91, "Tutor", "MRI is more sensitive."], [940.91, 946.78, "Tutor", "Diffuse restricted diffusion in the cortex and deep grey matter, best seen between days two and seven."], [946.78, 953.66, "Tutor", "The limitations: transporting an unstable ventilated patient, variable quantitative thresholds, and limited availability."], [954.06, 956.56, "Tutor", "Here's a quick test on the imaging logic."], [956.56, 958.81, "Tutor", "A patient is twelve hours post ROSC."], [958.81, 961.01, "Tutor", "The CT brain is reported as normal."], [961.01, 963.92, "Tutor", "The registrar tells the family that's reassuring."], [963.92, 966.01, "Tutor", "What's wrong with that statement?"], [966.01, 967.34, "Tutor", "Pause, and answer."], [972.74, 981.64, "Tutor", "Grey-white differentiation is often preserved in the first day, even in patients with devastating hypoxic injury, because the cytotoxic oedema hasn't declared itself yet."], [981.64, 984.89, "Tutor", "So an early normal CT has poor negative predictive value."], [984.89, 986.64, "Tutor", "It rules out a haemorrhage."], [986.64, 989.09, "Tutor", "It doesn't rule out hypoxic brain injury."], [989.09, 995.54, "Tutor", "The right message to the family is that the scan has excluded a bleed, and that it's too early to judge the brain injury."], [995.94, 1005.93, "Tutor", "While we wait for 72 hours, the rest of the organ support matters, because the other three parts of the syndrome can kill the patient before the brain declares itself."], [1005.93, 1006.96, "Tutor", "The heart."], [1006.96, 1012.22, "Tutor", "Myocardial stunning after arrest is common and usually improves over 48 to 72 hours."], [1012.22, 1013.7, "Tutor", "Get an early echo."], [1013.7, 1021.53, "Tutor", "Look for a regional wall motion abnormality, right ventricular dilatation suggesting pulmonary embolism, and tamponade after CPR."], [1021.53, 1028.15, "Tutor", "If the patient is in cardiogenic shock, use fluids, then noradrenaline, then an inotrope such as dobutamine."], [1028.15, 1031.75, "Tutor", "Mechanical support is for selected patients after that."], [1031.75, 1032.89, "Tutor", "Ventilation."], [1032.89, 1038.43, "Tutor", "Lung-protective volumes, around 6 to 8 millilitres per kilogram of predicted body weight."], [1038.43, 1043.57, "Tutor", "Remember that aspiration pneumonia is common after arrest, so send cultures early."], [1043.57, 1044.48, "Tutor", "Glucose."], [1044.48, 1047.4, "Tutor", "Avoid both hypoglycaemia and tight control."], [1047.4, 1052.42, "Tutor", "A target of roughly 7.8 to 10 millimoles per litre is a sensible range to quote."], [1052.42, 1053.39, "Tutor", "Sedation."], [1053.39, 1058.36, "Tutor", "Use short-acting agents, because you'll need to clear them for prognostication."], [1058.36, 1063.62, "Tutor", "And treat shivering, which raises metabolic rate and fights your temperature device."], [1063.62, 1069.1, "Tutor", "And one distinction that cost candidates marks in 2023: this is not brain death testing."], [1069.28, 1074.69, "Tutor", "Brain death needs established preconditions, an observation period and absent brainstem function."], [1074.69, 1080.46, "Tutor", "Neuroprognostication is a probabilistic judgement in a patient who usually still has brainstem reflexes."], [1080.46, 1086.44, "Tutor", "If brainstem reflexes are lost and the patient progresses to brain death, that's a separate, formal process."], [1086.84, 1092.25, "Tutor", "Now confounders, because the examiners specifically want them under general principles."], [1092.25, 1097.2, "Tutor", "Sedatives and opioids, especially accumulated propofol, midazolam and fentanyl."], [1097.2, 1104.08, "Tutor", "Their clearance is slowed by hypothermia, and by renal and liver dysfunction, so wait longer after stopping them."], [1104.08, 1107.67, "Tutor", "Use short-acting agents from the start for that reason."], [1107.67, 1109.43, "Tutor", "Neuromuscular blockade."], [1109.43, 1111.93, "Tutor", "Check train-of-four before the exam."], [1111.93, 1114.44, "Tutor", "Hypothermia itself, and hypotension."], [1114.44, 1120.41, "Tutor", "Metabolic causes: hypoglycaemia, hyponatraemia, uraemia, hepatic encephalopathy, and hypercapnia."], [1120.41, 1124.11, "Tutor", "And non-convulsive seizures, or a new intracranial event."], [1124.11, 1128.72, "Tutor", "If any of these are present, the clock doesn't start until they're fixed."], [1129.12, 1131.46, "Tutor", "Finally, synthesis and communication."], [1131.46, 1140.8, "Tutor", "Most deaths in patients admitted comatose after out-of-hospital cardiac arrest follow withdrawal of life-sustaining therapy, based on a predicted poor neurological outcome."], [1140.8, 1143.5, "Tutor", "That's the self-fulfilling prophecy problem."], [1143.5, 1147.03, "Tutor", "Withdraw too early, and you'll never see the late awakeners."], [1147.03, 1150.61, "Tutor", "Your data then confirm that patients like this don't wake up."], [1150.61, 1159.79, "Tutor", "So the consultant answer says: prognosticate using at least two concordant predictors, at the right time, without confounders, by a senior clinician, documented clearly."], [1159.79, 1163.84, "Tutor", "Have early and honest conversations with the family about uncertainty."], [1163.84, 1170.17, "Tutor", "Consider organ donation pathways where appropriate, and refer to the donation service according to local practice."], [1170.17, 1177.44, "Tutor", "And plan follow-up for survivors, because cognitive and psychological problems after cardiac arrest are common and under-recognised."], [1177.84, 1180.62, "Tutor", "Here are your three numbers to remember."], [1180.62, 1186.89, "Tutor", "Seventy-two hours: the earliest point for the prognostication algorithm, after confounders are gone."], [1186.89, 1193.56, "Tutor", "Sixty micrograms per litre: the neuron-specific enolase threshold at 48 or 72 hours, in the 2025 guideline."], [1193.56, 1199.07, "Tutor", "Thirty-seven point five degrees: the fever threshold to stay below, for 36 to 72 hours."], [1199.07, 1200.29, "Tutor", "And one rule."], [1200.29, 1203.36, "Tutor", "Two or more concordant predictors, never one."], [1204.76, 1206.28, "Tutor", "Now three trials."], [1206.28, 1215.34, "Tutor", "Each one answers a question an examiner could put to you: does cooling help, does adrenaline help, and how high should the blood pressure be."], [1215.34, 1222.64, "Tutor", "We'll start with HACA, the Hypothermia after Cardiac Arrest trial, published in the New England Journal in 2002."], [1222.64, 1226.9, "Tutor", "It's chapter fifty-eight of Landmark Studies in Critical Care."], [1226.9, 1238.58, "Tutor", "The population was tightly selected: adults aged 18 to 75, comatose after a witnessed out-of-hospital arrest with ventricular fibrillation, and return of circulation within 60 minutes."], [1238.58, 1243.57, "Tutor", "It was done in nine centres in five European countries, with 275 patients."], [1243.57, 1254.52, "Tutor", "The intervention was cooling to 32 to 34 degrees bladder temperature for 24 hours, mainly with an external forced-air device, then passive rewarming over about eight hours."], [1254.52, 1260.18, "Tutor", "The comparator was standard care with normothermia, which wasn't actively controlled."], [1260.18, 1269.48, "Tutor", "The primary outcome, a favourable neurological outcome at six months, meaning Cerebral Performance Category one or two, was 55 versus 39 percent."], [1269.48, 1271.12, "Tutor", "Relative risk 1.40."], [1271.12, 1273.32, "Tutor", "Number needed to treat, six."], [1273.32, 1276.54, "Tutor", "Six-month mortality was 41 versus 55 percent."], [1276.54, 1281.04, "Tutor", "On harm, complications were similar overall, 73 versus 70 percent."], [1281.22, 1285.59, "Tutor", "Pneumonia, sepsis and bleeding were numerically higher with cooling."], [1285.59, 1287.2, "Tutor", "The main criticisms."], [1287.2, 1293.65, "Tutor", "It stopped early because enrolment was slow and funding ran out, which tends to exaggerate effect sizes."], [1293.65, 1298.89, "Tutor", "It was open label for the treating team, though the outcome assessors were blinded."], [1298.89, 1302.97, "Tutor", "Cooling was slow, with a median of eight hours to reach target."], [1302.97, 1308.38, "Tutor", "And, most importantly, the control arm wasn't protocolised, so fever wasn't prevented."], [1308.38, 1315.4, "Tutor", "What it changed: with Bernard's trial in the same issue, it put therapeutic hypothermia into guidelines worldwide."], [1315.4, 1317.93, "Tutor", "Here's how to quote it in an answer."], [1317.93, 1333.7, "Tutor", "HACA in 2002 showed improved neurological outcome with 32 to 34 degrees for 24 hours after witnessed VF arrest, number needed to treat six, but its uncontrolled-fever control arm means the benefit is now attributed largely to fever avoidance, as TTM and TTM2 showed."], [1334.1, 1338.6, "Tutor", "Second, PARAMEDIC2, Perkins and colleagues, New England Journal, 2018."], [1338.6, 1346.49, "Tutor", "This is the trial behind chapter twenty-three of Controversies in Critical Care, on adrenaline and outcomes after cardiac arrest."], [1346.49, 1349.72, "Tutor", "Before I give you the result, try to predict it."], [1349.72, 1352.66, "Tutor", "Did adrenaline improve survival at 30 days?"], [1352.66, 1356.64, "Tutor", "And did it improve survival with a good neurological outcome?"], [1356.64, 1358.14, "Tutor", "Pause, and answer."], [1363.54, 1365.24, "Tutor", "Here's what happened."], [1365.24, 1377.51, "Tutor", "This was a blinded, placebo-controlled trial in UK ambulance services: 8,014 adults with out-of-hospital cardiac arrest, randomised to 1 milligram of adrenaline every 3 to 5 minutes, or saline placebo."], [1377.51, 1381.8, "Tutor", "The primary outcome, 30-day survival, was 3.2 versus 2.4 percent."], [1381.8, 1383.73, "Tutor", "Adjusted odds ratio 1.47."], [1383.73, 1387.55, "Tutor", "That's about eight extra survivors per thousand patients."], [1387.55, 1397.53, "Tutor", "But survival with a favourable neurological outcome, a modified Rankin score of three or less, at discharge, was 2.2 versus 1.9 percent, which wasn't significant."], [1397.53, 1403.63, "Tutor", "And there was a signal that more of the adrenaline survivors had severe neurological impairment."], [1403.63, 1404.98, "Tutor", "The criticisms."], [1404.98, 1407.98, "Tutor", "It wasn't powered for neurological outcome."], [1407.98, 1412.97, "Tutor", "Survival was lower than expected, so the power calculation had to be revised."], [1412.97, 1417.96, "Tutor", "About one in five patients in each arm was lost to follow-up at three months."], [1417.96, 1423.71, "Tutor", "It doesn't apply to in-hospital arrest, and post-arrest hospital care wasn't standardised."], [1423.71, 1425.76, "Tutor", "And the result was fragile."], [1425.76, 1431.34, "Tutor", "A handful of events in the other direction would have removed statistical significance."], [1431.52, 1440.46, "Tutor", "A Bayesian reanalysis gave only about a 37 percent probability that adrenaline improves survival by at least one percentage point in absolute terms."], [1440.46, 1442.58, "Tutor", "Why might adrenaline do this?"], [1442.58, 1446.99, "Tutor", "It raises coronary perfusion pressure, which helps the heart restart."], [1446.99, 1456.45, "Tutor", "But its alpha-agonist effect constricts the cerebral microcirculation, and its beta effects raise myocardial oxygen demand and promote arrhythmia after ROSC."], [1456.45, 1460.41, "Tutor", "So you can restart more hearts while protecting fewer brains."], [1460.41, 1463.27, "Tutor", "That's the mechanism behind the trade-off."], [1463.27, 1476.57, "Tutor", "What it changed: adrenaline stayed in guidelines because it increases survival, but the debate is now about timing and dose, and the uncomfortable trade-off between more survivors and more survivors with severe brain injury."], [1476.57, 1487.4, "Tutor", "How to quote it: PARAMEDIC2 showed adrenaline improved 30-day survival, 3.2 versus 2.4 percent, without a significant improvement in survival with a favourable neurological outcome."], [1487.8, 1492.1, "Tutor", "Third, BOX, Kjaergaard and colleagues, New England Journal, 2022."], [1492.1, 1496.63, "Tutor", "It's the trial behind the blood pressure number in today's guideline."], [1496.63, 1505.22, "Tutor", "BOX was a double-blind, two-by-two factorial trial in Denmark: 789 comatose adults after out-of-hospital arrest of presumed cardiac cause."], [1505.22, 1513.52, "Tutor", "They were randomised to a mean arterial pressure target of 77 versus 63 millimetres of mercury, and separately to two oxygen targets."], [1513.52, 1523.59, "Tutor", "The blinding was clever: the arterial pressure monitors were modified to display a value offset by ten percent, so clinicians couldn't tell which arm they were in."], [1523.59, 1530.65, "Tutor", "The primary outcome, death or discharge with severe disability or coma within 90 days, was 34 versus 32 percent."], [1530.65, 1533.18, "Tutor", "Hazard ratio 1.08, not significant."], [1533.18, 1536.36, "Tutor", "Ninety-day mortality was 31 versus 29 percent."], [1536.36, 1542.84, "Tutor", "Median neuron-specific enolase at 48 hours was similar, and there was no difference in adverse events."], [1542.84, 1546.66, "Tutor", "The oxygen comparison in the same trial was also neutral."], [1546.66, 1549.66, "Tutor", "Why was a higher pressure expected to help?"], [1549.66, 1559.08, "Tutor", "After arrest, cerebral autoregulation is often impaired, and the lower limit can be shifted upwards, particularly in patients with chronic hypertension."], [1559.26, 1565.57, "Tutor", "So the theory was that a higher pressure would push more blood through a brain that can't defend its own flow."], [1565.57, 1568.56, "Tutor", "BOX tested that, and on average, it didn't help."], [1568.56, 1569.79, "Tutor", "The criticisms."], [1569.79, 1575.93, "Tutor", "The population was mostly shockable rhythms in a high-performing system, with a high rate of bystander CPR."], [1575.93, 1578.23, "Tutor", "The pressure separation was modest."], [1578.23, 1582.51, "Tutor", "And it can't tell you about patients in cardiogenic shock who need more."], [1582.51, 1589.99, "Tutor", "What it changed: it supports the 2025 target of a mean arterial pressure above 60 to 65, with no proven benefit from pushing higher."], [1589.99, 1600.78, "Tutor", "How to quote it: BOX found no difference in death or severe disability between mean arterial pressure targets of 77 and 63 millimetres of mercury after cardiac arrest, supporting a target of 65."], [1602.18, 1605.83, "Examiner", "This is from the 2024 first sitting, question twenty-eight."], [1605.83, 1606.81, "Examiner", "Ten marks."], [1606.81, 1608.39, "Examiner", "I'll read it exactly."], [1608.39, 1618.3, "Examiner", "Discuss your approach to prognostication of neurological outcome in adult ICU patients after successful cardiovascular resuscitation following out of hospital cardiac arrest."], [1618.3, 1621.62, "Examiner", "Your answer should include the following headings: a."], [1621.62, 1622.65, "Examiner", "Guidelines."], [1622.65, 1623.63, "Examiner", "Two marks."], [1623.63, 1624.18, "Examiner", "b."], [1624.18, 1626.68, "Examiner", "General approach and clinical factors."], [1626.68, 1627.77, "Examiner", "Three marks."], [1627.77, 1628.32, "Examiner", "c."], [1628.32, 1631.47, "Examiner", "Investigations, and their role in prognostication."], [1631.47, 1632.51, "Examiner", "Five marks."], [1632.51, 1634.09, "Examiner", "You have ten minutes."], [1634.09, 1635.94, "Examiner", "Start with the guidelines."], [1636.44, 1643.38, "Candidate", "For guidelines, I'd use the European Resuscitation Council and ESICM post-resuscitation care guideline."], [1643.38, 1647.63, "Candidate", "They recommend a multimodal approach at 72 hours after ROSC."], [1647.63, 1661.63, "Candidate", "Poor outcome is likely if two or more predictors are present, such as absent pupillary and corneal reflexes, absent N20s, a malignant EEG, high neuron-specific enolase, status myoclonus, or diffuse injury on imaging."], [1661.63, 1665.76, "Candidate", "I'd also mention the Neurocritical Care Society guideline."], [1666.26, 1669.54, "Examiner", "Which edition, and what's the entry criterion?"], [1670.04, 1673.99, "Candidate", "The 2025 edition, published last year in Resuscitation."], [1673.99, 1682.13, "Candidate", "Entry is a patient who isn't obeying commands, a motor score below six, at 72 hours or later, after excluding confounders."], [1682.13, 1685.95, "Candidate", "The 2021 version used a motor score of three or less."], [1685.95, 1690.08, "Candidate", "And the Neurocritical Care Society guideline is from 2023."], [1690.08, 1696.72, "Candidate", "It grades the pupillary reflex at 72 hours and bilaterally absent N20s as the reliable predictors."], [1697.22, 1697.77, "Examiner", "Good."], [1697.77, 1699.57, "Examiner", "That's where the second mark lives."], [1699.57, 1702.33, "Examiner", "Candidates who just say there are guidelines don't get it."], [1702.33, 1703.38, "Examiner", "General approach."], [1703.88, 1707.5, "Candidate", "The principles are: multimodal, never a single test."], [1707.5, 1709.68, "Candidate", "Timing at 72 hours or later."], [1709.68, 1711.37, "Candidate", "Exclude confounders."], [1711.37, 1713.24, "Candidate", "Repeat the examination."], [1713.24, 1716.8, "Candidate", "And assess with senior and multidisciplinary input."], [1716.8, 1721.69, "Candidate", "For clinical factors, I'd split them into arrest factors and examination."], [1721.69, 1733.94, "Candidate", "Arrest factors associated with a poor outcome are a non-shockable initial rhythm, an unwitnessed arrest, no bystander CPR, a long time to ROSC, say over twenty minutes, older age and comorbidity."], [1733.94, 1737.45, "Candidate", "But they shouldn't be used alone to prognosticate."], [1737.45, 1742.94, "Candidate", "On examination: the pupillary light reflex, ideally with quantitative pupillometry."], [1742.94, 1744.57, "Candidate", "The corneal reflex."], [1744.57, 1751.15, "Candidate", "The motor response, which has a high false-positive rate, so it's only a trigger for further testing."], [1751.15, 1755.8, "Candidate", "And myoclonus, where status myoclonus within 72 hours is a poor sign."], [1756.3, 1757.83, "Examiner", "You said exclude confounders."], [1757.83, 1758.58, "Examiner", "Name them."], [1759.08, 1761.91, "Candidate", "Sedation and neuromuscular blockade."], [1761.91, 1763.2, "Candidate", "Hypothermia."], [1763.2, 1764.49, "Candidate", "Hypotension."], [1764.49, 1769.45, "Candidate", "Metabolic derangements like hypoglycaemia, hyponatraemia and uraemia."], [1769.45, 1770.8, "Candidate", "And seizures."], [1771.3, 1775.82, "Examiner", "Why might sedation still be a confounder two days after you've stopped the propofol and fentanyl?"], [1776.32, 1785.23, "Candidate", "Because hypothermia slows drug metabolism, and these patients often have shock liver and acute kidney injury, so the drugs and their metabolites accumulate."], [1785.23, 1790.72, "Candidate", "So I'd wait longer after stopping them, and check drug levels or train-of-four if I'm unsure."], [1791.22, 1791.7, "Examiner", "Good."], [1791.7, 1793.38, "Examiner", "You'd also lost a point on myoclonus."], [1793.38, 1794.5, "Examiner", "What's the trap there?"], [1795.0, 1795.8, "Candidate", "Right."], [1795.8, 1797.46, "Candidate", "Lance-Adams syndrome."], [1797.46, 1801.97, "Candidate", "That's action myoclonus as the patient wakes, with preserved cognition."], [1801.97, 1808.48, "Candidate", "So I'd record an EEG during the myoclonus and look at the background, rather than assume it's a poor sign."], [1808.98, 1810.3, "Examiner", "Investigations."], [1810.3, 1811.38, "Examiner", "Five marks."], [1811.38, 1816.02, "Examiner", "For each, the examiners want the finding, the timing, and the limitation."], [1816.52, 1822.54, "Candidate", "I'd lay this out as a table: test, poor-outcome finding and timing, and limitation."], [1822.54, 1823.47, "Candidate", "SSEPs."], [1823.47, 1826.97, "Candidate", "Bilaterally absent N20s at 24 hours or later."], [1826.97, 1832.8, "Candidate", "Very low false-positive rate, and relatively unaffected by sedation and cooling."], [1832.8, 1839.74, "Candidate", "Limitations: low sensitivity, muscle artefact, and it needs expertise and isn't always available."], [1839.74, 1840.54, "Candidate", "EEG."], [1840.54, 1849.4, "Candidate", "A highly malignant pattern after 24 hours: a suppressed background, with or without periodic discharges, or burst suppression."], [1849.4, 1853.7, "Candidate", "A continuous reactive background suggests a good outcome."], [1853.7, 1859.79, "Candidate", "Limitations: sedatives suppress it, reactivity isn't standardised, and readers vary."], [1859.79, 1862.96, "Candidate", "It also detects non-convulsive seizures."], [1862.96, 1865.08, "Candidate", "Neuron-specific enolase."], [1865.08, 1870.11, "Candidate", "Above 60 micrograms per litre at 48 or 72 hours, and a rising trend."], [1870.11, 1872.95, "Candidate", "Limitation: no universal threshold."], [1872.95, 1874.08, "Candidate", "CT brain."], [1874.08, 1879.96, "Candidate", "Loss of grey-white differentiation and diffuse oedema, best after 24 to 48 hours."], [1879.96, 1887.84, "Candidate", "Early CT is often normal and doesn't exclude a poor outcome, but it finds causes like subarachnoid haemorrhage."], [1887.84, 1888.63, "Candidate", "MRI."], [1888.63, 1894.45, "Candidate", "Diffuse restricted diffusion, cortex and deep grey matter, at two to seven days."], [1894.45, 1897.96, "Candidate", "Limitations: transport risk and availability."], [1898.46, 1899.78, "Examiner", "Neuron-specific enolase."], [1899.78, 1901.26, "Examiner", "You've given one limitation."], [1901.26, 1902.54, "Examiner", "What else confounds it?"], [1903.04, 1904.15, "Candidate", "Haemolysis."], [1904.15, 1908.61, "Candidate", "Red cells contain enolase, so a haemolysed sample or ECMO raises it."], [1908.61, 1912.66, "Candidate", "And neuroendocrine tumours, including small cell lung cancer."], [1912.66, 1915.12, "Candidate", "So I'd check the haemolysis index."], [1915.62, 1920.9, "Examiner", "And how do you put this together for the family on day three, if one test is poor and the rest are indeterminate?"], [1921.4, 1923.82, "Candidate", "Then I wouldn't call it a poor prognosis."], [1923.82, 1925.55, "Candidate", "One predictor isn't enough."], [1925.55, 1930.88, "Candidate", "I'd continue support, repeat the assessment, and allow a longer period of observation for awakening."], [1930.88, 1933.85, "Candidate", "I'd be honest with the family about the uncertainty."], [1933.85, 1938.64, "Candidate", "If two or more concordant predictors develop, the consultant would discuss goals of care."], [1938.64, 1942.44, "Candidate", "That includes considering organ donation according to local practice."], [1942.94, 1944.54, "Examiner", "Let's apply it."], [1944.54, 1947.19, "Examiner", "Day four, 80 hours after ROSC."], [1947.19, 1953.24, "Examiner", "Sedation stopped 48 hours ago, temperature 37.2, sodium 139, creatinine normal."], [1953.24, 1955.75, "Examiner", "Motor response is extension."], [1955.75, 1957.21, "Examiner", "Pupils react."], [1957.21, 1959.23, "Examiner", "Corneals are present."], [1959.23, 1962.15, "Examiner", "SSEPs: N20s present on both sides."], [1962.15, 1969.18, "Examiner", "Neuron-specific enolase 38 micrograms per litre at 72 hours, with a mildly haemolysed sample."], [1969.18, 1973.08, "Examiner", "EEG: continuous background with some reactivity."], [1973.08, 1975.1, "Examiner", "What do you conclude?"], [1975.6, 1979.81, "Candidate", "This patient doesn't meet the criteria for a likely poor outcome."], [1979.81, 1987.01, "Candidate", "He enters the algorithm because he isn't obeying commands at more than 72 hours with confounders reasonably excluded."], [1987.01, 1989.95, "Candidate", "But none of the six predictors are present."], [1989.95, 1997.62, "Candidate", "Brainstem reflexes are intact, N20s are present, the enolase is below 60, and the haemolysis would only push it up, not down."], [1997.62, 2003.15, "Candidate", "The EEG isn't malignant, and a continuous reactive background actually favours recovery."], [2003.15, 2006.49, "Candidate", "The extensor posture on its own isn't a predictor."], [2006.49, 2010.93, "Candidate", "So the prognosis is indeterminate, leaning towards possible recovery."], [2010.93, 2020.44, "Candidate", "I'd continue full support, consider an MRI between days two and seven, repeat the examination daily, and tell the family it's too early to conclude anything."], [2020.94, 2021.69, "Examiner", "Correct."], [2021.69, 2027.66, "Examiner", "The most dangerous answer here is to read extension at day four as a bad sign and start a conversation about withdrawal."], [2027.66, 2030.18, "Examiner", "That's the self-fulfilling prophecy in action."], [2030.58, 2031.43, "Examiner", "One more."], [2031.43, 2037.91, "Examiner", "The registrar asks whether to send the patient for a CT brain on the way back from the catheter laboratory, at six hours."], [2037.91, 2040.62, "Examiner", "What's the rationale, and what's the downside?"], [2041.12, 2054.24, "Candidate", "The rationale for early CT is to find a cause or a complication: subarachnoid haemorrhage, an intracranial bleed after anticoagulation for the coronary procedure, or traumatic injury from a fall at the time of the arrest."], [2054.24, 2059.39, "Candidate", "Finding a subarachnoid haemorrhage changes management and prognosis straight away."], [2059.39, 2067.01, "Candidate", "A late CT, at 48 hours or more, is for the severity of hypoxic injury: loss of grey-white differentiation and diffuse oedema."], [2067.01, 2074.0, "Candidate", "The downside of an early CT is that it's often normal even with severe hypoxic injury, so it can falsely reassure."], [2074.0, 2079.33, "Candidate", "There's also transport risk in an unstable patient, and it can delay other treatment."], [2079.33, 2092.68, "Candidate", "So I'd do it early if there's a clinical reason to suspect an intracranial cause, like no clear cardiac cause or a headache before collapse, and route it on the way back from the catheter laboratory to save a second transfer."], [2093.18, 2097.33, "Examiner", "That's a reasonable answer to the 2024 second sitting question as well."], [2097.33, 2106.51, "Examiner", "Its examiner comments rewarded candidates who stayed in the clinical context of out-of-hospital arrest and talked about the implications of early versus late scanning."], [2106.51, 2110.18, "Examiner", "They didn't reward generic advantages and disadvantages of CT."], [2110.18, 2111.18, "Examiner", "Last probe."], [2111.18, 2114.49, "Examiner", "The family ask what the chances are if he does wake up."], [2114.49, 2116.06, "Examiner", "What do you tell them?"], [2116.56, 2122.24, "Candidate", "That it depends a lot on the severity of the brain injury, which we'll know more about after 72 hours."], [2122.24, 2129.05, "Candidate", "Many survivors who wake up have a good functional outcome, but problems with memory, attention, fatigue and mood are common."], [2129.05, 2131.63, "Candidate", "So we'd plan follow-up and rehabilitation."], [2131.63, 2134.36, "Candidate", "I'd avoid giving a precise number on day one."], [2134.86, 2137.66, "Examiner", "Let me tell you where the marks came from."], [2137.66, 2142.88, "Examiner", "Guidelines: you named both, with years, the entry criterion and the two-or-more rule."], [2142.88, 2147.19, "Examiner", "Full marks once prompted, but you didn't give the year until I asked."], [2147.19, 2153.3, "Examiner", "The rubric rewards citing guidelines with specifics, so state the edition and year in the first line."], [2153.3, 2156.28, "Examiner", "General approach and clinical factors: solid."], [2156.28, 2161.77, "Examiner", "Multimodal, timing, confounders, and the motor score as a trigger rather than a predictor."], [2161.77, 2169.34, "Examiner", "You lost a little because the confounders came only when I asked, and the reason sedation lingers came only on a second prompt."], [2169.34, 2172.2, "Examiner", "On paper there's no examiner to prompt you."], [2172.2, 2175.78, "Examiner", "Write the confounders and why they persist, in one line."], [2175.78, 2180.94, "Examiner", "Investigations: the table structure was right, and you were strong on SSEPs and EEG."], [2180.94, 2187.05, "Examiner", "But you left the limitation off neuron-specific enolase and off the motor examination until prompted."], [2187.05, 2191.09, "Examiner", "That's the commonest way candidates lose marks on this question."], [2191.09, 2197.37, "Examiner", "The commentary on the 2023 version said neurophysiology and biomarkers were explored only superficially."], [2197.37, 2202.58, "Examiner", "On paper, as you first answered it, I'd put this at around six and a half out of ten."], [2202.76, 2208.57, "Examiner", "With the year, the confounders and the enolase limitations written down unprompted, it's an eight."], [2208.57, 2214.5, "Examiner", "The one fix: every test needs three things in the table, the finding, the timing and the limitation."], [2214.5, 2216.8, "Examiner", "Fill all three columns, every row."], [2217.7, 2219.61, "Tutor", "One last thing on this question."], [2219.61, 2225.29, "Tutor", "The 2023 version had a separate one-mark heading for biomarkers, and a two-and-a-half mark heading for imaging."], [2225.29, 2229.39, "Tutor", "When the College gives you headings with marks, spend your time in proportion."], [2229.39, 2234.98, "Tutor", "Two and a half marks is roughly two and a half minutes of writing, not a paragraph about brain death testing."], [2235.38, 2237.87, "Tutor", "Before the next episode, do one thing."], [2237.87, 2244.08, "Tutor", "From memory, write the neuroprognostication table: six rows, three columns, finding, timing and limitation."], [2244.08, 2251.65, "Tutor", "Then check it against chapter thirty of Oh's, the post-resuscitation care section, and make Fresh cards for any cell you left empty."], [2251.65, 2253.21, "Tutor", "That's the deep dive."], [2253.21, 2254.78, "Tutor", "Thanks for listening."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 51.24, "title": "Tutorial: neuroprognostication and post-resuscitation care"}, {"start": 1204.76, "title": "Landmark trials"}, {"start": 1602.18, "title": "Exam practice: 2024.1 Question 28"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
