<script>
var C=[[0.0, 2.68, "Tutor", "Good morning, and welcome to Part Two Daily."], [2.68, 9.13, "Tutor", "It's Saturday the fourteenth of November, one hundred and sixteen days until the written paper on the tenth of March."], [9.13, 11.09, "Tutor", "Saturday is the spiral review."], [11.09, 19.2, "Tutor", "We go back to topics from the last few weeks, rebuild the answer that earns the marks, and then make each one harder by linking it to another system."], [19.2, 26.26, "Tutor", "Spaced, harder retrieval is what makes things stick, and it's the closest thing to how the College actually writes its questions."], [26.26, 28.22, "Tutor", "There are four revisits today."], [28.22, 32.66, "Tutor", "First, rhabdomyolysis, with an exertional heat stroke and hyperkalaemia twist."], [32.66, 37.25, "Tutor", "Second, end-stage kidney disease in the critically ill, with septic shock on top."], [37.25, 41.64, "Tutor", "Third, hypernatraemia and diabetes insipidus, with a renal replacement twist."], [41.64, 46.59, "Tutor", "Fourth, the low output state after cardiac surgery, with the right ventricle joining in."], [46.59, 51.91, "Tutor", "Then a syllabus round-up of six items, from mechanical cardiac support to antimicrobial dosing."], [51.91, 54.13, "Tutor", "There's no journal watch this week."], [54.13, 59.08, "Tutor", "Nothing new and important has appeared since the last one, so we'll leave that part out."], [60.48, 63.05, "Tutor", "Let's start in London, in September 1940."], [63.05, 64.52, "Tutor", "The Blitz has begun."], [64.52, 70.09, "Tutor", "Rescue teams are pulling people out of collapsed buildings, some after hours trapped under rubble."], [70.09, 73.4, "Tutor", "Many of them look surprisingly well when they come out."], [73.4, 78.39, "Tutor", "A trapped leg, some swelling, but they're talking, and their blood pressure is holding."], [78.39, 80.96, "Tutor", "Then, hours later, some of them collapse."], [80.96, 83.48, "Tutor", "Fluid is pouring into the injured limbs."], [83.48, 88.21, "Tutor", "Over the next few days their urine turns dark and smoky, and then it nearly stops."], [88.21, 91.05, "Tutor", "Most of them die within about a week, uraemic."], [91.05, 95.04, "Tutor", "At post-mortem the kidney tubules are full of brown pigmented casts."], [95.44, 99.5, "Tutor", "A young physician at Hammersmith, Eric Bywaters, noticed the pattern."], [99.5, 108.61, "Tutor", "With Desmond Beall he published four of these cases in the British Medical Journal in March 1941, under the title \"Crush injuries with impairment of renal function\"."], [108.61, 114.24, "Tutor", "The similarity to blackwater fever, where haemoglobin blocks the tubules, pointed toward a pigment."], [114.24, 118.3, "Tutor", "That pigment turned out to be myoglobin, leaking from damaged muscle."], [118.3, 125.04, "Tutor", "Bywaters later found that German doctors had described the same thing in the First World War, and it had been forgotten."], [125.44, 129.01, "Tutor", "Two lessons from that story are still exam points today."], [129.01, 134.1, "Tutor", "The first is that the danger comes after the rescue, when the muscle is reperfused."], [134.1, 140.07, "Tutor", "Potassium, phosphate, myoglobin and acid flood out of the muscle, and litres of fluid move into it."], [140.07, 145.43, "Tutor", "The second is that the kidney injury is largely preventable with early, generous volume."], [145.43, 148.56, "Tutor", "That's why the College answer leads with volume."], [148.96, 151.88, "Tutor", "This is the 2020 first sitting, question one."], [151.88, 157.6, "Tutor", "With regards to rhabdomyolysis in the ICU patient: a, list five causes, twenty percent of marks."], [157.6, 165.63, "Tutor", "b, what are the important features in the history and clinical examination, and what specific laboratory investigations would you request?"], [165.63, 167.39, "Tutor", "Thirty percent of marks."], [167.39, 169.26, "Tutor", "c, outline the management."], [169.26, 170.97, "Tutor", "Fifty percent of marks."], [170.97, 176.85, "Tutor", "Seventy-eight percent of candidates passed it, so it's a question you're expected to score well on."], [176.85, 184.28, "Tutor", "Rhabdomyolysis has turned up five times in the question bank we're working from, most recently twice in the 2025 first sitting."], [184.28, 190.0, "Tutor", "You scored five on this on the ninth of November, and you used under half of the available time."], [190.4, 193.6, "Tutor", "Here's the answer that earns the marks."], [193.6, 199.74, "Tutor", "For part a, give one cause per heading, because the College gave half a mark each."], [199.74, 201.45, "Tutor", "Trauma and crush."], [201.45, 203.49, "Tutor", "Exertion and seizures."], [203.49, 209.56, "Tutor", "Drugs, such as statins and antipsychotics through neuroleptic malignant syndrome."], [209.56, 212.97, "Tutor", "Toxins, such as alcohol, cocaine and MDMA."], [212.97, 218.49, "Tutor", "Temperature, meaning heat stroke, malignant hyperthermia, or hypothermia."], [218.49, 222.72, "Tutor", "Infection, such as influenza or necrotising fasciitis."], [222.72, 228.04, "Tutor", "And metabolic causes, like severe hypokalaemia or hyperosmolar states."], [228.44, 230.66, "Tutor", "Part b is where your marks went."], [230.66, 238.19, "Tutor", "The question asks for specific laboratory investigations, and the examiners noted that some candidates offered CT scans instead."], [238.19, 239.41, "Tutor", "Read the verb."], [239.41, 244.9, "Tutor", "Give creatine kinase, with a risk rising steeply above about five thousand units per litre."], [244.9, 251.38, "Tutor", "Creatinine, and note that the urea to creatinine ratio may be low because creatinine is released from muscle."], [251.38, 253.43, "Tutor", "Then the dangerous chemistry."], [253.43, 254.43, "Tutor", "Potassium."], [254.43, 255.42, "Tutor", "Phosphate."], [255.42, 257.42, "Tutor", "Calcium, which is low early."], [257.42, 258.19, "Tutor", "Urate."], [258.19, 261.02, "Tutor", "A blood gas with lactate and the anion gap."], [261.02, 265.12, "Tutor", "Urine dipstick positive for blood with no red cells on microscopy."], [265.12, 270.27, "Tutor", "Then the cause-directed tests: a drug screen, alcohol, glucose, and thyroid function."], [270.27, 275.48, "Tutor", "Clinically, ask about trauma, immobility, seizures, drugs, muscle pain and dark urine."], [275.48, 279.8, "Tutor", "Examine every compartment, the temperature, and the peripheral pulses."], [280.2, 281.9, "Tutor", "Part c, half the marks."], [281.9, 284.43, "Tutor", "First, stop the ongoing muscle injury."], [284.43, 288.6, "Tutor", "Treat the cause, stop the drug, control agitation, cool the patient."], [288.6, 292.61, "Tutor", "Second, find limb-threatening and life-threatening complications."], [292.61, 296.89, "Tutor", "Compartment syndrome, with compartment pressures and early fasciotomy."], [296.89, 300.35, "Tutor", "Third, treat the electrolytes, hyperkalaemia above all."], [300.35, 306.12, "Tutor", "Fourth, early, aggressive volume resuscitation with crystalloid, titrated to a high urine output."], [306.12, 311.61, "Tutor", "The College accepted saline in 2020, and a balanced crystalloid is equally defensible today."], [311.61, 318.14, "Tutor", "Bicarbonate and mannitol are described in the literature, but the College specifically said they earn no marks."], [318.14, 322.04, "Tutor", "And fifth, renal replacement therapy for the usual indications."], [322.04, 323.8, "Tutor", "Not to remove myoglobin."], [324.2, 326.0, "Tutor", "Now let's make it harder."], [326.0, 332.65, "Tutor", "A twenty-four-year-old army recruit collapses near the end of a ten-kilometre march on a humid Queensland morning."], [332.65, 334.61, "Tutor", "He's confused and combative."], [334.61, 338.1, "Tutor", "His rectal temperature is forty-one point eight degrees."], [338.1, 350.04, "Tutor", "Two hours later, after cooling, his creatine kinase is forty thousand units per litre, his potassium is seven point four millimoles per litre, and the ECG shows peaked T waves and a QRS that's starting to widen."], [350.44, 357.32, "Tutor", "That's exertional heat stroke: a core temperature above forty degrees with central nervous system dysfunction after exertion."], [357.32, 360.47, "Tutor", "The first rule is to cool first and transport second."], [360.47, 369.36, "Tutor", "Cold water immersion is the fastest method, and the aim is to get the core temperature below thirty-nine degrees as fast as possible, ideally within thirty minutes."], [369.36, 373.45, "Tutor", "The longer the brain and muscle sit above forty, the worse the outcome."], [373.45, 377.48, "Tutor", "Antipyretics don't work, because the hypothalamic set point is normal."], [377.48, 381.05, "Tutor", "Dantrolene has no proven role outside malignant hyperthermia."], [381.05, 388.08, "Tutor", "Watch for disseminated intravascular coagulation, liver injury peaking on day two or three, and the rhabdomyolysis you'd expect."], [388.48, 391.33, "Tutor", "Now the hyperkalaemia with a widening QRS."], [391.33, 394.52, "Tutor", "This is the moment the question becomes cardiac."], [394.52, 396.8, "Tutor", "Three numbers, each with a dose."], [396.8, 398.28, "Tutor", "Pause, and answer."], [403.68, 405.77, "Tutor", "First, stabilise the membrane."], [405.77, 414.86, "Tutor", "Ten millilitres of ten percent calcium chloride, or thirty millilitres of ten percent calcium gluconate, through a good line, repeated until the QRS narrows."], [414.86, 417.23, "Tutor", "Second, shift potassium into cells."], [417.23, 428.19, "Tutor", "Ten units of short-acting insulin with fifty millilitres of fifty percent glucose, with glucose monitoring for the next four to six hours, plus nebulised salbutamol, ten to twenty milligrams."], [428.19, 429.56, "Tutor", "Third, remove it."], [429.56, 437.88, "Tutor", "In a rhabdomyolysis patient who's oliguric, that means early renal replacement therapy, because the muscle keeps releasing potassium for hours."], [438.28, 441.78, "Tutor", "Here's the subtlety that separates a pass from a good pass."], [441.78, 445.39, "Tutor", "In rhabdomyolysis you don't treat asymptomatic hypocalcaemia."], [445.39, 451.71, "Tutor", "Calcium deposits in injured muscle, and as the muscle recovers it comes back out, causing rebound hypercalcaemia."], [451.71, 456.57, "Tutor", "But when hyperkalaemia is threatening the heart, you give calcium without hesitation."], [456.57, 462.16, "Tutor", "Say both halves of that sentence in an answer and the examiner knows you understand the physiology."], [463.06, 464.33, "Examiner", "Let's push on."], [464.33, 469.59, "Examiner", "Six hours later his right calf is tense, and he's grimacing when you move his foot."], [469.59, 472.36, "Examiner", "He's sedated, so he can't tell you much."], [472.36, 475.54, "Examiner", "Candidate, what's going on, and what do you do?"], [476.04, 478.22, "Candidate", "I'm worried about compartment syndrome."], [478.22, 484.85, "Candidate", "The swollen muscle is inside a fixed fascial envelope, so the compartment pressure rises until it exceeds capillary perfusion pressure."], [484.85, 488.65, "Candidate", "The clinical signs are pain out of proportion and pain on passive stretch."], [488.65, 492.92, "Candidate", "In a sedated patient those are unreliable, so I'd measure the compartment pressures."], [493.42, 494.5, "Examiner", "What numbers?"], [495.0, 498.8, "Candidate", "An absolute pressure above thirty millimetres of mercury is concerning."], [498.8, 501.34, "Candidate", "The more useful number is the delta pressure."], [501.34, 508.83, "Candidate", "That's the diastolic blood pressure minus the compartment pressure, and a value under thirty millimetres of mercury is an indication for fasciotomy."], [508.83, 513.25, "Candidate", "Pulses are usually present until very late, so a palpable pulse doesn't reassure me."], [513.25, 516.52, "Candidate", "I'd call the orthopaedic or vascular surgeons straight away."], [517.02, 520.02, "Examiner", "And if his diastolic is low because he's shocked?"], [520.52, 523.89, "Candidate", "Then the delta pressure falls, even at the same compartment pressure."], [523.89, 528.32, "Candidate", "So restoring the blood pressure is part of treating the limb, and I'd say that in the answer."], [528.82, 529.44, "Examiner", "Good."], [529.44, 530.25, "Examiner", "One more."], [530.25, 534.78, "Examiner", "Why does the creatine kinase keep rising for a day or two after the insult has stopped?"], [535.28, 541.18, "Candidate", "Ongoing release from injured and reperfused muscle, and new necrosis if there's an untreated compartment syndrome."], [541.18, 548.44, "Candidate", "A creatine kinase that doesn't start falling after about seventy-two hours should make me look for a missed compartment or a continuing cause."], [548.94, 550.73, "Examiner", "That's a candidate who'll pass."], [550.73, 552.94, "Examiner", "Notice that none of it needed a CT scan."], [554.34, 555.42, "Tutor", "Picture this."], [555.42, 562.65, "Tutor", "It's three in the morning and a fifty-eight-year-old woman on haemodialysis three times a week arrives from the emergency department."], [562.65, 569.74, "Tutor", "She has a fever, a blood pressure of seventy-eight over forty, and a hot, red, tender left forearm over her arteriovenous fistula."], [569.74, 572.05, "Tutor", "Her last dialysis was three days ago."], [572.05, 575.18, "Tutor", "Her potassium is six point nine millimoles per litre."], [575.58, 578.81, "Tutor", "This is the 2021 first sitting, question eight."], [578.81, 588.8, "Tutor", "Outline the pathophysiological changes associated with end-stage kidney disease, dialysis dependent, that may impact on the management of critically ill patients."], [588.8, 593.92, "Tutor", "That theme has been asked four times in the bank, in 2011, 2016, 2020 and 2021."], [593.92, 597.15, "Tutor", "You scored five on it on the ninth of November."], [597.15, 601.09, "Tutor", "Your pharmacology was good, but whole systems were missing."], [601.09, 602.85, "Tutor", "The fix is structural."], [602.85, 610.26, "Tutor", "This question rewards a system-by-system answer, and a table works well: system, change, and impact on ICU management."], [610.66, 612.46, "Tutor", "Let's run through it."], [612.46, 622.42, "Tutor", "Renal: oliguria or anuria, so every millilitre of fluid, every drug infusion and every gram of protein in the feed is prescribed against a dialysis plan."], [622.42, 630.85, "Tutor", "Metabolic: hyperkalaemia, hyperphosphataemia and hypocalcaemia, a chronic metabolic acidosis, and secondary hyperparathyroidism."], [630.85, 634.56, "Tutor", "So you restrict potassium and phosphate in the feed."], [634.56, 644.47, "Tutor", "Cardiovascular: hypertension, left ventricular hypertrophy, accelerated atherosclerosis, uraemic pericarditis, and a low threshold for pulmonary oedema."], [644.47, 649.11, "Tutor", "Neurological: dialysis disequilibrium, polyneuropathy and myopathy."], [649.11, 653.2, "Tutor", "Haematological: anaemia, and uraemic platelet dysfunction."], [653.2, 656.42, "Tutor", "GI: impaired motility, ulceration, bleeding."], [656.42, 660.57, "Tutor", "Immune: a real increase in infection risk and fragile skin."], [660.57, 664.65, "Tutor", "Pharmacology: reduced clearance of renally excreted drugs."], [664.65, 668.06, "Tutor", "And access, which candidates forget every time."], [668.46, 671.14, "Tutor", "Why do we protect the fistula so fiercely?"], [671.14, 672.54, "Tutor", "Pause, and answer."], [677.94, 680.98, "Tutor", "Because it's her lifeline, and it's hard to replace."], [680.98, 683.82, "Tutor", "No blood pressure cuffs or cannulas on that arm."], [683.82, 691.26, "Tutor", "Avoid central lines in the veins draining it, especially the subclavian, because central venous stenosis can destroy the fistula's outflow."], [691.26, 697.24, "Tutor", "And never use the fistula for continuous renal replacement therapy or slow low-efficiency dialysis in the ICU."], [697.24, 704.59, "Tutor", "Needles stay in for hours in a drowsy, moving patient, and needle dislodgement from a high-flow fistula can exsanguinate them in minutes."], [704.59, 709.1, "Tutor", "Put in a temporary dialysis catheter instead, ideally the right internal jugular."], [709.5, 710.99, "Tutor", "Now the harder layer."], [710.99, 713.83, "Tutor", "She's septic, almost certainly from the access."], [713.83, 716.25, "Tutor", "What changes because she's on dialysis?"], [716.25, 717.59, "Tutor", "Antibiotics first."], [717.59, 722.33, "Tutor", "Give a full loading dose, because the volume of distribution is unchanged or bigger."], [722.33, 725.21, "Tutor", "It's only the maintenance doses that you reduce."], [725.21, 732.32, "Tutor", "Vancomycin at a loading dose of about twenty-five milligrams per kilogram, then dosing guided by levels and timed around dialysis."], [732.32, 737.78, "Tutor", "Remember that a clotted or infected fistula is a source, and the vascular surgeons need to see it."], [738.18, 739.89, "Tutor", "Second, the potassium."], [739.89, 743.25, "Tutor", "Six point nine with a three-day gap is predictable."], [743.25, 748.96, "Tutor", "In a stable patient, intermittent haemodialysis removes potassium faster than anything else."], [748.96, 753.06, "Tutor", "In septic shock, continuous therapy is usually better tolerated."], [753.06, 757.05, "Tutor", "Either way, temporise first with calcium, insulin and glucose."], [757.05, 763.55, "Tutor", "And if you intubate her, remember that suxamethonium raises potassium by about half a millimole per litre."], [763.55, 766.86, "Tutor", "At six point nine, rocuronium is the safer choice."], [767.26, 768.7, "Tutor", "Third, the fluids."], [768.7, 771.68, "Tutor", "Here's where a landmark trial earns its place."], [771.68, 777.04, "Tutor", "Many of us were taught that saline is safer in renal failure because it has no potassium."], [777.04, 778.43, "Tutor", "That's backwards."], [778.43, 783.18, "Tutor", "Saline causes a hyperchloraemic acidosis, which shifts potassium out of cells."], [783.18, 790.7, "Tutor", "Balanced solutions contain a little potassium, around five millimoles per litre in Plasma-Lyte, but they don't drive that shift."], [791.1, 800.37, "Tutor", "The BaSICS trial, published by Zampieri and colleagues in JAMA in 2021, randomised eleven thousand and fifty-two ICU patients across seventy-five Brazilian units."], [800.37, 802.82, "Tutor", "It was a two by two factorial design."], [802.82, 814.11, "Tutor", "Plasma-Lyte was compared with zero point nine percent saline, and a slow bolus rate of three hundred and thirty-three millilitres an hour was compared with a fast one of nine hundred and ninety-nine."], [814.11, 821.58, "Tutor", "Ninety-day mortality was twenty-six point four percent with the balanced solution and twenty-seven point two percent with saline."], [821.58, 828.77, "Tutor", "That's a hazard ratio of zero point nine seven, with a confidence interval from zero point nine zero to one point zero five."], [828.77, 829.97, "Tutor", "No difference."], [829.97, 832.81, "Tutor", "The infusion rate made no difference either."], [832.81, 842.07, "Tutor", "The worrying signal was in traumatic brain injury, where mortality was higher with the balanced fluid: thirty-one point three versus twenty-one point one percent."], [842.07, 847.25, "Tutor", "Plasma-Lyte is mildly hypotonic, so that fits the physiology, though it was a subgroup."], [847.25, 856.14, "Tutor", "The criticisms: a low-acuity population, about half of them elective surgical, modest fluid volumes, and a small difference in chloride between the groups."], [856.32, 871.26, "Tutor", "Here's how to quote it in an SAQ: \"BaSICS, eleven thousand patients, showed no mortality difference between balanced crystalloid and saline, with a possible harm signal for balanced fluid in traumatic brain injury.\" For our dialysis patient, either fluid is acceptable."], [871.26, 877.08, "Tutor", "Give modest boluses, judge each one, and don't let fear of potassium push you into litres of saline."], [877.48, 881.91, "Tutor", "A brief detour on where dialysis came from, because it's a remarkable story."], [881.91, 889.52, "Tutor", "In the early 1940s, in the occupied Netherlands, a young physician called Willem Kolff built an artificial kidney in the town of Kampen."], [889.52, 896.38, "Tutor", "He wrapped cellophane sausage casing around a wooden drum that rotated through a bath of dialysis fluid in an enamel tank."], [896.38, 898.49, "Tutor", "Most of his early patients died."], [898.49, 903.99, "Tutor", "Then in September 1945 a sixty-seven-year-old woman in uraemic coma was dialysed for many hours."], [903.99, 905.73, "Tutor", "She woke up and survived."], [905.73, 912.75, "Tutor", "Kolff gave his machines and blueprints away after the war, and they seeded dialysis programmes on both sides of the Atlantic."], [912.75, 917.34, "Tutor", "He later contributed to the intra-aortic balloon pump and the artificial heart."], [917.34, 920.88, "Tutor", "Every dialysis catheter you put in descends from that drum."], [921.28, 922.75, "Tutor", "One more harder twist."], [922.75, 930.2, "Tutor", "Your dialysis patient needs an emergency laparotomy and bleeds from every puncture site, with a normal platelet count and normal clotting times."], [930.2, 932.36, "Tutor", "That's uraemic platelet dysfunction."], [932.36, 933.48, "Tutor", "Dialysis helps."], [933.48, 937.65, "Tutor", "Correct the anaemia, because red cells push platelets out to the vessel wall."], [937.65, 941.86, "Tutor", "And give desmopressin, zero point three micrograms per kilogram intravenously."], [941.86, 943.04, "Tutor", "Notice the unit."], [943.04, 943.97, "Tutor", "Micrograms."], [943.97, 945.88, "Tutor", "We're about to need that again."], [946.78, 948.39, "Examiner", "Before we leave her."], [948.39, 950.52, "Examiner", "Different patient, same unit."], [950.52, 958.23, "Examiner", "A forty-year-old man presents with a urea of fifty-five millimoles per litre, a GCS of thirteen, and he's never been dialysed."], [958.23, 964.68, "Examiner", "Candidate, the registrar wants to run a four-hour intermittent haemodialysis session at full blood flow."], [964.68, 966.06, "Examiner", "What's the risk?"], [966.56, 968.64, "Candidate", "Dialysis disequilibrium syndrome."], [968.64, 972.4, "Candidate", "Urea is removed from the blood faster than it can leave the brain."], [972.4, 977.33, "Candidate", "That leaves an osmotic gradient, and water moves into the brain, causing cerebral oedema."], [977.33, 981.4, "Candidate", "It ranges from headache and nausea through to seizures, coma, and death."], [981.9, 983.14, "Examiner", "Who's at risk?"], [983.64, 985.86, "Candidate", "New patients with a very high urea."], [985.86, 990.61, "Candidate", "Patients with existing brain injury, raised intracranial pressure, or hyponatraemia."], [990.61, 992.62, "Candidate", "The very young and the elderly."], [992.62, 995.2, "Candidate", "And anyone with severe metabolic acidosis."], [995.7, 997.06, "Examiner", "How do you prevent it?"], [997.56, 999.47, "Candidate", "Make the first session gentle."], [999.47, 1007.73, "Candidate", "Use a short session with a lower blood flow and a smaller surface area filter, aiming to lower the urea by no more than about thirty percent the first time."], [1007.73, 1009.19, "Candidate", "Then repeat it daily."], [1009.19, 1013.32, "Candidate", "Or use continuous renal replacement therapy, which lowers the urea slowly."], [1013.32, 1020.32, "Candidate", "In a patient with brain injury or raised intracranial pressure, I'd choose continuous therapy, and I'd keep the sodium high-normal."], [1020.82, 1021.49, "Examiner", "Good."], [1021.49, 1025.42, "Examiner", "That's worth a mark in any question that asks about modality choice."], [1026.82, 1030.46, "Tutor", "This is the 2018 first sitting, question five point two."], [1030.46, 1037.69, "Tutor", "A 47-year-old, previously well, 70 kilogram male was admitted to the Emergency Department with agitation and confusion."], [1037.69, 1043.94, "Tutor", "Following catheterisation, his urine output in the next few hours was 300 to 350 millilitres per hour."], [1043.94, 1047.02, "Tutor", "The results of his blood tests are as follows."], [1047.02, 1050.66, "Tutor", "Sodium, one hundred and sixty-nine millimoles per litre."], [1050.66, 1053.79, "Tutor", "Potassium, four point six millimoles per litre."], [1053.79, 1057.2, "Tutor", "Chloride, one hundred and five millimoles per litre."], [1057.2, 1060.21, "Tutor", "Bicarbonate, twenty-six millimoles per litre."], [1060.21, 1063.17, "Tutor", "Glucose, six point six millimoles per litre."], [1063.17, 1066.02, "Tutor", "Urea, nine point six millimoles per litre."], [1066.02, 1069.71, "Tutor", "Creatinine, one hundred and fifteen micromoles per litre."], [1069.71, 1073.3, "Tutor", "Magnesium, zero point eight eight millimoles per litre."], [1073.3, 1075.92, "Tutor", "Albumin, twenty-eight grams per litre."], [1075.92, 1078.48, "Tutor", "Protein, fifty-eight grams per litre."], [1078.48, 1082.74, "Tutor", "Plasma osmolality, three hundred and sixty millimoles per kilogram."], [1082.74, 1085.98, "Tutor", "Urine specific gravity, one point zero zero five."], [1085.98, 1088.55, "Tutor", "a, what is the most likely diagnosis?"], [1088.55, 1090.19, "Tutor", "Ten percent of marks."], [1090.19, 1093.04, "Tutor", "b, how would you manage the hypernatremia?"], [1093.04, 1094.86, "Tutor", "Thirty percent of marks."], [1095.26, 1101.68, "Tutor", "The examiners wrote that management of diabetes insipidus was handled poorly, and that some fluid regimens were dangerous."], [1101.68, 1105.62, "Tutor", "You first met this question on the fifteenth of October and scored five."], [1105.62, 1110.66, "Tutor", "When you came back to it on the tenth of November you scored six, so it's technically retired."], [1110.66, 1114.75, "Tutor", "But the desmopressin dose was written in milligrams rather than micrograms."], [1114.75, 1116.58, "Tutor", "That's a thousand-fold error."], [1116.58, 1118.4, "Tutor", "In the exam it's a lost mark."], [1118.4, 1120.33, "Tutor", "On the ward it's a catastrophe."], [1120.33, 1121.86, "Tutor", "So it comes back today."], [1122.26, 1124.57, "Tutor", "Diagnosis: diabetes insipidus."], [1124.57, 1133.18, "Tutor", "Severe hypernatraemia, high plasma osmolality, and a large volume of dilute urine with a specific gravity of one point zero zero five."], [1133.18, 1136.27, "Tutor", "The answer that scores then has five moves."], [1136.27, 1140.76, "Tutor", "One, assess volume and cardiac status, because he may also be dry."], [1140.76, 1144.71, "Tutor", "Two, calculate the water deficit and choose a time frame."], [1144.71, 1151.56, "Tutor", "Three, give free water as five percent dextrose or enteral water, and match the ongoing urine losses too."], [1151.56, 1154.84, "Tutor", "Four, decide central or nephrogenic and treat."], [1154.84, 1158.66, "Tutor", "Five, check the sodium every one to two hours at first."], [1159.06, 1160.7, "Tutor", "Let's do the arithmetic."], [1160.7, 1162.54, "Tutor", "He weighs seventy kilograms."], [1162.54, 1164.49, "Tutor", "What's his free water deficit?"], [1164.49, 1165.82, "Tutor", "Pause, and answer."], [1171.22, 1175.31, "Tutor", "Total body water is sixty percent of seventy, which is forty-two litres."], [1175.31, 1180.99, "Tutor", "The deficit is forty-two multiplied by the ratio of the current sodium to the target sodium, minus one."], [1180.99, 1184.32, "Tutor", "One sixty-nine over one forty is about one point two one."], [1184.32, 1189.64, "Tutor", "So the deficit is forty-two times zero point two one, which is roughly eight point seven litres."], [1189.64, 1194.04, "Tutor", "And that's on top of a urine output of over three hundred millilitres an hour."], [1194.04, 1198.23, "Tutor", "That's more than seven litres a day, which you have to replace as it goes."], [1198.23, 1201.66, "Tutor", "Unless you control the urine output, you'll never catch up."], [1202.06, 1203.02, "Tutor", "How fast?"], [1203.02, 1210.83, "Tutor", "If the hypernatraemia is clearly acute, under forty-eight hours, you can lower it faster, around one millimole per litre per hour."], [1210.83, 1223.17, "Tutor", "If it's chronic or the duration is unknown, aim for no more than ten to twelve millimoles per litre in twenty-four hours, because the brain has made idiogenic osmoles and rapid correction risks cerebral oedema."], [1223.17, 1233.42, "Tutor", "One more useful number: each litre of five percent dextrose will lower his sodium by about one sixty-nine divided by forty-three, which is roughly four millimoles per litre."], [1233.82, 1235.62, "Tutor", "Then the specific therapy."], [1235.62, 1242.14, "Tutor", "Desmopressin, one to two micrograms intravenously or subcutaneously, repeated according to urine output and sodium."], [1242.14, 1243.15, "Tutor", "Micrograms."], [1243.15, 1247.92, "Tutor", "If the urine concentrates and the output falls, the diabetes insipidus is central."], [1247.92, 1253.55, "Tutor", "If it doesn't, think nephrogenic, and in a previously well forty-seven-year-old ask about lithium."], [1253.55, 1259.06, "Tutor", "Then the management changes: stop the lithium, check the level, and use a thiazide or amiloride."], [1259.06, 1264.84, "Tutor", "Amiloride blocks the epithelial sodium channel that lithium enters the collecting duct cells through."], [1264.84, 1270.62, "Tutor", "Lithium-induced nephrogenic diabetes insipidus was the focus of a question in the 2026 first sitting."], [1271.02, 1276.98, "Tutor", "In the ICU, central diabetes insipidus has a short list of causes, and you should be able to recite it."], [1276.98, 1279.03, "Tutor", "Severe traumatic brain injury."], [1279.03, 1280.8, "Tutor", "Subarachnoid haemorrhage."], [1280.8, 1283.48, "Tutor", "Hypoxic brain injury after cardiac arrest."], [1283.48, 1285.74, "Tutor", "Pituitary or hypothalamic surgery."], [1285.74, 1295.2, "Tutor", "And brain death, where diabetes insipidus is so common that its sudden appearance in a deteriorating neurosurgical patient should make you check the brainstem reflexes."], [1295.2, 1309.38, "Tutor", "In the organ donor, the targets are a sodium below about one hundred and fifty-five millimoles per litre and a urine output brought back to between half a millilitre and three millilitres per kilogram per hour, using desmopressin or a vasopressin infusion."], [1309.78, 1313.2, "Tutor", "After pituitary surgery, watch for the triphasic response."], [1313.2, 1319.68, "Tutor", "First comes polyuria from diabetes insipidus over the first few days, as the damaged neurones stop releasing hormone."], [1319.68, 1330.2, "Tutor", "Then, for about a week, there's an antidiuretic phase as the dying neurones release their stored hormone, and the patient can become dangerously hyponatraemic if you're still giving desmopressin."], [1330.2, 1333.16, "Tutor", "Finally, permanent diabetes insipidus can follow."], [1333.16, 1337.15, "Tutor", "So the drug that rescued them on day two can drown them on day seven."], [1337.15, 1345.34, "Tutor", "That's why you give desmopressin as single doses guided by the urine output and sodium, rather than as a fixed regular prescription in the first week."], [1345.74, 1349.17, "Tutor", "Now the twist, and it links to one of today's Fresh cards."], [1349.17, 1357.64, "Tutor", "Same man, but he's had a prolonged cardiac arrest from the agitation, and he now has an acute kidney injury and needs continuous renal replacement therapy."], [1357.64, 1360.49, "Tutor", "His sodium is still one hundred and sixty-nine."], [1360.49, 1365.85, "Tutor", "Standard replacement fluid contains about one hundred and forty millimoles per litre of sodium."], [1365.85, 1368.34, "Tutor", "What happens when you start the circuit?"], [1369.24, 1370.53, "Examiner", "I'll take that one."], [1370.53, 1372.72, "Examiner", "Candidate, what happens to his sodium?"], [1373.22, 1376.06, "Candidate", "The circuit equilibrates plasma with the fluid."], [1376.06, 1383.77, "Candidate", "With a normal effluent dose, his sodium will fall toward one forty quite quickly, potentially by well over ten millimoles per litre in a day."], [1383.77, 1386.66, "Candidate", "That's the overcorrection we're trying to avoid."], [1387.16, 1388.76, "Examiner", "So what do you do?"], [1389.26, 1391.62, "Candidate", "I'd set the fluid sodium close to his."], [1391.62, 1399.95, "Candidate", "I'd add hypertonic saline to the bags so the sodium starts within about eight to ten millimoles per litre of his plasma level, then step it down each day."], [1399.95, 1402.57, "Candidate", "I'd measure sodium every four to six hours."], [1402.57, 1405.34, "Candidate", "I could also start with a lower effluent dose."], [1405.84, 1406.53, "Examiner", "Good."], [1406.53, 1410.0, "Examiner", "And the mirror image, a sodium of one hundred and twelve?"], [1410.5, 1412.54, "Candidate", "The same principle in reverse."], [1412.54, 1418.97, "Candidate", "Lower the fluid sodium, for example by adding sterile water to the bags, or run five percent dextrose alongside."], [1418.97, 1425.14, "Candidate", "That stops the circuit correcting it by twenty-eight millimoles in a day and causing osmotic demyelination."], [1425.64, 1426.9, "Examiner", "That's the whole concept."], [1426.9, 1429.28, "Examiner", "The circuit doesn't care about your correction limits."], [1429.28, 1431.2, "Examiner", "You have to programme them into the fluid."], [1432.1, 1438.9, "Tutor", "And a reminder from the hyponatraemia question you met in October, the 2011 second sitting, question five."], [1438.9, 1446.3, "Tutor", "When you restore volume in hypovolaemic hyponatraemia, the baroreceptor drive for antidiuretic hormone switches off."], [1446.3, 1450.3, "Tutor", "The kidney then dumps free water, and the sodium shoots up."], [1450.3, 1454.36, "Tutor", "Watch the urine output and check the sodium every two hours."], [1454.36, 1461.88, "Tutor", "Alcohol, malnutrition, hypokalaemia and elderly women on thiazides are the classic osmotic demyelination risk factors."], [1461.88, 1464.98, "Tutor", "The same physiology runs in both directions."], [1464.98, 1468.26, "Tutor", "Water moves fast, and the brain pays for speed."], [1469.66, 1472.68, "Tutor", "This is the 2016 first sitting, question six."], [1472.68, 1476.22, "Tutor", "The same question was used in the 2015 second sitting."], [1476.22, 1482.32, "Tutor", "A 76-year-old female is admitted to the ICU following elective aortic and mitral valve replacement."], [1482.32, 1487.68, "Tutor", "Transoesophageal echo at the end of surgery showed an ejection fraction of 20 percent."], [1487.68, 1491.38, "Tutor", "Her preoperative creatinine was 340 micromoles per litre."], [1491.38, 1493.78, "Tutor", "Total bypass time was 240 minutes."], [1493.78, 1497.43, "Tutor", "On arrival in ICU the patient has the following indices."], [1497.43, 1500.22, "Tutor", "Temperature, thirty-five degrees Celsius."], [1500.22, 1503.02, "Tutor", "Atrial pacing, AAI, at eighty per minute."], [1503.02, 1507.81, "Tutor", "Systemic blood pressure, eighty-five over fifty-five millimetres of mercury."], [1507.81, 1512.14, "Tutor", "Pulmonary artery pressure, sixty over thirty millimetres of mercury."], [1512.14, 1516.3, "Tutor", "Cardiac index, one point five litres per minute per square metre."], [1516.3, 1522.69, "Tutor", "Systemic vascular resistance, one thousand seven hundred dynes seconds per centimetre to the minus five."], [1522.69, 1526.56, "Tutor", "Pulmonary artery wedge pressure, ten millimetres of mercury."], [1526.56, 1530.1, "Tutor", "Central venous pressure, eight millimetres of mercury."], [1530.1, 1533.29, "Tutor", "Adrenaline infusion, four micrograms per minute."], [1533.29, 1538.94, "Tutor", "a, list the specific clinical and haemodynamic issues for this patient on admission to ICU."], [1538.94, 1540.7, "Tutor", "Forty percent of marks."], [1540.7, 1543.61, "Tutor", "b, outline your management of these issues."], [1543.61, 1545.38, "Tutor", "Sixty percent of marks."], [1545.78, 1551.97, "Tutor", "Ninety-five percent of candidates passed it, and the examiners' main complaint was superficial, generic management plans."], [1551.97, 1554.85, "Tutor", "You scored four and a half on the tenth of November."], [1554.85, 1557.1, "Tutor", "The core error was reading the numbers."], [1557.5, 1559.1, "Tutor", "So, the numbers."], [1559.1, 1566.23, "Tutor", "A cardiac index of one point five, a wedge of ten, a CVP of eight, and an SVR of seventeen hundred."], [1566.23, 1568.77, "Tutor", "What's the haemodynamic state?"], [1568.77, 1570.5, "Tutor", "Pause, and answer."], [1575.9, 1580.0, "Tutor", "A low output state with low-normal filling pressures and a high afterload."], [1580.0, 1585.79, "Tutor", "The wedge of ten after a double valve replacement, in a stiff, hypertrophied ventricle, is probably too low."], [1585.79, 1587.69, "Tutor", "She's likely fluid responsive."], [1587.69, 1590.63, "Tutor", "The SVR is high, not low, so this isn't vasoplegia."], [1590.63, 1598.03, "Tutor", "Reaching for noradrenaline would raise the afterload on a ventricle with an ejection fraction of twenty percent and drop the output further."], [1598.03, 1604.82, "Tutor", "And a mean arterial pressure of sixty-five is probably not enough for a woman whose kidneys were already failing before surgery."], [1605.22, 1608.19, "Tutor", "Now the issues list, which earns forty percent."], [1608.19, 1612.52, "Tutor", "An elderly woman after a double valve operation with a long bypass time."], [1612.52, 1614.95, "Tutor", "Pre-existing severe renal impairment."], [1614.95, 1616.04, "Tutor", "Hypotension."], [1616.04, 1619.44, "Tutor", "A low output state with poor left ventricular function."], [1619.44, 1621.06, "Tutor", "Probable hypovolaemia."], [1621.06, 1622.31, "Tutor", "High afterload."], [1622.31, 1624.47, "Tutor", "Moderate pulmonary hypertension."], [1624.47, 1625.55, "Tutor", "Hypothermia."], [1625.55, 1631.5, "Tutor", "And, implicitly, the risks of bleeding and coagulopathy after two hundred and forty minutes on bypass."], [1631.9, 1633.73, "Tutor", "Management, sixty percent."], [1633.73, 1637.72, "Tutor", "Rewarm her, and give judicious fluid as she warms and vasodilates."], [1637.72, 1646.77, "Tutor", "Get a bedside echo, transoesophageal if the windows are poor, looking for tamponade, prosthetic valve function, left and right ventricular filling and function."], [1646.77, 1653.07, "Tutor", "Titrate the adrenaline to a cardiac index above two point two, and add an inodilator if the output stays low."], [1653.07, 1661.85, "Tutor", "That might be milrinone, at around zero point three seven five to zero point seven five micrograms per kilogram per minute, or levosimendan, or dobutamine."], [1661.85, 1666.64, "Tutor", "If she's still in low output despite that, consider an intra-aortic balloon pump."], [1666.64, 1669.34, "Tutor", "Use AV sequential pacing at around ninety."], [1669.34, 1673.81, "Tutor", "Correct coagulopathy and keep the haemoglobin above eighty grams per litre."], [1673.81, 1676.45, "Tutor", "Plan early for renal replacement therapy."], [1676.45, 1680.38, "Tutor", "And consider inhaled nitric oxide for the pulmonary hypertension."], [1680.78, 1682.34, "Tutor", "Now let's go further."], [1682.34, 1685.15, "Tutor", "Calculate her pulmonary vascular resistance."], [1685.15, 1690.86, "Tutor", "The mean pulmonary artery pressure is sixty plus two times thirty, all over three, which is forty."], [1690.86, 1695.33, "Tutor", "The transpulmonary gradient is forty minus a wedge of ten, which is thirty."], [1695.33, 1706.06, "Tutor", "Her cardiac output is about two and a half litres a minute, because a cardiac index of one point five multiplied by a body surface area of about one point seven is around two point five five."], [1706.06, 1714.47, "Tutor", "Thirty divided by two point five five is nearly twelve Wood units, or roughly nine hundred and forty dynes seconds per centimetre to the minus five."], [1714.47, 1722.5, "Tutor", "That's severe pre-capillary pulmonary hypertension, probably from long-standing mitral disease, and it's a right ventricle under real strain."], [1723.4, 1725.64, "Examiner", "Two hours later the nurse calls you."], [1725.64, 1728.25, "Examiner", "The CVP has climbed from eight to eighteen."], [1728.25, 1729.68, "Examiner", "The wedge is twelve."], [1729.68, 1731.92, "Examiner", "The cardiac index is one point four."], [1731.92, 1734.01, "Examiner", "The chest drains have gone quiet."], [1734.01, 1735.8, "Examiner", "What are you worried about?"], [1736.3, 1737.33, "Candidate", "Two things."], [1737.33, 1743.4, "Candidate", "Tamponade, because the drains stopping while the CVP rises is a classic sign of clot in the pericardium."], [1743.4, 1750.33, "Candidate", "And acute right ventricular failure, because she has severe pulmonary hypertension and she's just had a long bypass run."], [1750.33, 1757.86, "Candidate", "A CVP well above the wedge favours the right ventricle, but a localised clot behind the right atrium can do exactly the same thing."], [1758.36, 1759.84, "Examiner", "How do you tell them apart?"], [1760.34, 1766.43, "Candidate", "Echo, and transoesophageal if the transthoracic windows are poor, which they usually are after sternotomy."], [1766.43, 1773.81, "Candidate", "Tamponade after cardiac surgery is often localised, so you may not see the classic equalisation of pressures or a global effusion."], [1773.81, 1778.35, "Candidate", "If there's a collection compressing a chamber, the surgeon reopens the chest."], [1778.35, 1784.66, "Candidate", "If it's a dilated, hypokinetic right ventricle with the septum pushed left, I treat right ventricular failure."], [1785.16, 1787.04, "Examiner", "And the treatment of the right ventricle?"], [1787.54, 1792.04, "Candidate", "Optimise preload, which usually means stopping fluid rather than giving it."], [1792.04, 1804.28, "Candidate", "Reduce the right ventricular afterload: avoid hypoxia, hypercapnia and acidosis, keep the plateau pressure and PEEP modest, and start inhaled nitric oxide at around twenty parts per million or use inhaled prostacyclin."], [1804.28, 1807.47, "Candidate", "Support contractility with milrinone or adrenaline."], [1807.47, 1813.76, "Candidate", "Maintain systemic pressure with noradrenaline or vasopressin, so that the right coronary artery is perfused."], [1813.76, 1815.38, "Candidate", "And keep AV synchrony."], [1815.88, 1818.8, "Examiner", "You've left out one thing that kills these patients."], [1819.3, 1821.55, "Candidate", "Intubation and positive pressure."], [1821.55, 1830.16, "Candidate", "If she weren't already ventilated, induction could precipitate a right ventricular arrest, so it needs a cautious induction with vasopressor running."], [1830.16, 1835.26, "Candidate", "And if she fails all of that, a temporary right ventricular assist device or VA ECMO."], [1835.76, 1836.51, "Examiner", "Fine."], [1836.51, 1840.03, "Examiner", "That's around seven out of ten as an extended answer."], [1840.03, 1845.28, "Examiner", "The fix is the one from November: interpret every number before you treat anything."], [1845.28, 1847.47, "Examiner", "Wedge, CVP, index, resistance."], [1847.47, 1851.28, "Examiner", "Say what each one means, and the management writes itself."], [1852.18, 1854.83, "Tutor", "That last line is the whole revisit."], [1854.83, 1870.29, "Tutor", "Low output after cardiac surgery has been asked three times in the bank, with closely related questions on shock after cardiac surgery appearing as recently as the 2026 second sitting, and right ventricular dysfunction after cardiac surgery in 2025."], [1870.29, 1873.9, "Tutor", "Next week's block is cardiac, so this is the bridge."], [1875.3, 1876.73, "Tutor", "Time for the round-up."], [1876.73, 1877.87, "Tutor", "Six items today."], [1877.87, 1884.35, "Tutor", "One finishes this week's shock block, three finish the renal block, and two are beyond this week, from obstetrics and infection."], [1884.35, 1888.82, "Tutor", "Each one gets what an examiner wants, the numbers, and the trial or guideline to name."], [1889.22, 1893.98, "Tutor", "First, mechanical cardiac supports: ventricular assist devices and the Impella."], [1893.98, 1896.72, "Tutor", "Oh's covers these in chapter twenty-eight."], [1896.72, 1898.58, "Tutor", "Start with the categories."], [1898.58, 1905.98, "Tutor", "Temporary percutaneous devices include the intra-aortic balloon pump, the Impella family of microaxial flow pumps, and VA ECMO."], [1905.98, 1911.18, "Tutor", "Durable devices are implanted left ventricular assist devices, such as the HeartMate 3."], [1911.18, 1916.88, "Tutor", "The Impella sits across the aortic valve and pumps blood from the left ventricle into the aorta."], [1916.88, 1926.13, "Tutor", "It unloads the ventricle while adding forward flow, around three and a half to four litres a minute for the CP device, and more for the larger surgical versions."], [1926.13, 1934.18, "Tutor", "Its complications are the exam points: haemolysis, limb ischaemia at the access site, bleeding, device migration, and aortic regurgitation."], [1934.58, 1941.24, "Tutor", "The trial to name is DanGer Shock, published by Møller and colleagues in the New England Journal of Medicine in 2024."], [1941.24, 1952.54, "Tutor", "Three hundred and sixty patients with ST-elevation myocardial infarction and cardiogenic shock, with a lactate above two point five millimoles per litre, were randomised to an Impella CP or standard care."], [1952.54, 1960.85, "Tutor", "Death at one hundred and eighty days was forty-five point eight versus fifty-eight point five percent, with a hazard ratio of zero point seven four."], [1960.85, 1963.57, "Tutor", "The number needed to treat was about eight."], [1963.57, 1972.42, "Tutor", "But the composite of serious device complications was twenty-four versus six percent, and renal replacement therapy was forty-two versus twenty-seven percent."], [1972.42, 1978.39, "Tutor", "It took ten years to recruit, it wasn't blinded, and it excluded comatose patients after cardiac arrest."], [1978.39, 1988.46, "Tutor", "Quote it as: \"the first trial of mechanical support to show a survival benefit in infarct-related cardiogenic shock, at the cost of more bleeding, limb ischaemia and kidney injury.\""], [1988.86, 1993.3, "Tutor", "For a patient with a durable left ventricular assist device, know four things."], [1993.3, 2000.38, "Tutor", "The pulse may be absent, so measure the mean pressure by Doppler, aiming for around seventy to eighty and certainly below ninety."], [2000.38, 2006.21, "Tutor", "They're anticoagulated, and they develop an acquired von Willebrand deficiency, so GI bleeding is common."], [2006.21, 2010.45, "Tutor", "Pump thrombosis shows up as a rising lactate dehydrogenase and haemolysis."], [2010.45, 2013.96, "Tutor", "And right ventricular failure is the commonest early killer."], [2013.96, 2020.98, "Tutor", "A suction event, where the ventricle collapses onto the inflow cannula, usually means hypovolaemia or right ventricular failure."], [2020.98, 2024.7, "Tutor", "It's treated with volume and a lower pump speed, not more speed."], [2025.1, 2032.01, "Tutor", "Second, the acute interstitial nephritis and glomerular causes of kidney injury, from Oh's chapter fifty-five."], [2032.01, 2038.51, "Tutor", "Acute interstitial nephritis was asked as the third part of the 2016 second sitting, question thirteen."], [2038.51, 2047.23, "Tutor", "A previously well woman on intravenous antibiotics for cellulitis becomes oliguric on day five, with an eosinophil count of four point three."], [2047.23, 2051.74, "Tutor", "The answer was allergic interstitial nephritis due to the antibiotic."], [2051.74, 2057.59, "Tutor", "The culprits are beta-lactams, proton pump inhibitors, NSAIDs, sulphonamides and rifampicin."], [2057.59, 2064.03, "Tutor", "The classic triad of fever, rash and eosinophilia is present in only a minority, so don't wait for it."], [2064.03, 2067.37, "Tutor", "The urine shows white cells and white cell casts."], [2067.37, 2069.53, "Tutor", "Eosinophiluria is unreliable."], [2069.53, 2071.64, "Tutor", "Biopsy is the gold standard."], [2071.64, 2078.9, "Tutor", "Management is to stop the drug, and to consider early corticosteroids if function doesn't recover within a few days."], [2079.3, 2082.49, "Tutor", "The glomerular syndromes come in two flavours."], [2082.49, 2091.16, "Tutor", "Nephrotic syndrome means proteinuria above three and a half grams a day, albumin below thirty grams per litre, oedema, and hyperlipidaemia."], [2091.16, 2098.76, "Tutor", "The ICU complication to name is venous thrombosis, including renal vein thrombosis, especially in membranous nephropathy."], [2098.76, 2104.78, "Tutor", "Nephritic syndrome means haematuria with red cell casts, hypertension and a rising creatinine."], [2104.78, 2110.5, "Tutor", "When it's rapidly progressive and the lungs bleed too, that's a pulmonary-renal syndrome."], [2110.5, 2115.16, "Tutor", "Think of ANCA vasculitis and anti-glomerular basement membrane disease."], [2115.16, 2123.83, "Tutor", "Send the ANCA, the anti-GBM antibody, complement, ANA and urine microscopy, and call nephrology early for the biopsy and induction therapy."], [2123.83, 2127.84, "Tutor", "Plasma exchange still has a clear place in anti-GBM disease."], [2127.84, 2135.45, "Tutor", "In ANCA vasculitis, the PEXIVAS trial didn't show that routine plasma exchange reduced death or end-stage kidney disease."], [2135.45, 2141.7, "Tutor", "You saw part of this angle in October, in the pneumonia question that wanted an autoimmune screen."], [2142.1, 2146.36, "Tutor", "Third, renal transplantation, from Oh's chapter one hundred and sixteen."], [2146.36, 2149.56, "Tutor", "A transplant recipient in the ICU has four problems."], [2149.56, 2153.99, "Tutor", "The graft, the immunosuppression, the infection, and the drug interactions."], [2153.99, 2162.84, "Tutor", "Protect the graft: avoid nephrotoxins and hypovolaemia, and get an early Doppler ultrasound if function falls, to look at the artery, the vein and the ureter."], [2162.84, 2172.54, "Tutor", "Tacrolimus and cyclosporin are themselves nephrotoxic and cause hypertension, hyperkalaemia, hypomagnesaemia and neurotoxicity, including posterior reversible encephalopathy."], [2172.54, 2174.41, "Tutor", "So check the trough levels."], [2174.41, 2177.13, "Tutor", "Azoles and macrolides push those levels up."], [2177.13, 2179.69, "Tutor", "Rifampicin and phenytoin pull them down."], [2179.69, 2183.9, "Tutor", "Patients on long-term prednisolone may need stress-dose hydrocortisone."], [2184.3, 2186.78, "Tutor", "The infection timeline is a favourite."], [2186.78, 2190.87, "Tutor", "In the first month, it's the usual surgical and hospital infections."], [2190.87, 2196.36, "Tutor", "From one to six months, it's the opportunistic ones: cytomegalovirus, Pneumocystis, and fungi."], [2196.36, 2202.18, "Tutor", "After six months, it's mostly community infections, unless the immunosuppression has been increased."], [2202.18, 2207.72, "Tutor", "The College has asked about the timing of infection after transplant in the 2023 first sitting."], [2207.72, 2212.35, "Tutor", "Whenever immunosuppression is reduced for sepsis, involve the transplant team."], [2212.35, 2215.1, "Tutor", "Rejection is the price of getting it wrong."], [2215.5, 2220.8, "Tutor", "While we're on the kidney, one more item that finishes the renal block: renal imaging."], [2220.8, 2225.03, "Tutor", "Ultrasound comes first in nearly every case of acute kidney injury."], [2225.03, 2229.25, "Tutor", "It's quick, it can be done at the bedside, and it uses no contrast."], [2229.25, 2231.23, "Tutor", "It answers three questions."], [2231.23, 2233.26, "Tutor", "First, is there obstruction?"], [2233.26, 2238.55, "Tutor", "Hydronephrosis means a post-renal cause, and you need a catheter or a nephrostomy now."], [2238.55, 2240.81, "Tutor", "Second, how big are the kidneys?"], [2240.81, 2248.36, "Tutor", "Small, echogenic kidneys under about nine centimetres suggest chronic disease, which changes how you interpret the creatinine."], [2248.36, 2250.34, "Tutor", "Third, is there blood flow?"], [2250.34, 2257.1, "Tutor", "A Doppler study looks for renal artery or vein thrombosis, especially after a transplant or an aortic procedure."], [2257.5, 2259.1, "Tutor", "CT has its own place."], [2259.1, 2261.79, "Tutor", "A non-contrast CT is the test for stones."], [2261.79, 2268.56, "Tutor", "A CT angiogram is the test for renal artery dissection, aortic dissection with renal involvement, and renal trauma."], [2268.56, 2272.24, "Tutor", "The fear of contrast has shrunk a lot over the last decade."], [2272.24, 2280.83, "Tutor", "Large propensity-matched studies have suggested that much of what was called contrast nephropathy was kidney injury that would have happened anyway."], [2280.83, 2284.62, "Tutor", "Don't withhold a diagnostic scan that will change management."], [2284.62, 2291.06, "Tutor", "Instead, make sure the patient is euvolaemic, use the smallest dose that does the job, and stop nephrotoxins."], [2291.06, 2295.52, "Tutor", "For MRI, the old worry was nephrogenic systemic fibrosis with gadolinium."], [2295.52, 2303.66, "Tutor", "With modern macrocyclic agents, that risk is very low even with poor renal function, so again, the scan shouldn't be refused if it's needed."], [2304.06, 2308.07, "Tutor", "Fourth, beyond this week: special considerations in the obstetric patient."], [2308.07, 2310.57, "Tutor", "Oh's chapters eighty-eight and eighty-nine."], [2310.57, 2317.03, "Tutor", "The curriculum links this item to twenty-nine past questions, which makes it one of the most examined areas in the syllabus."], [2317.03, 2320.85, "Tutor", "Let's start with the physiology, because everything else hangs off it."], [2320.85, 2324.47, "Tutor", "In the third trimester, what are the normal PaCO2 and bicarbonate?"], [2324.47, 2325.74, "Tutor", "Pause, and answer."], [2331.14, 2336.29, "Tutor", "The PaCO2 is around thirty millimetres of mercury, because progesterone drives ventilation."], [2336.29, 2341.81, "Tutor", "The bicarbonate falls to around eighteen to twenty-one millimoles per litre as renal compensation."], [2341.81, 2343.84, "Tutor", "So the pH is slightly alkaline."], [2343.84, 2348.79, "Tutor", "That means a PaCO2 of forty in a pregnant asthmatic is a sign of tiring, not normality."], [2348.79, 2353.73, "Tutor", "And a mildly low bicarbonate is expected, not a pathological normal anion gap acidosis."], [2353.73, 2358.36, "Tutor", "That was exactly the misread that cost you marks in the pregnancy gas in October."], [2358.36, 2361.59, "Tutor", "Cardiac output rises by around forty to fifty percent."], [2361.59, 2365.29, "Tutor", "Systemic vascular resistance and colloid osmotic pressure fall."], [2365.29, 2369.71, "Tutor", "The functional residual capacity drops, so they desaturate fast at induction."], [2369.71, 2373.46, "Tutor", "Their airways are oedematous, and they're at risk of aspiration."], [2373.86, 2375.44, "Tutor", "Then the emergencies."], [2375.44, 2381.94, "Tutor", "Aortocaval compression from about twenty weeks, so use manual left uterine displacement or a left lateral tilt."], [2381.94, 2391.66, "Tutor", "In cardiac arrest, if the uterus is at or above the umbilicus, the resuscitative hysterotomy should begin by four minutes and the baby should be delivered by around five."], [2391.66, 2396.52, "Tutor", "That's for the mother's sake, because emptying the uterus restores venous return."], [2396.52, 2407.11, "Tutor", "For severe pre-eclampsia, the SOMANZ 2023 hypertension in pregnancy guideline treats a systolic of one hundred and sixty or more, or a diastolic of one hundred and ten or more, urgently."], [2407.11, 2415.25, "Tutor", "Magnesium sulphate is given as a four-gram intravenous load over twenty minutes, then one gram an hour, halving the dose in renal impairment."], [2415.25, 2417.82, "Tutor", "Check reflexes and urine output hourly."], [2417.82, 2422.89, "Tutor", "Toxicity shows up as loss of reflexes and then a respiratory rate of twelve or below."], [2422.89, 2426.93, "Tutor", "The treatment is ten millilitres of ten percent calcium gluconate."], [2426.93, 2438.62, "Tutor", "The other headline obstetric emergencies are major haemorrhage, where a fibrinogen below two grams per litre predicts severe bleeding, amniotic fluid embolism, peripartum cardiomyopathy, and HELLP syndrome."], [2439.02, 2441.09, "Tutor", "Each of those has a signature."], [2441.09, 2444.92, "Tutor", "HELLP is haemolysis, elevated liver enzymes and low platelets."], [2444.92, 2449.72, "Tutor", "It sits on the pre-eclampsia spectrum, and the definitive treatment is delivery."], [2449.72, 2454.36, "Tutor", "The ICU complications are liver haematoma and rupture, kidney injury and DIC."], [2454.36, 2462.93, "Tutor", "Amniotic fluid embolism classically presents at delivery as sudden collapse, hypoxia, and a consumptive coagulopathy that arrives early and severely."], [2462.93, 2464.68, "Tutor", "Treatment is supportive."], [2464.68, 2470.08, "Tutor", "Expect right ventricular failure first, replace fibrinogen aggressively, and consider ECMO."], [2470.08, 2479.85, "Tutor", "Peripartum cardiomyopathy is new left ventricular systolic dysfunction, with an ejection fraction below forty-five percent, in late pregnancy or the months after delivery."], [2479.85, 2484.98, "Tutor", "Treat it as heart failure, with drug choices adjusted for pregnancy and breastfeeding."], [2484.98, 2490.28, "Tutor", "Bromocriptine is used in some centres, and mechanical support is a bridge in the sickest."], [2490.28, 2498.47, "Tutor", "One last principle runs through every obstetric SAQ: there are two patients, and resuscitating the mother is the best treatment for the fetus."], [2498.47, 2503.38, "Tutor", "Always mention early involvement of the obstetric, anaesthetic and neonatal teams."], [2503.38, 2507.42, "Tutor", "Name the decision about delivery explicitly, including its timing."], [2507.82, 2513.05, "Tutor", "Fifth, also beyond this week: antimicrobial use in the ICU, with antimicrobial pharmacology."], [2513.05, 2514.89, "Tutor", "That's Oh's chapter twenty."], [2514.89, 2518.13, "Tutor", "The syllabus links this to twenty-four past questions."], [2518.13, 2520.07, "Tutor", "An examiner wants four ideas."], [2520.07, 2521.53, "Tutor", "The first is timing."], [2521.53, 2528.65, "Tutor", "The 2026 Surviving Sepsis Campaign guidelines have kept the urgency for definite sepsis and shock: give antibiotics immediately."], [2528.65, 2535.29, "Tutor", "But for possible sepsis without shock, they've moved to a risk-based approach that allows a short period of assessment."], [2535.29, 2540.58, "Tutor", "They also emphasise avoiding unnecessary anaerobic, antifungal and broad gram-negative cover."], [2540.98, 2544.19, "Tutor", "The second idea is pharmacokinetics in the critically ill."], [2544.19, 2550.5, "Tutor", "The volume of distribution goes up with capillary leak and fluid, so loading doses go up too, whatever the renal function."], [2550.5, 2555.02, "Tutor", "Clearance can be reduced in kidney injury, or increased in augmented renal clearance."], [2555.02, 2563.38, "Tutor", "That's a creatinine clearance above about one hundred and thirty millilitres a minute, common in young trauma and head injury patients, and it leads to underdosing."], [2563.78, 2565.92, "Tutor", "The third is pharmacodynamics."], [2565.92, 2571.54, "Tutor", "Beta-lactams are time-dependent: what matters is the time the free drug stays above the MIC."], [2571.54, 2578.45, "Tutor", "Aminoglycosides are concentration-dependent, so give them once daily with a peak around eight to ten times the MIC."], [2578.45, 2584.02, "Tutor", "For vancomycin, the target is the area under the curve, around four hundred to six hundred."], [2584.42, 2586.17, "Tutor", "That leads to the trial."], [2586.17, 2595.78, "Tutor", "BLING III, published by Dulhunty and colleagues in JAMA in 2024, randomised about seven thousand septic ICU patients to continuous or intermittent beta-lactam infusion."], [2595.78, 2600.91, "Tutor", "Ninety-day mortality was twenty-four point nine versus twenty-six point eight percent."], [2600.91, 2606.65, "Tutor", "That's an absolute difference of one point nine percent, and it wasn't statistically significant."], [2606.65, 2610.25, "Tutor", "Clinical cure was clearly better with continuous infusion."], [2610.25, 2615.55, "Tutor", "A companion meta-analysis in the same year found lower mortality with prolonged infusion."], [2615.55, 2622.1, "Tutor", "So prolonged or continuous beta-lactam infusion is now a reasonable default, and you can defend it in an answer."], [2622.5, 2625.15, "Tutor", "Put that together with this week's renal block."], [2625.15, 2628.81, "Tutor", "How do you dose antibiotics on continuous renal replacement therapy?"], [2628.81, 2630.49, "Tutor", "Give the full loading dose."], [2630.49, 2635.84, "Tutor", "Then the maintenance dose depends on the effluent rate and on how much of the drug is bound to protein."], [2635.84, 2649.37, "Tutor", "At a typical effluent dose of twenty-five to thirty millilitres per kilogram per hour, clearance of a small, water-soluble, poorly protein-bound drug, like meropenem or piperacillin, is often similar to a creatinine clearance of around thirty to fifty millilitres a minute."], [2649.37, 2654.37, "Tutor", "So the renal-failure doses in the drug handbook, which assume no clearance, will underdose them."], [2654.37, 2657.79, "Tutor", "When circuit downtime is long, the patient is underdosed again."], [2657.79, 2665.35, "Tutor", "Use therapeutic drug monitoring where you have it, for vancomycin and aminoglycosides routinely and for beta-lactams where your laboratory offers it."], [2665.35, 2669.78, "Tutor", "Underdosing in the first forty-eight hours is the commoner and more dangerous error."], [2670.18, 2672.57, "Tutor", "The fourth idea is stewardship."], [2672.57, 2682.46, "Tutor", "That means cultures before antibiotics where it doesn't delay them, de-escalation at forty-eight to seventy-two hours, short courses, and source control."], [2682.46, 2695.78, "Tutor", "When you write about resistance, which was asked in the 2017 second sitting, name the organisms: MRSA, VRE, ESBL and carbapenemase-producing Enterobacterales, and multi-resistant Pseudomonas and Acinetobacter."], [2697.18, 2699.24, "Tutor", "That's the spiral for this week."], [2699.24, 2701.19, "Tutor", "One thing to do before Monday."], [2701.19, 2706.64, "Tutor", "Take a blank page and write out the issues list for the 2016 cardiac surgery question from memory."], [2706.64, 2710.09, "Tutor", "Interpret every number before you write a single treatment."], [2710.09, 2712.41, "Tutor", "Then check it against today's answer."], [2712.41, 2719.51, "Tutor", "While you're there, write the desmopressin dose for diabetes insipidus and for uraemic bleeding, with the units, three times each."], [2719.51, 2722.49, "Tutor", "Small habits like that are what protect the marks."], [2722.49, 2723.98, "Tutor", "Thanks for listening."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 60.48, "title": "Spiral review 1: rhabdomyolysis, heat stroke and hyperkalaemia"}, {"start": 554.34, "title": "Spiral review 2: end-stage kidney disease meets septic shock"}, {"start": 1026.82, "title": "Spiral review 3: hypernatraemia, diabetes insipidus and the CRRT circuit"}, {"start": 1469.66, "title": "Spiral review 4: low output after cardiac surgery, with the right ventricle"}, {"start": 1875.3, "title": "Syllabus round-up"}, {"start": 2697.18, "title": "Close"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
