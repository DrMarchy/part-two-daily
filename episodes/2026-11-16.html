<script>
var C=[[0.0, 1.73, "Tutor", "Welcome to Part Two Daily."], [1.73, 7.19, "Tutor", "It's Monday the sixteenth of November, and this is the primer for week six: cardiac intensive care."], [7.19, 9.38, "Tutor", "Sixteen weeks to the written paper."], [9.38, 13.81, "Tutor", "Cardiac is the block where the College shows you a picture and asks what it is."], [13.81, 18.3, "Tutor", "The ECG has turned up more often than almost any other single item in the paper."], [18.3, 25.54, "Tutor", "But the questions that sink candidates are the ones with an unstable patient attached to the rhythm, and that's where this week lives."], [25.54, 27.22, "Tutor", "Here's the running order."], [27.22, 29.56, "Tutor", "First, a short look back at last week."], [29.56, 39.3, "Tutor", "Then the week's theme: the unstable arrhythmia, new atrial fibrillation in the critically ill, broad complex tachycardia, dynamic outflow obstruction and arrest after cardiac surgery."], [39.3, 45.77, "Tutor", "Then two landmark trials, an exam practice question from the 2021 second sitting, and a syllabus round-up of six items."], [45.77, 46.64, "Tutor", "Let's go."], [48.04, 49.04, "Tutor", "Last week."], [49.04, 58.95, "Tutor", "Two answers on Wednesday the eleventh earned four and a half each, and they share a lesson: you knew the territory but left the specific, mark-bearing detail on the table."], [58.95, 63.61, "Tutor", "The first was fluid responsiveness, 2020 second sitting, question seventeen."], [63.61, 68.31, "Tutor", "The examiners wanted the limitations of pulse pressure variation spelled out."], [68.31, 76.46, "Tutor", "Pulse pressure variation above about twelve percent predicts a response, with an area under the curve around 0.94 in Marik's meta-analysis."], [76.46, 79.23, "Tutor", "But it only holds under strict conditions."], [79.23, 83.38, "Tutor", "First, controlled ventilation with no spontaneous breathing effort."], [83.38, 87.43, "Tutor", "Second, tidal volumes of at least eight millilitres per kilogram."], [87.43, 88.98, "Tutor", "Third, sinus rhythm."], [88.98, 90.7, "Tutor", "Fourth, a closed chest."], [90.7, 95.29, "Tutor", "Fifth, no right ventricular failure and no raised intra-abdominal pressure."], [95.29, 100.83, "Tutor", "In your answer those limitations drifted under passive leg raising, where they don't belong."], [100.83, 103.44, "Tutor", "Hold on to the third one, sinus rhythm."], [103.44, 111.36, "Tutor", "This week you'll meet a patient in fast atrial fibrillation, and the variation in pulse pressure from beat to beat will be meaningless."], [111.36, 116.4, "Tutor", "Passive leg raising, by contrast, works in spontaneous breathing and in arrhythmia."], [116.58, 127.25, "Tutor", "It returns roughly three hundred millilitres from the legs and splanchnic bed, but it must be judged on real-time cardiac output or aortic velocity time integral, not on blood pressure."], [127.25, 132.83, "Tutor", "Monnet's meta-analysis found a pooled sensitivity and specificity of about 85 and 91 percent."], [132.83, 138.96, "Tutor", "And it's unreliable with raised intra-abdominal pressure, and impractical with pelvic or leg fractures."], [138.96, 145.59, "Tutor", "The second was keeping the continuous renal replacement circuit alive, 2014 first sitting, question twenty-nine."], [145.59, 152.0, "Tutor", "The miss that matters: heparin-induced thrombocytopenia with thrombosis is a systemic prothrombotic disease."], [152.0, 156.65, "Tutor", "Regional citrate keeps the filter running, but it doesn't treat the patient."], [156.65, 171.18, "Tutor", "You must stop every source of heparin, flushes included, and start a systemic non-heparin anticoagulant: argatroban, cleared by the liver and falsely raising the INR; bivalirudin, cleared partly by the kidney; or danaparoid, monitored with anti-Xa levels."], [172.58, 178.31, "Tutor", "An eighty-two-year-old on the ward is referred to you with an ECG, and nothing else."], [178.31, 182.86, "Tutor", "That is the whole stem of question one in the 2026 first sitting."], [182.86, 193.32, "Tutor", "Assess the patient and explain why you'd order each test, then discuss specific management in the first twenty-four hours if the arrhythmia makes them unstable."], [193.32, 195.75, "Tutor", "The pass rate was 43.7 percent."], [195.75, 201.85, "Tutor", "Fewer than half of candidates passed a question that every intensivist manages every week."], [201.85, 205.22, "Tutor", "So let's set out how the College asks cardiac."], [205.22, 213.37, "Tutor", "In the past question bank, Name That ECG Abnormality is tagged to seventeen questions, most recently in both 2026 sittings."], [213.37, 219.04, "Tutor", "Cardiovascular physical examination appears eight times, all between 2009 and 2013."], [219.04, 223.15, "Tutor", "Atrial fibrillation four times: 2012, 2021, 2024 and 2025."], [223.15, 228.13, "Tutor", "Troubleshooting the temporary pacemaker, six times across its two forms."], [228.13, 233.49, "Tutor", "Dynamic left ventricular outflow tract obstruction three times, twice in 2025."], [233.49, 239.78, "Tutor", "And cardiac arrest after cardiac surgery twice, in 2022 and again in the 2026 second sitting."], [239.96, 252.6, "Tutor", "The reading for this week is Oh's ninth edition: chapter thirty-one on cardiac arrhythmias, chapter thirty on resuscitation, chapter thirty-three on acute heart failure and chapter seventy-three on post-operative cardiac intensive care."], [253.0, 257.04, "Tutor", "Start with the framework that earns marks on any unstable rhythm."], [257.04, 261.19, "Tutor", "Examiners reward a structure that a registrar could follow at 3 am."], [261.19, 263.4, "Tutor", "First: is this patient unstable?"], [263.4, 269.6, "Tutor", "The resuscitation council's adverse features are shock, syncope, myocardial ischaemia and heart failure."], [269.6, 273.86, "Tutor", "Any one of them changes the plan from drugs to electricity or pacing."], [273.86, 275.85, "Tutor", "Second: classify the rhythm."], [275.85, 277.01, "Tutor", "Fast or slow."], [277.01, 278.34, "Tutor", "Narrow or broad."], [278.34, 279.94, "Tutor", "Regular or irregular."], [279.94, 283.76, "Tutor", "That gives you six boxes, and each box has its own algorithm."], [283.76, 289.23, "Tutor", "Third: look for the cause, because in an eighty-two-year-old it is often outside the heart."], [289.23, 295.87, "Tutor", "Drugs come first: beta-blockers, calcium channel blockers, digoxin, and sometimes donepezil causing bradycardia."], [295.87, 299.19, "Tutor", "Then electrolytes: potassium, magnesium and calcium."], [299.19, 304.5, "Tutor", "Then ischaemia, then thyroid disease, then sepsis, then degenerative conduction disease."], [304.5, 309.26, "Tutor", "Now the rationale for investigations, because that was half the 2026 question."], [309.26, 312.74, "Tutor", "The twelve-lead ECG and rhythm strip define the rhythm."], [312.74, 317.89, "Tutor", "Potassium and magnesium because both are arrhythmogenic and both are quickly fixable."], [317.89, 321.43, "Tutor", "Troponin, to look for ischaemia as cause or consequence."], [321.43, 324.36, "Tutor", "Thyroid function for new atrial fibrillation."], [324.54, 329.91, "Tutor", "A digoxin level if they take it, with potassium, because toxicity is worse with hypokalaemia."], [329.91, 333.9, "Tutor", "An arterial gas for acidosis and lactate as a measure of perfusion."], [333.9, 337.62, "Tutor", "An echo for ventricular function and valves, and a chest film."], [337.62, 339.91, "Tutor", "Every test needs a reason attached."], [339.91, 343.42, "Tutor", "A list without reasons earns only a fraction of the marks."], [343.82, 348.84, "Tutor", "Now treatment in the first twenty-four hours if the patient becomes unstable."], [348.84, 353.91, "Tutor", "For an unstable tachyarrhythmia, synchronised DC cardioversion under sedation."], [353.91, 365.77, "Tutor", "Current resuscitation guidance suggests a first biphasic shock of 120 to 150 joules for atrial fibrillation, escalating, and 70 to 120 joules for flutter and regular narrow complex tachycardia."], [365.77, 374.5, "Tutor", "If three shocks fail, give amiodarone 300 milligrams over ten to twenty minutes and shock again, then 900 milligrams over twenty-four hours."], [374.5, 380.64, "Tutor", "For an unstable bradycardia, atropine 500 micrograms, repeated to a maximum of three milligrams."], [380.64, 386.43, "Tutor", "If that fails, isoprenaline or an adrenaline infusion at two to ten micrograms per minute."], [386.43, 393.39, "Tutor", "Then transcutaneous pacing as a bridge, and transvenous pacing as the definitive bridge to a permanent device."], [393.39, 400.76, "Tutor", "Atropine won't help a transplanted heart, and it rarely helps Mobitz two or complete heart block with a broad escape."], [400.76, 405.01, "Tutor", "Then the specific treatments, which are where the top marks are."], [405.01, 408.67, "Tutor", "Digoxin toxicity: digoxin-specific antibody fragments."], [408.67, 415.34, "Tutor", "Hyperkalaemia: calcium first, ten millilitres of ten percent calcium chloride, then insulin and dextrose."], [415.52, 419.8, "Tutor", "Beta-blocker overdose: high-dose insulin euglycaemia and glucagon."], [419.8, 423.96, "Tutor", "Calcium channel blocker overdose: calcium and high-dose insulin."], [424.36, 426.72, "Tutor", "Why do we synchronise the shock at all?"], [426.72, 429.78, "Tutor", "The answer is a story from Boston in the early 1960s."], [429.78, 438.0, "Tutor", "In 1956 Paul Zoll showed that alternating current, straight from the mains through a transformer, could defibrillate a human heart through the closed chest."], [438.0, 439.85, "Tutor", "It worked, but it was brutal."], [439.85, 449.88, "Tutor", "Bernard Lown, a cardiologist at the Peter Bent Brigham Hospital, set out to use shocks deliberately to terminate arrhythmias that weren't arrests: atrial fibrillation, ventricular tachycardia."], [449.88, 460.71, "Tutor", "Working with the engineer Baruch Berkovits from the American Optical Company, he found in animal experiments that alternating current burned muscle and could itself induce atrial and ventricular fibrillation."], [460.71, 465.08, "Tutor", "They switched to direct current: a capacitor discharge with a defined waveform."], [465.08, 466.23, "Tutor", "That was safer."], [466.23, 468.24, "Tutor", "But Lown noticed something else."], [468.24, 473.25, "Tutor", "There was a brief vulnerable window near the T wave, only a few hundredths of a second long."], [473.25, 477.86, "Tutor", "A shock landing there could throw an organised rhythm into ventricular fibrillation."], [477.86, 483.68, "Tutor", "So he timed the discharge to the R wave, well away from that window, and called the technique cardioversion."], [483.86, 490.19, "Tutor", "The 1962 papers in JAMA described synchronised capacitor discharge, then its use for atrial fibrillation."], [490.19, 498.94, "Tutor", "Lown went on to share the 1985 Nobel Peace Prize, accepting it for International Physicians for the Prevention of Nuclear War, a body he co-founded."], [498.94, 500.62, "Tutor", "Here's the exam point."], [500.62, 504.15, "Tutor", "Synchronisation exists to avoid shocking on the T wave."], [504.15, 512.95, "Tutor", "That's why you synchronise for any organised rhythm with a pulse, and why you turn synchronisation off for ventricular fibrillation and pulseless VT."], [512.95, 519.05, "Tutor", "In polymorphic VT the defibrillator can't reliably find an R wave, so you treat it as unsynchronised."], [519.05, 525.5, "Tutor", "And after each synchronised shock, check that the sync mode hasn't reset, because on many machines it does."], [525.9, 527.64, "Tutor", "Here's a pause and answer."], [527.64, 535.5, "Tutor", "Your patient in fast atrial fibrillation with a blood pressure of 75 over 40 has had a synchronised shock, and is now in ventricular fibrillation."], [535.5, 539.13, "Tutor", "Name the most likely technical cause, and say what you do next."], [539.13, 540.46, "Tutor", "Pause, and answer."], [545.86, 554.66, "Tutor", "The most likely cause is that the shock wasn't synchronised, or the device marked a T wave or artefact as the R wave, so the discharge fell in the vulnerable period."], [554.66, 556.84, "Tutor", "Next: this is now a cardiac arrest."], [556.84, 563.86, "Tutor", "Check that sync is off, defibrillate immediately unsynchronised at maximum energy, and follow the advanced life support algorithm."], [564.26, 567.98, "Tutor", "Now new-onset atrial fibrillation in the critically ill."], [567.98, 576.13, "Tutor", "This is the most examined rhythm problem in the paper, and the College wants the intensivist's version, not the cardiology clinic's."], [576.13, 577.29, "Tutor", "It's common."], [577.29, 586.66, "Tutor", "The 2024 European guideline notes sepsis is the most common precipitating factor, with atrial fibrillation in roughly 9 to 20 percent of septic patients."], [586.66, 588.98, "Tutor", "It also marks a worse prognosis."], [588.98, 599.45, "Tutor", "Most of the time it's driven by the acute illness: endogenous and infused catecholamines, atrial stretch from fluid, inflammation, electrolyte loss and lines in the atrium."], [599.45, 608.24, "Tutor", "The governing guideline is the 2024 European Society of Cardiology guideline for atrial fibrillation, written with the cardiothoracic surgeons."], [608.24, 610.56, "Tutor", "Its framework is called AF-CARE."], [610.56, 613.01, "Tutor", "C, comorbidities and risk factors."], [613.01, 615.57, "Tutor", "A, avoid stroke and thromboembolism."], [615.57, 618.71, "Tutor", "R, reduce symptoms by rate and rhythm control."], [618.71, 621.44, "Tutor", "E, evaluation and dynamic reassessment."], [621.44, 624.47, "Tutor", "Note the order: the precipitant comes first."], [624.47, 632.67, "Tutor", "In the unit, that means treating sepsis, hypoxia, hypovolaemia and potassium and magnesium, and cutting catecholamines where you can."], [632.67, 635.99, "Tutor", "Three changes from earlier guidance are quotable."], [635.99, 640.58, "Tutor", "First, the stroke score is now CHA2DS2-VA: female sex has been removed."], [640.76, 647.15, "Tutor", "A score of two or more means anticoagulation is recommended, and a score of one means it should be considered."], [647.15, 652.35, "Tutor", "Bleeding scores should not be used to decide on starting or withdrawing anticoagulation."], [652.35, 657.55, "Tutor", "Second, the early cardioversion window has shrunk from forty-eight hours to twenty-four."], [657.55, 665.46, "Tutor", "Beyond twenty-four hours, cardioversion needs three weeks of therapeutic anticoagulation first, or a transoesophageal echo excluding clot."], [665.46, 672.56, "Tutor", "Third, wait-and-see is acceptable in a stable patient, because many paroxysms revert by themselves once the driver settles."], [672.96, 675.87, "Tutor", "In the unit, rate control usually comes first."], [675.87, 677.86, "Tutor", "A beta-blocker is first line."], [677.86, 683.41, "Tutor", "Metoprolol, or esmolol if you want something titratable with a half-life of about nine minutes."], [683.41, 688.43, "Tutor", "Diltiazem or verapamil are options only if the ejection fraction is above 40 percent."], [688.43, 692.31, "Tutor", "Digoxin is slow, but useful with poor left ventricular function."], [692.31, 695.92, "Tutor", "Magnesium is cheap and helps with both rate and conversion."], [695.92, 702.28, "Tutor", "Amiodarone does both rate and rhythm and is the default when the blood pressure won't tolerate a beta-blocker."], [702.28, 706.75, "Tutor", "Amiodarone is the anti-arrhythmic you'll be asked about, so know its harms."], [706.75, 712.63, "Tutor", "Intravenously, it causes hypotension, largely from its solvent, plus bradycardia and QT prolongation."], [712.63, 715.05, "Tutor", "It's an irritant to peripheral veins."], [715.05, 724.38, "Tutor", "With longer use come thyroid dysfunction in both directions, pulmonary toxicity, hepatitis and drug interactions: it raises digoxin levels and the INR with warfarin."], [724.38, 725.35, "Tutor", "Two traps."], [725.35, 732.89, "Tutor", "Never give AV nodal blockers to pre-excited atrial fibrillation, the irregular, broad, bizarre tachycardia of Wolff-Parkinson-White."], [732.89, 738.93, "Tutor", "Blocking the node pushes conduction down the accessory pathway and can trigger ventricular fibrillation."], [738.93, 740.92, "Tutor", "Use procainamide, or a shock."], [741.1, 746.79, "Tutor", "And in the ICU, cardioversion often fails or the rhythm relapses while the driver persists."], [746.79, 749.66, "Tutor", "Say so in your answer: it shows judgement."], [750.06, 751.5, "Tutor", "Pause and answer."], [751.5, 759.06, "Tutor", "A septic patient on noradrenaline develops atrial fibrillation at 150 beats per minute with a blood pressure of 95 over 55."], [759.06, 761.31, "Tutor", "The AF started eight hours ago."], [761.31, 763.97, "Tutor", "Their ejection fraction is 35 percent."], [763.97, 766.16, "Tutor", "Give your first three actions."], [766.16, 767.66, "Tutor", "Pause, and answer."], [773.06, 775.03, "Tutor", "First: correct the drivers."], [775.03, 781.94, "Tutor", "Potassium to around 4.5, magnesium replaced, oxygenation and volume status checked, and the noradrenaline reviewed."], [781.94, 786.43, "Tutor", "Second: the patient isn't in shock from the rhythm, so treat with drugs."], [786.43, 790.88, "Tutor", "With an ejection fraction of 35 percent, avoid diltiazem and verapamil."], [790.88, 796.16, "Tutor", "Amiodarone is reasonable, with cautious beta-blockade as the alternative if tolerated."], [796.16, 804.87, "Tutor", "Third: because the onset is clearly under twenty-four hours, cardioversion without prior anticoagulation is acceptable if the patient deteriorates."], [804.87, 811.78, "Tutor", "Then calculate CHA2DS2-VA, and decide about anticoagulation once the bleeding risk from the acute illness is clear."], [812.18, 817.85, "Tutor", "Next, the broad complex tachycardia, which is where ECG questions go to hurt you."], [817.85, 828.11, "Tutor", "2021 second sitting, question twenty-three, gave a broad complex tachycardia at about 200 per minute with a QRS of 150 milliseconds and a northwest axis."], [828.11, 833.34, "Tutor", "It then asked for the differential and how to separate the two on the ECG."], [833.34, 842.83, "Tutor", "The safe rule first: a broad complex tachycardia is ventricular tachycardia until proven otherwise, especially with structural heart disease."], [842.83, 847.16, "Tutor", "Verapamil given to VT on the assumption that it's SVT kills."], [847.16, 850.41, "Tutor", "To discriminate, use the Brugada algorithm."], [850.41, 852.58, "Tutor", "Any one of these means VT."], [852.58, 855.77, "Tutor", "One, no RS complex in any precordial lead."], [855.77, 860.67, "Tutor", "Two, an R to S interval over 100 milliseconds in any precordial lead."], [860.67, 865.84, "Tutor", "Three, atrioventricular dissociation, including capture and fusion beats."], [865.84, 869.4, "Tutor", "Four, VT morphology criteria in V1 to V2 and V6."], [869.4, 873.48, "Tutor", "Also mention extreme axis deviation, the northwest axis."], [873.48, 875.46, "Tutor", "It strongly favours VT."], [875.46, 878.07, "Tutor", "Polymorphic VT is the other face."], [878.07, 882.34, "Tutor", "If the QT is long before the run, it's torsades de pointes."], [882.52, 895.59, "Tutor", "Treatment is two grams of magnesium sulphate intravenously, potassium kept high-normal, every QT-prolonging drug stopped, and the heart rate raised with isoprenaline or overdrive pacing, because torsades is pause-dependent."], [895.59, 900.29, "Tutor", "If the QT is normal, think ischaemia first, and get the coronary angiogram."], [900.29, 908.84, "Tutor", "And the young man after an out-of-hospital arrest, with coved ST elevation sloping into inverted T waves in V1 and V2, has the Brugada pattern."], [908.84, 912.97, "Tutor", "Know that fever unmasks it and sodium channel blockers worsen it."], [912.97, 917.67, "Tutor", "For an electrical storm, isoprenaline and quinidine are the drugs you name."], [917.67, 924.12, "Tutor", "The governing document is the 2022 European guideline on ventricular arrhythmias and sudden cardiac death."], [924.52, 928.12, "Tutor", "Now dynamic left ventricular outflow tract obstruction."], [928.12, 933.6, "Tutor", "You scored seven on this on the twelfth of October, 2025 first sitting, question twelve."], [933.6, 942.96, "Tutor", "The missing points were the mitral regurgitation that comes from systolic anterior motion, and echo as the test that makes the diagnosis and guides therapy."], [942.96, 951.01, "Tutor", "The 2019 first sitting, question eight, asked for predisposing and precipitating factors, the signs, and the principles of treatment."], [951.01, 966.31, "Tutor", "The examiners' comment is worth remembering word for word: \"Candidates who did poorly did not know how to manage outflow tract obstruction and recommended dangerous therapies, including inotropic therapy and vasodilator agents.\" The pass rate was 65.9 percent."], [966.31, 968.71, "Tutor", "The mechanism explains everything."], [968.71, 976.47, "Tutor", "A small, hyperdynamic, hypertrophied ventricle ejects so fast that the anterior mitral leaflet is pulled into the outflow tract."], [976.47, 980.76, "Tutor", "Anything that empties the ventricle or speeds it up makes it worse."], [980.76, 989.95, "Tutor", "So: predisposing, hypertrophic cardiomyopathy, hypertensive hypertrophy, and the ventricle just relieved of aortic stenosis by valve replacement or TAVI."], [989.95, 996.0, "Tutor", "Precipitating: hypovolaemia, vasodilatation from sepsis or anaesthesia, tachycardia and inotropes."], [996.18, 998.18, "Tutor", "Treatment reverses each one."], [998.18, 999.29, "Tutor", "Give volume."], [999.29, 1003.28, "Tutor", "Use a pure vasoconstrictor such as phenylephrine or vasopressin."], [1003.28, 1006.5, "Tutor", "Slow the heart with a beta-blocker, often esmolol."], [1006.5, 1007.95, "Tutor", "Stop the inotrope."], [1007.95, 1009.39, "Tutor", "Keep sinus rhythm."], [1009.39, 1018.1, "Tutor", "And diagnose it on echo: systolic anterior motion, a late-peaking dagger-shaped outflow Doppler, and a gradient of 30 millimetres of mercury or more."], [1018.5, 1019.85, "Tutor", "Pause and answer."], [1019.85, 1023.45, "Tutor", "Day one after aortic valve replacement for severe stenosis."], [1023.45, 1030.82, "Tutor", "The patient is hypotensive, tachycardic at 120, and the nurse has just started dobutamine, after which the pressure fell further."], [1030.82, 1034.26, "Tutor", "A new systolic murmur is heard at the left sternal edge."], [1034.26, 1037.54, "Tutor", "What's happening, and what are your next three moves?"], [1037.54, 1038.94, "Tutor", "Pause, and answer."], [1044.34, 1051.62, "Tutor", "Dynamic outflow obstruction in a hypertrophied ventricle freshly relieved of its stenosis, made worse by the inotrope."], [1051.62, 1053.24, "Tutor", "Stop the dobutamine."], [1053.24, 1058.44, "Tutor", "Give a fluid bolus and start a pure vasoconstrictor, phenylephrine or vasopressin."], [1058.44, 1068.26, "Tutor", "Then slow the rate, with esmolol if the pressure allows, and confirm on echo: systolic anterior motion, mitral regurgitation and a dagger-shaped outflow gradient."], [1068.66, 1074.36, "Tutor", "Pacing deserves a minute, because troubleshooting the temporary pacemaker has been asked six times."], [1074.36, 1078.57, "Tutor", "Know the pacing threshold: the smallest current that reliably captures."], [1078.57, 1086.5, "Tutor", "Pace about ten beats above the intrinsic rate, turn the output down until capture is lost, then set the output at about twice that threshold."], [1086.5, 1088.63, "Tutor", "Sensitivity is the reverse idea."], [1088.63, 1092.31, "Tutor", "It decides how small an intrinsic signal the box will notice."], [1092.31, 1097.9, "Tutor", "You set it so the pacemaker doesn't compete with the patient's own rhythm and fire on the T wave."], [1097.9, 1103.81, "Tutor", "When the nurse tells you the output has crept up all shift to keep capture, list the reversible causes."], [1103.81, 1108.12, "Tutor", "The wire has moved, or there's oedema and fibrosis at the epicardial tip."], [1108.12, 1112.17, "Tutor", "Electrolytes and acid-base: potassium too high or too low, acidosis."], [1112.17, 1114.46, "Tutor", "And drugs that raise the threshold."], [1114.46, 1128.2, "Tutor", "Then the fixes from the 2013 first-sitting answer: increase output, check every connection, reverse the polarity, swap the box and cables, convert to unipolar pacing with a skin electrode, and use transcutaneous or transvenous pacing as the fallback."], [1128.2, 1132.46, "Tutor", "The second trace in that question showed pacemaker-mediated tachycardia."], [1132.64, 1140.22, "Tutor", "That's a re-entry loop: a ventricular beat conducts back to the atria, the atrial lead senses it and triggers another paced beat."], [1140.22, 1145.92, "Tutor", "You break it by lengthening the post-ventricular atrial refractory period or changing the mode."], [1146.32, 1151.71, "Tutor", "Your own weak spot this block is the haemodynamically unstable cardiac surgical patient."], [1151.71, 1156.59, "Tutor", "You earned four and a half on the 2016 first sitting, question six, a week ago."], [1156.59, 1160.24, "Tutor", "That error is worth naming again because it'll come back."], [1160.24, 1168.71, "Tutor", "A low wedge pressure and a low central venous pressure with a low cardiac index mean the ventricle is underfilled, so the first move is volume."], [1168.71, 1174.72, "Tutor", "A high systemic vascular resistance, 1,700 in that question, means the circulation is clamped down."], [1174.72, 1179.1, "Tutor", "It calls for afterload reduction and inotropy, not more noradrenaline."], [1179.1, 1188.64, "Tutor", "And whenever a post-operative cardiac patient deteriorates with rising filling pressures and falling output, consider tamponade first: echo, and call the surgeon."], [1189.04, 1194.36, "Tutor", "Which brings us to arrest after cardiac surgery, examined in 2022 and again in 2026."], [1194.36, 1202.58, "Tutor", "The governing document is the Society of Thoracic Surgeons expert consensus, Dunning and colleagues, Annals of Thoracic Surgery, 2017."], [1202.58, 1207.09, "Tutor", "It departs from standard advanced life support in ways examiners love."], [1207.09, 1220.28, "Tutor", "For ventricular fibrillation or pulseless VT, give up to three sequential shocks before starting compressions, because a shock within the first minute works and external compressions risk tearing grafts and suture lines."], [1220.28, 1224.04, "Tutor", "Amiodarone 300 milligrams follows the third failed shock."], [1224.04, 1232.38, "Tutor", "For asystole or severe bradycardia with epicardial wires in place, connect them and pace at maximum output, DDD at 80 to 100 per minute."], [1232.38, 1234.46, "Tutor", "Atropine is not recommended."], [1234.46, 1242.21, "Tutor", "If none of that works, resternotomy within five minutes, and it stays part of the protocol until the tenth post-operative day."], [1242.21, 1245.51, "Tutor", "Internal massage is more effective than external."], [1245.51, 1247.94, "Tutor", "Adrenaline is not given routinely."], [1247.94, 1259.8, "Tutor", "The consensus says to give it only if an experienced clinician directs, because a full one milligram dose on a heart that restarts can cause severe hypertension and bleeding from fresh anastomoses."], [1259.98, 1264.72, "Tutor", "If the monitor shows a paced rhythm with no output, briefly pause the pacing."], [1264.72, 1266.62, "Tutor", "It can mask underlying VF."], [1267.02, 1268.35, "Tutor", "Pause and answer."], [1268.35, 1274.53, "Tutor", "Ten minutes after arriving from theatre, a patient after coronary bypass goes into ventricular fibrillation."], [1274.53, 1276.87, "Tutor", "Their epicardial wires are attached."], [1276.87, 1279.8, "Tutor", "What's your sequence for the first two minutes?"], [1279.8, 1281.18, "Tutor", "Pause, and answer."], [1286.58, 1291.36, "Tutor", "Confirm the rhythm and call for help, including the surgeon and the resternotomy kit."], [1291.36, 1295.89, "Tutor", "Give up to three sequential shocks within the first minute, before compressions."], [1295.89, 1303.6, "Tutor", "If VF persists after the third, start external compressions, give amiodarone 300 milligrams, and prepare for resternotomy within five minutes."], [1303.6, 1305.45, "Tutor", "Withhold routine adrenaline."], [1305.45, 1312.34, "Tutor", "Keep ventilation at 100 percent oxygen and check the airway and ventilator, and turn off the pacing if it might be masking VF."], [1312.74, 1315.41, "Tutor", "Three numbers to remember this week."], [1315.41, 1323.31, "Tutor", "Twenty-four hours: the new cut-off for cardioversion without prior anticoagulation or TOE, in the 2024 European guideline."], [1323.31, 1331.2, "Tutor", "Three shocks: the stacked sequence for VF after cardiac surgery, before compressions and before amiodarone 300 milligrams."], [1331.2, 1333.87, "Tutor", "Two grams of magnesium for torsades."], [1333.87, 1339.7, "Tutor", "And with it, the reminder that a broad complex tachycardia is VT until proven otherwise."], [1341.1, 1346.62, "Tutor", "Two trials this week, both about choices we make every day in cardiac intensive care."], [1346.62, 1354.94, "Tutor", "First, the Cardiothoracic Surgical Trials Network trial of rate versus rhythm control for atrial fibrillation after cardiac surgery."], [1354.94, 1359.16, "Tutor", "Gillinov and colleagues, New England Journal of Medicine, 2016."], [1359.16, 1362.96, "Tutor", "It's chapter fifty of Landmark Studies in Critical Care."], [1362.96, 1369.49, "Tutor", "The question: post-operative atrial fibrillation affects roughly a third of cardiac surgical patients."], [1369.49, 1375.25, "Tutor", "Should we chase sinus rhythm with amiodarone and cardioversion, or just control the rate?"], [1375.25, 1382.38, "Tutor", "Population: patients having elective coronary or valve surgery who developed post-operative atrial fibrillation."], [1382.38, 1384.04, "Tutor", "523 were randomised."], [1384.04, 1390.34, "Tutor", "Intervention: rhythm control with amiodarone, plus cardioversion if atrial fibrillation persisted."], [1390.34, 1393.72, "Tutor", "Comparator: rate control with rate-slowing drugs."], [1393.72, 1397.64, "Tutor", "Primary outcome: total days in hospital within sixty days."], [1397.64, 1401.57, "Tutor", "5.1 days with rate control versus 5.0 with rhythm control."], [1401.57, 1402.87, "Tutor", "No difference."], [1402.87, 1413.86, "Tutor", "Secondary results: by sixty days, freedom from atrial fibrillation was 93.8 percent with rate control and 97.9 percent with rhythm control, a difference that wasn't significant."], [1414.04, 1418.77, "Tutor", "About a quarter of patients in each arm didn't stay on their assigned strategy."], [1418.77, 1422.46, "Tutor", "Rhythm control brought the expected amiodarone side effects."], [1422.46, 1430.07, "Tutor", "Main criticisms: crossover blurred the comparison, it was open label, and the sixty-day horizon says nothing about long-term stroke."], [1430.07, 1434.42, "Tutor", "What it changed: it gave intensivists permission to use either strategy."], [1434.42, 1445.56, "Tutor", "Most post-operative atrial fibrillation is self-limiting, so rate control is a legitimate first choice in the stable patient, and you reserve rhythm control for symptoms or haemodynamic compromise."], [1445.56, 1458.28, "Tutor", "How to quote it in an answer: \"In the CTSN trial, rate and rhythm control for post-operative atrial fibrillation gave the same hospital stay, 5.1 versus 5.0 days, with over 90 percent in sinus rhythm at sixty days either way.\""], [1458.68, 1460.63, "Tutor", "Second, CULPRIT-SHOCK."], [1460.63, 1465.11, "Tutor", "Thiele and colleagues, New England Journal of Medicine, 2017."], [1465.11, 1468.1, "Tutor", "Chapter fifty-one of Landmark Studies."], [1468.1, 1475.76, "Tutor", "The question: in cardiogenic shock complicating myocardial infarction, most patients have multivessel disease."], [1475.76, 1482.45, "Tutor", "Should the interventionist open every critical lesion while they're there, or only the culprit?"], [1482.45, 1490.11, "Tutor", "Population: 706 patients with acute myocardial infarction, cardiogenic shock and multivessel coronary disease."], [1490.11, 1496.15, "Tutor", "Intervention: culprit-lesion-only PCI, with staged revascularisation later if needed."], [1496.15, 1502.25, "Tutor", "Comparator: immediate multivessel PCI, including attempts on chronic total occlusions."], [1502.25, 1509.0, "Tutor", "Primary outcome: death or severe renal failure needing renal replacement therapy at thirty days."], [1509.0, 1513.42, "Tutor", "45.9 versus 55.4 percent, relative risk 0.83, p equals 0.01."], [1513.42, 1516.99, "Tutor", "The driver was death: 43.3 versus 51.6 percent."], [1516.99, 1522.77, "Tutor", "Renal replacement therapy was 11.6 versus 16.4 percent, which wasn't significant."], [1522.77, 1538.16, "Tutor", "Criticisms: open label; 43 patients crossed from culprit-only to multivessel; chronic occlusions were attempted in the multivessel arm, which may have added contrast, time and harm; and the primary follow-up was only thirty days."], [1538.34, 1547.88, "Tutor", "What it changed: European guidance now advises against routine immediate revascularisation of non-culprit lesions in infarct-related cardiogenic shock."], [1547.88, 1559.27, "Tutor", "Put that next to IABP-SHOCK II, which removed the routine balloon pump, and DanGer Shock, which found a survival benefit for the microaxial pump in a selected STEMI shock population."], [1559.27, 1563.05, "Tutor", "Together they map how the evidence for shock has moved."], [1563.05, 1573.54, "Tutor", "How to quote it: \"In cardiogenic shock with multivessel disease, CULPRIT-SHOCK showed culprit-only PCI reduced thirty-day death or dialysis, 45.9 versus 55.4 percent.\""], [1574.94, 1577.97, "Examiner", "This is from the 2021 second sitting, question nine."], [1577.97, 1579.43, "Examiner", "I'll read it exactly."], [1579.43, 1586.5, "Examiner", "\"Outline your approach to the assessment and management of atrial fibrillation in the critically ill patient.\" You have ten minutes."], [1587.0, 1588.15, "Candidate", "Thank you."], [1588.15, 1596.31, "Candidate", "I'll structure this as assessment, then management split into the unstable and the stable patient, then anticoagulation."], [1596.31, 1597.52, "Candidate", "Assessment."], [1597.52, 1606.26, "Candidate", "First, haemodynamic stability: looking for shock, ischaemia, heart failure or a fall in consciousness attributable to the rhythm."], [1606.26, 1612.63, "Candidate", "Second, confirming the rhythm on a twelve-lead ECG and excluding flutter and pre-excitation."], [1612.63, 1619.14, "Candidate", "Third, timing the onset from the monitor record, which matters for the cardioversion decision."], [1619.14, 1634.25, "Candidate", "Fourth, looking for precipitants, which in the ICU are usually the acute illness: sepsis, hypovolaemia, catecholamine infusions, central lines in the right atrium, hypoxia, electrolyte loss and recent cardiac or thoracic surgery."], [1634.25, 1645.98, "Candidate", "Investigations: potassium, magnesium, troponin, thyroid function, an arterial gas, a chest film, and a transthoracic echo for left ventricular function, valves and atrial size."], [1645.98, 1647.83, "Candidate", "Management, unstable."], [1647.83, 1657.33, "Candidate", "Synchronised DC cardioversion under sedation, starting at 120 to 150 joules biphasic, with amiodarone 300 milligrams if it fails or relapses."], [1657.33, 1659.06, "Candidate", "Management, stable."], [1659.06, 1665.24, "Candidate", "Treat the precipitant: replace potassium and magnesium, treat sepsis, and wean inotropes."], [1665.42, 1674.33, "Candidate", "Then rate control to below 110, using a beta-blocker first line, or amiodarone if the blood pressure is marginal, and digoxin in poor LV function."], [1674.33, 1678.66, "Candidate", "I'd avoid calcium channel blockers if the ejection fraction is low."], [1678.66, 1684.62, "Candidate", "To guide fluid in the shocked patient, I'd use pulse pressure variation from the arterial line."], [1685.12, 1685.98, "Examiner", "Stop there."], [1685.98, 1689.0, "Examiner", "You said you'd use pulse pressure variation to guide fluid."], [1689.0, 1690.08, "Examiner", "In this patient?"], [1690.58, 1691.2, "Candidate", "Ah."], [1691.2, 1691.83, "Candidate", "No."], [1691.83, 1694.79, "Candidate", "Pulse pressure variation needs sinus rhythm."], [1694.79, 1701.66, "Candidate", "In atrial fibrillation the stroke volume varies from beat to beat with the filling time, so it's uninterpretable."], [1701.66, 1710.3, "Candidate", "I'd use a passive leg raise with real-time cardiac output or velocity time integral on echo, or a small fluid challenge judged on stroke volume."], [1710.8, 1711.49, "Examiner", "Better."], [1711.49, 1714.18, "Examiner", "You promised anticoagulation and haven't delivered."], [1714.18, 1716.88, "Examiner", "And what about cardioversion in the stable patient?"], [1717.38, 1718.73, "Candidate", "Anticoagulation."], [1718.73, 1728.54, "Candidate", "I'd calculate the stroke risk with CHA2DS2-VA, and weigh it against the bleeding risk of the acute illness: recent surgery, thrombocytopenia, coagulopathy, procedures."], [1728.54, 1733.87, "Candidate", "In the ICU, unfractionated heparin is usually the first choice because it's reversible."], [1733.87, 1738.69, "Candidate", "For elective cardioversion, the onset must be clearly under twenty-four hours."], [1738.69, 1748.96, "Candidate", "Otherwise the patient needs three weeks of anticoagulation or a TOE excluding left atrial appendage thrombus, and anticoagulation continues for at least four weeks afterwards."], [1748.96, 1759.33, "Candidate", "And I'd add that in the critically ill, cardioversion often fails or relapses while the driver persists, so rate control and treating the cause is usually the better first step."], [1759.33, 1764.94, "Candidate", "Much of this AF reverts as the patient recovers, and it should be reviewed before discharge."], [1765.44, 1766.88, "Examiner", "Here's the marking."], [1766.88, 1775.66, "Examiner", "Assessment carries roughly three marks: stability, the ECG with exclusion of pre-excitation, onset time, precipitants and targeted tests, each with a reason."], [1775.66, 1777.2, "Examiner", "You got most of that."], [1777.2, 1781.57, "Examiner", "Your test list needed the reasons attached, as the 2026 question demanded."], [1781.57, 1784.28, "Examiner", "Unstable management carries one and a half."], [1784.28, 1785.29, "Examiner", "You got it."], [1785.29, 1787.74, "Examiner", "Stable management carries about three."], [1787.74, 1793.12, "Examiner", "The precipitant first, rate control with named drugs and their limits, and the relapse point."], [1793.12, 1799.98, "Examiner", "You got there, but the pulse pressure variation slip would have cost you a credibility half mark before you recovered it."], [1799.98, 1802.81, "Examiner", "In a written paper, you don't get to recover."], [1802.81, 1805.04, "Examiner", "Anticoagulation carries about two."], [1805.04, 1811.96, "Examiner", "The score, the bleeding balance in the critically ill, the agent, the twenty-four hour rule and the four weeks afterwards."], [1811.96, 1814.52, "Examiner", "Your version came late but was complete."], [1814.52, 1823.57, "Examiner", "The last half mark goes to the one sentence that shows you know the ICU is different: most new atrial fibrillation in the critically ill is driven by the illness."], [1823.57, 1826.87, "Examiner", "Verdict: as written, around six and a half out of ten."], [1826.87, 1833.2, "Examiner", "With anticoagulation planned up front and the pulse pressure variation line removed, seven and a half to eight."], [1833.38, 1842.74, "Examiner", "The one fix: write a four-part skeleton in the first minute, assessment, unstable, stable, anticoagulation, so no part gets left until time runs out."], [1844.14, 1850.13, "Tutor", "Now the syllabus round-up: six items from this week's block that the episodes haven't touched yet."], [1850.13, 1853.18, "Tutor", "First, hypertensive crisis with a renal focus."], [1853.18, 1855.49, "Tutor", "It appears in six past questions."], [1855.49, 1861.65, "Tutor", "A hypertensive emergency is severe hypertension, usually above 180 over 120, with acute organ damage."], [1861.65, 1866.45, "Tutor", "Severe hypertension without organ damage is an urgency and is treated orally."], [1866.45, 1868.82, "Tutor", "The renal faces to name are these."], [1868.82, 1875.03, "Tutor", "Acute kidney injury with thrombotic microangiopathy: fragments on the film, low platelets, a high LDH."], [1875.03, 1876.9, "Tutor", "Scleroderma renal crisis."], [1876.9, 1880.62, "Tutor", "Renovascular disease presenting as flash pulmonary oedema."], [1880.62, 1882.09, "Tutor", "And pre-eclampsia."], [1882.09, 1885.09, "Tutor", "Scleroderma renal crisis is the classic trap."], [1885.09, 1891.3, "Tutor", "The treatment is an ACE inhibitor, classically captopril, titrated up even while the creatinine rises."], [1891.3, 1894.63, "Tutor", "Stopping it because the creatinine climbs is wrong."], [1894.63, 1901.18, "Tutor", "The general target: reduce mean arterial pressure by no more than about 20 to 25 percent in the first hours."], [1901.18, 1912.14, "Tutor", "The two exceptions are aortic dissection, where you go lower and faster with heart rate control first, and acute ischaemic stroke, where you go more cautiously depending on thrombolysis."], [1912.32, 1924.66, "Tutor", "Agents to name, all titratable intravenously: labetalol, clevidipine or nicardipine, glyceryl trinitrate for pulmonary oedema, and sodium nitroprusside, with its cyanide and thiocyanate toxicity."], [1924.66, 1929.28, "Tutor", "Oh's chapter twenty-seven covers vasodilators and antihypertensives."], [1929.68, 1935.21, "Tutor", "Second, infective endocarditis: four past questions, the latest in the 2026 second sitting."], [1935.21, 1940.69, "Tutor", "The governing guideline is the 2023 European Society of Cardiology endocarditis guideline."], [1940.69, 1944.83, "Tutor", "The intensivist's questions are when to operate, and how to image."], [1944.83, 1954.16, "Tutor", "Emergency surgery, within twenty-four hours, for aortic or mitral endocarditis with valve dysfunction causing refractory pulmonary oedema or cardiogenic shock."], [1954.16, 1958.02, "Tutor", "Urgent surgery, within three to five days, for heart failure."], [1958.02, 1964.9, "Tutor", "Also for locally uncontrolled infection: abscess, false aneurysm, fistula, an enlarging vegetation or new AV block."], [1964.9, 1969.26, "Tutor", "And for a vegetation of 10 millimetres or more after an embolic event."], [1969.26, 1975.01, "Tutor", "For right-sided disease, residual tricuspid vegetations above 20 millimetres are an indication."], [1975.01, 1987.81, "Tutor", "Imaging: transthoracic echo first, transoesophageal echo for prosthetic valves or a negative transthoracic study, FDG PET-CT for possible prosthetic valve endocarditis, and brain imaging when there are neurological signs."], [1987.81, 1991.0, "Tutor", "Device infection means removing the whole system."], [1991.0, 1995.36, "Tutor", "Prosthetic valve endocarditis needs at least six weeks of antibiotics."], [1995.54, 2004.44, "Tutor", "In selected stable patients, the guideline allows a switch to oral therapy after two weeks of intravenous treatment and a transoesophageal echo showing no progression."], [2004.44, 2006.58, "Tutor", "In Oh's, it's chapter thirty-four."], [2006.98, 2014.18, "Tutor", "Third and fourth together: pericarditis, which has five past questions, and pericardiocentesis, which has four."], [2014.18, 2020.83, "Tutor", "The new document is the 2025 European Society of Cardiology guideline on myocarditis and pericarditis."], [2020.83, 2030.63, "Tutor", "Acute pericarditis needs two of four: pleuritic chest pain, a friction rub, new widespread ST elevation or PR depression, and a new or worsening effusion."], [2030.63, 2037.77, "Tutor", "Treatment is a non-steroidal or aspirin with colchicine, colchicine for around three months to cut recurrence."], [2037.77, 2039.77, "Tutor", "Steroids are second line."], [2039.77, 2042.91, "Tutor", "Tamponade is clinical and echocardiographic."], [2042.91, 2049.09, "Tutor", "Hypotension, raised venous pressure, pulsus paradoxus of more than ten millimetres of mercury."], [2049.09, 2060.7, "Tutor", "On echo: right atrial collapse in systole, right ventricular collapse in diastole, a plethoric inferior vena cava, and exaggerated respiratory variation in mitral and tricuspid inflow."], [2060.7, 2067.05, "Tutor", "Pericardiocentesis is echo-guided, usually subxiphoid or apical, with a pigtail left in to drain."], [2067.05, 2069.41, "Tutor", "The traps the examiners reward."], [2069.41, 2075.22, "Tutor", "One: after cardiac surgery, tamponade is often a localised clot compressing one chamber."], [2075.22, 2080.18, "Tutor", "Echo can miss it, and the answer is surgical re-exploration, not a needle."], [2080.36, 2087.92, "Tutor", "Two: in type A dissection with tamponade, a needle drain can precipitate rupture, so the answer is the operating theatre."], [2087.92, 2092.73, "Tutor", "Three: intubation and positive pressure can cause cardiovascular collapse."], [2092.73, 2098.24, "Tutor", "Keep the patient breathing spontaneously, load with fluid, and drain first if you can."], [2098.64, 2102.86, "Tutor", "Fifth, pulmonary hypertension and the failing right ventricle."], [2102.86, 2108.4, "Tutor", "Three past questions, plus the perioperative right heart questions of 2017 and 2026."], [2108.4, 2117.44, "Tutor", "The 2022 European respiratory and cardiology guideline lowered the definition: mean pulmonary artery pressure above 20 millimetres of mercury."], [2117.44, 2124.25, "Tutor", "Pre-capillary disease adds a pulmonary vascular resistance above 2 Wood units with a wedge of 15 or less."], [2124.25, 2127.93, "Tutor", "In the unit, the right ventricle fails from pressure."], [2127.93, 2131.91, "Tutor", "The management principles form a structure examiners like."], [2131.91, 2139.56, "Tutor", "First, remove what raises pulmonary vascular resistance: hypoxia, hypercapnia, acidosis, high PEEP and over-distension."], [2139.56, 2147.87, "Tutor", "Second, protect right coronary perfusion by keeping systemic pressure above pulmonary pressure, with noradrenaline or vasopressin."], [2147.87, 2149.8, "Tutor", "Third, optimise preload."], [2149.8, 2156.85, "Tutor", "The failing right ventricle is usually over-full, so diuresis or ultrafiltration often helps more than fluid."], [2156.85, 2161.74, "Tutor", "Fourth, support contractility with dobutamine, milrinone or levosimendan."], [2161.74, 2167.76, "Tutor", "Fifth, give a selective pulmonary vasodilator: inhaled nitric oxide or inhaled epoprostenol."], [2167.76, 2172.16, "Tutor", "Sixth, think early about mechanical support, VA ECMO as a bridge."], [2172.34, 2179.72, "Tutor", "And name the danger: induction and intubation in severe pulmonary hypertension is one of the highest-risk moments in intensive care."], [2179.72, 2181.98, "Tutor", "In Oh's, it's chapter thirty-three."], [2182.38, 2183.62, "Tutor", "Pause and answer."], [2183.62, 2189.51, "Tutor", "A patient with known pulmonary arterial hypertension is hypoxic and hypotensive with a dilated right ventricle."], [2189.51, 2192.93, "Tutor", "Name three things that will make them worse in the next hour."], [2192.93, 2194.22, "Tutor", "Pause, and answer."], [2199.62, 2220.9, "Tutor", "Any three of: a large fluid bolus, which dilates the right ventricle further and shifts the septum; induction and positive pressure ventilation, with the fall in systemic pressure and rise in right ventricular afterload; hypoxia, hypercapnia or acidosis; high PEEP; and systemic vasodilators that drop the pressure perfusing the right coronary artery."], [2221.3, 2224.54, "Tutor", "Sixth, beyond the cardiac core, vascular surgery."], [2224.54, 2226.08, "Tutor", "Two past questions."], [2226.08, 2230.11, "Tutor", "Oh's chapter thirty-five covers it with acute aortic syndromes."], [2230.11, 2240.69, "Tutor", "For ruptured abdominal aortic aneurysm, the principles are permissive hypotension in the conscious patient, with systolic pressure around 70 to 90, until the aorta is controlled."], [2240.69, 2242.96, "Tutor", "Avoid large crystalloid volumes."], [2242.96, 2248.65, "Tutor", "Endovascular repair is preferred where anatomy allows; the IMPROVE trial is the one to name."], [2248.65, 2251.15, "Tutor", "After repair, watch for four things."], [2251.15, 2256.9, "Tutor", "Abdominal compartment syndrome: intra-abdominal pressure above 20 with new organ dysfunction."], [2256.9, 2260.42, "Tutor", "Colonic ischaemia: bloody diarrhoea, a rising lactate."], [2260.42, 2262.01, "Tutor", "Acute kidney injury."], [2262.01, 2266.45, "Tutor", "And, after thoracic or thoracoabdominal repair, spinal cord ischaemia."], [2266.45, 2269.41, "Tutor", "That last one is the high-yield ICU problem."], [2269.41, 2274.41, "Tutor", "Spinal cord perfusion pressure equals mean arterial pressure minus CSF pressure."], [2274.41, 2285.84, "Tutor", "So you drain CSF to a pressure around 10 millimetres of mercury, limiting the drainage rate to avoid subdural haemorrhage, and you raise the mean arterial pressure, often to 80 to 90 or higher."], [2285.84, 2294.14, "Tutor", "If the legs weaken after the operation, that is an emergency: raise the pressure, open the drain, and correct haemoglobin and oxygenation."], [2294.54, 2301.03, "Tutor", "Before Wednesday: today's set includes the 2026 first-sitting question with only an ECG and an eighty-two-year-old."], [2301.03, 2304.72, "Tutor", "Write it in ten minutes using the structure from this episode."], [2304.72, 2307.26, "Tutor", "Assessment with a reason for every test."], [2307.26, 2310.43, "Tutor", "Then the unstable patient, split into fast and slow."], [2310.43, 2313.17, "Tutor", "Then the specific treatments for the causes."], [2313.17, 2319.29, "Tutor", "And do the daily ECG drill out loud, naming rate, rhythm, axis, intervals and one diagnosis before you look."], [2319.29, 2320.77, "Tutor", "That's it for today."], [2320.77, 2322.14, "Tutor", "See you next time."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 48.04, "title": "Last week"}, {"start": 172.58, "title": "This week: cardiac intensive care"}, {"start": 1341.1, "title": "Landmark trials"}, {"start": 1574.94, "title": "Exam practice"}, {"start": 1844.14, "title": "Syllabus round-up"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
