<script>
var C=[[0.0, 1.72, "Tutor", "Welcome to Part Two Daily."], [1.72, 6.27, "Tutor", "It's Saturday the thirty-first of October, and this is the Saturday spiral review."], [6.27, 14.96, "Tutor", "Spiral means we come back to things you've already met, but harder, and joined to another system, because that is exactly how the College writes its long questions."], [14.96, 16.94, "Tutor", "Today there are three revisits."], [16.94, 24.47, "Tutor", "First, shock and fluids, from this week: how you prove fluid responsiveness when the usual tests fail, and the rise and fall of the starches."], [24.47, 29.17, "Tutor", "Second, from three weeks ago, community-acquired pneumonia that isn't getting better."], [29.17, 34.53, "Tutor", "Third, also from three weeks ago, lactate after cardiac surgery, with a blood gas to work through."], [34.53, 39.38, "Tutor", "Then a journal watch on PELICAN, a new randomised trial of cardiac index guided therapy."], [39.38, 49.34, "Tutor", "And we finish with a syllabus round-up: blood gas analysis, interpreting arterial gases, diabetes insipidus, the syndrome of inappropriate antidiuretic hormone, and electrolyte replacement."], [49.34, 51.72, "Tutor", "There are six pause and answer moments."], [51.72, 54.4, "Tutor", "When you hear them, stop and answer out loud."], [55.8, 56.88, "Tutor", "Revisit one."], [56.88, 58.24, "Tutor", "Shock and fluids."], [58.24, 59.38, "Tutor", "Picture this."], [59.38, 60.9, "Tutor", "Day two in the unit."], [60.9, 65.08, "Tutor", "A sixty-year-old man with faecal peritonitis, back from a laparotomy."], [65.08, 68.12, "Tutor", "He's ventilated at six millilitres per kilogram."], [68.12, 71.37, "Tutor", "He's in atrial fibrillation at a hundred and thirty."], [71.37, 75.77, "Tutor", "Noradrenaline is at 0.25 micrograms per kilogram per minute and climbing."], [75.77, 81.25, "Tutor", "Urine output has been ten millilitres an hour for four hours, and his creatinine has doubled."], [81.25, 86.02, "Tutor", "He's had six litres of crystalloid since he arrived in the emergency department."], [86.02, 88.46, "Tutor", "The nurse asks you a simple question."], [88.46, 90.2, "Tutor", "Does he need more fluid?"], [90.2, 97.36, "Tutor", "That question has been asked by the College three times as a stand-alone theme in the data we track, in 2008, 2016 and 2020."], [97.36, 103.17, "Tutor", "And fluid responsiveness turns up inside many more shock questions as a single line of the marking."], [103.17, 107.08, "Tutor", "Here's the 2016 second sitting, question 24, read word for word."], [107.08, 113.1, "Tutor", "\"With respect to haemodynamic monitoring in the critically ill patient: a, Define fluid responsiveness."], [113.1, 123.35, "Tutor", "b, Outline the physiological basis and the limitations of the following methods of assessment of fluid responsiveness in a patient on mechanical ventilation: one, Passive leg raise."], [123.35, 125.36, "Tutor", "Two, Central venous pressure."], [125.54, 136.62, "Tutor", "Three, Pulse pressure variation.\" The pass rate was 53 percent, and the examiners wrote that for a core topic, the overall understanding was lacking in a significant number of candidates."], [137.02, 140.04, "Tutor", "Let's rebuild the answer that earns the marks."], [140.04, 146.42, "Tutor", "Oh's chapter 24, haemodynamic monitoring, and chapter 58, fluid and electrolyte therapy, are your sources."], [146.42, 148.1, "Tutor", "First, the definition."], [148.1, 155.93, "Tutor", "The College answer defines fluid responsiveness as an increase in stroke volume, or cardiac output, of 10 to 15 percent after fluid."], [155.93, 161.87, "Tutor", "And it adds the line that candidates forget: fluid responsiveness is not the same as hypovolaemia."], [161.87, 164.33, "Tutor", "Healthy people are fluid responsive."], [164.33, 170.31, "Tutor", "Being on the steep part of the Frank Starling curve tells you that fluid would raise stroke volume."], [170.31, 173.06, "Tutor", "It doesn't tell you the patient needs it."], [173.06, 175.52, "Tutor", "Second, the central venous pressure."], [175.52, 181.73, "Tutor", "The physiology is that it estimates right atrial pressure, which is the back pressure to venous return."], [181.73, 187.16, "Tutor", "The limitation is that a single value predicts fluid response no better than a coin toss."], [187.16, 194.88, "Tutor", "It is changed by intrathoracic pressure, PEEP, tricuspid regurgitation, right ventricular compliance and intra-abdominal pressure."], [194.88, 197.23, "Tutor", "Its real use is as a safety limit."], [197.23, 207.86, "Tutor", "A high and rising central venous pressure with no rise in output tells you the right heart has had enough, and venous congestion of the kidney is a real cause of acute kidney injury."], [207.86, 210.1, "Tutor", "Third, pulse pressure variation."], [210.28, 217.96, "Tutor", "In a ventilated patient, each positive pressure breath squeezes blood from the lungs into the left heart, then reduces right ventricular filling."], [217.96, 224.08, "Tutor", "If both ventricles sit on the steep part of their curves, stroke volume and pulse pressure swing with each breath."], [224.08, 230.46, "Tutor", "A variation above about 12 percent predicts response, with excellent accuracy in the conditions where it was validated."], [230.46, 232.46, "Tutor", "But those conditions are narrow."], [232.46, 242.0, "Tutor", "The patient must be fully passive on the ventilator, in sinus rhythm, with a tidal volume of at least 8 millilitres per kilogram, a closed chest, and normal intra-abdominal pressure."], [242.0, 245.01, "Tutor", "Right ventricular failure gives you false positives."], [245.01, 247.32, "Tutor", "Low lung compliance blunts the signal."], [247.72, 249.62, "Tutor", "So here's the first pause."], [249.62, 256.96, "Tutor", "Our man is in atrial fibrillation, ventilated at six millilitres per kilogram, with a fresh laparotomy and a tense abdomen."], [256.96, 263.23, "Tutor", "Name three reasons his pulse pressure variation is uninterpretable, and two tests you could use instead."], [263.23, 264.68, "Tutor", "Pause, and answer."], [270.08, 276.67, "Tutor", "Three reasons: the arrhythmia makes beat to beat stroke volume vary for reasons that have nothing to do with ventilation."], [276.67, 280.87, "Tutor", "The low tidal volume makes the swings in intrathoracic pressure too small."], [280.87, 285.72, "Tutor", "And raised intra-abdominal pressure distorts the transmission of pressure to the heart."], [285.72, 287.15, "Tutor", "What to use instead."], [287.15, 293.39, "Tutor", "The passive leg raise, which moves about 300 millilitres of blood from the legs and splanchnic bed into the chest."], [293.39, 296.15, "Tutor", "It's reversible, and it gives no fluid at all."], [296.15, 303.36, "Tutor", "But it must be read with a real-time measure of cardiac output, such as the velocity time integral on echo or pulse contour analysis."], [303.36, 306.53, "Tutor", "Blood pressure alone misses about half the responders."], [306.53, 309.9, "Tutor", "A rise in output of 10 percent or more is a positive test."], [309.9, 317.62, "Tutor", "It is unreliable with high intra-abdominal pressure, and you shouldn't do it with raised intracranial pressure, or with a fresh femoral sheath."], [317.62, 319.77, "Tutor", "The end-expiratory occlusion test."], [319.77, 322.89, "Tutor", "Hold the ventilator at end expiration for 15 seconds."], [322.89, 329.18, "Tutor", "That removes the cyclic fall in venous return, and a rise in cardiac output of 5 percent or more predicts response."], [329.18, 335.36, "Tutor", "It works with arrhythmias and low tidal volumes, as long as the patient can tolerate the hold without triggering."], [335.54, 338.03, "Tutor", "Two more you can name for a top mark."], [338.03, 348.8, "Tutor", "The tidal volume challenge: increase tidal volume from six to eight millilitres per kilogram for one minute, and a rise in pulse pressure variation of about 3.5 percent predicts response."], [348.8, 355.82, "Tutor", "And the mini fluid challenge: 100 millilitres over a minute, with the velocity time integral measured before and after."], [355.82, 359.52, "Tutor", "And the reference standard is still the fluid bolus itself."], [359.52, 364.77, "Tutor", "Say 250 millilitres over ten minutes, with a pre-set target and a pre-set safety limit."], [364.77, 367.42, "Tutor", "It's the only test that actually treats."], [367.42, 372.78, "Tutor", "But it is irreversible, and repeated boluses are how patients end up ten litres positive."], [373.68, 375.21, "Examiner", "Let me push you, then."], [375.21, 377.16, "Examiner", "Say the leg raise is positive."], [377.16, 379.41, "Examiner", "His cardiac output rises 14 percent."], [379.41, 382.07, "Examiner", "He's still oliguric, and he's six litres up."], [382.07, 383.6, "Examiner", "Do you give the fluid?"], [384.1, 389.85, "Candidate", "I think I'd give a small bolus, because he's responsive and his kidneys are hypoperfused."], [389.85, 394.06, "Candidate", "Maybe 250 millilitres of a balanced crystalloid, then reassess."], [394.56, 396.51, "Examiner", "That's the answer most candidates give."], [396.51, 397.72, "Examiner", "What did you not ask?"], [398.22, 401.16, "Candidate", "Whether he needs a higher cardiac output at all."], [401.16, 408.73, "Candidate", "If his lactate is clearing, his capillary refill is normal, and his venous saturation is fine, then responsiveness alone isn't a reason."], [408.73, 410.99, "Candidate", "And I didn't look at the harm side."], [410.99, 416.24, "Candidate", "He's in a positive balance, his abdomen is tense, and his central venous pressure is rising."], [416.24, 421.34, "Candidate", "Venous congestion and intra-abdominal hypertension can both be driving the kidney injury."], [421.34, 429.06, "Candidate", "So I'd measure bladder pressure first, and I'd think about raising the noradrenaline, or adding vasopressin, rather than giving more fluid."], [429.56, 430.23, "Examiner", "Good."], [430.23, 432.89, "Examiner", "That second answer is the consultant answer."], [432.89, 434.64, "Examiner", "Three questions, in order."], [434.64, 436.23, "Examiner", "Is there hypoperfusion?"], [436.23, 437.46, "Examiner", "Will fluid help?"], [437.46, 438.8, "Examiner", "And is fluid safe?"], [438.8, 441.72, "Examiner", "A positive test answers only the middle question."], [442.62, 446.59, "Tutor", "That brings in the evidence on how much fluid to give."], [446.59, 449.09, "Tutor", "Two recent trials set the tone."], [449.09, 459.65, "Tutor", "CLASSIC, in the New England Journal in 2022, restricted fluid after initial resuscitation in septic shock, and 90-day mortality was 42.3 versus 42.1 percent."], [459.65, 461.06, "Tutor", "No difference."], [461.06, 474.25, "Tutor", "CLOVERS, in 2023, compared a restrictive, early vasopressor strategy with a liberal fluid strategy in sepsis induced hypotension, and 90-day death before discharge home was 14.0 versus 14.9 percent."], [474.25, 476.11, "Tutor", "Again, no difference."], [476.11, 487.06, "Tutor", "The take-home for an exam answer: after the first resuscitation, less fluid and earlier vasopressors is at least as safe, so the burden of proof is on giving more."], [487.06, 492.31, "Tutor", "Since we've raised vasopressin, here's something new on this week's theme."], [492.31, 500.83, "Tutor", "VASSPR, published in JAMA on the 14th of October, is a pragmatic cluster crossover trial from 13 hospitals in Utah and Idaho."], [500.83, 503.46, "Tutor", "3,959 patients with septic shock."], [503.46, 516.52, "Tutor", "Hospitals switched month by month between starting vasopressin at 0.03 units per minute when the noradrenaline-equivalent dose reached 0.1 micrograms per kilogram per minute, or waiting until 0.4."], [516.52, 523.18, "Tutor", "28-day mortality was 31.8 percent with the lower threshold and 33.0 percent with the higher one."], [523.36, 525.48, "Tutor", "Not significantly different."], [525.48, 532.33, "Tutor", "Persistent or new cardiogenic shock was a little more common with early vasopressin, 7.4 versus 6.3 percent."], [532.33, 543.12, "Tutor", "How to say it in an answer: early vasopressin is a reasonable noradrenaline-sparing strategy, but neither VANISH nor VASSPR shows a mortality benefit from starting it earlier."], [544.52, 552.37, "Tutor", "Now, a story, because this week's landmark reading is the CHEST trial, and the story behind it is one of the strangest in our specialty."], [552.37, 555.85, "Tutor", "Hydroxyethyl starch is made from maize or potato starch."], [555.85, 562.17, "Tutor", "The glucose chains are tagged with hydroxyethyl groups so that plasma amylase can't break them down quickly."], [562.17, 563.75, "Tutor", "The idea was elegant."], [563.75, 570.72, "Tutor", "Give a big molecule, and it stays in the vessels, so you need less volume than with crystalloid to fill the circulation."], [570.72, 575.84, "Tutor", "For decades it was routine in theatres across Europe and in many intensive care units."], [575.84, 583.14, "Tutor", "Much of the published evidence that starches were safe, and even protective, came from one German anaesthetist, Joachim Boldt."], [583.14, 587.28, "Tutor", "In November 2010 he was suspended from his hospital in Ludwigshafen."], [587.28, 593.82, "Tutor", "In March 2011, the editors of sixteen journals said that 89 of 102 of his studies lacked proper ethics approval."], [593.82, 597.63, "Tutor", "Retractions followed in waves, and they are still being added."], [597.63, 601.61, "Tutor", "A whole evidence base for a fluid had a hole in the middle of it."], [601.61, 604.61, "Tutor", "Meanwhile, two independent trials were running."], [604.61, 611.2, "Tutor", "In July 2012, the Scandinavian 6S trial compared starch with Ringer's acetate in 804 patients with severe sepsis."], [611.38, 618.17, "Tutor", "Death or dialysis dependence at 90 days was 51 versus 43 percent, a relative risk of 1.17."], [618.17, 622.26, "Tutor", "Renal replacement therapy was 22 versus 16 percent."], [622.26, 627.74, "Tutor", "Then in October 2012, from our own ANZICS Clinical Trials Group, CHEST."], [628.14, 633.34, "Tutor", "CHEST, Myburgh and colleagues, New England Journal of Medicine, 2012."], [633.34, 640.5, "Tutor", "7,000 adults in 32 Australian and New Zealand intensive care units who needed fluid resuscitation."], [640.5, 649.35, "Tutor", "Six percent hydroxyethyl starch 130 over 0.4 versus 0.9 percent saline, blinded, up to 50 millilitres per kilogram per day."], [649.35, 658.41, "Tutor", "Primary outcome, 90-day mortality: 18.0 versus 17.0 percent, relative risk 1.06, with a confidence interval from 0.96 to 1.18."], [658.41, 660.5, "Tutor", "No difference in death."], [660.5, 668.54, "Tutor", "But renal replacement therapy was 7.0 versus 5.8 percent, relative risk 1.21, confidence interval 1.00 to 1.45."], [668.54, 670.84, "Tutor", "More dialysis with starch."], [670.84, 680.29, "Tutor", "And starch reduced the volume of resuscitation fluid only modestly, about 526 versus 616 millilitres a day over the first four days."], [680.29, 683.0, "Tutor", "Nowhere near the promised ratio."], [683.0, 684.89, "Tutor", "The main criticisms."], [684.89, 689.55, "Tutor", "About 15 percent of patients had starch before randomisation."], [689.55, 694.82, "Tutor", "Mortality, 17 to 18 percent, was lower than the trial had planned for."], [694.82, 701.24, "Tutor", "And many patients were not badly shocked at enrolment, with mean base excess near zero."], [701.24, 702.86, "Tutor", "What it changed."], [703.04, 714.85, "Tutor", "In June 2013, Europe's safety committee recommended suspending starch, and the American regulator added a boxed warning that year, advising against starch in critically ill adults including sepsis."], [714.85, 720.5, "Tutor", "In February 2022 the European committee recommended suspension from the market altogether."], [720.5, 726.73, "Tutor", "The Surviving Sepsis Campaign 2021 makes a strong recommendation against starches for resuscitation."], [726.73, 739.17, "Tutor", "How to quote it in an SAQ: \"Starches increase renal replacement therapy without reducing mortality: CHEST, 7,000 patients, relative risk for dialysis 1.21, and 6S showed increased death or dialysis in sepsis."], [739.17, 748.05, "Tutor", "I would not use them.\" The lesson that examiners like: physiology predicted a benefit, small trials agreed, and large pragmatic trials found harm."], [748.05, 752.6, "Tutor", "Which is why your answers should lean on outcome trials, not mechanism."], [753.0, 754.11, "Tutor", "Second pause."], [754.11, 762.47, "Tutor", "Without looking: in CHEST, what were the rates of renal replacement therapy with starch and with saline, and what was the 90-day mortality in each arm?"], [762.47, 763.84, "Tutor", "Pause, and answer."], [769.24, 772.75, "Tutor", "Renal replacement therapy, 7.0 versus 5.8 percent."], [772.75, 777.73, "Tutor", "Ninety-day mortality, 18.0 versus 17.0 percent, which was not significant."], [777.73, 781.36, "Tutor", "One sentence: no survival difference, more dialysis."], [781.36, 784.94, "Tutor", "The overlap with the kidney that makes this harder."], [784.94, 791.0, "Tutor", "If our man goes on to continuous renal replacement therapy, his fluid question turns around."], [791.0, 795.6, "Tutor", "You now control fluid removal by setting a net ultrafiltration rate."], [795.6, 803.18, "Tutor", "A common starting point is 1 to 2 millilitres per kilogram per hour, titrated against perfusion and vasopressor dose."], [803.18, 813.36, "Tutor", "That is de-resuscitation, and it's the fourth phase of fluid therapy that the College expects you to name: rescue, optimisation, stabilisation, then evacuation."], [814.76, 815.85, "Tutor", "Revisit two."], [815.85, 817.22, "Tutor", "Three weeks back."], [817.22, 820.67, "Tutor", "Community-acquired pneumonia that isn't getting better."], [820.67, 826.9, "Tutor", "You scored five and a half on this question on the 12th of October, and five and a half again on the 16th."], [826.9, 828.87, "Tutor", "Both times part a was solid."], [828.87, 831.93, "Tutor", "Part b, the assessment, is where the marks went."], [831.93, 839.15, "Tutor", "If you haven't written today's attempt yet, this would be a good moment to stop the episode and do it first, then come back."], [839.15, 848.18, "Tutor", "William Osler, in his textbook at the turn of the twentieth century, borrowed a phrase from John Bunyan and called pneumonia the captain of the men of death."], [848.18, 854.31, "Tutor", "He also called it the old man's friend, because it brought a quick and fairly peaceful end to the frail."], [854.31, 863.28, "Tutor", "A century and a half of antibiotics later, severe pneumonia still carries a hospital mortality that would have been familiar to him in the sickest patients."], [863.28, 866.17, "Tutor", "That's why the College keeps asking about it."], [866.17, 870.0, "Tutor", "Here's the question, from the 2025 first sitting, question 11."], [870.0, 876.29, "Tutor", "\"A 67-year-old patient is admitted to the ICU with a presumptive diagnosis of community-acquired pneumonia."], [876.29, 881.6, "Tutor", "On day 5 they remain intubated and ventilated for persistent hypoxic respiratory failure."], [881.78, 886.96, "Tutor", "a, Outline six factors that may predict a poor response to antibiotics in CAP."], [886.96, 887.92, "Tutor", "3 marks."], [887.92, 895.45, "Tutor", "b, Outline your assessment of this patient with respiratory failure that is refractory to standard treatment for CAP."], [895.45, 898.4, "Tutor", "7 marks.\" The pass rate was 58.7 percent."], [898.4, 905.92, "Tutor", "Community-acquired pneumonia has come up four times in the questions we track, in 2012 twice, 2025 and again in 2026."], [905.92, 909.9, "Tutor", "The examiners said that part b was an assessment question."], [909.9, 920.98, "Tutor", "They wanted a focused history, examination and investigations aimed at the causes of non-resolving pneumonia, and at the non-infective causes of refractory respiratory failure."], [920.98, 927.3, "Tutor", "And they said that bullet points for a complete investigation list were acceptable and efficient."], [927.7, 930.6, "Tutor", "Third pause, and this is your part a."], [930.6, 936.78, "Tutor", "Six factors that predict a poor response to antibiotics in community-acquired pneumonia."], [936.78, 938.46, "Tutor", "Pause, and answer."], [943.86, 947.29, "Tutor", "Here's a list that would score all three marks."], [947.29, 950.21, "Tutor", "Think host, bug, disease and treatment."], [950.21, 956.13, "Tutor", "Host: age over 65, immunosuppression, and chronic lung or liver disease or alcohol use."], [956.13, 959.12, "Tutor", "Bug: a resistant or unexpected organism."], [959.12, 968.84, "Tutor", "Staphylococcus aureus including MRSA, Pseudomonas, Legionella, or an organism the empiric cover misses, such as tuberculosis, fungi or Pneumocystis."], [968.84, 975.63, "Tutor", "Disease: multilobar involvement, bacteraemia, septic shock at presentation, or a high severity score."], [975.63, 979.68, "Tutor", "Complications: an empyema, a lung abscess, or cavitation."], [979.68, 984.91, "Tutor", "Treatment: delayed or inappropriate first antibiotics, or inadequate dosing."], [984.91, 987.96, "Tutor", "That's more than six, which is the point."], [987.96, 990.02, "Tutor", "Write six, one line each."], [990.42, 992.49, "Tutor", "Now part b, the seven marks."], [992.49, 996.75, "Tutor", "Oh's chapter 48, pneumonia, frames non-resolution in four buckets."], [996.75, 1000.6, "Tutor", "Use them as your structure, and you'll stop missing things."], [1000.6, 1005.38, "Tutor", "Bucket one: it's the right diagnosis, but the wrong drug or the wrong dose."], [1005.38, 1010.73, "Tutor", "A resistant organism, an atypical one, or an antibiotic that isn't reaching the lung."], [1010.73, 1016.37, "Tutor", "Think about dosing in a patient with augmented clearance, or on renal replacement therapy."], [1016.37, 1020.57, "Tutor", "Bucket two: it's the right diagnosis, but there's a complication."], [1020.57, 1025.8, "Tutor", "Empyema, abscess, a new ventilator-associated pneumonia, a line infection, or ARDS."], [1025.8, 1028.73, "Tutor", "Bucket three: it's not an infection at all."], [1028.73, 1029.83, "Tutor", "The mimics."], [1029.83, 1031.95, "Tutor", "Cardiogenic pulmonary oedema."], [1031.95, 1033.51, "Tutor", "Pulmonary embolism."], [1033.51, 1036.1, "Tutor", "Vasculitis with alveolar haemorrhage."], [1036.1, 1037.77, "Tutor", "Organising pneumonia."], [1037.77, 1039.89, "Tutor", "Acute eosinophilic pneumonia."], [1039.89, 1041.85, "Tutor", "Drug-induced lung disease."], [1041.85, 1043.46, "Tutor", "Lymphangitic cancer."], [1043.46, 1047.6, "Tutor", "Bucket four: it's an infection, but not the one you're treating."], [1047.6, 1052.95, "Tutor", "Tuberculosis, fungi, Pneumocystis, viruses, and the Australian zoonoses like Q fever."], [1052.95, 1058.36, "Tutor", "Then, for the marks, run history, examination and investigations across those buckets."], [1058.36, 1061.53, "Tutor", "History: travel, occupation and animal contact."], [1061.53, 1067.22, "Tutor", "Rash, haemoptysis, joint pain and renal symptoms, which point to connective tissue disease."], [1067.4, 1071.76, "Tutor", "Drugs, including amiodarone, methotrexate and nitrofurantoin."], [1071.76, 1074.8, "Tutor", "Immune status, HIV risk and steroid use."], [1074.8, 1085.61, "Tutor", "Examination: rash, synovitis, an effusion, fluid status, cardiac signs and murmurs, line sites, and a review of the ventilator and the chest drain if there is one."], [1085.61, 1092.88, "Tutor", "Investigations, and this is the list you were missing: repeat blood and sputum cultures with sensitivities."], [1092.88, 1099.45, "Tutor", "Bronchoalveolar lavage for resistant organisms, fungi, Pneumocystis, mycobacteria and viral PCR."], [1099.45, 1105.33, "Tutor", "Legionella and pneumococcal urinary antigens, and serology for atypicals and Q fever."], [1105.33, 1108.94, "Tutor", "A QuantiFERON, or interferon gamma release assay."], [1108.94, 1117.28, "Tutor", "An autoimmune screen: ANCA, anti-GBM antibodies, ANA, complement and CK, and a urine sediment for active glomerulonephritis."], [1117.28, 1120.06, "Tutor", "An echo and BNP for cardiac failure."], [1120.06, 1129.04, "Tutor", "A CT pulmonary angiogram, or high resolution CT, which will show abscess, empyema, cavitation and the pattern of organising pneumonia."], [1129.04, 1130.68, "Tutor", "Antibiotic levels."], [1130.68, 1134.92, "Tutor", "And finally, lung biopsy if the diagnosis is still unclear."], [1135.82, 1137.8, "Examiner", "And the harder version."], [1137.8, 1139.15, "Examiner", "Same patient."], [1139.15, 1144.33, "Examiner", "The lavage is bloodstained, and gets more bloodstained with each aliquot."], [1144.33, 1148.3, "Examiner", "Haemoglobin has fallen from 120 to 85 grams per litre."], [1148.3, 1154.31, "Examiner", "Creatinine is 280 micromoles per litre and the urine dipstick shows blood and protein."], [1154.31, 1157.38, "Examiner", "What's your diagnosis, and what changes?"], [1157.88, 1161.82, "Candidate", "That's diffuse alveolar haemorrhage with a renal lesion."], [1161.82, 1163.98, "Candidate", "A pulmonary-renal syndrome."], [1163.98, 1168.36, "Candidate", "The most likely causes are ANCA vasculitis or anti-GBM disease."], [1168.36, 1174.45, "Candidate", "I'd send ANCA and anti-GBM urgently, look for red cell casts, and ask renal about a biopsy."], [1174.45, 1181.23, "Candidate", "And I'd start methylprednisolone, about 1 gram a day for three days, without waiting for the serology."], [1181.23, 1184.56, "Candidate", "Then plasma exchange if it's anti-GBM disease."], [1185.06, 1185.57, "Examiner", "Good."], [1185.57, 1187.06, "Examiner", "Where would you lose the mark?"], [1187.56, 1193.41, "Candidate", "By not checking coagulation and platelets first, and by not asking whether he's been on anticoagulants."], [1193.41, 1199.36, "Candidate", "And by forgetting that infection can still cause alveolar haemorrhage, so I'd keep the antibiotics going."], [1199.86, 1200.69, "Examiner", "Right."], [1200.69, 1209.1, "Examiner", "Plasma exchange for ANCA vasculitis is now a selective decision after the PEXIVAS trial, but for anti-GBM disease it remains standard."], [1209.1, 1211.94, "Examiner", "That nuance is a consultant-level point."], [1212.84, 1216.35, "Tutor", "One more piece, because it changes management."], [1216.35, 1229.75, "Tutor", "The 2023 European severe pneumonia guideline, from the ERS, ESICM, ESCMID and ALAT, makes a conditional recommendation for corticosteroids in severe community-acquired pneumonia when there is shock."], [1229.75, 1236.97, "Tutor", "The trial that has moved the field since is CAPE COD, Dequin and colleagues, New England Journal, 2023."], [1236.97, 1241.97, "Tutor", "800 patients in 31 French intensive care units with severe pneumonia."], [1241.97, 1248.28, "Tutor", "Hydrocortisone 200 milligrams a day for four days, then tapered to 8 or 14 days in total."], [1248.28, 1254.27, "Tutor", "28-day mortality was 6.2 versus 11.9 percent, an absolute difference of 5.6 percent."], [1254.27, 1257.39, "Tutor", "Intubation was 18.0 versus 29.5 percent."], [1257.39, 1258.69, "Tutor", "Two catches."], [1258.69, 1264.8, "Tutor", "Patients with septic shock at enrolment were excluded, and influenza was excluded too."], [1264.8, 1272.8, "Tutor", "So quote it as: \"hydrocortisone reduced 28-day mortality in severe non-influenza pneumonia without shock at entry.\""], [1273.2, 1283.23, "Tutor", "Two more things that turn a pass into a strong pass on pneumonia, because the 2026 first sitting asked about it again, and the pass rate there was 71.8 percent."], [1283.23, 1288.6, "Tutor", "The candidates who knew the severity criteria and the antibiotic choices did well."], [1288.6, 1289.62, "Tutor", "Severity."], [1289.62, 1304.9, "Tutor", "The 2019 American Thoracic Society and Infectious Diseases Society guideline defines severe pneumonia by one major criterion, which is septic shock needing vasopressors or respiratory failure needing mechanical ventilation, or three minor criteria."], [1304.9, 1322.15, "Tutor", "The minor criteria are: respiratory rate of 30 or more, a PaO2 to FiO2 ratio of 250 or less, multilobar infiltrates, confusion, urea of 7 millimoles per litre or more, white cells below 4, platelets below 100, temperature below 36 degrees, and hypotension needing aggressive fluid."], [1322.15, 1331.7, "Tutor", "In Australia, SMART-COP is the other score worth naming, because it was built here to predict the need for intensive respiratory or vasopressor support."], [1331.7, 1332.89, "Tutor", "Antibiotics."], [1332.89, 1343.76, "Tutor", "Following Australian practice for severe pneumonia, a third-generation cephalosporin such as ceftriaxone, plus a macrolide such as azithromycin, which also covers Legionella."], [1343.94, 1354.9, "Tutor", "Add cover for Staphylococcus aureus if there are risk factors, such as recent influenza or a cavitating picture, and for Pseudomonas if there is structural lung disease or recent hospital exposure."], [1354.9, 1357.52, "Tutor", "Then narrow as soon as you have a result."], [1357.52, 1371.26, "Tutor", "And the history line that earns marks in Australia: ask about melioidosis risk in the tropical north, especially with diabetes, alcohol use or chronic kidney disease, because Burkholderia pseudomallei needs meropenem and is missed by standard cover."], [1372.66, 1373.92, "Tutor", "Revisit three."], [1373.92, 1376.1, "Tutor", "Lactate after cardiac surgery."], [1376.1, 1382.42, "Tutor", "You met this three weeks ago, and scored five and a half on the 13th of October, then six on the 16th."], [1382.42, 1386.61, "Tutor", "That's retired, but the theme is one of the College's favourites."], [1386.61, 1392.52, "Tutor", "Causes of lactic acidosis appear in thirteen questions in the data we track, from 2008 to 2021."], [1392.52, 1395.5, "Tutor", "Here's the 2018 second sitting, question 12."], [1395.5, 1401.7, "Tutor", "\"List the causes of an elevated lactate immediately following an aortic valve replacement procedure."], [1401.7, 1406.75, "Tutor", "Outline your approach to determining the cause.\" The pass rate was 46.3 percent."], [1406.75, 1415.88, "Tutor", "And the examiner comment matters: many candidates gave a general list of causes of high lactate, rather than causes specific to the post-valve setting."], [1415.88, 1420.3, "Tutor", "Some outlined management instead of an approach to finding the cause."], [1420.3, 1423.11, "Tutor", "So the answer has to be setting-specific."], [1423.11, 1430.17, "Tutor", "Oh's chapter 57, acid-base disorders and hyperlactataemia, gives the framework, and the College answer fills it in."], [1430.17, 1434.93, "Tutor", "Before surgery: drugs, especially metformin, linezolid and antiretrovirals."], [1434.93, 1441.42, "Tutor", "On bypass: a long bypass run, a lactate-containing prime, inadequate pump flow and prolonged hypothermia."], [1441.6, 1448.61, "Tutor", "After surgery, low cardiac output: tamponade, myocardial ischaemia or infarction, and a malfunctioning valve."], [1448.61, 1452.02, "Tutor", "Then: splanchnic ischaemia and liver dysfunction."], [1452.02, 1460.53, "Tutor", "And the others: beta agonists, especially adrenaline, measurement error, ischaemic muscle and rhabdomyolysis, and thiamine deficiency."], [1460.53, 1462.62, "Tutor", "Your approach then follows."], [1462.62, 1465.8, "Tutor", "History of the bypass run and the drug chart."], [1465.8, 1471.55, "Tutor", "Examination of perfusion, infusions, temperature, the drains, the abdomen and the limbs."], [1471.55, 1488.8, "Tutor", "Investigations: repeat the lactate, a blood gas with a venous saturation, full blood count, coagulation and biochemistry with CK, a chest film, an echo looking for tamponade and valve function, imaging of the abdomen, and red cell transketolase if thiamine deficiency is possible."], [1489.2, 1496.02, "Tutor", "Before the gas, the reasoning behind why we chase lactate at all, because it explains several exam answers."], [1496.02, 1499.52, "Tutor", "Lactate isn't a waste product and it isn't a toxin."], [1499.52, 1502.31, "Tutor", "Every cell makes pyruvate from glucose."], [1502.31, 1512.1, "Tutor", "When pyruvate is made faster than the mitochondria can use it, it's converted to lactate, which regenerates the cofactor that glycolysis needs to keep going."], [1512.1, 1517.08, "Tutor", "The liver then takes up most of that lactate and turns it back into glucose."], [1517.08, 1523.01, "Tutor", "That's the Cori cycle, described by Carl and Gerty Cori, who shared the Nobel Prize in 1947."], [1523.01, 1526.63, "Tutor", "So a high lactate means production exceeds clearance."], [1526.63, 1535.12, "Tutor", "Production rises with tissue hypoxia, which is type A, and also with adrenaline, sepsis-driven glycolysis, and drugs, which are type B."], [1535.12, 1538.67, "Tutor", "Clearance falls with liver hypoperfusion or failure."], [1538.67, 1545.14, "Tutor", "That's why the post-valve answer has to include the liver and the splanchnic bed, not just the heart."], [1545.14, 1548.52, "Tutor", "And it's why lactate is a slow, imperfect target."], [1548.52, 1558.01, "Tutor", "ANDROMEDA-SHOCK, in JAMA in 2019, randomised 424 patients with early septic shock to resuscitation targeting capillary refill time or targeting lactate."], [1558.01, 1562.64, "Tutor", "28-day mortality was 34.9 versus 43.4 percent, with a p value of 0.06."], [1562.82, 1569.42, "Tutor", "Not statistically significant, but capillary refill was at least as good, and it responds in minutes, not hours."], [1569.42, 1576.3, "Tutor", "That's why the Surviving Sepsis Campaign 2021 suggests capillary refill as an adjunct to other measures of perfusion."], [1576.7, 1577.86, "Tutor", "Now harder."], [1577.86, 1583.43, "Tutor", "Two hours after an aortic valve replacement, the patient is sedated and ventilated."], [1583.43, 1591.26, "Tutor", "The gas shows a pH of 7.19, a carbon dioxide of 38 millimetres of mercury, and a bicarbonate of 14 millimoles per litre."], [1591.26, 1597.8, "Tutor", "Sodium 136 millimoles per litre, chloride 102 millimoles per litre, and albumin 28 grams per litre."], [1597.8, 1600.37, "Tutor", "Lactate is 9 millimoles per litre."], [1600.37, 1607.53, "Tutor", "He's on adrenaline at 0.15 micrograms per kilogram per minute, and his mixed venous saturation is 72 percent."], [1607.53, 1616.21, "Tutor", "This is where marks were lost on the 20th of October, on question 26 from the 2013 second sitting, which you scored one and a half on."], [1616.21, 1618.84, "Tutor", "The compensation formula was wrong."], [1618.84, 1620.98, "Tutor", "So let's make it automatic."], [1621.38, 1622.55, "Tutor", "Fourth pause."], [1622.55, 1625.1, "Tutor", "Work this gas with the College method."], [1625.1, 1632.54, "Tutor", "Calculate the anion gap without potassium, correct it for albumin, calculate the delta ratio, and the expected carbon dioxide."], [1632.54, 1634.26, "Tutor", "What are the disorders?"], [1634.26, 1635.7, "Tutor", "Pause, and answer."], [1641.1, 1645.25, "Tutor", "Anion gap: 136 minus the sum of 102 and 14, which is 20."], [1645.25, 1650.05, "Tutor", "Albumin correction: add a quarter of the albumin deficit below 40."], [1650.05, 1654.33, "Tutor", "That's 40 minus 28, which is 12, and a quarter of 12 is 3."], [1654.33, 1656.4, "Tutor", "Corrected anion gap, 23."], [1656.4, 1659.45, "Tutor", "Against a normal of 12, the rise is 11."], [1659.45, 1663.28, "Tutor", "Bicarbonate has fallen from 24 to 14, a fall of 10."], [1663.28, 1666.07, "Tutor", "Delta ratio, 11 over 10, about 1.1."], [1666.07, 1675.34, "Tutor", "Between 1 and 2, so this is a pure high anion gap metabolic acidosis, with no hidden normal anion gap acidosis and no hidden alkalosis."], [1675.34, 1682.67, "Tutor", "Expected carbon dioxide, Winters' formula: one and a half times the bicarbonate, plus 8, plus or minus 2."], [1682.67, 1686.04, "Tutor", "One and a half times 14 is 21, plus 8 is 29."], [1686.04, 1688.77, "Tutor", "So the expected range is 27 to 31."], [1688.77, 1689.93, "Tutor", "His is 38."], [1689.93, 1693.11, "Tutor", "That's a concurrent respiratory acidosis."], [1693.11, 1699.14, "Tutor", "He's under-ventilated for this degree of acidosis, so turn up his minute ventilation."], [1699.14, 1700.57, "Tutor", "And the twist."], [1700.57, 1705.82, "Tutor", "With a venous saturation of 72 percent, he isn't obviously in low output."], [1705.82, 1715.16, "Tutor", "Adrenaline stimulates beta 2 receptors on muscle, speeds up aerobic glycolysis, and pours out lactate even when oxygen delivery is fine."], [1715.16, 1717.11, "Tutor", "That's type B lactate."], [1717.11, 1719.18, "Tutor", "But you don't assume it."], [1719.36, 1729.87, "Tutor", "You exclude tamponade and ischaemia with an echo and an ECG, look at the abdomen, and only then consider a switch to noradrenaline with an inodilator, and watch whether the lactate falls."], [1729.87, 1734.88, "Tutor", "That is the setting-specific, data-based answer that scores seven or eight, not five."], [1735.78, 1740.47, "Examiner", "One more twist, because examiners love to join the kidney to this."], [1740.47, 1742.88, "Examiner", "Same day, a different patient."], [1742.88, 1748.71, "Examiner", "A 72-year-old with type 2 diabetes on metformin, two days of vomiting, now oliguric."], [1748.71, 1751.5, "Examiner", "Creatinine 640 micromoles per litre."], [1751.5, 1756.89, "Examiner", "pH 6.95, bicarbonate 4 millimoles per litre, lactate 18 millimoles per litre."], [1756.89, 1760.12, "Examiner", "Blood pressure 85 over 50 on noradrenaline."], [1760.12, 1763.86, "Examiner", "What's going on, and what's the specific treatment?"], [1764.36, 1766.93, "Candidate", "Metformin-associated lactic acidosis."], [1766.93, 1776.34, "Candidate", "Metformin is renally cleared, so with acute kidney injury it accumulates, and it inhibits mitochondrial respiration and hepatic gluconeogenesis from lactate."], [1776.34, 1783.64, "Candidate", "But I'd still look for a second cause, like mesenteric ischaemia or sepsis, because the lactate could be type A as well."], [1783.64, 1786.89, "Candidate", "The specific treatment is extracorporeal removal."], [1786.89, 1797.56, "Candidate", "Metformin is small and water soluble, so intermittent haemodialysis clears it best, but if the patient is unstable I'd use continuous haemodiafiltration with a high effluent dose."], [1797.56, 1808.0, "Candidate", "The extracorporeal treatments in poisoning workgroup recommends extracorporeal treatment when lactate is above 20, or the pH is 7.0 or lower, or when standard care is failing."], [1808.5, 1809.05, "Examiner", "Good."], [1809.05, 1810.06, "Examiner", "And bicarbonate?"], [1810.56, 1814.47, "Candidate", "Only as a bridge for severe acidaemia while dialysis is set up."], [1814.47, 1820.2, "Candidate", "On its own it doesn't remove the metformin, and the extra carbon dioxide has to be breathed off."], [1820.7, 1822.83, "Examiner", "That's a seven out of ten answer."], [1822.83, 1829.1, "Examiner", "The eight comes from saying that a metformin level is useful to confirm the diagnosis, but you don't wait for it."], [1830.5, 1831.81, "Tutor", "Journal watch."], [1831.81, 1832.76, "Tutor", "PELICAN."], [1832.76, 1834.91, "Tutor", "Here's the question it asks."], [1834.91, 1841.58, "Tutor", "If you know what a patient's normal cardiac output is, should you defend that number during big surgery?"], [1841.58, 1848.07, "Tutor", "PELICAN was flagged by Critical Care Reviews this week, and published in JAMA on the 19th of October."], [1848.07, 1850.09, "Tutor", "First author Bernd Saugel."], [1850.09, 1855.63, "Tutor", "Design: a randomised trial across 12 university hospitals in five European countries."], [1855.63, 1862.3, "Tutor", "1,111 high-risk adults having elective major abdominal surgery were randomised, and 1,095 were analysed."], [1862.3, 1863.61, "Tutor", "Median age 67."], [1863.61, 1871.17, "Tutor", "Intervention: haemodynamic therapy individualised to each patient's own resting cardiac index, measured before surgery."], [1871.17, 1877.54, "Tutor", "Comparator: routine haemodynamic care, with cardiac index monitored but hidden from the clinicians."], [1877.54, 1882.18, "Tutor", "Primary outcome: a composite of major complications within seven days."], [1882.18, 1888.2, "Tutor", "Acute kidney injury, myocardial injury, severe infection, non-fatal cardiac arrest, or death."], [1888.2, 1894.09, "Tutor", "It occurred in 44.3 percent with individualised therapy and 46.9 percent with routine care."], [1894.09, 1896.59, "Tutor", "Relative risk 0.94, p equals 0.38."], [1896.59, 1898.02, "Tutor", "Not significant."], [1898.02, 1906.06, "Tutor", "There was no difference in any single component, or in seven-day mortality, so there's no safety signal, and no benefit either."], [1906.46, 1907.64, "Tutor", "Limitations."], [1907.64, 1913.03, "Tutor", "It's elective surgery, not shock, so be careful about extending it to our patients."], [1913.03, 1915.52, "Tutor", "The intervention can't be blinded."], [1915.52, 1921.5, "Tutor", "And the composite is driven by events, like kidney injury, that have many causes beyond flow."], [1921.5, 1922.69, "Tutor", "How it fits."], [1922.69, 1925.18, "Tutor", "This is the latest in a long line."], [1925.18, 1939.81, "Tutor", "Shoemaker's supranormal targets in the 1980s gave way to goal-directed therapy, and then to OPTIMISE in 2014, where a cardiac output guided algorithm reduced complications from 43.4 to 36.6 percent, but the confidence interval crossed one."], [1939.81, 1944.72, "Tutor", "A single-centre German pilot of the personalised approach looked promising."], [1944.72, 1948.51, "Tutor", "PELICAN is the large multicentre test, and it's neutral."], [1948.51, 1950.47, "Tutor", "Three take-home messages."], [1950.47, 1958.11, "Tutor", "One: targeting the patient's own baseline cardiac index did not reduce major complications after major abdominal surgery."], [1958.11, 1962.67, "Tutor", "Two: it caused no harm, so it's a neutral result, not a negative one."], [1962.67, 1968.65, "Tutor", "Three: across intraoperative and ICU trials, chasing a flow number in everyone keeps failing."], [1968.65, 1973.09, "Tutor", "What works is treating hypoperfusion, and stopping when it's fixed."], [1973.09, 1975.46, "Tutor", "Does it change your exam answer?"], [1975.46, 1976.94, "Tutor", "Only in one line."], [1977.12, 1985.37, "Tutor", "If asked about cardiac output monitoring, you can now say that goal-directed and individualised flow targets have not shown benefit in large trials."], [1985.37, 1990.44, "Tutor", "The summary here is drawn from the published abstract, flagged by Critical Care Reviews."], [1991.84, 1993.27, "Tutor", "Syllabus round-up."], [1993.27, 1998.81, "Tutor", "Five items today, all from week one, acid-base and electrolytes, so they're beyond this week."], [1998.81, 2002.71, "Tutor", "First, blood gas analysis, and how the machine can mislead you."], [2002.71, 2009.03, "Tutor", "This is the analytical side, and it is examined, usually as \"what are the sources of error in this result\"."], [2009.03, 2010.89, "Tutor", "Oh's chapter 57 covers it."], [2010.89, 2016.22, "Tutor", "What it is: the analyser measures pH, carbon dioxide and oxygen directly with electrodes."], [2016.22, 2019.79, "Tutor", "Bicarbonate and base excess are calculated, not measured."], [2019.79, 2022.7, "Tutor", "Lactate is measured with an enzyme electrode."], [2022.7, 2024.84, "Tutor", "Four points the examiner wants."], [2024.84, 2027.75, "Tutor", "One, pre-analytical errors are the commonest."], [2027.75, 2033.79, "Tutor", "An air bubble pulls the oxygen towards about 150 millimetres of mercury and lowers the carbon dioxide."], [2033.79, 2043.23, "Tutor", "Delay at room temperature lets leucocytes keep consuming oxygen and producing acid, which matters with a very high white count, where it's called leucocyte larceny."], [2043.23, 2048.56, "Tutor", "Too much liquid heparin dilutes the sample and lowers the carbon dioxide and bicarbonate."], [2048.56, 2050.7, "Tutor", "Two, the patient's temperature."], [2050.7, 2052.95, "Tutor", "Gases are measured at 37 degrees."], [2052.95, 2058.94, "Tutor", "Alpha-stat management uses the uncorrected values, and pH-stat corrects to the patient's temperature."], [2058.94, 2062.73, "Tutor", "Know which one you're quoting after bypass or in hypothermia."], [2062.73, 2064.32, "Tutor", "Why does that matter?"], [2064.5, 2070.73, "Tutor", "As blood cools, carbon dioxide becomes more soluble, so its partial pressure falls and the pH rises."], [2070.73, 2080.32, "Tutor", "Cold-blooded animals simply let that happen, and keep the charge state of the imidazole groups on histidine constant, which is where alpha-stat gets its name."], [2080.32, 2083.09, "Tutor", "Their proteins and enzymes keep working."], [2083.09, 2087.99, "Tutor", "Hibernating mammals do the opposite and add carbon dioxide, which is pH-stat."], [2087.99, 2094.05, "Tutor", "In adult cardiac surgery, alpha-stat is usual and is thought to preserve cerebral autoregulation."], [2094.05, 2098.73, "Tutor", "pH-stat raises cerebral blood flow and is used in some paediatric bypass."], [2098.73, 2101.67, "Tutor", "Name both and say which one your unit uses."], [2101.67, 2103.35, "Tutor", "Three, interferences."], [2103.35, 2113.16, "Tutor", "Ethylene glycol's metabolite glycolate cross-reacts with the lactate oxidase on some analysers, giving a falsely high lactate on the gas but a normal lab lactate."], [2113.16, 2114.89, "Tutor", "That is a lactate gap."], [2114.89, 2120.78, "Tutor", "Methaemoglobin and carboxyhaemoglobin make pulse oximetry unreliable, so you need co-oximetry."], [2120.78, 2124.3, "Tutor", "Four, sodium and potassium on the gas versus the lab."], [2124.3, 2129.44, "Tutor", "A direct electrode on whole blood is not affected by high lipids or high protein."], [2129.44, 2133.42, "Tutor", "The indirect lab method is, which causes pseudohyponatraemia."], [2133.42, 2136.94, "Tutor", "It's asked often, usually embedded in data questions."], [2138.34, 2141.93, "Tutor", "Second, interpreting arterial blood gases."], [2141.93, 2148.41, "Tutor", "This is the most examined data skill in the paper, and the College wants a method."], [2148.41, 2151.35, "Tutor", "Write it the same way every time."], [2151.35, 2153.51, "Tutor", "Step one, oxygenation."], [2153.51, 2159.55, "Tutor", "Calculate the alveolar to arterial gradient using the alveolar gas equation."], [2159.55, 2167.03, "Tutor", "Alveolar oxygen equals the inspired fraction times 713, minus the carbon dioxide divided by 0.8."], [2167.03, 2172.93, "Tutor", "The normal gradient rises with age, roughly age divided by four plus four."], [2172.93, 2180.19, "Tutor", "And state the PaO2 to FiO2 ratio for ARDS severity: 300, 200 and 100 are the Berlin cut-offs."], [2180.19, 2188.6, "Tutor", "Here's a worked example of step one, because the alveolar gas equation is where the 2013 question went wrong."], [2188.6, 2191.91, "Tutor", "FiO2 0.6, carbon dioxide 40, PaO2 120."], [2191.91, 2195.65, "Tutor", "Inspired oxygen: 0.6 times 713 is about 428."], [2195.65, 2198.45, "Tutor", "Minus 40 over 0.8, which is 50."], [2198.45, 2200.89, "Tutor", "Alveolar oxygen about 378."], [2200.89, 2204.2, "Tutor", "Gradient, 378 minus 120, which is 258."], [2204.2, 2206.22, "Tutor", "That's a huge shunt."], [2206.22, 2212.26, "Tutor", "Write all three lines of the working, because the College marks the working."], [2212.26, 2217.29, "Tutor", "Step two, the primary disorder from the pH and carbon dioxide."], [2217.29, 2221.03, "Tutor", "Step three, compensation, with the formulas."], [2221.03, 2227.79, "Tutor", "Metabolic acidosis, Winters: one and a half times bicarbonate plus 8, plus or minus 2."], [2227.79, 2232.1, "Tutor", "Metabolic alkalosis: 0.7 times bicarbonate, plus 20."], [2232.28, 2239.26, "Tutor", "Respiratory acidosis: bicarbonate rises 1 per 10 of carbon dioxide acutely, and 4 per 10 chronically."], [2239.26, 2244.14, "Tutor", "Respiratory alkalosis: falls 2 per 10 acutely, 5 per 10 chronically."], [2244.14, 2249.65, "Tutor", "Step four, the anion gap, without potassium, normal 12, corrected for albumin."], [2249.65, 2251.89, "Tutor", "Step five, the delta ratio."], [2251.89, 2254.9, "Tutor", "Below 0.4, a normal anion gap acidosis."], [2254.9, 2258.43, "Tutor", "0.4 to 0.8, mixed high and normal gap acidosis."], [2258.43, 2260.92, "Tutor", "1 to 2, pure high gap acidosis."], [2260.92, 2266.31, "Tutor", "Above 2, a concurrent metabolic alkalosis or a chronic respiratory acidosis."], [2266.31, 2271.56, "Tutor", "Step six, if the gap is high and the cause isn't obvious, the osmolar gap."], [2271.56, 2277.39, "Tutor", "Measured minus calculated, where calculated is twice sodium plus glucose plus urea."], [2277.39, 2279.25, "Tutor", "Above 10 is abnormal."], [2279.25, 2282.45, "Tutor", "The trap the College sets most: pregnancy."], [2282.45, 2289.76, "Tutor", "Normal carbon dioxide in late pregnancy is about 30 millimetres of mercury, so a value of 40 is retention."], [2291.16, 2293.58, "Tutor", "Third, diabetes insipidus."], [2293.58, 2304.76, "Tutor", "You scored five on the 2018 first sitting question 5 on the 15th of October, and part 5.2 was where the marks went, because the diagnosis was missed."], [2304.76, 2307.46, "Tutor", "Let me read it, word for word."], [2307.46, 2316.15, "Tutor", "\"A 47-year-old, previously well, 70 kg male was admitted to the Emergency Department with agitation and confusion."], [2316.15, 2327.04, "Tutor", "Following catheterisation, his urine output in the next few hours was 300 to 350 ml per hour.\" Then the results: sodium 169 millimoles per litre."], [2327.04, 2330.1, "Tutor", "Potassium 4.6 millimoles per litre."], [2330.1, 2333.09, "Tutor", "Chloride 105 millimoles per litre."], [2333.09, 2336.23, "Tutor", "Bicarbonate 26 millimoles per litre."], [2336.23, 2339.15, "Tutor", "Glucose 6.6 millimoles per litre."], [2339.15, 2341.85, "Tutor", "Urea 9.6 millimoles per litre."], [2341.85, 2344.98, "Tutor", "Creatinine 115 micromoles per litre."], [2344.98, 2348.12, "Tutor", "Magnesium 0.88 millimoles per litre."], [2348.12, 2350.61, "Tutor", "Albumin 28 grams per litre."], [2350.61, 2353.1, "Tutor", "Protein 58 grams per litre."], [2353.1, 2355.24, "Tutor", "Plasma osmolality 360."], [2355.24, 2357.87, "Tutor", "Urine specific gravity 1.005."], [2357.87, 2361.15, "Tutor", "\"a, What is the most likely diagnosis?"], [2361.15, 2372.54, "Tutor", "b, How would you manage the hypernatremia?\" Polyuria with a dilute urine and a very high plasma osmolality is diabetes insipidus until proven otherwise."], [2372.54, 2376.88, "Tutor", "Oh's chapter 69, polyuria in the ICU, is your source."], [2377.28, 2378.36, "Tutor", "Fifth pause."], [2378.36, 2383.35, "Tutor", "Calculate his free water deficit, and tell me how fast you would correct his sodium."], [2383.35, 2384.76, "Tutor", "Pause, and answer."], [2390.16, 2393.93, "Tutor", "Total body water is 0.6 times 70, which is 42 litres."], [2393.93, 2397.95, "Tutor", "The deficit is 42 times the sum of 169 over 140, minus 1."], [2397.95, 2400.11, "Tutor", "169 over 140 is about 1.21."], [2400.11, 2402.77, "Tutor", "So 42 times 0.21, about 8.7 litres."], [2402.77, 2415.01, "Tutor", "Correction rate: in hypernatraemia that developed over more than about 48 hours, aim for no more than 10 millimoles per litre per day, about 0.5 an hour, with sodium checked hourly at first."], [2415.01, 2417.98, "Tutor", "Faster correction risks cerebral oedema."], [2417.98, 2422.37, "Tutor", "If it was clearly acute, over hours, faster correction is safe."], [2422.37, 2431.45, "Tutor", "The rest of the College answer: assess fluid and cardiac status first, because if he's shocked, he needs isotonic volume before free water."], [2431.45, 2434.86, "Tutor", "Give water as 5 percent dextrose, or enterally."], [2434.86, 2436.65, "Tutor", "Then treat the cause."], [2436.65, 2445.49, "Tutor", "For central diabetes insipidus, desmopressin, starting at about 1 microgram intravenously, and watch for a sudden fall in urine output."], [2445.49, 2452.53, "Tutor", "For lithium-induced nephrogenic disease, stop the lithium, check a level, and use a thiazide or amiloride."], [2452.53, 2460.32, "Tutor", "The examiners wrote that some candidates' fluid regimes were dangerous, so always state your rate and your monitoring."], [2460.32, 2468.36, "Tutor", "The tests that separate central from nephrogenic: a paired plasma and urine osmolality, then the response to desmopressin."], [2468.54, 2472.78, "Tutor", "A rise in urine osmolality of more than 50 percent suggests central disease."], [2473.18, 2477.85, "Tutor", "A neurocritical care angle, because diabetes insipidus is examined there too."], [2477.85, 2482.63, "Tutor", "After pituitary surgery or severe head injury, look for the triphasic response."], [2482.63, 2486.37, "Tutor", "First, diabetes insipidus over a few days from axonal shock."], [2486.37, 2493.35, "Tutor", "Then a phase of inappropriate antidiuretic hormone release as the dying neurones leak stored hormone, so hyponatraemia."], [2493.35, 2499.34, "Tutor", "Then permanent diabetes insipidus if enough of the supraoptic and paraventricular neurones have gone."], [2499.34, 2505.33, "Tutor", "If you give a long-acting desmopressin in phase one, and phase two arrives, the sodium can fall fast."], [2505.33, 2510.49, "Tutor", "And in the potential organ donor after brain death, diabetes insipidus is very common."], [2510.49, 2519.23, "Tutor", "Vasopressin infusion at about 1 to 2.4 units an hour treats both the polyuria and the vasoplegia, and desmopressin can be added for the polyuria alone."], [2519.23, 2524.78, "Tutor", "A sodium above 155 at retrieval is associated with worse liver graft function, so it matters."], [2526.18, 2530.41, "Tutor", "Fourth, the syndrome of inappropriate antidiuretic hormone."], [2530.41, 2531.93, "Tutor", "Oh's chapter 58."], [2531.93, 2542.41, "Tutor", "What it is: antidiuretic hormone released without an osmotic or volume trigger, so water is retained and sodium falls, with the patient clinically euvolaemic."], [2542.41, 2544.81, "Tutor", "The points the examiner wants."], [2544.81, 2546.45, "Tutor", "One, the criteria."], [2546.45, 2550.37, "Tutor", "Plasma osmolality below 275 milliosmoles per kilogram."], [2550.37, 2552.58, "Tutor", "Urine osmolality above 100."], [2552.58, 2557.31, "Tutor", "Urine sodium above 30 millimoles per litre on a normal salt intake."], [2557.31, 2559.08, "Tutor", "Clinical euvolaemia."], [2559.08, 2565.27, "Tutor", "And normal thyroid and adrenal function, which you must check before making the diagnosis."], [2565.27, 2566.79, "Tutor", "Two, the causes."], [2566.79, 2569.38, "Tutor", "Lung disease including pneumonia."], [2569.38, 2574.93, "Tutor", "Intracranial disease, including subarachnoid haemorrhage, meningitis and trauma."], [2574.93, 2580.43, "Tutor", "Drugs, such as SSRIs, carbamazepine, opioids, cyclophosphamide and vincristine."], [2580.43, 2583.84, "Tutor", "Malignancy, especially small cell lung cancer."], [2583.84, 2586.24, "Tutor", "Pain and nausea after surgery."], [2586.24, 2592.55, "Tutor", "Three, management, following the 2014 European clinical practice guideline on hyponatraemia."], [2592.55, 2605.94, "Tutor", "For severe symptoms, such as seizures or reduced consciousness, give 150 millilitres of 3 percent saline over 20 minutes, check sodium, and repeat up to twice, aiming for a rise of 5 millimoles per litre."], [2606.12, 2612.57, "Tutor", "Then limit the rise to 10 millimoles per litre in the first 24 hours, and 8 in each 24 hours after that."], [2612.57, 2614.64, "Tutor", "Four, the chronic treatment."], [2614.64, 2616.49, "Tutor", "Fluid restriction first."], [2616.49, 2623.0, "Tutor", "Then urea, or a vasopressin receptor antagonist such as tolvaptan, with care around rapid overcorrection."], [2623.0, 2627.09, "Tutor", "The trap: cerebral salt wasting after subarachnoid haemorrhage."], [2627.09, 2631.41, "Tutor", "It looks the same in the blood, but the patient is volume depleted."], [2631.41, 2635.44, "Tutor", "Fluid restricting that patient risks vasospasm and infarction."], [2636.34, 2638.59, "Examiner", "A quick probe on that trap."], [2638.59, 2641.61, "Examiner", "Day six after subarachnoid haemorrhage."], [2641.61, 2646.68, "Examiner", "Sodium 127 millimoles per litre, urine sodium 80, urine osmolality 520."], [2646.68, 2654.26, "Examiner", "How do you tell cerebral salt wasting from inappropriate antidiuretic hormone, and does it change what you do?"], [2654.76, 2658.46, "Candidate", "The blood and urine look the same, so it comes down to volume."], [2658.46, 2664.76, "Candidate", "Salt wasting has a negative fluid balance, weight loss, a rising urea and haematocrit, and a high urine output."], [2664.76, 2668.99, "Candidate", "Inappropriate hormone release is euvolaemic with a normal or low output."], [2668.99, 2670.79, "Candidate", "It does change management."], [2670.79, 2674.81, "Candidate", "After subarachnoid haemorrhage I wouldn't fluid restrict either way."], [2674.81, 2681.48, "Candidate", "I'd give isotonic or hypertonic saline to keep the patient euvolaemic, and fludrocortisone can reduce the natriuresis."], [2681.98, 2682.79, "Examiner", "Correct."], [2682.79, 2685.71, "Examiner", "In subarachnoid haemorrhage, don't restrict fluid."], [2685.71, 2687.78, "Examiner", "That single line is worth a mark."], [2689.18, 2691.5, "Tutor", "Fifth, electrolyte replacements."], [2691.5, 2697.24, "Tutor", "The syllabus asks you to know the doses, and the College asks them inside bigger questions."], [2697.24, 2698.29, "Tutor", "Potassium."], [2698.29, 2701.6, "Tutor", "Peripheral infusions up to 10 millimoles an hour."], [2701.6, 2707.57, "Tutor", "Through a central line, up to about 20 to 40 millimoles an hour with continuous ECG monitoring."], [2707.57, 2711.17, "Tutor", "Replace magnesium too, or the potassium won't stay up."], [2711.17, 2712.21, "Tutor", "Magnesium."], [2712.21, 2718.25, "Tutor", "10 to 20 millimoles over 20 minutes to an hour in an emergency, such as torsades or arrhythmias."], [2718.25, 2721.67, "Tutor", "Watch reflexes and blood pressure in renal failure."], [2721.67, 2734.72, "Tutor", "In eclampsia, the regimen is different: a loading dose of 4 grams over 15 to 20 minutes, then 1 gram an hour for 24 hours, and the patellar reflexes, respiratory rate and urine output are your monitoring for toxicity."], [2734.72, 2735.77, "Tutor", "Phosphate."], [2735.77, 2744.18, "Tutor", "Severe hypophosphataemia, below 0.32 millimoles per litre, causes respiratory muscle weakness, failure to wean and myocardial depression."], [2744.18, 2749.69, "Tutor", "Replace with about 0.3 to 0.5 millimoles per kilogram intravenously over 6 to 12 hours."], [2749.69, 2752.94, "Tutor", "Monitor calcium, because phosphate will drop it."], [2753.12, 2767.13, "Tutor", "And in refeeding, prevent it rather than chase it: start feeding at about 10 kilocalories per kilogram per day in high-risk patients, give thiamine before the first feed, and check phosphate, potassium and magnesium daily for the first few days."], [2767.13, 2772.39, "Tutor", "This was one of the omissions in the hypophosphataemia question on the 14th of October."], [2772.39, 2773.27, "Tutor", "Calcium."], [2773.27, 2778.64, "Tutor", "10 millilitres of 10 percent calcium gluconate gives 2.2 millimoles of elemental calcium."], [2778.64, 2784.85, "Tutor", "The same volume of calcium chloride gives 6.8 millimoles, three times as much, but it burns if it leaks."], [2784.85, 2790.83, "Tutor", "Use it for hyperkalaemia with ECG changes, calcium channel blocker toxicity and massive transfusion."], [2790.83, 2793.04, "Tutor", "And sodium, which we've covered."], [2793.04, 2795.92, "Tutor", "Correction limits matter more than the dose."], [2796.32, 2802.51, "Tutor", "Because electrolyte replacement questions often turn on hyperkalaemia, here are the emergency numbers."], [2802.51, 2813.7, "Tutor", "Stabilise the membrane first with calcium if the ECG has changed: 10 millilitres of 10 percent calcium chloride or 30 millilitres of 10 percent gluconate, repeated if the ECG doesn't improve."], [2813.7, 2828.05, "Tutor", "Shift potassium with 10 units of short-acting insulin and 50 millilitres of 50 percent glucose, which lowers potassium by about 0.6 to 1 millimole per litre within 30 minutes, and check glucose hourly for six hours because hypoglycaemia is common."], [2828.05, 2832.15, "Tutor", "Salbutamol, 10 to 20 milligrams nebulised, adds a similar effect."], [2832.15, 2835.47, "Tutor", "Bicarbonate helps mainly when there is an acidosis."], [2835.47, 2841.89, "Tutor", "Then remove potassium: loop diuretics if the kidneys work, a potassium binder, and dialysis if they don't."], [2841.89, 2846.16, "Tutor", "The calcium chloride versus gluconate point leads to the last pause."], [2846.56, 2848.73, "Tutor", "Sixth and last pause, a quick one."], [2848.73, 2857.01, "Tutor", "Ten millilitres of 10 percent calcium gluconate versus ten millilitres of 10 percent calcium chloride: how many millimoles of elemental calcium in each?"], [2857.01, 2858.36, "Tutor", "Pause, and answer."], [2863.76, 2865.63, "Tutor", "Gluconate, 2.2 millimoles."], [2865.63, 2867.45, "Tutor", "Chloride, 6.8 millimoles."], [2867.45, 2869.32, "Tutor", "About three times as much."], [2869.32, 2874.0, "Tutor", "That's one of the numbers that examiners expect you to know without thinking."], [2875.4, 2877.04, "Tutor", "Before Monday, one thing."], [2877.04, 2884.32, "Tutor", "Take the post-valve gas from today, write it out by hand in the six steps, with every calculation shown, and time yourself to six minutes."], [2884.32, 2887.0, "Tutor", "Then do the same with the gas in today's plan."], [2887.0, 2891.69, "Tutor", "The marks in the acid-base questions came from the calculations you didn't write down."], [2891.69, 2894.57, "Tutor", "That's the fastest win available to you this week."], [2894.57, 2896.42, "Tutor", "This has been Part Two Daily."], [2896.42, 2898.16, "Tutor", "Good luck with today's set."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 55.8, "title": "Revisit 1: fluid responsiveness when the tests fail"}, {"start": 544.52, "title": "The rise and fall of the starches: CHEST"}, {"start": 814.76, "title": "Revisit 2: non-resolving pneumonia (2025.1 Q11)"}, {"start": 1372.66, "title": "Revisit 3: lactate after valve surgery (2018.2 Q12)"}, {"start": 1830.5, "title": "Journal watch: PELICAN"}, {"start": 1991.84, "title": "Round-up: blood gas errors and alpha-stat"}, {"start": 2138.34, "title": "Round-up: the six-step gas method"}, {"start": 2291.16, "title": "Round-up: diabetes insipidus (2018.1 Q5)"}, {"start": 2526.18, "title": "Round-up: SIADH and cerebral salt wasting"}, {"start": 2689.18, "title": "Round-up: electrolyte replacement and hyperkalaemia"}, {"start": 2875.4, "title": "Before Monday"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
