var C=[[0.0, 2.72, "Tutor", "Good morning, and welcome to Part Two Daily."], [2.72, 9.21, "Tutor", "It's Saturday the twenty-first of November, one hundred and nine days until the written paper on the tenth of March."], [9.21, 11.2, "Tutor", "Saturday is the spiral review."], [11.2, 19.62, "Tutor", "We go back to topics from one, three and six weeks ago, rebuild the answer that earns the marks, then make each one harder by tying it to another system."], [19.62, 23.8, "Tutor", "That's how the College writes its questions, and it's how memory sticks."], [23.8, 25.27, "Tutor", "Four revisits today."], [25.27, 31.86, "Tutor", "First, the central venous waveform and the passive leg raise, with a right ventricle in trouble after cardiac surgery."], [31.86, 36.93, "Tutor", "Second, the standardised mortality ratio, in a unit with a big cardiac surgical case mix."], [36.93, 41.12, "Tutor", "Third, pyroglutamic acidosis, with a second acid hiding in the same gas."], [41.12, 47.13, "Tutor", "Fourth, myxoedema coma in a woman on amiodarone, with the story of a young doctor in Newcastle and a sheep."], [47.13, 53.57, "Tutor", "Then a journal watch with two new trials, one on dialysis modality and one on dapagliflozin before cardiac surgery."], [53.57, 58.8, "Tutor", "Then a syllabus round-up of six items, from respiratory monitoring to chronic liver failure."], [60.2, 63.11, "Tutor", "Picture the second night after a mitral valve repair."], [63.11, 68.07, "Tutor", "The patient is ventilated, in new atrial fibrillation at a hundred and twenty, on noradrenaline."], [68.07, 72.22, "Tutor", "The central venous pressure reads eighteen millimetres of mercury and climbing."], [72.22, 74.65, "Tutor", "The registrar asks whether to give a bolus."], [74.65, 77.04, "Tutor", "Does that number tell you anything useful?"], [77.04, 78.28, "Tutor", "Hold that thought."], [78.68, 81.99, "Tutor", "This is the 2021 first sitting, question twenty-one."], [81.99, 85.3, "Tutor", "It came up in your set on the fifteenth of November."], [85.3, 90.16, "Tutor", "Part a: List four patient factors that determine central venous pressure, C V P."], [90.16, 91.92, "Tutor", "Twenty percent of marks."], [91.92, 102.79, "Tutor", "Part b: List four clinical conditions that may be detected from an abnormal central venous waveform in a euvolaemic patient and for each condition describe the associated waveform features."], [102.79, 104.56, "Tutor", "Twenty percent of marks."], [104.56, 113.99, "Tutor", "Part c: Explain how one performs and interprets a passive leg raise manoeuvre including its physiological basis, reliability, and limitations in clinical practice."], [113.99, 115.7, "Tutor", "Sixty percent of marks."], [115.7, 123.92, "Tutor", "The determinants of central venous pressure turned up as a question of their own in 2014, so this is a recurring theme rather than a one-off."], [124.32, 126.02, "Tutor", "Let's rebuild the answer."], [126.02, 127.82, "Tutor", "Notice the weighting first."], [127.82, 132.71, "Tutor", "Sixty percent sits on the passive leg raise, so most of your ten minutes belongs there."], [132.71, 134.82, "Tutor", "Parts a and b are list questions."], [134.82, 137.44, "Tutor", "Give four items each, crisply, and move on."], [137.84, 141.21, "Tutor", "For part a, the College wants factors, not a lecture."], [141.21, 144.13, "Tutor", "Think of it as pressure at the end of a tube."], [144.13, 150.48, "Tutor", "One: intravascular volume and how it's distributed between the stressed and unstressed venous compartments."], [150.48, 153.68, "Tutor", "Two: venous tone and right ventricular compliance."], [153.68, 158.37, "Tutor", "Three: right ventricular systolic function and pulmonary vascular resistance."], [158.37, 161.52, "Tutor", "Four: the tricuspid valve and the cardiac rhythm."], [161.52, 169.58, "Tutor", "And five, if you have the space, intrathoracic pressure, which means positive end-expiratory pressure, and the transducer reference level."], [169.58, 179.4, "Tutor", "A transducer ten centimetres too low reads about seven millimetres of mercury too high, because ten centimetres of water is about seven point four millimetres of mercury."], [179.8, 184.61, "Tutor", "For part b, describe the waveform for each condition, as the question asks."], [184.61, 186.58, "Tutor", "Remember the normal shape."], [186.58, 188.96, "Tutor", "The a wave is atrial contraction."], [188.96, 193.54, "Tutor", "The c wave is the tricuspid valve bulging back at the start of systole."], [193.54, 196.03, "Tutor", "The x descent is atrial relaxation."], [196.03, 199.51, "Tutor", "The v wave is atrial filling against a closed valve."], [199.51, 203.39, "Tutor", "The y descent is the valve opening and the atrium emptying."], [203.39, 205.25, "Tutor", "Now the four conditions."], [205.25, 209.77, "Tutor", "Atrial fibrillation: no a wave, and the c wave becomes more prominent."], [209.77, 217.54, "Tutor", "Complete heart block, or any atrioventricular dissociation: cannon a waves, where the atrium contracts against a closed valve."], [217.54, 222.47, "Tutor", "Tricuspid regurgitation: a giant fused c v wave that wipes out the x descent."], [222.47, 229.42, "Tutor", "Tamponade: a blunted or absent y descent, because the stiff pericardial space stops the ventricle filling early."], [229.42, 235.8, "Tutor", "Constriction is the contrast case: a steep x and a steep y, so the trace looks like the letter M or W."], [236.2, 237.6, "Tutor", "Here's a quick one."], [237.6, 238.95, "Tutor", "Pause, and answer."], [238.95, 242.12, "Tutor", "In cardiac tamponade, which descent is lost, and why?"], [247.52, 248.66, "Tutor", "The y descent."], [248.66, 253.83, "Tutor", "Early diastolic filling is blocked because the total volume inside the pericardium is fixed."], [253.83, 257.77, "Tutor", "The x descent is preserved, because ventricular ejection makes room."], [257.77, 263.2, "Tutor", "In constriction, both descents are steep, because early filling is rapid and then stops abruptly."], [263.6, 265.17, "Tutor", "Now the sixty percent."], [265.17, 266.27, "Tutor", "How to do it."], [266.27, 269.82, "Tutor", "Start with the patient semi-recumbent at forty-five degrees."], [269.82, 274.11, "Tutor", "Measure baseline stroke volume or cardiac output with a real-time monitor."], [274.11, 279.29, "Tutor", "Then tilt the whole bed so the trunk is flat and the legs are raised to forty-five degrees."], [279.29, 284.36, "Tutor", "Don't lift the legs by hand, because pain and sympathetic activation confound the result."], [284.36, 288.91, "Tutor", "Measure again within the first sixty to ninety seconds, while the effect peaks."], [288.91, 292.2, "Tutor", "Then return to baseline and check the value comes back."], [292.6, 293.81, "Tutor", "Interpretation."], [293.81, 299.62, "Tutor", "A rise in stroke volume or cardiac output of ten percent or more means the patient is fluid responsive."], [299.62, 306.69, "Tutor", "The physiology is that you shift a few hundred millilitres of venous blood from the legs and the splanchnic bed into the chest."], [306.69, 309.0, "Tutor", "That's a reversible fluid challenge."], [309.0, 312.56, "Tutor", "It costs nothing, and it disappears when you lower the legs."], [312.96, 314.04, "Tutor", "Reliability."], [314.04, 319.91, "Tutor", "The 2016 meta-analysis by Monnet and colleagues in Intensive Care Medicine pooled twenty-one studies."], [319.91, 330.79, "Tutor", "A passive leg raise judged on cardiac output had a pooled sensitivity of about eighty-five percent and a specificity of about ninety-one percent, with an area under the curve of point nine five."], [330.79, 333.86, "Tutor", "The best threshold was around a ten percent rise."], [333.86, 338.27, "Tutor", "When the change was judged on pulse pressure alone, accuracy fell clearly."], [338.27, 344.2, "Tutor", "That's the point you missed on fluid responsiveness earlier this month, so say it plainly in the exam."], [344.2, 347.22, "Tutor", "The leg raise needs a real-time measure of flow."], [347.22, 349.64, "Tutor", "Arterial pressure alone isn't enough."], [350.04, 352.38, "Tutor", "What counts as a real-time measure?"], [352.38, 359.73, "Tutor", "Pulse contour cardiac output, the velocity time integral at the left ventricular outflow tract on echo, or oesophageal Doppler."], [359.73, 364.13, "Tutor", "A useful alternative in a ventilated patient is end-tidal carbon dioxide."], [364.13, 370.72, "Tutor", "With fixed ventilation, a rise of about five percent during the leg raise suggests that cardiac output has risen."], [371.12, 373.5, "Tutor", "Limitations, which carry real marks."], [373.5, 377.52, "Tutor", "It needs a bed that tilts and two intact legs and a stable pelvis."], [377.52, 382.29, "Tutor", "It's unsuitable with raised intracranial pressure, because lying flat raises it."], [382.29, 387.6, "Tutor", "Intra-abdominal hypertension blunts venous return from the legs and gives false negatives."], [387.6, 394.32, "Tutor", "Amputations, compression stockings and severe hypovolaemia with venoconstriction all reduce the volume you mobilise."], [394.32, 397.74, "Tutor", "Pain, coughing and patient effort confound the reading."], [397.74, 402.02, "Tutor", "And finally, a positive test tells you the heart will respond to fluid."], [402.02, 404.84, "Tutor", "It doesn't tell you the patient needs fluid."], [405.24, 406.45, "Tutor", "Now the twist."], [406.45, 408.77, "Tutor", "Back to our mitral repair patient."], [408.77, 412.97, "Tutor", "He's in atrial fibrillation, so pulse pressure variation is useless."], [412.97, 415.9, "Tutor", "The rhythm varies stroke volume beat to beat."], [415.9, 421.64, "Tutor", "The C V P of eighteen has a giant c v wave, which tells you there's new tricuspid regurgitation."], [421.64, 430.92, "Tutor", "The echo shows a dilated right ventricle, a septum flattened in both systole and diastole, and a tricuspid annular plane systolic excursion of nine millimetres."], [430.92, 435.12, "Tutor", "He's on a ventilator with a positive end-expiratory pressure of ten."], [436.02, 437.26, "Examiner", "So, should he have the bolus?"], [437.76, 440.33, "Candidate", "I wouldn't give it on the C V P alone."], [440.33, 448.54, "Candidate", "In atrial fibrillation with tricuspid regurgitation, the C V P mostly reflects the regurgitant v wave and a stiff, dilated right ventricle."], [448.54, 452.73, "Candidate", "I'd do a passive leg raise with the velocity time integral on echo."], [452.73, 456.53, "Candidate", "But with this right ventricle, I'd expect it to be negative."], [456.53, 460.88, "Candidate", "A failing right ventricle sits on the flat part of its Starling curve."], [460.88, 468.09, "Candidate", "Extra volume dilates it further, pushes the septum left, squashes the left ventricle and worsens tricuspid regurgitation."], [468.09, 470.88, "Candidate", "That lowers cardiac output, not raises it."], [471.38, 471.89, "Examiner", "Good."], [471.89, 474.22, "Examiner", "What else tells you he's congested rather than dry?"], [474.72, 476.55, "Candidate", "Venous excess ultrasound."], [476.55, 479.27, "Candidate", "Hepatic vein flow with systolic reversal."], [479.27, 483.72, "Candidate", "A portal vein pulsatility fraction above fifty percent, which is severe."], [483.72, 486.11, "Candidate", "Interrupted intrarenal venous flow."], [486.11, 490.44, "Candidate", "Those suggest venous congestion that will harm the kidney and the gut."], [490.94, 491.7, "Examiner", "And your management?"], [492.2, 493.28, "Candidate", "Avoid fluid."], [493.28, 495.11, "Candidate", "Treat the right ventricle."], [495.11, 502.12, "Candidate", "Keep the mean arterial pressure up with noradrenaline, and add vasopressin if needed, to protect right coronary perfusion."], [502.12, 506.75, "Candidate", "Lower pulmonary vascular resistance with inhaled nitric oxide or prostacyclin."], [506.75, 509.44, "Candidate", "Correct hypoxia, hypercapnia and acidosis."], [509.44, 513.43, "Candidate", "Add an inotrope such as milrinone or dobutamine for contractility."], [513.43, 519.68, "Candidate", "Rate or rhythm control for the atrial fibrillation, because the right ventricle tolerates tachycardia badly."], [519.68, 525.39, "Candidate", "Reduce the positive end-expiratory pressure to the lowest level that keeps oxygenation acceptable."], [525.39, 528.68, "Candidate", "If he's overloaded, use diuretics or ultrafiltration."], [529.18, 530.78, "Examiner", "That's the answer I'm after."], [530.78, 533.49, "Examiner", "The trap is treating a high C V P as a volume number."], [533.49, 538.02, "Examiner", "It's a pressure, and in this patient it's telling you about the right ventricle and the valve."], [538.92, 543.75, "Tutor", "So the spiral lesson is that the passive leg raise answers one question: will cardiac output rise?"], [543.75, 546.76, "Tutor", "Whether the patient should get fluid is a second question."], [546.76, 550.04, "Tutor", "Answering it means looking at the right ventricle and the veins."], [551.44, 554.5, "Tutor", "Imagine a letter arriving from the hospital executive."], [554.5, 560.43, "Tutor", "Your unit's standardised mortality ratio is above the ninety-five percent confidence limit for comparable units."], [560.43, 563.0, "Tutor", "The director wants an explanation by Friday."], [563.0, 564.88, "Tutor", "What's the first thing you do?"], [565.28, 570.06, "Tutor", "This is the 2026 first sitting, question three, and it's in today's set."], [570.06, 581.58, "Tutor", "Your ICU's Standardised Mortality Ratio, S M R, over the last 12 months has been noted to be above the 95 percent confidence interval, C I, for comparable ICUs in the National database."], [581.58, 584.51, "Tutor", "Part a: Outline the limitations of S M R."], [584.51, 585.7, "Tutor", "Three marks."], [585.7, 589.76, "Tutor", "Part b: Outline your approach to investigating a high S M R."], [589.76, 590.96, "Tutor", "Seven marks."], [590.96, 593.76, "Tutor", "Just over half of candidates passed it."], [593.76, 598.78, "Tutor", "The S M R has now been asked five times, in 2007 twice, 2015, 2019 and 2026."], [598.78, 603.37, "Tutor", "In the 2015 second sitting version, only twenty-seven percent passed."], [603.37, 609.35, "Tutor", "The examiners called it a significant knowledge gap about a commonly used quality indicator."], [609.35, 614.48, "Tutor", "So this is a theme where knowing the structure lifts you well above the field."], [614.88, 617.12, "Tutor", "First, the definition, in one line."], [617.12, 621.38, "Tutor", "The S M R is observed hospital deaths divided by expected hospital deaths."], [621.38, 626.95, "Tutor", "Expected deaths are the sum of each patient's predicted risk of death from a risk-adjustment model."], [626.95, 633.61, "Tutor", "In Australia and New Zealand, the ANZICS Adult Patient Database uses the Australian and New Zealand Risk of Death model."], [633.61, 637.66, "Tutor", "That model was built on APACHE three physiology, plus other variables."], [637.66, 641.2, "Tutor", "An S M R of one means you had the deaths the model expected."], [641.2, 643.8, "Tutor", "Above one means more deaths than expected."], [644.2, 645.99, "Tutor", "Part a, the limitations."], [645.99, 648.29, "Tutor", "Three marks, so about six points."], [648.29, 651.65, "Tutor", "First, it's only as good as the model's calibration."], [651.65, 654.68, "Tutor", "Mortality falls year on year, so models drift."], [654.68, 658.26, "Tutor", "If the model isn't recalibrated, everyone's S M R falls."], [658.26, 661.12, "Tutor", "Second, case mix the model doesn't capture."], [661.12, 668.01, "Tutor", "Examples are a new ECMO service, a lot of patients with treatment limitations, or a referral unit taking transfers."], [668.01, 669.69, "Tutor", "Third, lead-time bias."], [669.69, 676.92, "Tutor", "Patients resuscitated in the emergency department or another hospital arrive with better physiology than their true risk."], [676.92, 680.17, "Tutor", "Their predicted risk is lower, so the S M R rises."], [680.17, 681.79, "Tutor", "Fourth, data quality."], [681.79, 689.3, "Tutor", "The Glasgow Coma Scale in sedated patients, the admission diagnosis and the source of admission all move predicted risk a lot."], [689.3, 692.66, "Tutor", "Fifth, the outcome is hospital death, not ICU death."], [692.66, 698.26, "Tutor", "Deaths on the ward after discharge, and transfers out to die elsewhere, both move the ratio."], [698.26, 700.11, "Tutor", "Sixth, statistical noise."], [700.11, 702.97, "Tutor", "A small unit has wide confidence intervals."], [702.97, 705.88, "Tutor", "One bad quarter can cross a limit by chance."], [705.88, 708.63, "Tutor", "And seventh, it's a single crude outcome."], [708.63, 713.84, "Tutor", "It says nothing about morbidity, function or patient experience, and it can be gamed."], [714.24, 715.5, "Tutor", "Pause, and answer."], [715.5, 719.96, "Tutor", "Name three reasons an S M R can rise when the quality of care hasn't changed at all."], [725.36, 726.77, "Tutor", "Any three of these."], [726.77, 730.76, "Tutor", "Poor data entry, especially Glasgow Coma Scale and diagnosis coding."], [730.76, 734.06, "Tutor", "Lead-time bias from resuscitation before ICU admission."], [734.06, 736.78, "Tutor", "A case-mix change the model doesn't capture."], [736.78, 739.09, "Tutor", "A model that's no longer calibrated."], [739.09, 743.54, "Tutor", "Changes in discharge practice, such as fewer patients transferred out to die."], [743.54, 745.48, "Tutor", "And chance in a small sample."], [745.88, 748.61, "Tutor", "Part b, seven marks, is about approach."], [748.61, 753.03, "Tutor", "The examiners want a structure that reads like a real investigation."], [753.03, 755.88, "Tutor", "Use four steps, and say them as headings."], [756.28, 758.34, "Tutor", "Step one: is the signal real?"], [758.34, 759.95, "Tutor", "Check the statistics."], [759.95, 762.79, "Tutor", "Where does the unit sit on the funnel plot?"], [762.79, 765.73, "Tutor", "Is it above the inner limit or the outer one?"], [765.73, 771.52, "Tutor", "Is it a single period, or a trend on a cumulative sum chart or a variable life-adjusted display?"], [771.52, 775.52, "Tutor", "Is the denominator large enough for the result to mean anything?"], [775.92, 778.09, "Tutor", "Step two: is the data right?"], [778.09, 781.71, "Tutor", "Audit the submissions to the Adult Patient Database."], [781.71, 791.54, "Tutor", "Look at missing physiology, the worst Glasgow Coma Scale in sedated patients, diagnostic codes, the admission source, and elective versus emergency status."], [791.54, 796.24, "Tutor", "A common College point is that miscoded data alone can move the S M R."], [796.64, 799.24, "Tutor", "Step three: is it case mix or the model?"], [799.24, 805.08, "Tutor", "Break observed and expected deaths down by diagnostic group, by admission source and by risk decile."], [805.08, 810.66, "Tutor", "If the excess sits in one group, such as cardiac arrests or ECMO, that tells you where to look."], [810.66, 814.12, "Tutor", "Check whether the model is calibrated for your patients."], [814.52, 816.38, "Tutor", "Step four: is it real care?"], [816.38, 818.88, "Tutor", "Look at structure, process and outcome."], [818.88, 824.08, "Tutor", "Structure means staffing, senior cover after hours, occupancy, and after-hours discharges."], [824.08, 832.32, "Tutor", "Process means delays to admission from the emergency department and wards, the rapid response system, adherence to protocols, and end-of-life care."], [832.32, 837.53, "Tutor", "Outcome means structured mortality review of every death, with a preventability judgement."], [837.53, 839.55, "Tutor", "And look beyond the ICU walls."], [839.55, 841.72, "Tutor", "Has the surgical service changed?"], [841.72, 843.48, "Tutor", "Has a new service opened?"], [843.48, 846.4, "Tutor", "What's happening to deaths after ICU discharge?"], [846.8, 848.24, "Tutor", "Then close the loop."], [848.24, 854.44, "Tutor", "Report to the hospital's clinical governance committee, make an action plan with owners and dates, and remeasure."], [854.44, 858.7, "Tutor", "That's an audit cycle, and saying the phrase 'audit cycle' is worth a mark."], [858.7, 864.6, "Tutor", "ANZICS CORE also has a formal process for following up outlier units, so mention that you'd engage with it."], [865.0, 866.13, "Tutor", "Now the twist."], [866.13, 868.33, "Tutor", "Your unit is half cardiac surgical."], [868.33, 872.52, "Tutor", "Your S M R has risen from point seven to one point one over twelve months."], [872.52, 875.54, "Tutor", "Here's a real-world check on why the College cares."], [875.54, 884.4, "Tutor", "Solomon and colleagues analysed over five hundred and twenty thousand patients from one hundred and forty-four ICUs in the Adult Patient Database, from 2000 to 2010."], [884.4, 888.34, "Tutor", "They used funnel plots with limits adjusted for multiple comparisons."], [888.34, 895.2, "Tutor", "Seven ICUs stood out as performing unusually, all of them as poor performers, and four of the seven were in private hospitals."], [895.2, 899.24, "Tutor", "So outlier status in this region is uncommon, and it's taken seriously."], [900.14, 905.17, "Examiner", "Your cardiac surgical volume fell by a third this year because a second hospital opened a cardiac unit."], [905.17, 906.3, "Examiner", "Does that matter?"], [906.8, 907.89, "Candidate", "Yes, a lot."], [907.89, 913.87, "Candidate", "Elective cardiac surgical patients have low predicted mortality and very low observed mortality."], [913.87, 917.15, "Candidate", "They pad the denominator and pull the S M R down."], [917.15, 924.33, "Candidate", "If you lose a third of them, the remaining medical case mix dominates, and any miscalibration in that group shows up."], [924.33, 931.75, "Candidate", "So I'd recalculate the S M R excluding elective cardiac surgery and compare it with the previous years on the same basis."], [931.75, 936.92, "Candidate", "If the medical S M R hasn't changed, this is a case-mix shift, not a care problem."], [937.42, 939.22, "Examiner", "And if the medical S M R has risen?"], [939.72, 941.74, "Candidate", "Then I'd move to step four."], [941.74, 951.52, "Candidate", "I'd look at deaths by diagnosis, delays from the wards, after-hours discharges and readmissions within forty-eight hours, with a structured review of every death."], [952.02, 952.55, "Examiner", "Good."], [952.55, 955.95, "Examiner", "The trap in this question is jumping straight to blaming staff or protocols."], [955.95, 958.62, "Examiner", "The College rewards checking the data and the model first."], [960.02, 965.49, "Tutor", "Here's a woman whose bicarbonate is five, whose lactate is one, and whose ketones barely register."], [965.49, 967.2, "Tutor", "Something is making acid."], [967.2, 968.18, "Tutor", "What is it?"], [968.58, 972.73, "Tutor", "This is the 2014 second sitting, question twenty-three."], [972.73, 985.32, "Tutor", "A 72-year-old female, body mass index 17.5 kilograms per metre squared, is admitted to the High Dependency Unit following a Medical Emergency Team call for tachypnoea and hypotension."], [985.32, 997.51, "Tutor", "She is known to have sepsis relating to a urinary tract infection and wound infection following extensive surgery for resection of a left thigh chondrosarcoma six weeks earlier."], [997.51, 999.69, "Tutor", "Here are the key results."], [999.69, 1004.11, "Tutor", "Arterial gas on an inspired oxygen fraction of point three."], [1004.11, 1005.16, "Tutor", "pH 7.18."], [1005.16, 1008.0, "Tutor", "P C O 2, 14 millimetres of mercury."], [1008.0, 1010.9, "Tutor", "Bicarbonate, 5 millimoles per litre."], [1010.9, 1012.87, "Tutor", "Base excess, minus 22."], [1012.87, 1015.58, "Tutor", "Sodium, 141 millimoles per litre."], [1015.58, 1017.02, "Tutor", "Chloride, 114."], [1017.02, 1018.41, "Tutor", "Lactate, 1.0."], [1018.41, 1019.79, "Tutor", "Glucose, 6.9."], [1019.79, 1022.76, "Tutor", "Creatinine, 179 micromoles per litre."], [1022.76, 1031.0, "Tutor", "Urinalysis shows 5-oxoproline, pyroglutamic acid, more than three plus, at 16 millimoles per millimole of creatinine."], [1031.0, 1035.22, "Tutor", "Beta-hydroxybutyrate and acetoacetate are each one plus."], [1035.22, 1038.97, "Tutor", "The parts are: a, interpret her acid-base status."], [1038.97, 1043.98, "Tutor", "Then, with reference to her urinalysis: b, explain the significance."], [1043.98, 1048.2, "Tutor", "c, list the likely predisposing factors in this patient."], [1048.2, 1052.03, "Tutor", "d, briefly outline the underlying pathophysiology."], [1052.03, 1054.86, "Tutor", "e, list your management strategies."], [1054.86, 1057.1, "Tutor", "Fifty-five percent passed."], [1057.5, 1059.45, "Tutor", "You've written this one twice."], [1059.45, 1066.86, "Tutor", "You scored four and a half on the fourteenth of October, and two on the nineteenth, when you answered only part a and left b to e blank."], [1066.86, 1070.4, "Tutor", "It's in today's set again, so this revisit is your rehearsal."], [1070.4, 1076.16, "Tutor", "Pyroglutamic acidosis has appeared six times in the question bank, from 2011 to the 2025 second sitting."], [1076.16, 1078.63, "Tutor", "It's usually one part of a gas question."], [1078.63, 1082.74, "Tutor", "So the diagnosis has to come quickly, and the mechanism has to be ready."], [1083.14, 1085.29, "Tutor", "Part a, with the numbers."], [1085.29, 1087.7, "Tutor", "The College wants them shown."], [1087.7, 1094.94, "Tutor", "Anion gap, using the College convention without potassium: 141 minus the sum of 114 and 5, which is 22."], [1094.94, 1098.53, "Tutor", "Delta ratio: the gap rose by 10, from 12 to 22."], [1098.53, 1101.46, "Tutor", "Bicarbonate fell by 19, from 24 to 5."], [1101.46, 1104.46, "Tutor", "Ten over nineteen is about point five."], [1104.46, 1111.77, "Tutor", "Expected P C O 2 by Winter's formula: one and a half times 5, plus 8, is 15 and a half, plus or minus 2."], [1111.77, 1116.33, "Tutor", "Her P C O 2 is 14, so respiratory compensation is appropriate."], [1116.33, 1123.12, "Tutor", "The apparent strong ion difference, sodium plus potassium minus chloride, is 31.3, which is low."], [1123.12, 1132.18, "Tutor", "So the interpretation is a mixed high anion gap and normal anion gap metabolic acidosis, with appropriate respiratory compensation."], [1132.58, 1133.38, "Tutor", "Part b."], [1133.38, 1137.37, "Tutor", "The pyroglutamic acid is the unmeasured anion causing the high gap."], [1137.37, 1140.45, "Tutor", "The lactate is normal and the ketones are trivial."], [1140.45, 1143.91, "Tutor", "The ketones reflect starvation in a malnourished patient."], [1143.91, 1145.98, "Tutor", "They don't explain a gap of 22."], [1146.38, 1148.75, "Tutor", "Part c, the predisposing factors."], [1148.75, 1149.62, "Tutor", "Female."], [1149.62, 1150.55, "Tutor", "Elderly."], [1150.55, 1153.62, "Tutor", "Malnourished, with a body mass index of 17.5."], [1153.62, 1154.48, "Tutor", "Sepsis."], [1154.48, 1157.38, "Tutor", "Renal impairment, which reduces excretion."], [1157.38, 1159.4, "Tutor", "Likely regular paracetamol."], [1159.4, 1165.83, "Tutor", "Likely flucloxacillin for a post-operative wound infection, since staphylococcus is the usual organism."], [1165.83, 1168.03, "Tutor", "Liver dysfunction, if present."], [1168.03, 1172.14, "Tutor", "A congenital enzyme deficiency is very unlikely at seventy-two."], [1172.54, 1173.97, "Tutor", "Pause, and answer."], [1173.97, 1178.26, "Tutor", "Part d: what are the two mechanisms that make 5-oxoproline accumulate?"], [1183.66, 1185.7, "Tutor", "First, glutathione depletion."], [1185.7, 1191.83, "Tutor", "Glutathione normally inhibits the first enzyme of its own synthesis, gamma-glutamylcysteine synthetase."], [1191.83, 1195.59, "Tutor", "Sepsis, malnutrition and paracetamol all use up glutathione."], [1195.59, 1200.45, "Tutor", "Paracetamol does it through its toxic metabolite, N-acetyl-p-benzoquinone imine."], [1200.45, 1203.38, "Tutor", "When glutathione falls, that brake comes off."], [1203.38, 1209.73, "Tutor", "The cycle runs fast, and gamma-glutamylcysteine is converted to 5-oxoproline faster than it can be cleared."], [1209.73, 1215.91, "Tutor", "Second, flucloxacillin inhibits 5-oxoprolinase, the enzyme that converts 5-oxoproline back to glutamate."], [1215.91, 1219.72, "Tutor", "So one drug floods the cycle, and the other blocks the drain."], [1219.72, 1224.14, "Tutor", "In October you wrote that beta-lactams are metabolised to pyroglutamate."], [1224.14, 1225.25, "Tutor", "They aren't."], [1225.25, 1228.34, "Tutor", "Flucloxacillin blocks the enzyme that clears it."], [1228.74, 1230.21, "Tutor", "Part e, management."], [1230.21, 1231.79, "Tutor", "Stop the paracetamol."], [1231.79, 1235.38, "Tutor", "Change flucloxacillin to an alternative such as cefazolin."], [1235.38, 1238.7, "Tutor", "Treat the sepsis and get source control of the wound."], [1238.7, 1245.23, "Tutor", "Give N-acetylcysteine to replenish glutathione, usually using the intravenous regimen for paracetamol poisoning."], [1245.23, 1247.68, "Tutor", "Improve nutrition, and give thiamine."], [1247.68, 1250.79, "Tutor", "Then supportive care, with monitoring of the gas."], [1250.79, 1255.47, "Tutor", "Bicarbonate and dialysis are only for extreme acidaemia or another indication."], [1255.47, 1257.54, "Tutor", "In October you put them first."], [1257.54, 1258.9, "Tutor", "They belong last."], [1259.3, 1266.07, "Tutor", "Now the twist, and it ties to this week's cardiac theme and to today's journal watch."], [1266.07, 1269.63, "Tutor", "Day eight after coronary bypass grafting."], [1269.63, 1274.58, "Tutor", "A sixty-eight-year-old woman weighing forty-eight kilograms."], [1274.58, 1281.06, "Tutor", "She's on flucloxacillin for a sternal wound infection and on regular paracetamol."], [1281.06, 1285.06, "Tutor", "And her empagliflozin was restarted on day two."], [1285.06, 1286.88, "Tutor", "Her gas: pH 7.20."], [1286.88, 1288.34, "Tutor", "P C O 2, 20."], [1288.34, 1290.01, "Tutor", "Bicarbonate, 8."], [1290.01, 1291.47, "Tutor", "Sodium, 138."], [1291.47, 1293.07, "Tutor", "Chloride, 108."], [1293.07, 1294.6, "Tutor", "Lactate, 1.2."], [1294.6, 1295.98, "Tutor", "Glucose, 9."], [1295.98, 1301.0, "Tutor", "A capillary beta-hydroxybutyrate of 4.8 millimoles per litre."], [1301.0, 1305.22, "Tutor", "The urine dipstick shows ketones at only one plus."], [1306.12, 1306.96, "Examiner", "What's going on?"], [1307.46, 1312.31, "Candidate", "The anion gap is 138 minus the sum of 108 and 8, which is 22."], [1312.31, 1319.63, "Candidate", "Expected P C O 2 is one and a half times 8, plus 8, which is 20, so compensation is appropriate."], [1319.63, 1324.41, "Candidate", "There's a euglycaemic ketoacidosis from the SGLT2 inhibitor."], [1324.41, 1328.98, "Candidate", "The beta-hydroxybutyrate is 4.8 with a glucose of only 9."], [1329.48, 1331.32, "Examiner", "Does the ketone explain the whole gap?"], [1331.82, 1332.45, "Candidate", "No."], [1332.45, 1334.27, "Candidate", "The gap has risen by 10."], [1334.27, 1339.84, "Candidate", "The beta-hydroxybutyrate accounts for about 5 of that, and the lactate for almost nothing."], [1339.84, 1343.99, "Candidate", "So about 5 millimoles per litre of unmeasured anion is left over."], [1343.99, 1350.76, "Candidate", "With flucloxacillin, paracetamol, malnutrition and sepsis, that's pyroglutamic acidosis until proven otherwise."], [1350.76, 1352.86, "Candidate", "I'd send urine organic acids."], [1353.36, 1355.28, "Examiner", "Why is the dipstick only one plus?"], [1355.78, 1360.72, "Candidate", "The dipstick's nitroprusside reaction detects acetoacetate, not beta-hydroxybutyrate."], [1360.72, 1364.33, "Candidate", "Beta-hydroxybutyrate is the dominant ketone in ketoacidosis."], [1364.33, 1366.94, "Candidate", "So a dipstick can badly underestimate it."], [1366.94, 1369.22, "Candidate", "I'd use blood beta-hydroxybutyrate."], [1369.72, 1370.44, "Examiner", "Management?"], [1370.94, 1374.49, "Candidate", "Stop the empagliflozin, paracetamol and flucloxacillin."], [1374.49, 1377.41, "Candidate", "Use an alternative antistaphylococcal agent."], [1377.41, 1380.79, "Candidate", "Start an insulin infusion with intravenous dextrose."], [1380.79, 1387.88, "Candidate", "The ketoacidosis needs insulin even though the glucose is normal, and the dextrose lets me give enough insulin safely."], [1387.88, 1390.81, "Candidate", "Give N-acetylcysteine for the pyroglutamate."], [1390.81, 1392.95, "Candidate", "Watch potassium and phosphate."], [1392.95, 1396.1, "Candidate", "And start nutrition, which treats both problems."], [1396.6, 1397.15, "Examiner", "Good."], [1397.15, 1399.15, "Examiner", "The examiner's point is the arithmetic."], [1399.15, 1404.2, "Examiner", "If you calculate the gap and subtract the anions you can measure, the leftover tells you there's a second acid."], [1405.6, 1407.39, "Tutor", "Newcastle upon Tyne, 1891."], [1407.39, 1414.12, "Tutor", "A doctor three years out of medical school is about to inject a woman with an extract made from a sheep's thyroid gland."], [1414.52, 1416.88, "Tutor", "His name was George Redmayne Murray."], [1416.88, 1419.84, "Tutor", "Myxoedema was a well-described disease by then."], [1419.84, 1422.31, "Tutor", "William Gull had described it in 1873."], [1422.31, 1426.78, "Tutor", "A Clinical Society committee chaired by William Ord reported on it in 1888."], [1426.78, 1429.25, "Tutor", "They linked it to loss of the thyroid."], [1429.25, 1431.13, "Tutor", "But there was no treatment."], [1431.13, 1434.89, "Tutor", "Patients became slow, cold, puffy and confused, and many died."], [1434.89, 1441.93, "Tutor", "In 1890 two doctors in Lisbon, Bettencourt and Serrano, had tried implanting half a sheep's thyroid under a patient's skin."], [1441.93, 1447.79, "Tutor", "Murray reasoned that if the gland made something the body needed, an extract might work just as well."], [1447.79, 1451.23, "Tutor", "He prepared a glycerin extract of healthy sheep thyroid."], [1451.23, 1457.85, "Tutor", "From April 1891, he injected one and a half millilitres under the skin of a forty-six-year-old woman, twice a week."], [1457.85, 1460.42, "Tutor", "Within three months she was transformed."], [1460.42, 1463.92, "Tutor", "He published it in the British Medical Journal that year."], [1463.92, 1467.52, "Tutor", "And his patient went on to live until she was seventy-four."], [1467.92, 1472.07, "Tutor", "It was one of the first times anyone had replaced a missing hormone."], [1472.07, 1475.94, "Tutor", "Within a year or two others showed the extract worked by mouth."], [1475.94, 1479.38, "Tutor", "Thyroxine was isolated in 1914 and synthesised in 1927."], [1479.38, 1482.43, "Tutor", "Murray's reasoning still shapes the exam answer."], [1482.43, 1485.92, "Tutor", "The hormone works, but the old heart can't take it fast."], [1485.92, 1490.72, "Tutor", "Replacement in the elderly and in coronary disease is still about dose and pace."], [1491.12, 1495.07, "Tutor", "This is the 2014 first sitting, question thirty, part one."], [1495.07, 1503.03, "Tutor", "You are asked to review an 80-year-old female in the Emergency Department who has presented with a depressed conscious state."], [1503.03, 1507.52, "Tutor", "She has ischaemic heart disease and paroxysmal atrial fibrillation."], [1507.52, 1511.59, "Tutor", "Her medication includes aspirin, metoprolol, and amiodarone."], [1511.59, 1522.96, "Tutor", "On examination she has a temperature of 34.5 degrees Celsius, she is drowsy with a G C S of 10, a pulse of 50 beats per minute and a blood pressure 90 over 40 millimetres of mercury."], [1522.96, 1525.89, "Tutor", "C T brain scan shows age related atrophy."], [1525.89, 1529.06, "Tutor", "Her results: sodium 120 millimoles per litre."], [1529.06, 1530.38, "Tutor", "Potassium 4.0."], [1530.38, 1531.4, "Tutor", "Urea 6.0."], [1531.4, 1533.97, "Tutor", "Creatinine 90 micromoles per litre."], [1533.97, 1535.89, "Tutor", "Measured osmolality 255."], [1535.89, 1538.34, "Tutor", "Glucose 3.0 millimoles per litre."], [1538.34, 1540.32, "Tutor", "C K 1000 units per litre."], [1540.32, 1543.01, "Tutor", "Cholesterol 7.2 millimoles per litre."], [1543.01, 1549.35, "Tutor", "Part a: Give the likely diagnosis and the underlying cause to account for all these blood results."], [1549.35, 1554.68, "Tutor", "Part b: List four measures essential for the specific management of this patient."], [1555.08, 1558.15, "Tutor", "You scored six on the thirteenth of October."], [1558.15, 1560.05, "Tutor", "The diagnosis was right."], [1560.05, 1565.43, "Tutor", "You missed the hydrocortisone, the thyroxine dosing and the sodium correction rate."], [1565.43, 1570.81, "Tutor", "Myxoedema coma has come up at least five times, in 2008, 2014, 2018 twice and 2024."], [1570.81, 1574.12, "Tutor", "So it's a reliable theme in the endocrine block."], [1574.52, 1575.39, "Tutor", "Part a."], [1575.39, 1580.23, "Tutor", "Myxoedema coma, which is decompensated hypothyroidism, caused by amiodarone."], [1580.23, 1581.74, "Tutor", "Every result fits."], [1581.74, 1582.89, "Tutor", "Hypothermia."], [1582.89, 1584.05, "Tutor", "Bradycardia."], [1584.05, 1587.28, "Tutor", "Hyponatraemia from reduced free water clearance."], [1587.28, 1588.55, "Tutor", "Hypoglycaemia."], [1588.55, 1591.26, "Tutor", "A raised creatine kinase from myopathy."], [1591.26, 1593.22, "Tutor", "And hypercholesterolaemia."], [1593.22, 1594.55, "Tutor", "Why amiodarone?"], [1594.55, 1597.84, "Tutor", "It's about thirty-seven percent iodine by weight."], [1597.84, 1603.9, "Tutor", "The iodine load triggers the Wolff-Chaikoff effect, which switches off thyroid hormone synthesis."], [1603.9, 1609.62, "Tutor", "Most people escape from it, but someone with underlying autoimmune thyroid disease may not."], [1609.62, 1613.6, "Tutor", "Amiodarone also blocks the peripheral conversion of T4 to T3."], [1614.0, 1615.46, "Tutor", "Pause, and answer."], [1615.46, 1619.4, "Tutor", "Which drug goes in first, before the thyroid hormone, and why?"], [1624.8, 1630.38, "Tutor", "Hydrocortisone, for example 100 milligrams intravenously, then 50 milligrams six-hourly."], [1630.38, 1637.48, "Tutor", "Hypothyroidism can coexist with adrenal insufficiency, from autoimmune polyglandular disease or a pituitary cause."], [1637.48, 1643.01, "Tutor", "Thyroid hormone speeds up cortisol clearance and can tip a patient into adrenal crisis."], [1643.01, 1647.08, "Tutor", "So you give the steroid first, after taking a random cortisol."], [1647.48, 1649.55, "Tutor", "The other specific measures."], [1649.55, 1650.93, "Tutor", "Thyroid hormone."], [1650.93, 1661.9, "Tutor", "The College answer for this eighty-year-old with ischaemic heart disease accepted low-dose thyroxine, about 50 to 100 micrograms a day, increased slowly, with T3 as a cautious option."], [1661.9, 1671.55, "Tutor", "Contemporary guidance, including the 2014 American Thyroid Association guideline, favours an intravenous loading dose of 200 to 400 micrograms of levothyroxine."], [1671.55, 1676.37, "Tutor", "Use the lower end in the elderly, the small and those with coronary disease."], [1676.37, 1679.13, "Tutor", "Then give daily intravenous maintenance."], [1679.13, 1686.25, "Tutor", "Liothyronine, or T3, is optional in small doses, 5 to 20 micrograms to load, then 2.5 to 10 micrograms eight-hourly."], [1686.25, 1689.81, "Tutor", "Be careful with it in coronary disease and arrhythmia."], [1689.81, 1692.91, "Tutor", "Correct the glucose with intravenous dextrose."], [1692.91, 1694.87, "Tutor", "Correct the sodium slowly."], [1694.87, 1701.36, "Tutor", "The College answer used hypertonic saline aiming for 130, no faster than 2 millimoles per litre per hour."], [1701.36, 1703.88, "Tutor", "Today you'd also cap the total rise."], [1703.88, 1709.0, "Tutor", "Aim for no more than 8 to 10 millimoles per litre in the first twenty-four hours."], [1709.0, 1714.57, "Tutor", "Elderly, malnourished and hypothyroid patients are at high risk of osmotic demyelination."], [1714.57, 1716.52, "Tutor", "And use passive rewarming."], [1716.52, 1721.92, "Tutor", "Active external rewarming can vasodilate a patient with no reserve and cause collapse."], [1722.32, 1725.16, "Tutor", "Now the twist, which is pure cardiac week."], [1725.16, 1727.72, "Tutor", "She's intubated for a rising P C O 2."], [1727.72, 1730.96, "Tutor", "After induction her blood pressure is 75 over 35."], [1730.96, 1733.97, "Tutor", "Her heart rate is 38, in a junctional rhythm."], [1733.97, 1740.4, "Tutor", "Echo shows a moderate circumferential pericardial effusion, with no right atrial or ventricular collapse."], [1741.3, 1743.86, "Examiner", "What's driving the bradycardia, and what will you do?"], [1744.36, 1746.2, "Candidate", "Several things together."], [1746.2, 1750.22, "Candidate", "Hypothyroidism itself, hypothermia, metoprolol and amiodarone."], [1750.22, 1751.83, "Candidate", "I'd stop both drugs."], [1751.83, 1755.4, "Candidate", "I'd give hydrocortisone and start thyroid replacement."], [1755.4, 1762.7, "Candidate", "Atropine may not work, so I'd use an adrenaline or isoprenaline infusion as a bridge, and set up transcutaneous pacing."], [1762.7, 1767.7, "Candidate", "If she stays haemodynamically compromised, I'd place a transvenous pacing wire."], [1767.7, 1772.64, "Candidate", "Amiodarone has a very long half-life, so its effects won't wear off for weeks."], [1773.14, 1774.1, "Examiner", "And the effusion?"], [1774.1, 1775.1, "Examiner", "Will you drain it?"], [1775.6, 1778.23, "Candidate", "Not unless there's tamponade physiology."], [1778.23, 1783.99, "Candidate", "Hypothyroid effusions accumulate slowly, so the pericardium stretches, and tamponade is uncommon."], [1783.99, 1786.4, "Candidate", "This echo shows no chamber collapse."], [1786.4, 1790.24, "Candidate", "The effusion will resolve as the thyroid hormone takes effect."], [1790.24, 1793.8, "Candidate", "I'd re-image it, and drain it only if tamponade develops."], [1794.3, 1796.74, "Examiner", "Why might she be refractory to vasopressors?"], [1797.24, 1803.16, "Candidate", "Untreated hypothyroidism reduces adrenergic receptor responsiveness and cardiac contractility."], [1803.16, 1806.53, "Candidate", "Unrecognised adrenal insufficiency makes it worse."], [1806.53, 1809.96, "Candidate", "That's another reason to give hydrocortisone early."], [1810.46, 1811.05, "Examiner", "Good."], [1811.05, 1813.17, "Examiner", "One more twist for the endocrine block."], [1813.17, 1815.66, "Examiner", "Amiodarone can also cause the opposite problem."], [1816.56, 1817.21, "Tutor", "Yes."], [1817.21, 1820.52, "Tutor", "Amiodarone-induced thyrotoxicosis comes in two types."], [1820.52, 1828.49, "Tutor", "Type one is iodine-induced excess hormone synthesis in an abnormal gland, such as a multinodular goitre, and it's treated with thionamides."], [1828.49, 1832.94, "Tutor", "Type two is a destructive thyroiditis, and it's treated with prednisolone."], [1832.94, 1834.41, "Tutor", "Mixed forms happen."], [1834.41, 1841.08, "Tutor", "And a critically ill patient on amiodarone with low thyroid hormone levels may simply have sick euthyroid syndrome."], [1841.08, 1846.99, "Tutor", "That's why the 2021 second sitting asked about hypothyroidism in the ICU and sick euthyroid together."], [1846.99, 1848.73, "Tutor", "Don't treat the numbers."], [1848.73, 1852.8, "Tutor", "Treat the patient who is cold, slow, hyponatraemic and bradycardic."], [1854.2, 1858.86, "Tutor", "Two new trials this week, both summarised by The Bottom Line, and both about the kidney."], [1858.86, 1861.43, "Tutor", "One asks how to dialyse the sickest patients."], [1861.43, 1866.0, "Tutor", "The other asks whether a diabetes drug can protect the kidney through cardiac surgery."], [1866.4, 1872.26, "Tutor", "The first is Gaudry and colleagues, published in the New England Journal of Medicine in October 2026."], [1872.26, 1878.29, "Tutor", "It was an investigator-initiated, open-label, randomised non-inferiority trial in forty-two French ICUs."], [1878.29, 1886.79, "Tutor", "It enrolled adults with acute kidney injury and an indication for renal replacement therapy who were on invasive ventilation, catecholamines, or both."], [1886.79, 1892.92, "Tutor", "Patients were randomised to start with intermittent haemodialysis or continuous renal replacement therapy."], [1892.92, 1896.9, "Tutor", "The primary outcome was major adverse kidney events at day ninety."], [1896.9, 1900.78, "Tutor", "That means death, new dialysis, or persistent renal dysfunction."], [1900.78, 1904.76, "Tutor", "The non-inferiority margin was seven and a half percentage points."], [1905.16, 1910.93, "Tutor", "The trial planned for a thousand patients but stopped early at five hundred and fifty-four."], [1910.93, 1918.75, "Tutor", "Major adverse kidney events occurred in 78.1 percent with intermittent dialysis, against 71.6 percent with continuous therapy."], [1918.75, 1925.39, "Tutor", "The adjusted difference was 6.3 percentage points, with a confidence interval from minus 1.2 to plus 13.8."], [1925.39, 1929.83, "Tutor", "The upper bound crosses the margin, so non-inferiority wasn't shown."], [1929.83, 1938.63, "Tutor", "As a secondary outcome, mortality was higher with intermittent dialysis, with a hazard ratio of 1.30 and a confidence interval of 1.04 to 1.63."], [1938.63, 1944.23, "Tutor", "Dialysis dependence at day ninety was low and similar in both groups, about two percent."], [1944.23, 1949.36, "Tutor", "Twenty-two percent of the intermittent group crossed over to continuous therapy."], [1949.76, 1951.41, "Tutor", "The limitations matter."], [1951.41, 1958.82, "Tutor", "The trial stopped early, so it was underpowered, and a mortality signal from a secondary outcome should be treated as a hypothesis."], [1958.82, 1964.05, "Tutor", "The delivered intermittent dose was on the low side, with a median Kt over V of about one."], [1964.05, 1969.11, "Tutor", "It tested only the initial modality, it was open label, and it was done in one country."], [1969.11, 1977.64, "Tutor", "Earlier trials, including the French Hemodiafe trial of about three hundred and sixty patients in 2006, found no survival difference between modalities."], [1978.04, 1979.95, "Tutor", "Three take-home messages."], [1979.95, 1989.94, "Tutor", "One: in ventilated or vasopressor-dependent patients with acute kidney injury, starting with intermittent dialysis was not shown to be as good as continuous therapy."], [1989.94, 1997.63, "Tutor", "Two: there's a mortality signal favouring continuous therapy, but it comes from a secondary outcome in a trial stopped early."], [1997.63, 2007.97, "Tutor", "Three: it supports what most Australian and New Zealand units already do, and what KDIGO 2012 suggests, which is continuous therapy for haemodynamically unstable patients."], [2007.97, 2016.36, "Tutor", "For the exam, if you're asked to compare modalities, you can now name a 2026 trial that backs continuous therapy in the unstable patient."], [2016.36, 2018.84, "Tutor", "Summary drawn from The Bottom Line."], [2019.24, 2024.87, "Tutor", "The second study is MERCURI-2, by Oosterom-Eijmael and colleagues, in JAMA in 2026."], [2024.87, 2030.56, "Tutor", "It was a double-blind, placebo-controlled randomised trial in seven Dutch hospitals."], [2030.56, 2036.07, "Tutor", "It enrolled seven hundred and eighty-four adults having elective cardiac surgery."], [2036.07, 2046.28, "Tutor", "They received dapagliflozin 10 milligrams or placebo, in four doses: the evening before surgery, the morning of surgery, and post-operative days one and two."], [2046.28, 2051.72, "Tutor", "The primary outcome was acute kidney injury by KDIGO criteria within seven days."], [2052.12, 2058.26, "Tutor", "Acute kidney injury occurred in 28 percent with dapagliflozin, against 52 percent with placebo."], [2058.26, 2062.98, "Tutor", "The relative risk was 0.54, with a confidence interval of 0.45 to 0.65."], [2062.98, 2065.24, "Tutor", "That looks like a huge effect."], [2065.24, 2067.09, "Tutor", "But look underneath it."], [2067.09, 2071.39, "Tutor", "The effect came almost entirely from the urine output criterion."], [2071.39, 2078.91, "Tutor", "Defined by creatinine alone, acute kidney injury occurred in 14 percent versus 15 percent, so there was no difference."], [2078.91, 2082.72, "Tutor", "Stage three injury was under one percent in both groups."], [2082.72, 2086.96, "Tutor", "There was one case of ketoacidosis, in the dapagliflozin group."], [2087.36, 2089.97, "Tutor", "Here's the physiology that explains it."], [2089.97, 2094.73, "Tutor", "SGLT2 inhibitors block glucose and sodium reabsorption in the proximal tubule."], [2094.73, 2097.84, "Tutor", "That causes an osmotic diuresis and natriuresis."], [2097.84, 2100.55, "Tutor", "So the drug raises urine output directly."], [2100.55, 2107.2, "Tutor", "That makes patients less likely to meet the oliguria criterion, whether or not the kidney is actually protected."], [2107.2, 2109.64, "Tutor", "The outcome definition did the work."], [2110.04, 2111.87, "Tutor", "Three take-home messages."], [2111.87, 2118.65, "Tutor", "One: dapagliflozin halved KDIGO acute kidney injury after cardiac surgery, but only by the urine output criterion."], [2118.65, 2123.42, "Tutor", "Two: creatinine-defined injury, severe injury and hard outcomes didn't change."], [2123.42, 2125.75, "Tutor", "Three: it doesn't change practice."], [2125.75, 2134.03, "Tutor", "Remember that perioperative SGLT2 inhibitors carry a risk of euglycaemic ketoacidosis, which is why they're normally withheld before surgery."], [2134.03, 2141.41, "Tutor", "For the exam, this is a perfect example of how a composite or surrogate outcome can be driven by the drug's own pharmacology."], [2141.41, 2143.8, "Tutor", "Summary drawn from The Bottom Line."], [2145.2, 2147.11, "Tutor", "Now the syllabus round-up."], [2147.11, 2150.27, "Tutor", "Six items, all beyond this week's cardiac block."], [2150.27, 2153.2, "Tutor", "We'll go fast and focus on what earns marks."], [2153.6, 2155.39, "Tutor", "First, renal malignancy."], [2155.39, 2159.97, "Tutor", "It's rarely examined on its own, but it turns up in ICU as a complication."], [2159.97, 2163.38, "Tutor", "Renal cell carcinoma causes paraneoplastic syndromes."], [2163.38, 2167.3, "Tutor", "Hypercalcaemia comes from parathyroid hormone-related peptide."], [2167.3, 2170.03, "Tutor", "Erythrocytosis comes from erythropoietin."], [2170.03, 2172.16, "Tutor", "Hypertension comes from renin."], [2172.16, 2176.74, "Tutor", "And there's a non-metastatic hepatic dysfunction called Stauffer syndrome."], [2176.74, 2181.44, "Tutor", "The surgical problem is tumour thrombus extending up the inferior vena cava."], [2181.44, 2186.02, "Tutor", "When it reaches the right atrium, removal may need cardiopulmonary bypass."], [2186.02, 2193.79, "Tutor", "The ICU then deals with major haemorrhage, tumour embolism to the lungs, and acute kidney injury in a patient left with one kidney."], [2193.79, 2196.14, "Tutor", "The modern twist is immunotherapy."], [2196.14, 2203.86, "Tutor", "Patients on checkpoint inhibitors such as nivolumab and ipilimumab can arrive with myocarditis, pneumonitis, colitis or nephritis."], [2203.86, 2208.55, "Tutor", "These are treated with high-dose corticosteroids, after excluding infection."], [2208.55, 2212.8, "Tutor", "Myocarditis is the one that kills, so check troponin and do an echo."], [2213.2, 2214.9, "Tutor", "How might it be asked?"], [2214.9, 2217.22, "Tutor", "Usually as a post-operative case."], [2217.22, 2226.69, "Tutor", "For example: day one after radical nephrectomy with removal of a caval tumour thrombus, now hypotensive with a falling haemoglobin and rising airway pressures."], [2226.69, 2232.08, "Tutor", "The structure that earns marks is a differential, then investigations, then management."], [2232.08, 2234.34, "Tutor", "Bleeding is the commonest cause."], [2234.34, 2239.79, "Tutor", "Tumour or thrombus embolism shows up as sudden right ventricular failure and hypoxaemia."], [2239.79, 2243.47, "Tutor", "Abdominal compartment syndrome follows a big transfusion."], [2243.47, 2246.82, "Tutor", "And there's acute kidney injury in a single kidney."], [2246.82, 2249.42, "Tutor", "Treat the solitary kidney as precious."], [2249.42, 2256.0, "Tutor", "Avoid nephrotoxins, dose drugs for the new glomerular filtration rate, and keep perfusion pressure adequate."], [2256.4, 2264.23, "Tutor", "Second, respiratory monitoring, which has appeared in about two dozen past questions and leads into next week's respiratory block."], [2264.23, 2265.87, "Tutor", "Think in four layers."], [2265.87, 2268.88, "Tutor", "Oxygenation: pulse oximetry, with its limits."], [2268.88, 2274.04, "Tutor", "These are poor perfusion, carboxyhaemoglobin, methaemoglobin and skin pigmentation."], [2274.04, 2280.17, "Tutor", "Oximetry overestimates saturation in patients with darker skin, so occult hypoxaemia is more common."], [2280.17, 2284.71, "Tutor", "Then the arterial gas, the P F ratio and the alveolar-arterial gradient."], [2284.71, 2288.74, "Tutor", "Ventilation: waveform capnography, and the dead space fraction."], [2288.74, 2293.5, "Tutor", "In early A R D S, a higher dead space fraction independently predicts death."], [2293.5, 2301.56, "Tutor", "Mechanics: plateau pressure at 30 centimetres of water or less, and driving pressure, which is plateau minus PEEP, ideally 15 or less."], [2301.56, 2309.22, "Tutor", "In the 2015 analysis by Amato and colleagues, driving pressure was the ventilation variable most strongly linked with survival."], [2309.22, 2315.57, "Tutor", "Add compliance, the flow and pressure waveforms, and the auto-PEEP measured with an end-expiratory hold."], [2315.57, 2322.38, "Tutor", "Effort: P zero point one, the occlusion pressure, and oesophageal manometry to estimate transpulmonary pressure."], [2322.38, 2328.56, "Tutor", "A P zero point one above about three and a half centimetres of water suggests high respiratory drive."], [2328.74, 2331.46, "Tutor", "That's a warning sign of self-inflicted lung injury."], [2331.86, 2336.56, "Tutor", "Capnography deserves its own sentence, because it's a favourite data question."], [2336.56, 2342.75, "Tutor", "A normal trace has a flat baseline at zero, a sharp upstroke, an alveolar plateau and a sharp downstroke."], [2342.75, 2346.57, "Tutor", "A sloping shark-fin plateau means bronchospasm or obstruction."], [2346.57, 2352.65, "Tutor", "A baseline that doesn't return to zero means rebreathing, from an exhausted absorber or a faulty valve."], [2352.65, 2357.68, "Tutor", "A sudden fall to zero means disconnection, oesophageal intubation or cardiac arrest."], [2357.68, 2363.53, "Tutor", "A sudden fall to a low value suggests a big drop in cardiac output or a massive pulmonary embolism."], [2363.53, 2369.82, "Tutor", "Small dips in the plateau, sometimes called a curare cleft, mean the patient is making spontaneous efforts."], [2369.82, 2372.61, "Tutor", "And remember the arterial to end-tidal gap."], [2372.61, 2375.73, "Tutor", "It normally runs at a few millimetres of mercury."], [2375.73, 2380.38, "Tutor", "It widens with dead space, so it's a crude dead space monitor at the bedside."], [2380.78, 2385.35, "Tutor", "Third, severe and multiple trauma, with about two dozen past questions."], [2385.35, 2394.67, "Tutor", "Name the governing guideline: the European guideline on management of major bleeding and coagulopathy following trauma, sixth edition, published in 2023."], [2394.67, 2396.64, "Tutor", "Its key numbers are these."], [2396.64, 2403.7, "Tutor", "Tranexamic acid, 1 gram over 10 minutes and then 1 gram over 8 hours, within three hours of injury, as in CRASH-2."], [2403.7, 2412.39, "Tutor", "Permissive hypotension, with a target systolic of 80 to 90 millimetres of mercury until bleeding is controlled, unless there's a brain injury."], [2412.39, 2417.02, "Tutor", "With severe brain injury, keep the mean arterial pressure at 80 or more."], [2417.02, 2418.7, "Tutor", "Restrict crystalloid."], [2418.7, 2425.94, "Tutor", "Use plasma to red cells in a ratio of at least one to two, or use factor concentrates guided by viscoelastic testing."], [2425.94, 2431.03, "Tutor", "Give fibrinogen when it's below 1.5 grams per litre, starting with 3 to 4 grams."], [2431.03, 2434.04, "Tutor", "Target haemoglobin 70 to 90 grams per litre."], [2434.04, 2436.12, "Tutor", "Keep ionised calcium normal."], [2436.12, 2439.95, "Tutor", "And use damage control surgery or angioembolisation early."], [2439.95, 2452.74, "Tutor", "The structure the College rewards is a primary survey with simultaneous resuscitation, then haemorrhage control, then the lethal triad of acidosis, hypothermia and coagulopathy, with hypocalcaemia now added to it."], [2453.14, 2455.63, "Tutor", "Two ICU-specific angles come up often."], [2455.63, 2457.64, "Tutor", "The first is tertiary survey."], [2457.64, 2469.01, "Tutor", "Missed injuries are found in a meaningful minority of trauma patients after the first day, so a structured head-to-toe re-examination at twenty-four hours, with a review of all imaging, is worth a mark."], [2469.01, 2471.82, "Tutor", "The second is the timing of definitive care."], [2471.82, 2475.07, "Tutor", "Damage control resuscitation and surgery come first."], [2475.07, 2481.25, "Tutor", "The patient comes to ICU to be warmed, to have coagulopathy and acidosis corrected and to be resuscitated."], [2481.25, 2486.77, "Tutor", "Then they go back for definitive repair once physiology allows, typically within a day or two."], [2486.77, 2495.06, "Tutor", "Add venous thromboembolism prophylaxis once bleeding is controlled, usually within twenty-four to forty-eight hours, and early enteral nutrition."], [2495.46, 2496.89, "Tutor", "Pause, and answer."], [2496.89, 2501.42, "Tutor", "What's the dose and timing of dexamethasone in adult bacterial meningitis?"], [2506.82, 2514.02, "Tutor", "Ten milligrams intravenously every six hours for four days, started just before or with the first antibiotic dose."], [2514.02, 2519.8, "Tutor", "That's our fourth item, meningitis and encephalitis, with more than twenty past questions."], [2519.8, 2525.47, "Tutor", "The evidence is de Gans and van de Beek, in the New England Journal of Medicine in 2002."], [2525.47, 2528.36, "Tutor", "It included three hundred and one adults."], [2528.36, 2535.56, "Tutor", "Dexamethasone reduced unfavourable outcome, with a relative risk of 0.59, and death, with a relative risk of 0.48."], [2535.56, 2542.58, "Tutor", "The benefit was concentrated in pneumococcal meningitis, where unfavourable outcome fell from 52 to 26 percent."], [2542.58, 2547.24, "Tutor", "The 2016 ESCMID guideline recommends ceftriaxone 2 grams twelve-hourly."], [2547.24, 2556.5, "Tutor", "Add vancomycin where pneumococcal resistance is a concern, and amoxicillin or benzylpenicillin for Listeria in those over fifty or immunocompromised."], [2556.5, 2558.92, "Tutor", "Don't let a CT delay antibiotics."], [2558.92, 2566.24, "Tutor", "Scan first only if there's a focal deficit, new seizures, a Glasgow Coma Scale below 10, or severe immunocompromise."], [2566.24, 2571.08, "Tutor", "For encephalitis, start aciclovir 10 milligrams per kilogram eight-hourly."], [2571.08, 2581.58, "Tutor", "Send cerebrospinal fluid for herpes simplex PCR, get an MRI looking at the temporal lobes, and remember autoimmune encephalitis, especially anti-NMDA receptor antibodies."], [2581.98, 2585.83, "Tutor", "For the data question, know the cerebrospinal fluid patterns."], [2585.83, 2597.61, "Tutor", "Bacterial meningitis: a raised opening pressure, a neutrophil-predominant white cell count often in the thousands, a high protein, and a cerebrospinal fluid to blood glucose ratio below about point four."], [2597.61, 2603.92, "Tutor", "Viral: a lymphocytic count in the tens to hundreds, a modestly raised protein and a normal glucose ratio."], [2603.92, 2611.4, "Tutor", "Tuberculous or fungal: lymphocytes, a very high protein and a low glucose, often with cranial nerve palsies and hydrocephalus."], [2611.4, 2617.93, "Tutor", "And for cryptococcus, think of a very high opening pressure that needs repeated therapeutic lumbar punctures."], [2617.93, 2620.67, "Tutor", "Two public health points carry marks too."], [2620.67, 2629.38, "Tutor", "Notify the public health unit for meningococcal disease, and arrange clearance antibiotics for close contacts, usually ciprofloxacin or ceftriaxone."], [2629.78, 2634.35, "Tutor", "Fifth, intubation of the critically ill, with more than twenty past questions."], [2634.35, 2642.74, "Tutor", "Name the Difficult Airway Society guideline for tracheal intubation in critically ill adults, published in the British Journal of Anaesthesia in 2018."], [2642.74, 2644.33, "Tutor", "Its pillars are these."], [2644.33, 2646.66, "Tutor", "Plan for failure, with plans A to D."], [2646.66, 2651.97, "Tutor", "Preoxygenate with non-invasive ventilation or high-flow nasal oxygen in hypoxaemic patients."], [2651.97, 2654.84, "Tutor", "Use waveform capnography for every intubation."], [2654.84, 2656.06, "Tutor", "Limit attempts."], [2656.06, 2662.43, "Tutor", "And move to front-of-neck access with a scalpel, bougie and tube in a can't intubate, can't oxygenate situation."], [2662.43, 2668.38, "Tutor", "The trial to quote is DEVICE, by Prekker and colleagues, in the New England Journal of Medicine in 2023."], [2668.38, 2674.17, "Tutor", "It randomised fourteen hundred and twenty critically ill adults in US emergency departments and ICUs."], [2674.17, 2680.43, "Tutor", "First-attempt success was 85.1 percent with video laryngoscopy, against 70.8 percent with direct laryngoscopy."], [2680.43, 2682.66, "Tutor", "Severe complications were similar."], [2682.66, 2686.59, "Tutor", "The other major hazard is peri-intubation cardiovascular collapse."], [2686.59, 2692.86, "Tutor", "So resuscitate first, choose induction agents and doses carefully, and have a vasopressor running or drawn up."], [2693.26, 2696.39, "Tutor", "Pick the induction agent with the patient in mind."], [2696.39, 2704.68, "Tutor", "Ketamine, about 1 to 1.5 milligrams per kilogram, or a reduced dose of propofol, with rocuronium at 1.2 milligrams per kilogram for a quick onset."], [2704.68, 2706.51, "Tutor", "Keep sugammadex available."], [2706.51, 2710.18, "Tutor", "Position the patient head-up or ramped, especially if obese."], [2710.18, 2715.24, "Tutor", "Before induction, correct hypoxaemia, hypovolaemia and acidosis as far as time allows."], [2715.24, 2717.83, "Tutor", "A severe metabolic acidosis is the trap."], [2717.83, 2720.63, "Tutor", "The patient is breathing hard to compensate."], [2720.63, 2727.8, "Tutor", "If you lose that compensation during apnoea, or set a normal minute ventilation afterwards, the pH can fall catastrophically."], [2727.8, 2731.62, "Tutor", "So match the minute ventilation to their pre-intubation effort."], [2732.02, 2736.67, "Tutor", "Sixth, chronic hepatic failure, with more than twenty past questions."], [2736.67, 2738.12, "Tutor", "Know the scores."], [2738.12, 2743.07, "Tutor", "Child-Pugh uses bilirubin, albumin, the I N R, ascites and encephalopathy."], [2743.07, 2747.84, "Tutor", "MELD uses bilirubin, I N R and creatinine, and MELD-sodium adds sodium."], [2747.84, 2750.49, "Tutor", "Then acute-on-chronic liver failure."], [2750.49, 2754.96, "Tutor", "The 2023 EASL guideline grades it by the number of organ failures."], [2754.96, 2762.03, "Tutor", "Twenty-eight-day mortality rises from roughly one in five at grade one to about three in four at grade three."], [2762.03, 2769.09, "Tutor", "Spontaneous bacterial peritonitis is diagnosed by an ascitic neutrophil count above 250 per cubic millimetre."], [2769.09, 2777.0, "Tutor", "Treat it with antibiotics plus albumin, 1.5 grams per kilogram in the first six hours and 1 gram per kilogram on day three."], [2777.0, 2779.9, "Tutor", "That's from Sort and colleagues in 1999."], [2779.9, 2785.99, "Tutor", "Renal impairment fell from 33 to 10 percent, and in-hospital mortality from 29 to 10 percent."], [2785.99, 2790.52, "Tutor", "For hepatorenal acute kidney injury, use terlipressin with albumin."], [2790.52, 2796.62, "Tutor", "In the CONFIRM trial, terlipressin roughly doubled the rate of hepatorenal syndrome reversal."], [2796.62, 2802.41, "Tutor", "But it increased respiratory failure, so assess volume status and oxygenation carefully."], [2802.41, 2809.66, "Tutor", "And after a large-volume paracentesis of more than five litres, give about 8 grams of albumin per litre removed."], [2810.06, 2815.27, "Tutor", "The structure for a chronic liver failure question in the ICU runs system by system."], [2815.27, 2827.6, "Tutor", "Neurological: hepatic encephalopathy, graded by West Haven, treated with lactulose and rifaximin, with a search for a precipitant such as bleeding, infection, constipation, sedatives or electrolyte disturbance."], [2827.6, 2834.39, "Tutor", "Cardiovascular: low systemic vascular resistance and a high cardiac output, with relative adrenal insufficiency."], [2834.39, 2839.99, "Tutor", "Respiratory: hepatopulmonary syndrome, portopulmonary hypertension and hepatic hydrothorax."], [2839.99, 2849.73, "Tutor", "Gastrointestinal: variceal bleeding, treated with terlipressin, antibiotics, endoscopic banding and, if that fails, a transjugular intrahepatic portosystemic shunt."], [2849.73, 2852.39, "Tutor", "Haematological: rebalanced haemostasis."], [2852.39, 2859.46, "Tutor", "A high I N R doesn't mean the patient is anticoagulated, so don't give plasma to correct a number before a procedure."], [2859.46, 2865.74, "Tutor", "And always ask whether the patient is a transplant candidate, because that changes the ceiling of care."], [2867.14, 2869.5, "Tutor", "That's the spiral for this week."], [2869.5, 2871.74, "Tutor", "One thing to do before Monday."], [2871.74, 2881.48, "Tutor", "After today's set, take the pyroglutamic acidosis question and write part d from memory in four lines: glutathione, the brake, the drain, and flucloxacillin."], [2881.48, 2889.5, "Tutor", "Then write the S M R investigation as four headings: is it real, is the data right, is it case mix or the model, and is it care."], [2889.5, 2892.51, "Tutor", "Check both against today's College answers."], [2892.51, 2894.22, "Tutor", "Thanks for listening."]], CH=[{"start": 0.0, "title": "Introduction"}, {"start": 60.2, "title": "Spiral review 1: the CVP waveform and the passive leg raise, with a failing right ventricle"}, {"start": 551.44, "title": "Spiral review 2: the standardised mortality ratio, in a cardiac surgical unit"}, {"start": 960.02, "title": "Spiral review 3: pyroglutamic acidosis, and the second acid in the same gas"}, {"start": 1405.6, "title": "Spiral review 4: myxoedema coma on amiodarone, and the sheep that started endocrinology"}, {"start": 1854.2, "title": "Journal watch: intermittent versus continuous dialysis, and MERCURI-2"}, {"start": 2145.2, "title": "Syllabus round-up"}, {"start": 2867.14, "title": "Close"}], a=document.getElementById('a'), t=document.getElementById('t'), follow=true, last=-1, els=[];
