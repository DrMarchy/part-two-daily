var C=[[0.0, 1.72, "Tutor", "Welcome to Part Two Daily."], [1.72, 5.41, "Tutor", "It's Wednesday the eleventh of November, and this is a deep dive."], [5.41, 8.8, "Tutor", "Today we stay with one problem until it gives up its marks."], [8.8, 11.43, "Tutor", "The problem is a filter that keeps clotting."], [11.43, 13.56, "Tutor", "It sounds like a nursing headache."], [13.56, 21.5, "Tutor", "In the exam it is a renal question, a haematology question and a pharmacology question at once, and in 2014 fewer than half the candidates passed it."], [21.5, 23.17, "Tutor", "Here's the running order."], [23.17, 30.5, "Tutor", "First, a tutorial on keeping the continuous renal replacement circuit alive, including the patient with heparin-induced thrombocytopenia."], [30.5, 35.81, "Tutor", "Second, the two trials that made citrate the default, one of them from Australia and New Zealand."], [35.81, 41.07, "Tutor", "Third, exam practice on a real College question about citrate, with an examiner and a candidate."], [41.07, 42.44, "Tutor", "Then a short close."], [43.84, 45.57, "Tutor", "Picture three in the morning."], [45.57, 48.79, "Tutor", "Your patient is on continuous veno-venous haemodiafiltration."], [48.79, 51.03, "Tutor", "The third filter today has just clotted."], [51.03, 53.23, "Tutor", "The nurse shows you the platelet count."], [53.23, 54.72, "Tutor", "It was 240 on admission."], [54.72, 55.79, "Tutor", "Today it is 70."], [55.79, 59.72, "Tutor", "The patient has been on heparin for seven days, and the left leg is swollen."], [59.72, 61.58, "Tutor", "What do you do with the circuit?"], [61.58, 62.8, "Tutor", "Hold that thought."], [62.8, 66.16, "Tutor", "By the end of this part you should have a ten-mark answer ready."], [66.56, 69.09, "Tutor", "First, how the College asks this."], [69.09, 74.33, "Tutor", "In the curriculum data, the circuit has been examined seven times since 2007."], [74.33, 83.88, "Tutor", "Three questions ask for strategies to prolong the life of the circuit: the 2007 first sitting, the 2010 second sitting, and the 2014 first sitting."], [83.88, 90.16, "Tutor", "Two ask about citrate anticoagulation specifically, in 2013 and again, word for word, in 2015."], [90.16, 94.97, "Tutor", "Two more ask you to troubleshoot a dialysis circuit, in 2009 and 2018."], [94.97, 97.19, "Tutor", "The pass rates tell a story."], [97.19, 100.95, "Tutor", "The 2007 and 2010 versions were passed by 71 percent."], [100.95, 105.88, "Tutor", "The 2014 version, which is on your list today, was passed by 43 percent."], [105.88, 109.7, "Tutor", "The citrate question in 2015 was passed by 86 percent."], [109.7, 112.47, "Tutor", "So candidates know citrate chemistry."], [112.47, 120.36, "Tutor", "What they lose marks on is the whole-patient strategy, and especially the patient with heparin-induced thrombocytopenia."], [120.76, 124.8, "Tutor", "Here is the 2014 first sitting, question 29, read exactly."], [124.8, 135.76, "Tutor", "A 55-year-old patient with severe sepsis develops Heparin Induced Thrombotic Thrombocytopaenia Syndrome, HITTS, while on continuous veno-venous haemodiafiltration, CVVHDF."], [135.76, 145.86, "Tutor", "Outline the strategies available for prolonging the life of the CVVHDF circuit in this patient, mentioning the advantages and disadvantages of each strategy."], [145.86, 147.76, "Tutor", "Notice the instruction."], [147.76, 152.04, "Tutor", "Outline, with advantages and disadvantages, for each strategy."], [152.04, 153.51, "Tutor", "That is a table."], [153.51, 161.22, "Tutor", "The College's own discussion of the near-identical 2010 question said the answer would have benefited from tabulation."], [161.22, 164.83, "Tutor", "Three columns: strategy, advantages, disadvantages."], [164.83, 166.43, "Tutor", "Six to eight rows."], [166.43, 170.16, "Tutor", "Write it as a table and you will not forget a column."], [170.56, 171.81, "Tutor", "Now the framework."], [171.81, 173.89, "Tutor", "Think of filter life in two layers."], [173.89, 176.63, "Tutor", "The first layer is everything that is not a drug."], [176.63, 178.85, "Tutor", "The second layer is the anticoagulant."], [178.85, 186.32, "Tutor", "Examiners reward candidates who start with the first layer, because it is where the free marks are and because it is what a consultant fixes first."], [186.72, 191.03, "Tutor", "Before any drug: name three things that determine how long a filter lasts."], [191.03, 192.4, "Tutor", "Pause, and answer."], [197.8, 199.31, "Tutor", "Here is the answer."], [199.31, 200.54, "Tutor", "First, access."], [200.54, 203.78, "Tutor", "Second, flow and haemoconcentration in the filter."], [203.78, 205.4, "Tutor", "Third, interruptions."], [205.4, 207.08, "Tutor", "Let's go through each."], [207.48, 208.64, "Tutor", "Access first."], [208.64, 212.03, "Tutor", "Most early clotting is an access problem in disguise."], [212.03, 215.69, "Tutor", "A poorly flowing catheter causes repeated pressure alarms."], [215.69, 217.96, "Tutor", "Every alarm stops the blood pump."], [217.96, 219.57, "Tutor", "Stagnant blood clots."], [219.57, 227.05, "Tutor", "So you want a wide-bore, double-lumen dialysis catheter, of the right length for the site, with its tip where flow is generous."], [227.05, 237.97, "Tutor", "The 2012 Kidney Disease Improving Global Outcomes guideline, known as KDIGO, ranks the sites: right internal jugular first, femoral second, left internal jugular third, and subclavian last."], [237.97, 242.52, "Tutor", "The subclavian is last because of stenosis that can ruin a future fistula."], [242.52, 247.4, "Tutor", "Kinking, patient position and a catheter tip against the vessel wall all matter."], [247.4, 254.72, "Tutor", "If the access pressure swings every time the patient coughs or sits up, fix the catheter before you blame the anticoagulant."], [255.12, 257.52, "Tutor", "Second, flow and haemoconcentration."], [257.52, 260.24, "Tutor", "Blood in a haemofilter loses plasma water."], [260.24, 265.14, "Tutor", "The further you concentrate it, the thicker it gets and the more readily it clots."], [265.14, 271.02, "Tutor", "The measure is the filtration fraction: the proportion of plasma flow you take off as ultrafiltrate."], [271.02, 275.32, "Tutor", "In post-dilution haemofiltration, keep it under about 20 to 25 percent."], [275.32, 277.28, "Tutor", "You can lower it three ways."], [277.28, 281.48, "Tutor", "Raise the blood flow, typically to 150 to 250 millilitres per minute."], [281.48, 286.43, "Tutor", "Give some or all of the replacement fluid before the filter, which is pre-dilution."], [286.43, 292.2, "Tutor", "Or shift clearance from convection to diffusion, by using dialysate rather than replacement fluid."], [292.2, 293.95, "Tutor", "Pre-dilution is a trade."], [293.95, 303.64, "Tutor", "It lengthens filter life, but it dilutes the blood you are trying to clean, so you lose some clearance and must prescribe a little more effluent to deliver the same dose."], [304.04, 305.74, "Tutor", "Third, interruptions."], [305.74, 308.02, "Tutor", "Every stop is a chance to clot."], [308.02, 314.41, "Tutor", "Prompt response to alarms, trained nursing staff, and planned circuit changes all extend filter life."], [314.41, 319.33, "Tutor", "The venous bubble trap, where blood meets air, is a favourite site for clot."], [319.33, 321.03, "Tutor", "And watch the trends."], [321.03, 328.59, "Tutor", "A rising pre-filter pressure and a rising transmembrane pressure tell you the filter is failing before it actually clots."], [328.59, 335.8, "Tutor", "A falling ratio of effluent urea to blood urea tells you the membrane is fouling and clearance is quietly dropping."], [336.2, 339.59, "Tutor", "The 2018 first sitting turned this into a data question."], [339.59, 343.09, "Tutor", "You were given circuit pressures and asked what was wrong."], [343.09, 345.85, "Tutor", "So learn the pattern of the three pressures."], [345.85, 348.92, "Tutor", "The access pressure, before the pump, is negative."], [348.92, 352.57, "Tutor", "The pre-filter pressure sits between the pump and the filter."], [352.57, 356.18, "Tutor", "The return pressure is on the venous side, after the filter."], [356.18, 366.56, "Tutor", "If the access pressure becomes much more negative, the problem is drawing blood out: a kinked or malpositioned catheter, the tip sucking against the vessel wall, or a hypovolaemic patient."], [366.56, 373.56, "Tutor", "If the return pressure rises, the problem is getting blood back: a clot in the venous chamber or the return limb, or a kink."], [373.56, 380.08, "Tutor", "If the pre-filter pressure climbs while the return pressure stays the same or falls, the filter itself is clotting."], [380.08, 382.78, "Tutor", "The pressure drop across the filter widens."], [382.78, 389.19, "Tutor", "The transmembrane pressure rises as the membrane clogs with protein, which is called fouling, and then with clot."], [389.19, 391.26, "Tutor", "That is a filter about to fail."], [391.26, 398.52, "Tutor", "Change it electively before it clots with a full blood volume inside, which can be 150 to 200 millilitres of the patient's blood."], [398.92, 406.83, "Tutor", "A consultant habit worth stating in an answer: when filter life suddenly shortens in a patient whose regimen hasn't changed, look for a new cause."], [406.83, 408.68, "Tutor", "The catheter may have moved."], [408.68, 411.14, "Tutor", "The patient may be more volume depleted."], [411.14, 416.9, "Tutor", "Or something new may be driving coagulation, such as sepsis, or heparin-induced thrombocytopenia itself."], [416.9, 424.24, "Tutor", "Recurrent unexplained clotting on heparin, with a falling platelet count, is one of the classic ways HIT first shows itself in the ICU."], [424.64, 426.99, "Tutor", "Why does this matter beyond the circuit?"], [426.99, 428.84, "Tutor", "Because downtime is lost dose."], [428.84, 435.15, "Tutor", "If you prescribe 25 millilitres per kilogram per hour and the filter is down a quarter of the day, you deliver much less."], [435.15, 439.7, "Tutor", "That is one reason the big dose trials prescribed more than they intended to deliver."], [439.7, 441.95, "Tutor", "And downtime means lost fluid removal."], [441.95, 446.64, "Tutor", "A circuit that clots four times a day cannot de-resuscitate a patient in fluid overload."], [447.04, 449.57, "Tutor", "Now the second layer, the anticoagulant."], [449.57, 454.25, "Tutor", "Let me tell you where the most familiar one came from, because it explains a lot."], [454.25, 460.41, "Tutor", "In 1916, Jay McLean was a medical student at Johns Hopkins working in William Howell's physiology laboratory."], [460.41, 464.94, "Tutor", "Howell believed that a substance called cephalin was the body's clot promoter."], [464.94, 468.84, "Tutor", "McLean's job was to purify it and prove that it helped blood clot."], [468.84, 471.57, "Tutor", "He tried extracts from heart and from liver."], [471.57, 473.84, "Tutor", "The liver extract did the opposite."], [473.84, 475.63, "Tutor", "It stopped blood clotting."], [475.63, 477.79, "Tutor", "McLean called it heparphosphatid."], [477.79, 483.42, "Tutor", "Howell and his colleague Emmett Holt introduced the name heparin in 1918, from the Greek for liver."], [483.42, 492.11, "Tutor", "It took the Toronto group under Charles Best, in the 1930s, to purify it well enough for humans, and Gordon Murray's clinical studies were published in 1937."], [492.11, 497.32, "Tutor", "So the drug we put in every circuit began as a failed experiment to find the opposite drug."], [497.72, 500.77, "Tutor", "And it took decades to see heparin's paradox."], [500.77, 506.76, "Tutor", "In 1958, Weismann and Tobin described arterial emboli occurring during systemic heparin therapy."], [506.76, 515.46, "Tutor", "In 1977, Rhodes, Dixon and Silver described eight patients with heparin-induced thrombocytopenia and thrombotic and haemorrhagic complications."], [515.46, 517.41, "Tutor", "We now know the mechanism."], [517.41, 521.91, "Tutor", "Antibodies form against complexes of heparin and platelet factor four."], [521.91, 524.79, "Tutor", "Those immune complexes activate platelets."], [524.79, 528.01, "Tutor", "The platelet count falls, and the patient clots."], [528.01, 530.6, "Tutor", "That is the trap in today's question."], [530.6, 534.17, "Tutor", "A patient with HITTS does not have a bleeding problem."], [534.17, 537.8, "Tutor", "They have a clotting problem with a low platelet count."], [538.2, 540.06, "Tutor", "So, the anticoagulant options."], [540.06, 546.24, "Tutor", "I'll give you each one in the way the College answer lays them out: what it is, its advantages, and its disadvantages."], [546.64, 552.24, "Tutor", "Option one: unfractionated heparin, given systemically, usually as a pre-filter infusion."], [552.24, 558.12, "Tutor", "In the RICH trial the target was an activated partial thromboplastin time of 45 to 60 seconds."], [558.12, 562.91, "Tutor", "Advantages: cheap, familiar, easy to monitor and reversible with protamine."], [562.91, 566.95, "Tutor", "Disadvantages: bleeding, and heparin-induced thrombocytopenia."], [566.95, 570.29, "Tutor", "In this patient, it is absolutely contraindicated."], [570.29, 572.72, "Tutor", "Every source of heparin must stop."], [572.72, 579.3, "Tutor", "That includes the heparin flushes on arterial lines, heparin catheter locks, and heparin-bonded membranes."], [579.3, 581.49, "Tutor", "Say that sentence in the exam."], [581.49, 584.2, "Tutor", "It is a mark that most candidates miss."], [584.6, 591.19, "Tutor", "Two variations on heparin appear in the College answer to the 2007 question, so know them for a patient without HIT."], [591.19, 598.53, "Tutor", "Regional heparin means heparin before the filter and protamine after it, to neutralise it before the blood returns to the patient."], [598.53, 601.46, "Tutor", "The advantage is less systemic anticoagulation."], [601.46, 613.37, "Tutor", "The disadvantages are that the ratio is hard to get right, protamine has its own risks, including hypotension and anaphylaxis, and the heparin protamine complex can dissociate later and cause rebound anticoagulation."], [613.37, 618.21, "Tutor", "KDIGO suggests avoiding regional heparin in patients at increased risk of bleeding."], [618.21, 621.4, "Tutor", "Low molecular weight heparin is the other variation."], [621.4, 623.74, "Tutor", "Its advantage is predictable dosing."], [623.74, 635.17, "Tutor", "Its disadvantages in this setting are renal accumulation, monitoring that needs anti-ten-A levels, only partial reversal by protamine, and a higher risk of HIT antibodies cross-reacting than with danaparoid."], [635.17, 640.44, "Tutor", "In a patient with HIT, both variations are contraindicated, because they are still heparin."], [640.84, 644.74, "Tutor", "Option two: no anticoagulant, with or without saline flushes."], [644.74, 647.79, "Tutor", "Advantages: no bleeding risk from the circuit."], [647.79, 651.41, "Tutor", "Disadvantages: short filter life and more interruptions."], [651.41, 655.03, "Tutor", "Saline flushes add volume and their benefit is doubtful."], [655.03, 657.75, "Tutor", "And here is the key point for this stem."], [657.75, 664.36, "Tutor", "In HITTS, no anticoagulation is not an option for the patient, even if it might be an option for the circuit."], [664.36, 669.0, "Tutor", "The patient has a thrombosis and needs a non-heparin anticoagulant anyway."], [669.4, 671.65, "Tutor", "Option three: regional citrate."], [671.65, 675.22, "Tutor", "We'll do the chemistry in detail in the exam practice."], [675.22, 682.53, "Tutor", "In short, citrate binds ionised calcium in the circuit, and calcium is needed at several steps of the clotting cascade."], [682.53, 690.02, "Tutor", "You infuse citrate before the filter, aiming for a post-filter ionised calcium of about 0.25 to 0.35 millimoles per litre."], [690.02, 695.15, "Tutor", "You replace calcium into the patient to keep the systemic ionised calcium normal."], [695.15, 701.72, "Tutor", "Advantages: the longest filter life, and the least bleeding, because anticoagulation stays in the circuit."], [701.72, 708.17, "Tutor", "Disadvantages: complexity, protocols and frequent monitoring of sodium, ionised calcium and bicarbonate."], [708.17, 712.49, "Tutor", "It can cause metabolic alkalosis, hypocalcaemia and hypernatraemia."], [712.49, 717.38, "Tutor", "It is risky in liver failure and low-output shock, where citrate accumulates."], [717.38, 723.14, "Tutor", "And in HITTS, citrate looks after the circuit but does nothing for the patient's thrombosis."], [723.14, 726.6, "Tutor", "You still need a systemic non-heparin anticoagulant."], [726.6, 730.92, "Tutor", "That sentence is in the College's discussion of this very question."], [731.32, 737.17, "Tutor", "Let me add the practical citrate management the examiners expect, because the College asks it in detail."], [737.17, 740.05, "Tutor", "Citrate delivery is proportional to blood flow."], [740.05, 743.24, "Tutor", "Turn the blood pump up, and you deliver more citrate."], [743.24, 756.56, "Tutor", "So if a patient on citrate develops a metabolic alkalosis, the usual moves are to lower the blood flow, which lowers the citrate load, or to increase the dialysate or effluent flow, which removes more calcium citrate before it reaches the patient."], [756.56, 759.9, "Tutor", "Some units also switch to a lower-bicarbonate dialysate."], [759.9, 764.5, "Tutor", "If the sodium is creeping up, the cause is usually hypertonic trisodium citrate."], [764.5, 766.96, "Tutor", "Check the protocol's fluid composition."], [767.36, 768.83, "Tutor", "You're on citrate."], [768.83, 775.57, "Tutor", "The systemic ionised calcium has fallen to 0.9, and your calcium infusion has been increased three times today."], [775.57, 778.86, "Tutor", "The total calcium is now 3.1 millimoles per litre."], [778.86, 781.41, "Tutor", "What's happening, and what do you do?"], [781.41, 782.88, "Tutor", "Pause, and answer."], [788.28, 789.73, "Tutor", "Divide 3.1 by 0.9."], [789.73, 792.34, "Tutor", "The ratio is about 3.4, well above 2.5."], [792.34, 794.12, "Tutor", "Citrate is accumulating."], [794.12, 796.13, "Tutor", "The liver isn't clearing it."], [796.13, 801.08, "Tutor", "Look for the cause: worsening shock, a rising lactate, or failing liver function."], [801.08, 802.03, "Tutor", "Then act."], [802.03, 805.31, "Tutor", "Reduce the citrate load by lowering the blood flow."], [805.31, 809.71, "Tutor", "Increase the effluent or dialysate to clear more citrate in the filter."], [809.71, 813.66, "Tutor", "If the ratio doesn't improve, stop citrate and change strategy."], [813.66, 817.11, "Tutor", "Keep giving calcium until the ionised calcium is safe."], [817.11, 824.45, "Tutor", "As the accumulated citrate is finally metabolised, all that bound calcium is released, and the bicarbonate load arrives too."], [824.45, 828.29, "Tutor", "So expect a rebound later, with hypercalcaemia and alkalosis."], [828.29, 831.52, "Tutor", "That rebound is an examiner's favourite follow-up."], [831.92, 835.61, "Tutor", "Option four: prostacyclin, epoprostenol, or its analogues."], [835.61, 839.52, "Tutor", "It inhibits platelet aggregation, with a half-life of minutes."], [839.52, 843.21, "Tutor", "Advantages: less bleeding, and a short duration of action."], [843.21, 852.44, "Tutor", "Disadvantages: vasodilatation and hypotension in a patient who may already be on noradrenaline, cost, and a filter life shorter than with citrate or heparin."], [852.44, 855.12, "Tutor", "Again, it does not treat the thrombosis."], [855.52, 858.35, "Tutor", "Option five: the direct thrombin inhibitors."], [858.35, 863.89, "Tutor", "Argatroban, bivalirudin, and historically lepirudin and hirudin, which are no longer marketed."], [863.89, 868.29, "Tutor", "They bind thrombin directly, so there is no antibody to cross-react with."], [868.29, 872.8, "Tutor", "This is the class that treats the patient and the circuit at the same time."], [873.2, 874.19, "Tutor", "Pause here."], [874.19, 877.44, "Tutor", "You have a patient with HITTS and acute kidney injury."], [877.44, 882.72, "Tutor", "Which direct thrombin inhibitor would you choose, and what laboratory artefact does it cause?"], [882.72, 884.08, "Tutor", "Pause, and answer."], [889.48, 890.52, "Tutor", "Argatroban."], [890.52, 894.86, "Tutor", "It is cleared by the liver, so it does not accumulate in renal failure."], [894.86, 900.35, "Tutor", "That makes it the drug of choice in HIT with kidney injury, as long as the liver is working."], [900.35, 902.32, "Tutor", "KDIGO 2012 says so directly."], [902.32, 915.11, "Tutor", "In patients with heparin-induced thrombocytopenia, all heparin must be stopped and direct thrombin inhibitors such as argatroban, or factor ten A inhibitors such as danaparoid or fondaparinux, are recommended, at grade one A."], [915.11, 920.11, "Tutor", "In those without severe liver failure, argatroban is suggested ahead of the others."], [920.11, 926.09, "Tutor", "The artefact: argatroban prolongs the prothrombin time and raises the international normalised ratio."], [926.09, 931.96, "Tutor", "That matters when you switch to warfarin later, because the INR will overstate the warfarin effect."], [931.96, 938.22, "Tutor", "Monitor with the activated partial thromboplastin time, aiming for one and a half to three times baseline."], [938.22, 950.35, "Tutor", "Critically ill patients need much lower doses than the product information suggests, often starting around 0.5 to 1.2 micrograms per kilogram per minute, because hepatic clearance falls in shock and heart failure."], [950.35, 956.28, "Tutor", "Disadvantages of the class: no reversal agent, cost, and accumulation of the renally cleared agents."], [956.46, 962.97, "Tutor", "Bivalirudin is cleared partly by the kidney, so it accumulates in renal failure, but its short half-life makes it workable."], [962.97, 966.6, "Tutor", "Lepirudin and hirudin were renally cleared and accumulated badly."], [966.6, 974.46, "Tutor", "The College answer also notes that the relationship between hirudin level and the partial thromboplastin time is only roughly linear at the lower end."], [974.86, 979.58, "Tutor", "Option six: danaparoid, a heparinoid that works mainly against factor ten A."], [979.58, 983.18, "Tutor", "Advantages: it works in HIT and has a long track record."], [983.18, 993.42, "Tutor", "Disadvantages: a long half-life, renal clearance, monitoring only by anti-ten-A levels, limited availability, and occasional cross-reactivity with heparin-induced antibodies."], [993.42, 995.89, "Tutor", "Fondaparinux sits in the same space."], [995.89, 1003.88, "Tutor", "It has a long half-life and is renally cleared, so it accumulates in acute kidney injury, and the evidence for circuit use is limited."], [1003.88, 1014.06, "Tutor", "The 2014 College answer lists it, along with nafamostat, a serine protease inhibitor used in Japan and Korea, which it describes as limited in experience and very expensive."], [1014.46, 1016.71, "Tutor", "Now, how does Oh's frame this?"], [1016.71, 1023.5, "Tutor", "Chapter 56, Renal replacement therapy, covers circuit anticoagulation in the section on continuous therapy."], [1023.5, 1029.0, "Tutor", "The heparin-induced thrombocytopenia material is in chapter 113, Haemostatic failure."], [1029.0, 1033.49, "Tutor", "Put them together and you get the consultant answer to today's stem."], [1033.49, 1035.97, "Tutor", "One: stop all heparin, everywhere."], [1035.97, 1045.08, "Tutor", "Two: confirm HIT, with a pre-test probability using the four Ts score, then a platelet factor four immunoassay, then a functional assay if needed."], [1045.08, 1052.88, "Tutor", "Three: start a systemic non-heparin anticoagulant, usually argatroban, because the patient has thrombosis and kidney injury."], [1052.88, 1058.25, "Tutor", "Four: that same drug anticoagulates the circuit, so you rarely need citrate on top."], [1058.25, 1064.11, "Tutor", "Five: optimise access, blood flow and pre-dilution to reduce how hard the drug has to work."], [1064.11, 1071.02, "Tutor", "Six: don't give platelets for a low count alone, and don't start warfarin until the platelets have recovered."], [1071.42, 1073.03, "Tutor", "What are the four Ts?"], [1073.03, 1078.29, "Tutor", "Thrombocytopenia: a fall of more than 50 percent, with a nadir that's usually above 20."], [1078.29, 1084.82, "Tutor", "Timing: typically days 5 to 10 of heparin, or within a day if the patient was exposed in the previous 30 days."], [1084.82, 1089.59, "Tutor", "Thrombosis: new venous or arterial clots, or skin necrosis at injection sites."], [1089.59, 1099.22, "Tutor", "And other causes: in a septic patient on a filter there are many, which is why the score in the ICU often lands in the intermediate range and you need the laboratory."], [1099.22, 1112.02, "Tutor", "The American Society of Hematology's 2018 guideline on heparin-induced thrombocytopenia sets this out, and recommends a non-heparin anticoagulant once the probability is intermediate or high, without waiting for the result."], [1112.42, 1116.93, "Tutor", "A few management details from the same guideline earn marks in a HIT question."], [1116.93, 1125.42, "Tutor", "Treat with a non-heparin anticoagulant at therapeutic dose, not prophylactic dose, because the thrombotic risk is high even if no clot has been found yet."], [1125.42, 1132.19, "Tutor", "Look for occult deep vein thrombosis with a duplex ultrasound of the legs, including the arms if there are lines in them."], [1132.19, 1139.37, "Tutor", "Do not give platelet transfusions just to correct the number, but they can be given for active bleeding or a high-risk procedure."], [1139.37, 1141.94, "Tutor", "Do not start warfarin in the acute phase."], [1141.94, 1148.18, "Tutor", "Warfarin drops protein C before it drops the procoagulant factors, so it can cause venous limb gangrene in HIT."], [1148.18, 1151.96, "Tutor", "If warfarin has already been started, reverse it with vitamin K."], [1151.96, 1157.94, "Tutor", "Start it only once platelets have recovered, usually above 150, and overlap it with the non-heparin agent."], [1157.94, 1164.39, "Tutor", "The direct oral anticoagulants are an option once the patient is stable, but not with this degree of kidney injury."], [1164.39, 1167.64, "Tutor", "Duration: around three months if there was thrombosis."], [1167.64, 1172.62, "Tutor", "And document it as a heparin allergy, so no one restarts heparin in the next admission."], [1173.02, 1175.75, "Tutor", "In the sepsis stem, there's one more twist."], [1175.75, 1183.36, "Tutor", "The four Ts may not distinguish heparin-induced thrombocytopenia from sepsis, disseminated intravascular coagulation or haemodilution."], [1183.36, 1186.84, "Tutor", "A filter that consumes platelets can lower the count too."], [1186.84, 1189.09, "Tutor", "That's why the laboratory matters."], [1189.09, 1194.71, "Tutor", "And while you wait for the result, an intermediate or high probability means you treat it as HIT."], [1194.71, 1197.71, "Tutor", "The cost of missing it is limb loss or a stroke."], [1197.71, 1200.98, "Tutor", "The cost of overtreating is a few days of argatroban."], [1201.38, 1207.39, "Tutor", "A quick word on the guideline landscape, because examiners like a candidate who knows what is current."], [1207.39, 1211.43, "Tutor", "KDIGO's 2012 acute kidney injury guideline is still the reference."], [1211.43, 1219.02, "Tutor", "A 2026 update to it was released as a draft for public review this year, and the final version is not yet published, so quote 2012."], [1219.02, 1223.01, "Tutor", "Its anticoagulation recommendations are worth learning by number."], [1223.01, 1230.16, "Tutor", "For continuous therapy, regional citrate rather than heparin in patients without contraindications to citrate, grade two B."], [1230.16, 1235.57, "Tutor", "If citrate is contraindicated, unfractionated or low molecular weight heparin, grade two C."], [1235.57, 1240.27, "Tutor", "If bleeding risk is high, citrate rather than no anticoagulation, grade two C."], [1240.27, 1246.22, "Tutor", "And the heparin-induced thrombocytopenia recommendation at grade one A, which I've already given you."], [1246.22, 1256.92, "Tutor", "A Chinese Society of Critical Care Medicine guideline published in August 2026 also makes regional citrate first line, with heparin preferred where there is a risk of citrate accumulation."], [1256.92, 1259.98, "Tutor", "That's the same message from a second direction."], [1260.38, 1262.61, "Tutor", "Where do candidates lose marks?"], [1262.61, 1272.85, "Tutor", "From the College material on the 2014 question: candidates gave regional strategies alone, without recognising that HITTS still needs a systemic non-heparin anticoagulant."], [1272.85, 1275.48, "Tutor", "The highest mark that sitting was 7.5."], [1275.48, 1287.2, "Tutor", "And from your own work: yesterday, on the 2015 second sitting question comparing intermittent haemodialysis, slow low-efficiency dialysis and continuous haemofiltration, you scored five and a half."], [1287.2, 1292.4, "Tutor", "The fix was to add the disadvantages, and the biggest omission was anticoagulation."], [1292.4, 1298.92, "Tutor", "Continuous therapy needs continuous anticoagulation, with its bleeding risk and its effect on filter life."], [1298.92, 1301.9, "Tutor", "Intermittent haemodialysis often needs none."], [1301.9, 1305.33, "Tutor", "Slow low-efficiency dialysis gives shorter exposure."], [1305.33, 1308.47, "Tutor", "Today's topic is the other half of that answer."], [1308.47, 1315.22, "Tutor", "Once you've learned this, anticoagulation becomes a row in every renal replacement comparison table you write."], [1315.62, 1317.91, "Tutor", "Three numbers to remember."], [1317.91, 1323.99, "Tutor", "One: post-filter ionised calcium of 0.25 to 0.35 millimoles per litre for citrate."], [1323.99, 1329.79, "Tutor", "Two: a total to ionised calcium ratio above 2.5 means citrate is accumulating."], [1329.79, 1335.46, "Tutor", "Three: keep the filtration fraction under 20 to 25 percent in post-dilution."], [1336.86, 1340.49, "Tutor", "Two trials changed circuit anticoagulation from habit to evidence."], [1340.49, 1342.61, "Tutor", "Both compared citrate with heparin."], [1342.61, 1347.28, "Tutor", "One was run in Australia and New Zealand, so an examiner here may quote it back at you."], [1347.28, 1353.12, "Tutor", "Before we start, which outcome would you expect citrate to win on, and which would you expect it not to change?"], [1353.12, 1354.3, "Tutor", "Hold your guess."], [1354.7, 1361.6, "Tutor", "The first is the Heparin Citrate Study, by David Gattas and colleagues, published in Critical Care Medicine in 2015."], [1361.6, 1367.39, "Tutor", "It ran from 2010 to 2013 in seven intensive care units, six in Australia and one in New Zealand."], [1367.39, 1372.29, "Tutor", "It randomised 212 adults with acute kidney injury who needed continuous therapy."], [1372.29, 1381.76, "Tutor", "The comparison was regional citrate, with calcium replacement to keep systemic calcium normal, against regional heparin, reversed with protamine after the filter."], [1381.76, 1384.99, "Tutor", "Note that this was regional heparin, not systemic."], [1384.99, 1388.72, "Tutor", "Patients with liver failure or suspected HIT were excluded."], [1388.72, 1392.78, "Tutor", "The primary outcome was the functional life of the first circuit."], [1392.78, 1397.73, "Tutor", "Median life was 39.2 hours with citrate against 22.8 hours with regional heparin."], [1397.73, 1401.91, "Tutor", "The hazard of filter clotting was about twice as high with heparin."], [1401.91, 1407.14, "Tutor", "There was no difference in ICU mortality, 26.7 versus 23.4 percent, or in transfusion."], [1407.14, 1413.66, "Tutor", "Adverse events were more common with heparin, mostly suspected or confirmed heparin-induced thrombocytopenia."], [1413.66, 1416.33, "Tutor", "Criticisms: open label, as it had to be."], [1416.33, 1419.28, "Tutor", "Underpowered for any patient-centred outcome."], [1419.28, 1425.46, "Tutor", "Three quarters of patients came from two centres, and many potentially eligible patients were excluded."], [1425.64, 1435.28, "Tutor", "What it changed: it gave Australian and New Zealand units local evidence that citrate keeps the circuit alive longer than the regional heparin and protamine technique."], [1435.28, 1445.24, "Tutor", "One sentence for an exam answer: in the ANZ Heparin Citrate Study, regional citrate nearly doubled first-circuit life over regional heparin, with no difference in mortality."], [1445.64, 1451.17, "Tutor", "The second is RICH, by Alexander Zarbock and colleagues, published in JAMA in 2020."], [1451.17, 1455.49, "Tutor", "It was run in 26 German intensive care units from 2016 to 2018."], [1455.49, 1464.61, "Tutor", "Adults with stage three acute kidney injury needing continuous therapy were randomised to regional citrate or systemic unfractionated heparin."], [1464.61, 1470.69, "Tutor", "The citrate arm targeted a post-filter ionised calcium of 0.25 to 0.35 millimoles per litre."], [1470.69, 1475.74, "Tutor", "The heparin arm targeted a partial thromboplastin time of 45 to 60 seconds."], [1475.74, 1480.85, "Tutor", "Both arms received an effluent dose of 30 millilitres per kilogram per hour."], [1480.85, 1485.35, "Tutor", "There were two primary outcomes, filter life and 90-day mortality."], [1485.35, 1492.34, "Tutor", "The trial was stopped at an interim analysis after 638 patients were randomised, of whom 596 were analysed."], [1492.34, 1498.12, "Tutor", "Filter life had crossed its efficacy boundary, and mortality had crossed into futility."], [1498.52, 1505.09, "Tutor", "Before I give you the numbers: what was the median filter life with citrate in RICH, roughly, and with heparin?"], [1505.09, 1506.52, "Tutor", "Pause, and answer."], [1511.92, 1517.87, "Tutor", "Median filter life was 47 hours with citrate and 26 hours with heparin, a difference of 15 hours."], [1517.87, 1524.44, "Tutor", "Ninety-day mortality was 51.2 percent with citrate and 53.6 percent with heparin, which was not significant."], [1524.44, 1529.6, "Tutor", "Bleeding complications were 5.1 percent with citrate and 16.9 percent with heparin."], [1529.6, 1530.85, "Tutor", "Now the twist."], [1530.85, 1536.17, "Tutor", "New culture-proven infections were more common with citrate, 68.0 versus 55.4 percent."], [1536.17, 1543.71, "Tutor", "That was a secondary outcome among many, with no correction for multiple comparisons, so treat it as a signal, not a finding."], [1543.71, 1549.38, "Tutor", "Citrate also caused more hypophosphataemia, and more severe alkalosis, though that was rare."], [1549.38, 1553.8, "Tutor", "The criticisms: stopped early, so the mortality estimate is imprecise."], [1553.8, 1554.87, "Tutor", "Open label."], [1554.87, 1559.46, "Tutor", "About 6 percent of randomised patients were excluded for lack of consent."], [1559.46, 1568.08, "Tutor", "And patients at highest risk of citrate accumulation, with severe liver failure or profound shock, were excluded, so it says nothing about them."], [1568.08, 1573.18, "Tutor", "What it changed: it confirmed the 2012 KDIGO suggestion with a large modern trial."], [1573.18, 1577.2, "Tutor", "Citrate is the default for continuous therapy where it is safe."], [1577.38, 1588.66, "Tutor", "In an SAQ: the RICH trial showed regional citrate prolonged filter life compared with systemic heparin, 47 versus 26 hours, and reduced bleeding, without a demonstrated mortality benefit."], [1589.06, 1590.81, "Tutor", "So, was your guess right?"], [1590.81, 1593.56, "Tutor", "Citrate wins on the circuit and on bleeding."], [1593.56, 1596.15, "Tutor", "Neither trial showed it changes survival."], [1596.15, 1603.71, "Tutor", "That is the honest position, and it's what an examiner wants: citrate is chosen for filter life and safety, not because it saves lives."], [1603.71, 1607.57, "Tutor", "There's a nice irony in the history of continuous therapy itself."], [1607.57, 1613.86, "Tutor", "In 1977, Peter Kramer in Göttingen connected a haemofilter between a patient's femoral artery and femoral vein."], [1613.86, 1615.24, "Tutor", "There was no pump."], [1615.24, 1623.28, "Tutor", "The patient's own blood pressure drove about 100 millilitres a minute through the filter, to treat fluid overload that diuretics couldn't shift."], [1623.28, 1628.67, "Tutor", "That was continuous arteriovenous haemofiltration, the ancestor of every circuit in your unit."], [1628.67, 1634.75, "Tutor", "A pumpless circuit at low flow clots easily, and anticoagulation was a problem from the very first patient."], [1634.75, 1642.74, "Tutor", "Fifty years on, the question of how to keep blood moving through plastic without clotting the patient or the filter is still a core exam topic."], [1644.14, 1644.95, "Examiner", "Right."], [1644.95, 1648.26, "Examiner", "This is from the 2015 first sitting, question 22."], [1648.26, 1651.92, "Examiner", "It is identical to the 2013 first sitting, question 29."], [1651.92, 1657.6, "Examiner", "Regarding regional citrate anticoagulation for continuous renal replacement therapy, CRRT."], [1657.6, 1658.47, "Examiner", "Part a."], [1658.47, 1662.65, "Examiner", "What is the mechanism by which citrate provides anticoagulation?"], [1662.65, 1664.51, "Examiner", "Twenty percent of marks."], [1664.51, 1665.38, "Examiner", "Part b."], [1665.38, 1668.28, "Examiner", "What is the metabolic fate of the citrate?"], [1668.28, 1669.62, "Examiner", "Twenty percent."], [1669.62, 1670.49, "Examiner", "Part c."], [1670.49, 1673.39, "Examiner", "What are the features of citrate toxicity?"], [1673.39, 1674.72, "Examiner", "Twenty percent."], [1674.72, 1675.6, "Examiner", "Part d."], [1675.6, 1679.43, "Examiner", "What conditions may increase the risk of citrate toxicity?"], [1679.43, 1680.76, "Examiner", "Twenty percent."], [1680.76, 1681.63, "Examiner", "Part e."], [1681.63, 1687.2, "Examiner", "What alternative or alternatives to citrate could you use in a patient with severe HITS?"], [1687.2, 1688.54, "Examiner", "Twenty percent."], [1688.54, 1690.92, "Examiner", "You have ten minutes in the exam."], [1690.92, 1692.02, "Examiner", "Off you go."], [1692.52, 1693.36, "Candidate", "Part a."], [1693.36, 1695.64, "Candidate", "Citrate chelates ionised calcium."], [1695.64, 1705.1, "Candidate", "Calcium is a cofactor at several steps of the coagulation cascade, including the activation of factors nine and ten and the conversion of prothrombin to thrombin."], [1705.1, 1714.62, "Candidate", "Citrate is infused before the filter to bring the post-filter ionised calcium down to about 0.25 to 0.35 millimoles per litre, which stops clotting in the circuit."], [1714.62, 1722.92, "Candidate", "Calcium is then infused into the patient, separately, to restore the systemic ionised calcium to normal, so the patient isn't anticoagulated."], [1723.42, 1724.14, "Examiner", "Good."], [1724.14, 1730.51, "Examiner", "That's full marks for a, provided you say the post-filter target and that calcium is replaced systemically."], [1730.51, 1731.34, "Examiner", "Part b."], [1731.84, 1732.62, "Candidate", "Part b."], [1732.62, 1737.68, "Candidate", "A proportion of the calcium citrate complex is removed across the filter in the effluent."], [1737.68, 1744.82, "Candidate", "The rest returns to the patient and is metabolised, mainly in the liver, with some in muscle and kidney, through the Krebs cycle."], [1744.82, 1747.84, "Candidate", "The calcium is released back into the circulation."], [1748.34, 1751.06, "Examiner", "And what does metabolising citrate produce?"], [1751.56, 1753.65, "Candidate", "Energy, through the Krebs cycle."], [1753.65, 1755.32, "Candidate", "And, sorry, bicarbonate."], [1755.32, 1758.2, "Candidate", "Each citrate molecule yields three bicarbonate."], [1758.7, 1759.43, "Examiner", "Yes."], [1759.43, 1763.65, "Examiner", "Three bicarbonate per citrate, and NADH from the Krebs cycle."], [1763.65, 1767.14, "Examiner", "That's the link to part c, so don't leave it out."], [1767.14, 1768.06, "Examiner", "Part c."], [1768.56, 1769.46, "Candidate", "Part c."], [1769.46, 1771.98, "Candidate", "Citrate toxicity has two patterns."], [1771.98, 1776.66, "Candidate", "The first is low ionised calcium, from inadequate calcium replacement."], [1776.66, 1784.7, "Candidate", "Features are perioral tingling, paraesthesia, carpopedal spasm, tetany, a prolonged QT interval, arrhythmias, and hypotension."], [1784.7, 1793.28, "Candidate", "The second is metabolic alkalosis, because of the bicarbonate load, together with hypernatraemia, from the sodium in trisodium citrate."], [1793.78, 1796.94, "Examiner", "You've described what happens when the liver metabolises citrate too well."], [1796.94, 1799.1, "Examiner", "What happens when it can't metabolise it at all?"], [1799.6, 1801.43, "Candidate", "Then citrate accumulates."], [1801.43, 1806.53, "Candidate", "You get a high anion gap metabolic acidosis, because citrate is an unmeasured anion."], [1806.53, 1815.23, "Candidate", "The ionised calcium falls, because citrate keeps binding it, but the total calcium rises, because you keep infusing calcium and it's all still bound."], [1815.23, 1818.28, "Candidate", "So the ratio of total to ionised calcium rises."], [1818.28, 1820.5, "Candidate", "Above about 2.5 is accumulation."], [1820.5, 1823.6, "Candidate", "The calcium infusion requirement keeps climbing."], [1824.1, 1832.96, "Examiner", "That's the answer the College wanted: two distinct patterns, alkalosis when metabolism is intact and acidosis with a high ratio when it is not."], [1832.96, 1836.07, "Examiner", "You didn't volunteer the ratio until I asked."], [1836.07, 1838.3, "Examiner", "In the real thing I can't ask."], [1838.3, 1839.18, "Examiner", "Part d."], [1839.68, 1840.53, "Candidate", "Part d."], [1840.53, 1844.43, "Candidate", "Liver failure, because the liver does most of the metabolism."], [1844.43, 1848.15, "Candidate", "Low cardiac output and shock, with poor hepatic perfusion."], [1848.15, 1851.04, "Candidate", "Severe lactic acidosis is a marker of that."], [1851.04, 1853.24, "Candidate", "And pre-existing hypocalcaemia."], [1853.74, 1854.4, "Examiner", "Fine."], [1854.4, 1861.02, "Examiner", "You could add that a high blood flow means more citrate delivered, and that a massive transfusion is itself a citrate load."], [1861.02, 1861.78, "Examiner", "Part e."], [1862.28, 1863.04, "Candidate", "Part e."], [1863.04, 1865.31, "Candidate", "In severe HITS, I'd stop all heparin."], [1865.31, 1872.14, "Candidate", "Alternatives for the circuit are prostacyclin, which is a platelet inhibitor with a short half-life, but it causes hypotension."], [1872.14, 1875.68, "Candidate", "Or no anticoagulation with a high blood flow and pre-dilution."], [1876.18, 1877.13, "Examiner", "Stop there."], [1877.13, 1880.92, "Examiner", "This patient has severe heparin-induced thrombotic thrombocytopenia."], [1880.92, 1884.02, "Examiner", "What does the patient need, regardless of the circuit?"], [1884.52, 1886.38, "Candidate", "Systemic anticoagulation."], [1886.38, 1888.25, "Candidate", "With a non-heparin agent."], [1888.25, 1892.94, "Candidate", "So, argatroban, which is hepatically cleared and suitable in renal failure."], [1892.94, 1897.4, "Candidate", "Bivalirudin, which has a short half-life but is partly renally cleared."], [1897.4, 1902.77, "Candidate", "Danaparoid, which has anti-ten-A activity, a long half-life, and some cross-reactivity."], [1902.77, 1906.33, "Candidate", "Fondaparinux, which is renally cleared and accumulates."], [1906.33, 1912.88, "Candidate", "And the argatroban infusion anticoagulates the circuit as well, so I wouldn't need a regional method on top."], [1913.38, 1915.46, "Examiner", "That's what gets the marks."], [1915.46, 1925.51, "Examiner", "The College answer wanted at least three classes or four named agents for full marks: prostacyclin, argatroban, danaparoid, bivalirudin, fondaparinux, lepirudin."], [1925.51, 1933.89, "Examiner", "And the reasoning that the patient, not just the filter, needs a non-heparin anticoagulant is what separates a pass from a good pass."], [1933.89, 1939.06, "Examiner", "Your first answer to e would have earned about two of the five marks it needed."], [1939.46, 1941.72, "Examiner", "Let me mark the whole thing."], [1941.72, 1943.42, "Examiner", "Part a, full marks."], [1943.42, 1948.77, "Examiner", "Part b, nearly full, but only once I prompted you for the three bicarbonates."], [1948.77, 1955.62, "Examiner", "Part c, about two thirds without prompting, because the accumulation pattern and the ratio came late."], [1955.62, 1956.94, "Examiner", "Part d, full."], [1956.94, 1959.7, "Examiner", "Part e, about half as first written."], [1959.7, 1962.22, "Examiner", "Overall, about seven out of ten."], [1962.22, 1968.25, "Examiner", "In the sitting, the pass rate on this question was 86 percent, and the top mark was 9.3."], [1968.25, 1971.21, "Examiner", "So seven is a pass on an easy question."], [1971.21, 1974.23, "Examiner", "On an easy question, seven isn't enough."], [1974.23, 1988.88, "Examiner", "The one fix: for every citrate answer, write two columns for toxicity, the liver metabolising it, giving alkalosis and high sodium, and the liver failing, giving acidosis and a rising total to ionised calcium ratio above 2.5."], [1988.88, 1996.86, "Examiner", "And whenever a stem says HITTS, write in your first line: stop all heparin, start a systemic non-heparin anticoagulant."], [1997.26, 2003.56, "Examiner", "A follow-up, the kind you'd get in a viva, and the kind that turns up as a data question."], [2003.56, 2005.44, "Examiner", "Day three on citrate."], [2005.44, 2008.03, "Examiner", "Sodium 149 millimoles per litre."], [2008.03, 2010.89, "Examiner", "Bicarbonate 34 millimoles per litre."], [2010.89, 2011.93, "Examiner", "pH 7.52."], [2011.93, 2017.7, "Examiner", "Ionised calcium 1.1 millimoles per litre, total calcium 2.3 millimoles per litre."], [2017.7, 2019.26, "Examiner", "What's going on?"], [2019.76, 2023.04, "Candidate", "The ratio is about 2.1, so it isn't accumulating."], [2023.04, 2029.37, "Candidate", "The liver is metabolising the citrate well, and the bicarbonate load is causing a metabolic alkalosis."], [2029.37, 2032.36, "Candidate", "The sodium is up from the trisodium citrate."], [2032.36, 2042.72, "Candidate", "I'd reduce the blood flow to deliver less citrate, increase the dialysate flow to clear more of it, and check whether there's a lower-bicarbonate dialysate in the protocol."], [2042.72, 2047.96, "Candidate", "I'd also check for other causes of alkalosis, like nasogastric losses or diuretics."], [2048.46, 2049.08, "Examiner", "Good."], [2049.08, 2053.69, "Examiner", "That's the commonest citrate problem in a well patient, and the reverse of accumulation."], [2053.69, 2058.82, "Examiner", "A candidate who can tell those two patterns apart from a single blood gas has understood the topic."], [2059.32, 2060.73, "Candidate", "Can I ask one thing?"], [2060.73, 2064.24, "Candidate", "If the circuit keeps clotting on argatroban, do I add citrate?"], [2064.74, 2066.55, "Examiner", "You can, and some units do."], [2066.55, 2071.92, "Examiner", "But first check the access and the flows, and check that the argatroban is actually therapeutic."], [2071.92, 2077.6, "Examiner", "A partial thromboplastin time drawn from a line with saline flush running is a common source of error."], [2077.6, 2079.92, "Examiner", "Then raise the dose within the range."], [2079.92, 2082.14, "Examiner", "Most of the time it's the catheter."], [2083.04, 2089.42, "Tutor", "Let me pull the exam practice together, because the College could easily combine these two stems."], [2089.42
